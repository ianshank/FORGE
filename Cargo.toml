[workspace]
members = [
    "crates/forge-types",
    "crates/forge-core",
    "crates/forge-worldgen",
    "crates/forge-task",
    "crates/forge-agent",
    "crates/forge-bench",
    "crates/forge-python",
    "crates/forge-wasm",
    "crates/forge-procgen",
    "crates/forge-server",
    "crates/forge-memory",
    "crates/forge-social",
    "crates/forge-cognitive",
    "crates/forge-integration",
    "crates/forge-mangomas",
    "crates/forge-replay",
    "crates/forge-eval",
    "crates/forge-scenario",
    "crates/forge-data",
    "crates/forge-proposal",
    "crates/forge-cloud",
    "crates/forge-edge",
    "crates/forge-civ",
    "crates/forge-env",
    "crates/forge-env-forge",
    "crates/forge-env-mc",
    "crates/forge-mc-runner",
]
resolver = "2"

[package]
name = "forge-integration-tests"
version = "0.5.0"
edition = "2021"
publish = false

[dependencies]
forge-types = { path = "crates/forge-types" }
forge-core = { path = "crates/forge-core" }
forge-worldgen = { path = "crates/forge-worldgen" }
forge-task = { path = "crates/forge-task" }
forge-memory = { path = "crates/forge-memory" }
forge-social = { path = "crates/forge-social" }
forge-cognitive = { path = "crates/forge-cognitive" }
forge-integration-layer = { path = "crates/forge-integration" }
forge-proposal = { path = "crates/forge-proposal" }
forge-cloud = { path = "crates/forge-cloud" }
forge-edge = { path = "crates/forge-edge" }
forge-replay = { path = "crates/forge-replay" }
forge-agent = { path = "crates/forge-agent" }
forge-data = { path = "crates/forge-data" }
serde_json = "1"
rand = "0.8"
rand_pcg = "0.3"
tempfile = "3"
toml = "0.8"
bincode = "1"

[[test]]
name = "integration_tests"
path = "tests/rust/integration_tests.rs"

[[test]]
name = "integration_protodata"
path = "tests/rust/integration_protodata.rs"

[[test]]
name = "integration_proposal"
path = "tests/rust/integration_proposal.rs"

[[test]]
name = "integration_cloud_edge"
path = "tests/rust/integration_cloud_edge.rs"

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Ian Shank"]
license = "Apache-2.0"
repository = "https://github.com/ianshank/FORGE"
description = "Fast Open-source Runtime for Generalist Environments"
rust-version = "1.75"
keywords = ["simulation", "reinforcement-learning", "multi-agent", "game-engine"]
categories = ["simulation", "game-engines"]

[workspace.dependencies]
# Shared types crate
forge-types = { path = "crates/forge-types" }
forge-core = { path = "crates/forge-core" }
forge-worldgen = { path = "crates/forge-worldgen" }
forge-task = { path = "crates/forge-task" }
forge-agent = { path = "crates/forge-agent" }
forge-memory = { path = "crates/forge-memory" }
forge-social = { path = "crates/forge-social" }
forge-cognitive = { path = "crates/forge-cognitive" }
forge-integration-layer = { path = "crates/forge-integration" }
forge-replay = { path = "crates/forge-replay" }
forge-eval = { path = "crates/forge-eval" }
forge-proposal = { path = "crates/forge-proposal" }
forge-cloud = { path = "crates/forge-cloud" }
forge-edge = { path = "crates/forge-edge" }
forge-data = { path = "crates/forge-data" }
forge-civ = { path = "crates/forge-civ" }
forge-env = { path = "crates/forge-env" }
forge-env-forge = { path = "crates/forge-env-forge" }
forge-env-mc = { path = "crates/forge-env-mc" }
forge-mc-runner = { path = "crates/forge-mc-runner" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "0.8"

# Fixed-point arithmetic for deterministic physics
fixed = "1"

# Random number generation
rand = "0.8"
rand_pcg = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Timestamps
chrono = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"

# Small collections
smallvec = { version = "1", features = ["serde"] }

# Testing
proptest = "1"

# Cloud storage (GCS/S3/Azure — Apache Arrow object_store)
object_store = "0.11"
tokio = { version = "1", features = ["rt", "macros"] }
futures = "0.3"

# MLflow HTTP exporter (opt-in via forge-eval's `http-mlflow` feature).
# default-features=false + rustls-tls avoids OpenSSL on Windows CI; blocking
# pairs with the sync `mockito` test server below (no tokio dance per test).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
# RAII scope guard used by MlflowHttpSink to call `set_terminated(FAILED)` on
# early-return / panic — guarantees no orphan RUNNING runs after an export fails.
scopeguard = "1"
# Long-run CLI bin argument parsing. `derive` for the Cli struct, `env`
# for `--flag` ↔ `FORGE_E2E_*` env-var binding (so CI workflows can drive
# the bin without rebuilding it per scenario).
clap = { version = "4", features = ["derive", "env"] }
# Test-only HTTP mock server (sync API). Used by MlflowHttpClient unit tests
# to assert request shape + retry behaviour without a real server.
mockito = "1"
# Test-only ephemeral container runner; the testcontainers e2e test
# (gated #[ignore]) spins up a real `ghcr.io/mlflow/mlflow:vX.Y.Z` server.
testcontainers = { version = "0.23", features = ["blocking"] }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1
