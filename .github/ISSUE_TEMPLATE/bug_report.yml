name: Bug report
description: Report a defect in FORGE (crate, mc-bot, Python, dashboard, or CI).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce
        deterministically — FORGE's core is seed-deterministic, so a seed +
        action sequence usually pins a core bug exactly.
  - type: input
    id: area
    attributes:
      label: Area / crate
      description: e.g. forge-core, forge-mc-runner, mc-bot, python/forge, dashboard, CI
      placeholder: forge-core
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, seed, config, and any minimal input. Paste the exact invocation.
      render: shell
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Rust/Python/Node versions, and how FORGE was built (features, docker vs local).
    validations:
      required: false
