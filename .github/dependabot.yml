# Dependabot — automated dependency update PRs across all four ecosystems.
# Minor/patch updates are grouped to reduce PR noise; majors stay individual
# so breaking bumps get reviewed in isolation.
version: 2
updates:
  # Rust workspace (root Cargo.toml + Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
        # `ort` gets its own individual PR rather than being batched with
        # everything else: a routine rc.12->rc.13 bump silently broke the
        # onnx/onnx-reload/mc-live-bundled feature surface once (a7b078c)
        # because no CI job built it at the time. The `onnx-features` CI
        # job now catches this regardless, but an ort-specific PR is also
        # easier for a reviewer to scrutinize than a generic grouped bump.
        exclude-patterns: ["ort", "ort-sys"]

  # Python (root pyproject.toml).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  # Node — mc-bot bridge.
  - package-ecosystem: npm
    directory: "/mc-bot"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mc-bot-minor-patch:
        update-types: ["minor", "patch"]

  # Node — dashboard frontend.
  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dashboard-minor-patch:
        update-types: ["minor", "patch"]

  # Node — WASM demo E2E harness (Playwright).
  - package-ecosystem: npm
    directory: "/tests/web-e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-e2e-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows themselves.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
