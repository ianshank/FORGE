# Dependabot — automated dependency update PRs across every ecosystem this
# repository ships from. Minor/patch updates are grouped to reduce PR noise;
# majors stay individual so breaking bumps get reviewed in isolation.
#
# `open-pull-requests-limit` is deliberately left at 5 per ecosystem even
# though the queue currently sits at that ceiling. A saturated queue is a
# review-throughput problem, not a configuration one: raising the cap doubles
# the backlog without a single extra bump getting merged, and the grouping
# rules below are what actually keep the routine churn down to one PR per
# ecosystem per week. Note that this cap governs *version* updates only —
# Dependabot security alerts are limited separately, so a saturated queue
# does not suppress a security bump.
version: 2
updates:
  # Rust workspace (root Cargo.toml + Cargo.lock).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
        # `ort` gets its own individual PR rather than being batched with
        # everything else: a routine rc.12->rc.13 bump silently broke the
        # onnx/onnx-reload/mc-live-bundled feature surface once (a7b078c)
        # because no CI job built it at the time. The `onnx-features` CI
        # job now catches this regardless, but an ort-specific PR is also
        # easier for a reviewer to scrutinize than a generic grouped bump.
        exclude-patterns: ["ort", "ort-sys"]

  # Python (root pyproject.toml).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  # Node — mc-bot bridge.
  - package-ecosystem: npm
    directory: "/mc-bot"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mc-bot-minor-patch:
        update-types: ["minor", "patch"]

  # Node — dashboard frontend.
  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dashboard-minor-patch:
        update-types: ["minor", "patch"]

  # Node — WASM demo E2E harness (Playwright).
  - package-ecosystem: npm
    directory: "/tests/web-e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-e2e-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used by the workflows themselves.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # Container base images. Every Dockerfile in the repo lives under /docker;
  # nothing here is covered by the cargo/pip/npm ecosystems above, so until
  # this entry existed a CVE in a base image produced no signal at all.
  #
  # Partial by construction, and worth knowing which half: the literal tags
  # (docker/Dockerfile, Dockerfile.demo, mc-runner.Dockerfile and
  # trainer.Dockerfile pin python:3.11-slim and debian:bookworm-slim) are
  # updatable here. The `FROM rust:${RUST_IMAGE_TAG}` /
  # `FROM node:${NODE_IMAGE_TAG}` stages are not — Dependabot cannot resolve
  # a build ARG, and those tags are deliberately kept in step with
  # rust-toolchain.toml by scripts/check_pinned_config_consistency.py, which
  # is the mechanism that keeps them current.
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
