name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --verbose

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run -p forge-bench

  coverage:
    name: Rust Coverage (tarpaulin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache tarpaulin binary
        id: cache-tarpaulin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: tarpaulin-v0.31.0-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-tarpaulin
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --version 0.31.0 --locked
      - name: Run coverage
        run: |
          cargo tarpaulin \
            --workspace \
            --exclude forge-python \
            --exclude forge-wasm \
            --features forge-cloud/gcs \
            --skip-clean \
            --fail-under 85 \
            --out xml \
            --output-dir coverage/
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  python:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin ruff mypy pytest pytest-cov numpy gymnasium httpx \
            stable-baselines3
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build native extension
        run: maturin develop
      - name: Ruff lint
        run: ruff check python/ tests/python/ scripts/ demo_ui/ examples/
      - name: Mypy type check
        run: mypy python/ scripts/ --config-file pyproject.toml
      - name: Pytest with coverage
        run: |
          pytest tests/python/ -v \
            --cov=forge --cov=forge_env \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            --cov-config=.coveragerc

  demo-ui:
    name: Demo UI Tests
    runs-on: ubuntu-latest
    env:
      FORGE_DEMO_UI_PORT: "8765"
      FORGE_STARTUP_WAIT_SECS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install demo UI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo_ui/backend/requirements.txt
      - name: Run demo UI tests
        run: pytest demo_ui/tests/ -v --tb=short
      - name: Smoke-test server health endpoint
        run: |
          python -m uvicorn demo_ui.backend.main:app --host 127.0.0.1 --port ${FORGE_DEMO_UI_PORT} &
          SERVER_PID=$!
          sleep ${FORGE_STARTUP_WAIT_SECS}
          python -c "import httpx, os; port = os.environ['FORGE_DEMO_UI_PORT']; r = httpx.get(f'http://127.0.0.1:{port}/health'); assert r.status_code == 200, f'Health check failed: {r.status_code}'; print('Health check passed:', r.json())"
          kill $SERVER_PID
