name: CI

on:
  # NOTE: keep this list in sync with the repository's actual default branch.
  # GitHub's web UI for changing the default branch does NOT update workflow
  # filters, so a renamed/relocated default silently disables CI on PRs that
  # target it. Add the current default first to fail loud if anyone removes it.
  push:
    branches:
      - claude/plan-forge-environment-htAoK
      # Glob so any claude/* working branch (and future default renames under
      # that prefix) keeps CI wired up without editing this list each time.
      - "claude/**"
      - main
      - master
      - develop
      - v0.2/implementation
    # Release tags. REQUIRED, not decorative: when `on.push` declares only
    # `branches`, GitHub does not run the workflow for tag pushes at all, so
    # the `docker` job's `startsWith(github.ref, 'refs/tags/v')` clause below
    # was unreachable for this workflow's entire life and no tagged image was
    # ever built. Keep this key whenever that clause exists.
    tags:
      - "v*"
  pull_request:
    branches:
      - claude/plan-forge-environment-htAoK
      - "claude/**"
      - main
      - master
      - develop
      - v0.2/implementation
  workflow_dispatch:
    inputs:
      run_lmstudio:
        description: "Run opt-in LM Studio live-smoke job (requires vars.LMSTUDIO_SERVICE_IMAGE)"
        type: boolean
        default: false
      run_minecraft_e2e:
        description: "Run opt-in Minecraft E2E job (requires docker; spins up compose.minecraft.yml)"
        type: boolean
        default: false
      run_minecraft_real_run:
        description: "Run opt-in v0.5 first-real-run baseline capture (requires docker)"
        type: boolean
        default: false

# Dedupe runs: a push to a feature branch that also has an open PR would
# otherwise start two CI runs (push + pull_request). Group by the head branch
# (head_ref for PRs, ref_name for pushes) and cancel superseded in-progress runs.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege for every job that does not opt out. Without this block the
# GITHUB_TOKEN inherits the repository/organisation default, which is
# read-write on many repos — 27 jobs, most of which run untrusted PR code
# (cargo build scripts, npm postinstall, pytest), would get a token that can
# push commits and publish packages.
#
# Jobs needing more declare their own `permissions:` block, which REPLACES
# this one for that job (it is not additive). The `docker` job below keeps its
# `contents: read` + `packages: write` for GHCR publishing.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Mirrors forge.cognitive.providers.DEFAULT_LMSTUDIO_BASE_URL — keep these
  # two strings in lock-step. Used by the opt-in `python-test-lmstudio` job.
  LMSTUDIO_PORT: "1234"
  LMSTUDIO_BASE_URL: "http://localhost:1234/v1"
  # Mirrors gh-pages.yml's WASM_PACK_VERSION (the canonical pin) -- keep these
  # in lock-step. Consumed by scripts/install_wasm_pack.sh in the `wasm` and
  # `wasm-e2e` jobs; enforced by scripts/check_pinned_config_consistency.py.
  WASM_PACK_VERSION: "0.15.0"

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit toolchain, not just the action's own "stable" default --
          # dtolnay/rust-toolchain never reads rust-toolchain.toml (confirmed
          # against its own docs/action.yml), so without this every job here
          # would keep floating on whatever "stable" resolves to at each run,
          # defeating the repo-root pin. Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit toolchain, not just the action's own "stable" default --
          # dtolnay/rust-toolchain never reads rust-toolchain.toml (confirmed
          # against its own docs/action.yml), so without this every job here
          # would keep floating on whatever "stable" resolves to at each run,
          # defeating the repo-root pin. Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features forge-cloud/gcs -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit toolchain, not just the action's own "stable" default --
          # dtolnay/rust-toolchain never reads rust-toolchain.toml (confirmed
          # against its own docs/action.yml), so without this every job here
          # would keep floating on whatever "stable" resolves to at each run,
          # defeating the repo-root pin. Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features forge-cloud/gcs --verbose

  machete:
    name: Unused Dependencies (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      # Blocking: false positives from derive-only dependencies (serde, thiserror,
      # fixed, etc.) are explicitly pinned via each crate's
      # `[package.metadata.cargo-machete] ignored = [...]`.
      - run: cargo machete --with-metadata

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      # Config in .markdownlint.json, exclusions in .markdownlintignore.
      #
      # This used to be `npx --yes markdownlint-cli2 "**/*.md"`. That package
      # is declared in no package.json in this repo, so npx resolved `latest`
      # from the registry on every push and ran it with lifecycle scripts
      # enabled — a floating, unreviewed dependency with install-time code
      # execution on a runner that has just checked out the repo.
      #
      # Now: an exact pinned version, installed with `--ignore-scripts` (no
      # pre/post-install hooks run at all), into $RUNNER_TEMP rather than the
      # workspace (so the "**/*.md" glob never walks into node_modules), and
      # invoked directly instead of re-resolved by npx.
      - name: Markdown lint (pinned markdownlint-cli2)
        env:
          MARKDOWNLINT_CLI2_VERSION: "0.23.2"
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/mdlint" --no-audit --no-fund \
            --ignore-scripts "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
          "$RUNNER_TEMP/mdlint/node_modules/.bin/markdownlint-cli2" "**/*.md"

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit toolchain, not just the action's own "stable" default --
          # dtolnay/rust-toolchain never reads rust-toolchain.toml (confirmed
          # against its own docs/action.yml), so without this every job here
          # would keep floating on whatever "stable" resolves to at each run,
          # defeating the repo-root pin. Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
      - name: Install critcmp
        run: cargo install critcmp --locked || true
      - name: Restore baseline benchmarks
        id: restore-bench
        uses: actions/cache/restore@v5
        with:
          path: target/criterion-baseline
          key: bench-baseline-${{ runner.os }}
      - name: Run benchmarks
        run: cargo bench -p forge-bench -- --save-baseline current
      - name: Compare against baseline
        if: steps.restore-bench.outputs.cache-hit == 'true'
        run: |
          critcmp target/criterion-baseline target/criterion/current \
            --threshold 5
      - name: Save new baseline
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v5
        with:
          path: target/criterion/current
          key: bench-baseline-${{ runner.os }}
      - name: Export multi_agent_scaling JSON (reference_a artifact)
        # ubuntu-latest is the `reference_a` hardware class. Do not commit
        # this file from a non-GHA host; the artefact is how a later cycle
        # lands `benchmarks/baselines/reference_a/multi_agent_scaling.json`.
        run: |
          python3 benchmarks/runner/export_criterion_scaling.py \
            --criterion-dir target/criterion \
            --out /tmp/multi_agent_scaling.json \
            --profile reference_a
      - name: Upload reference_a scaling artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reference_a-multi_agent_scaling
          path: /tmp/multi_agent_scaling.json
          if-no-files-found: warn

  alloc-audit:
    name: Allocation Audit (zero-alloc gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit toolchain, not just the action's own "stable" default --
          # dtolnay/rust-toolchain never reads rust-toolchain.toml (confirmed
          # against its own docs/action.yml), so without this every job here
          # would keep floating on whatever "stable" resolves to at each run,
          # defeating the repo-root pin. Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build allocation_audit (dhat-heap)
        run: |
          cargo build -p forge-bench --bin allocation_audit \
            --features dhat-heap --release
      - name: Run audit
        run: |
          ./target/release/allocation_audit \
            --warmup 1024 --iters 10000 \
            --out alloc_audit.json
      - name: Verify zero-allocation contract
        run: |
          python3 benchmarks/runner/check_zero_alloc.py \
            --input alloc_audit.json \
            --max-bytes 0 \
            --json alloc_audit_summary.json
      - name: Upload audit artefacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: alloc-audit-report
          path: |
            alloc_audit.json
            alloc_audit_summary.json

  coverage:
    name: Rust Coverage (tarpaulin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit toolchain, not just the action's own "stable" default --
          # dtolnay/rust-toolchain never reads rust-toolchain.toml (confirmed
          # against its own docs/action.yml), so without this every job here
          # would keep floating on whatever "stable" resolves to at each run,
          # defeating the repo-root pin. Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
      - name: Cache tarpaulin binary
        id: cache-tarpaulin
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: tarpaulin-v0.31.0-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-tarpaulin
        run: |
          # rust-cache restores ~/.cargo/bin independently of the
          # tarpaulin-specific cache key (which hashes Cargo.lock). A
          # lockfile-only cache miss used to run `cargo install` against an
          # already-present binary and fail with "already exists" (exit 101).
          if cargo tarpaulin --version 2>/dev/null | grep -q '0.31.0'; then
            cargo tarpaulin --version
          else
            cargo install cargo-tarpaulin --version 0.31.0 --locked --force
          fi
      - name: Run coverage
        run: |
          cargo tarpaulin \
            --workspace \
            --exclude forge-python \
            --exclude forge-wasm \
            --features forge-cloud/gcs \
            --skip-clean \
            --fail-under 85 \
            --out xml \
            --output-dir coverage/
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  python-lint:
    name: Python Lint (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install lint tools
        # Pin tooling versions because:
        # - mypy is capped below the next major (3.0), not 2.0: mypy 2.0
        #   dropped support for `python_version` targets below 3.10, which
        #   used to matter because pyproject pinned "3.9" here. It now sets
        #   "3.11" (see [tool.mypy]'s own comment), so mypy 2.x installs and
        #   type-checks clean (verified locally against mypy 2.3.1) -- the
        #   <3.0 cap is just the same "verify a new major before adopting
        #   it" discipline as the ruff pin below, not a live incompatibility.
        # - numpy >= 2.0 bundles type stubs that misinterpret the
        #   `np.savez(path, **weights)` idiom used by every FORGE
        #   trainer's export path, raising spurious arg-type errors.
        #   numpy 1.26's stubs accept the **kwargs form. Modernising
        #   the call sites is staged separately.
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.13,<0.16" "mypy>=1.11,<3.0" "numpy>=1.26,<2.0"
      - name: Ruff lint
        run: ruff check python/ tests/python/ scripts/ demo_ui/ examples/
      - name: Mypy type check
        # `tests/` is otherwise excluded from type checking, but
        # tests/python/type_checking/ holds sentinels whose whole job is to fail this
        # step: they assert that a third-party package's types are still being
        # checked rather than silently erased to `Any`. See
        # tests/python/type_checking/test_numpy_types_are_live.py for the mechanism
        # (deliberate errors under `# type: ignore`, caught by the
        # `warn_unused_ignores = true` this repo already sets). Named
        # explicitly rather than widening to all of tests/, which would drag
        # ~200 unannotated test modules into a `disallow_untyped_defs` config.
        run: mypy python/ scripts/ tests/python/type_checking/ demo_ui/backend --config-file pyproject.toml
      - name: Claude Code hook self-tests
        # Stdlib-only (unittest + tempfile + git, no project deps), so it
        # runs here rather than needing its own job. See .claude/hooks/.
        # Auto-discovers every test_*.py under .claude/hooks/, so a new
        # hook's tests are picked up without touching this step. The
        # guard_staged_secrets tests that need a real `gitleaks` binary
        # skip themselves here (none on this job's PATH) -- they run
        # unskipped in security.yml's gitleaks job instead.
        run: python3 -m unittest discover -s .claude/hooks -p 'test_*.py' -v
      - name: Pinned-config consistency check
        # Catches rust-toolchain.toml / dtolnay toolchain: / Dockerfile
        # RUST_IMAGE_TAG / ONNXRUNTIME_VERSION / LM Studio port+URL drift --
        # see the script's own docstring for exactly which pins it
        # cross-checks and why.
        run: python3 scripts/check_pinned_config_consistency.py
      - name: Text-encoding drift check
        # Rejects NUL bytes in text-tracked files and line-ending drift.
        # Both have already happened here: 0303612 removed a stray NUL that
        # made a .ts file binary (and it recurred in mc-bot/test/
        # security.test.ts), and d51ba6d restored CHANGELOG.md's CRLF after a
        # text-mode edit flattened ~2000 lines. git renders such files as
        # `Bin`, so neither showed a reviewable diff. The .claude/hooks
        # guards only fire inside Claude Code sessions; this step is the
        # contributor-agnostic backstop.
        run: python3 scripts/check_text_encoding.py
      - name: Local/CI parity check
        # Fails if a job in this workflow has no `make` target and no stated
        # reason it cannot have one. Before this existed, ten of the jobs here
        # -- markdownlint, machete, alloc-audit, hf-export, mlflow-http,
        # forge-mc-runner-bin among them, all of which run fine on a laptop --
        # had no local path at all, so `make verify` could pass and CI still go
        # red. Also catches the reverse drift: a mapping naming a `make` target
        # that has since been renamed away.
        run: python3 scripts/check_local_ci_parity.py

  python-test:
    name: Python Tests (maturin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit toolchain, not just the action's own "stable" default --
          # dtolnay/rust-toolchain never reads rust-toolchain.toml (confirmed
          # against its own docs/action.yml), so without this every job here
          # would keep floating on whatever "stable" resolves to at each run,
          # defeating the repo-root pin. Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Create + activate virtualenv
        # maturin >= 1.x refuses to install into the system Python and needs
        # an explicit venv or conda env. setup-python doesn't create one, so
        # we make one here and `source` it for every subsequent shell.
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # `pyyaml` is required, not optional: the compose- and
          # workflow-contract tests parse those files, and they are
          # written to FAIL rather than skip without it (see
          # tests/python/integration/_helpers.py::load_yaml_document).
          pip install maturin pytest pytest-cov numpy gymnasium pettingzoo httpx jsonschema \
            pyyaml stable-baselines3
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # v0.4: install onnx + onnxruntime + onnxscript so the new
          # `minecraft_e2e_smoke` tests + the T4a `_export_bundle`
          # tests (which `importorskip("onnx")` / `("onnxscript")`)
          # actually run on PR CI rather than silently skipping.
          # `onnxscript` is required by torch >= 2.4's
          # `torch.onnx.export` for the dynamo path. Pinned to match
          # the workspace's numpy<2.0 gate.
          pip install "onnx>=1.16" "onnxruntime>=1.17" "onnxscript>=0.1"
      - name: Build native extension
        run: maturin develop
      - name: Pytest with coverage
        run: |
          pytest tests/python/ -v \
            --cov=forge --cov=forge_env --cov=scripts.v05_manual_baseline \
            --cov=check_pinned_config_consistency \
            --cov=check_text_encoding \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            --cov-config=.coveragerc

  python-test-lmstudio:
    # Opt-in live-smoke test against a real OpenAI-compatible LLM endpoint.
    # Triggered only via workflow_dispatch with `run_lmstudio=true`. Requires
    # the repo variable `LMSTUDIO_SERVICE_IMAGE` to be set to a tested OCI
    # image exposing the OpenAI v1 API on $LMSTUDIO_PORT. Document the chosen
    # image in docs/architecture.md §3.9 before enabling.
    name: Python LM Studio Smoke (opt-in)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_lmstudio
    services:
      lmstudio:
        image: ${{ vars.LMSTUDIO_SERVICE_IMAGE }}
        ports:
          - "1234:1234"
        options: >-
          --health-cmd "curl -sf http://localhost:1234/v1/models || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      # `base_url` is sourced from configs/cognitive/gemma_e4b_teacher.toml,
      # which already mirrors DEFAULT_LMSTUDIO_BASE_URL (see workflow-level
      # LMSTUDIO_BASE_URL env, kept in lock-step). No FORGE_TEACHER_BASE_URL
      # override is needed — overriding it would mask config drift.
      FORGE_LMSTUDIO_LIVE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit toolchain, not just the action's own "stable" default --
          # dtolnay/rust-toolchain never reads rust-toolchain.toml (confirmed
          # against its own docs/action.yml), so without this every job here
          # would keep floating on whatever "stable" resolves to at each run,
          # defeating the repo-root pin. Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Create + activate virtualenv
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest-cov for the same reason as the Minecraft E2E job: the
          # shared addopts carry --cov*, and this job's run step passes
          # --no-cov, so the plugin must be present or pytest exits 4.
          pip install maturin pytest pytest-cov numpy gymnasium httpx jsonschema
      - name: Build native extension
        run: maturin develop
      - name: Run lmstudio smoke (marker-selected, no coverage)
        run: pytest tests/python/test_lmstudio_live_smoke.py -m lmstudio --no-cov -v
      - name: Dump LM Studio service logs on failure
        if: failure()
        run: |
          echo "::group::LM Studio service container logs"
          docker logs "$(docker ps -aqf 'name=lmstudio' | head -n1)" 2>&1 || true
          echo "::endgroup::"
          echo "::group::LM Studio container inspect"
          docker inspect "$(docker ps -aqf 'name=lmstudio' | head -n1)" \
            --format '{{json .State}}' 2>&1 || true
          echo "::endgroup::"

  python-test-minecraft-e2e:
    # Opt-in E2E that spins up docker/compose.minecraft.yml (Minecraft +
    # mc-bot + runner) and drives the runner through two episodes,
    # asserting trajectory files appear on disk and the metrics
    # endpoint exposes the v2-plan §3.6 signals. Triggered only via
    # workflow_dispatch with `run_minecraft_e2e=true`.
    name: Python Minecraft E2E (opt-in)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_minecraft_e2e
    # The bring-up compiles forge-mc-runner from source inside Docker (no
    # image is published for it yet), so the fixture's build-path budget
    # applies. Cap the job above that budget rather than letting a hung
    # build ride GitHub's 6-hour default.
    timeout-minutes: 60
    env:
      # This job exists to RUN the suite, so a missing prerequisite must
      # fail it. Without this the fixtures `pytest.skip`, skipped tests
      # exit pytest 0, and a broken image tag or unaccepted EULA reports
      # success while verifying nothing. See tests/python/integration/
      # _helpers.py::require_e2e_execution.
      FORGE_MC_REQUIRE_E2E: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Verify docker compose is available
        run: docker compose version
      - name: Accept Minecraft EULA in the compose env
        # CI is acknowledging Mojang's EULA on its own runner instance
        # for the duration of this job only. Operators bringing the
        # stack up locally must accept it via their own
        # docker/compose.minecraft.env file.
        run: |
          cp docker/compose.minecraft.env.example docker/compose.minecraft.env
          sed -i 's/^MC_EULA=FALSE/MC_EULA=TRUE/' docker/compose.minecraft.env
          grep '^MC_EULA' docker/compose.minecraft.env
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pytest + pytest-cov
        # `pytest-cov` is REQUIRED, not optional. pyproject.toml's
        # [tool.pytest.ini_options].addopts carries --cov/--cov-report/
        # --cov-fail-under unconditionally, and the run step adds
        # --no-cov; all four are pytest-cov options. Without the plugin
        # pytest exits 4 at argument parsing -- before conftest, before
        # Docker, and before FORGE_MC_REQUIRE_E2E can mean anything:
        #   error: unrecognized arguments: --cov=python ... --no-cov
        # Pin versions explicitly; no extra deps drift in CI.
        run: pip install 'pytest==8.3.4' 'pytest-cov==6.0.0'
      - name: Run Minecraft E2E suite
        run: pytest tests/python/integration/test_minecraft_e2e.py -m minecraft_e2e --no-cov -v
      - name: Dump compose service logs on failure
        if: failure()
        run: |
          for svc in forge-mc-server forge-mc-bot forge-mc-runner; do
            echo "::group::$svc logs"
            docker logs --tail=200 "$svc" 2>&1 || true
            echo "::endgroup::"
          done
      - name: Tear down compose stack
        if: always()
        run: bash scripts/mc_run.sh --down || true

  python-test-minecraft-real-run:
    # v0.5 Phase 1 first-real-run baseline capture. Brings the full
    # self-play stack up against a real itzg/minecraft-server, drives
    # a small N-episode capture for both `random` and `trained`
    # variants, then renders the comparison report. Mirrors the
    # python-test-minecraft-e2e template; triggered only via
    # workflow_dispatch with `run_minecraft_real_run=true`.
    name: Python Minecraft Real Run (opt-in)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_minecraft_real_run
    steps:
      - uses: actions/checkout@v5
      - name: Verify docker compose is available
        run: docker compose version
      - name: Accept Minecraft EULA in the compose env
        run: |
          cp docker/compose.minecraft.env.example docker/compose.minecraft.env
          sed -i 's/^MC_EULA=FALSE/MC_EULA=TRUE/' docker/compose.minecraft.env
          grep '^MC_EULA' docker/compose.minecraft.env
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pytest + matplotlib
        run: pip install 'pytest==8.3.4' 'matplotlib>=3.8,<4.0'
      - name: Install forge in editable mode (capture-baseline + plot subcommands)
        run: pip install -e .
      - name: Capture random-action baseline (5 episodes for CI smoke)
        run: |
          python -m forge.training.muzero_mc.cli capture-baseline \
            --variant random \
            --episodes 5 \
            --out baseline_random.json \
            --timeout-secs 600
      - name: Capture trained baseline (5 episodes for CI smoke)
        run: |
          python -m forge.training.muzero_mc.cli capture-baseline \
            --variant trained \
            --episodes 5 \
            --out baseline_trained.json \
            --timeout-secs 600
      - name: Render Markdown report
        run: |
          python scripts/mc_plot_baseline.py \
            --random baseline_random.json \
            --trained baseline_trained.json \
            --out /tmp/v0.5-first-real-run.md
      - name: Sanity-check the snapshot JSONs
        run: |
          python -c "
          import json
          for name in ('baseline_random.json', 'baseline_trained.json'):
              snap = json.loads(open(name).read())
              assert len(snap['per_episode']) >= 3, f'{name} has too few episodes'
              print(f'{name}: {len(snap[\"per_episode\"])} episodes, '
                    f'manifest_versions={snap[\"manifest_versions_seen\"]}')"
      - name: Dump compose service logs on failure
        if: failure()
        run: |
          for svc in forge-mc-server forge-mc-bot forge-mc-runner forge-mc-trainer; do
            echo "::group::$svc logs"
            docker logs --tail=200 "$svc" 2>&1 || true
            echo "::endgroup::"
          done
      - name: Tear down self-play stack
        if: always()
        run: bash scripts/mc_self_play.sh --down || true

  python-test-fast:
    name: Python Tests (no native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov numpy gymnasium httpx toml
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run unit tests (no maturin)
        # Smoke-only run — disable the workspace 85% coverage gate that
        # pyproject.toml's [tool.pytest.ini_options].addopts applies by
        # default (only one test file is exercised here).
        run: |
          pytest tests/python/test_mangomas_smoke.py -v --no-cov

  api-compliance:
    name: RL Ecosystem API Compliance (Gymnasium + PettingZoo)
    runs-on: ubuntu-latest
    # Separate from `python-test` on purpose: this is the job whose green tick
    # backs the README/release claim that FORGE passes the upstream suites, so
    # it must be readable as its own required check rather than buried in a
    # 1500-test run. `python-test` also installs pettingzoo so the wrapper
    # suite in test_pettingzoo_env.py is not skip-only there; this job is
    # where the upstream checkers themselves run.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Keep in sync with rust-toolchain.toml -- dtolnay/rust-toolchain
          # never reads that file (see the python-test job's note).
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Create + activate virtualenv
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
      - name: Install compliance extras
        # `.[compliance]` is the declared extra, so the suites' version floors
        # live in pyproject.toml rather than being restated here.
        run: |
          python -m pip install --upgrade pip
          # pytest-cov is mandatory even though these steps pass --no-cov:
          # pyproject's shared addopts carry --cov unconditionally, and --no-cov
          # is itself a pytest-cov option, so pytest exits 4 at argument parsing
          # without the plugin. Pinned as a contract by
          # tests/python/integration/test_config_contracts.py.
          pip install maturin pytest pytest-cov
          pip install "gymnasium>=1.0" "pettingzoo>=1.24" "numpy>=1.26"
      - name: Build native extension
        run: maturin develop
      - name: Gymnasium env_checker + PettingZoo parallel_api_test
        run: pytest tests/python/test_api_compliance.py tests/python/test_pettingzoo_env.py -v --no-cov
      - name: Byte-level determinism across the PyO3 boundary
        run: pytest tests/python/test_determinism.py -v --no-cov

  pip-install-clean:
    name: Clean Wheel Install Smoke
    runs-on: ubuntu-latest
    # Every other Python job uses `maturin develop`, which never exercises
    # packaging: it leaves the source tree on sys.path, so a wheel missing a
    # module or a data file declared in [tool.maturin].include still imports
    # fine. This builds a real wheel, installs it into an empty environment,
    # and imports it from OUTSIDE the checkout so nothing resolves via CWD.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release -m crates/forge-python/Cargo.toml --out dist
      - name: Install into a clean environment and import from outside the tree
        run: |
          set -euo pipefail
          python -m venv /tmp/clean-install
          /tmp/clean-install/bin/python -m pip install --upgrade pip
          /tmp/clean-install/bin/python -m pip install dist/*.whl
          /tmp/clean-install/bin/python -m pip check
          cd /tmp
          /tmp/clean-install/bin/python -c "
          import forge_env
          from forge_env import ForgeEnv
          assert ForgeEnv is not None, 'native extension missing from the wheel'
          env = ForgeEnv()
          obs, info = env.reset(seed=0)
          assert 'grid_view' in obs
          env.close()
          print('wheel import OK, version', forge_env.__version__)
          "
      - name: Wheel version matches the Cargo workspace
        # The wheel's version comes from maturin reading the Cargo manifest.
        # If those ever disagree, a release publishes a mislabelled artifact.
        run: |
          set -euo pipefail
          WHEEL_VERSION="$(/tmp/clean-install/bin/python -c 'import forge_env; print(forge_env.__version__)')"
          CARGO_VERSION="$(python -c "
          import re, pathlib
          text = pathlib.Path('Cargo.toml').read_text(encoding='utf-8')
          table = re.search(r'^\[workspace\.package\][^\n]*\n(.*?)(?=^\[|\Z)', text, re.M | re.S).group(1)
          print(re.search(r'^\s*version\s*=\s*\"([^\"]+)\"', table, re.M).group(1))
          ")"
          echo "wheel=$WHEEL_VERSION cargo=$CARGO_VERSION"
          test "$WHEEL_VERSION" = "$CARGO_VERSION"

  mc-bot-test:
    name: mc-bot Node Tests + Biome Lint
    runs-on: ubuntu-latest
    # Phase 6: mc-bot ships 116 native node:test unit tests that were
    # previously not run in CI, plus a Biome config that lints the JS
    # surface. Both run here on every push touching the bot.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Pinned to the same major version mc-bot/package.json's
          # `engines.node` advertises.
          node-version: "22"
          package-manager-cache: false
      - name: Install mc-bot dependencies
        working-directory: mc-bot
        # package-lock.json is committed, so this always takes the `npm ci` path.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - name: TypeScript typecheck
        working-directory: mc-bot
        # `tsc --noEmit` against tsconfig.json with allowJs+checkJs
        # validates the JSDoc-typed source surface. A follow-up
        # commit renames .js → .ts; the typecheck step works either
        # way.
        run: npm run typecheck
      - name: Lint with Biome
        working-directory: mc-bot
        run: npm run lint
      - name: Run node:test suite
        working-directory: mc-bot
        run: npm test
      - name: Run node:test suite with coverage (gated)
        # The baseline this step was collecting has been collected: mc-bot
        # measures 90.68% lines / 81.57% branches / 95.06% functions, so it
        # was already clearing the 85% gate every other surface in this repo
        # enforces (tarpaulin --fail-under 85, .coveragerc fail_under 85,
        # pytest --cov-fail-under=85, dashboard 85%) while being the only one
        # exempt from it. `c8 --check-coverage` now enforces 85/75/90 --
        # thresholds set below the measured numbers with real headroom rather
        # than pinned to them, so an honest refactor does not go red while a
        # genuine regression does.
        #
        # This surface earns a gate more than most: mc-bot owns the
        # wire-contract logic the Rust and Python sides cross-check against
        # (schema_id canonicalization, action/reward registries) *and*, as of
        # this branch, the network-facing WebSocket auth, frame cap and queue
        # cap. Both failure directions were verified by raising each threshold
        # above the measured value and watching c8 exit 1.
        working-directory: mc-bot
        run: npm run test:coverage
      - name: Upload mc-bot coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mc-bot-coverage-report
          path: mc-bot/coverage/

  forge-mc-runner-bin:
    name: forge-mc-runner Binary Smoke
    runs-on: ubuntu-latest
    # Phase 4 wire-up sanity: ensure the runner binary builds and the
    # --dry-run smoke path remains green. Cheap, catches regressions in
    # the env+search+writer composition without requiring docker.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit toolchain, not just the action's own "stable" default --
          # dtolnay/rust-toolchain never reads rust-toolchain.toml (confirmed
          # against its own docs/action.yml), so without this every job here
          # would keep floating on whatever "stable" resolves to at each run,
          # defeating the repo-root pin. Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: forge-mc-runner-bin
      - name: Build forge-mc-runner binary
        run: cargo build -p forge-mc-runner --bin forge-mc-runner
      - name: Run dry-run smoke
        run: |
          mkdir -p ./_smoke_traj
          ./target/debug/forge-mc-runner --dry-run --episodes 1 \
            || (echo "::error::forge-mc-runner --dry-run failed"; exit 1)

  hf-export:
    name: HF Export (feature-gated)
    runs-on: ubuntu-latest
    # The `hf` feature (arrow/parquet Parquet export + forge-gen-dataset bin)
    # is off by default and invisible to the workspace-wide jobs above. This
    # job keeps it compiling and its tests green, plus a tiny generation
    # smoke so the bin's episode→Parquet path stays wired end-to-end.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit toolchain, not just the action's own "stable" default --
          # dtolnay/rust-toolchain never reads rust-toolchain.toml (confirmed
          # against its own docs/action.yml), so without this every job here
          # would keep floating on whatever "stable" resolves to at each run,
          # defeating the repo-root pin. Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hf-export
      - name: Clippy (hf feature)
        run: |
          cargo clippy -p forge-replay --all-targets --features hf -- -D warnings
          cargo clippy -p forge-data --all-targets --features hf -- -D warnings
      - name: Test (hf feature)
        run: |
          cargo test -p forge-replay --features hf
          cargo test -p forge-data --features hf
      - name: Generation smoke (2 cells × 2 episodes)
        run: |
          cargo run -p forge-data --features hf --bin forge-gen-dataset -- \
            --out ./_hf_smoke --episodes-per-cell 2 --max-steps 30 --mcts-sims 4 \
            --cells square-32-a1-t1-mcts,square-32-a1-t1-random
          test -f ./_hf_smoke/dataset_info.json \
            || (echo "::error::dataset_info.json missing"; exit 1)

  mutants:
    name: Mutation Testing (security-critical modules)
    runs-on: ubuntu-latest
    # Coverage answers "was this line executed". This answers "would a test
    # have noticed if it did something else" — and on this branch the answer
    # was repeatedly no, at 85%+ coverage with a green suite:
    #
    #   * `cors_layer_skips_unparseable_origins` bound its layer to `_layer`
    #     and asserted nothing; `cors_layer` could be rewritten to allow no
    #     origin at all and stay green.
    #   * the bundle path-containment guard's only test escaped to a *parent*
    #     directory, so swapping `Path::starts_with` for a string compare —
    #     which lets `/models-attacker/evil.onnx` through — was invisible.
    #   * mc-bot's cap tests sat 4-100x from their own boundaries, so an 8x
    #     payload-cap drift and `>=` -> `>` on the queue cap both survived.
    #   * `AuthFailure::as_str` could return "" for all three reasons,
    #     erasing an operator's only signal that someone is guessing tokens
    #     (the 401 body is deliberately uniform), with nothing failing.
    #
    # Every one was found by mutating the code by hand. This makes it routine.
    #
    # Scope and the reasoning behind it live in .cargo/mutants.toml: the two
    # crates that decide whether an untrusted model bundle is loaded and
    # whether an unauthenticated request reaches a mutating endpoint. Not the
    # workspace — that is 6,298 mutants, hours of runner time, and not a PR
    # gate. This scope is 42 mutants in ~4 minutes.
    #
    # Blocking, with an empty exclusion list. Three equivalent mutants turned
    # up while building it and all three were removed by changing the code
    # rather than excusing it, so a survivor here means a real test gap.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # See the note in hf-export: this action never reads
          # rust-toolchain.toml, so the pin has to be repeated per job.
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutation-test forge-mc-runner + forge-server
        # `--timeout 120` is not optional: a mutant that hangs is a *detected*
        # mutant, but without a cap it stalls the job instead of reporting one.
        # It is a CLI flag rather than a mutants.toml key (v27 rejects the key).
        run: cargo mutants -p forge-mc-runner -p forge-server --timeout 120
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutants-report
          path: mutants.out/

  mlflow-http:
    name: MLflow HTTP Transport (feature-gated)
    runs-on: ubuntu-latest
    # `forge-eval/http-mlflow` gates 1,434 production lines: 987 in
    # src/exporters/mlflow_http.rs (the reqwest-backed MLflow tracking
    # transport, counting only the code above its own #[cfg(test)] module)
    # plus the 447-line forge-eval-longrun bin, which declares
    # required-features on it. The workspace-wide clippy/test jobs above pass
    # only
    # `--features forge-cloud/gcs`, so none of it is compiled, linted, tested,
    # or counted in coverage on a PR. That is the same hole the `onnx-features`
    # job below was added to close after a routine `ort` bump broke the ONNX
    # surface undetected -- reqwest/url/scopeguard are on Dependabot's weekly
    # schedule too, and this crate's exclusive dependency on them means a
    # grouped minor/patch PR could land the identical failure.
    #
    # A separate job rather than folding these steps into `hf-export`: that
    # job's name is a check name a branch-protection rule may reference, and
    # renaming it to cover both surfaces would silently change what protection
    # matches.
    #
    # `tests/mlflow_http_e2e.rs` is `#[ignore]`d (it pulls a ~1.5GB MLflow
    # image via testcontainers), so this stays a fast compile-and-unit-test
    # job; `cargo test` here still builds that target, which is what keeps the
    # testcontainers integration from bit-rotting.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # See the note in hf-export: this action never reads
          # rust-toolchain.toml, so the pin has to be repeated per job.
          # Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mlflow-http
      - name: Clippy (http-mlflow feature)
        run: cargo clippy -p forge-eval --all-targets --features http-mlflow -- -D warnings
      - name: Test (http-mlflow feature)
        run: cargo test -p forge-eval --features http-mlflow
      - name: CLI smoke (forge-eval-longrun --help)
        # The bin is `required-features = ["http-mlflow"]`, so a build failure
        # in its clap surface is invisible to every other job. `--help` exits 0
        # only if clap's command tree assembles.
        run: cargo run -p forge-eval --features http-mlflow --bin forge-eval-longrun -- --help

  onnx-features:
    name: ONNX Feature Surface (onnx, onnx-reload, mc-live-bundled)
    runs-on: ubuntu-latest
    # The onnx/onnx-reload/mc-live-bundled feature surface had ZERO CI
    # coverage until this job -- every workspace-wide job above builds
    # only `--features forge-cloud/gcs`. That's exactly how a routine
    # Dependabot bump (ort rc.12 -> rc.13) silently broke the ONNX path:
    # nothing here caught it. Uses load-dynamic (`ort/load-dynamic`, via
    # forge-agent's `onnx-bundled` feature and forge-mc-runner's
    # `mc-live-bundled`, which implies it) so this job only needs a
    # downloaded .so + ORT_DYLIB_PATH -- no system ONNX Runtime install,
    # pkg-config, or static-link setup required.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicit toolchain, not just the action's own "stable" default --
          # dtolnay/rust-toolchain never reads rust-toolchain.toml (confirmed
          # against its own docs/action.yml), so without this every job here
          # would keep floating on whatever "stable" resolves to at each run,
          # defeating the repo-root pin. Keep in sync with rust-toolchain.toml.
          toolchain: "1.94.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: onnx-features
      - name: Install ONNX Runtime
        # >=1.23.2 is required: older releases hit a known upstream `ort`
        # rc.13 teardown segfault on process exit under load-dynamic
        # (pykeio/ort#614, fixed in the runtime by pykeio/ort#610) --
        # reproduced and confirmed fixed by this version during the
        # feature-surface repair. Matches docker/mc-runner.Dockerfile's
        # ONNXRUNTIME_VERSION build arg.
        run: |
          set -euo pipefail
          ORT_VERSION=1.23.2
          curl -fsSL -o /tmp/onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar -xzf /tmp/onnxruntime.tgz -C /tmp
          echo "ORT_DYLIB_PATH=/tmp/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so" >> "$GITHUB_ENV"
      - name: Clippy (onnx-bundled / mc-live-bundled)
        run: |
          cargo clippy -p forge-agent --all-targets --features onnx-bundled -- -D warnings
          cargo clippy -p forge-mc-runner --all-targets --features mc-live-bundled -- -D warnings
      - name: Build (mc-live-bundled binary)
        run: cargo build -p forge-mc-runner --bin forge-mc-runner --features mc-live-bundled
      - name: Test (onnx-bundled / mc-live-bundled)
        # mc-live-bundled implies onnx-reload, so this also exercises every
        # onnx-reload-gated test (ModelManifest, HotReloadWatcher,
        # OnnxMuZeroModel::reload) without a separate static-link setup.
        # The heavier bootstrap-a-real-model-and-infer integration test
        # (tests/onnx_integration.rs) needs torch+onnx+onnxscript and is
        # `#[ignore]`d accordingly -- run manually with `--ignored` in a
        # torch-capable environment, matching forge-eval's precedent for
        # heavy-external-dep tests.
        run: |
          cargo test -p forge-agent --features onnx-bundled
          cargo test -p forge-mc-runner --features mc-live-bundled

  mc-runner-bundled-image:
    name: mc-live-bundled Runner Image Smoke
    runs-on: ubuntu-latest
    # Compose trained identity (`RUNNER_FEATURES=mc-live-bundled`) is a
    # no-op unless this Dockerfile actually builds. The onnx-features
    # job cargo-builds the feature surface; this job is the image.
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build forge-mc-runner with FEATURES=mc-live-bundled
        run: |
          docker build \
            -f docker/mc-runner.Dockerfile \
            --build-arg FEATURES=mc-live-bundled \
            -t forge-mc-runner:bundled-smoke \
            .
      - name: Smoke --help via image ENTRYPOINT
        run: docker run --rm forge-mc-runner:bundled-smoke --help

  demo-ui:
    name: Demo UI Tests
    runs-on: ubuntu-latest
    env:
      FORGE_DEMO_UI_PORT: "8765"
      FORGE_DEMO_PORT: "18765"
      FORGE_STARTUP_WAIT_SECS: "3"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            demo_ui/backend/requirements.txt
            demo_ui/pyproject.toml
      - name: Install demo UI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo_ui/backend/requirements.txt
          pip install -e 'demo_ui[dev]'
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Run demo UI tests
        # demo_ui/pytest.ini enforces --cov-fail-under=70 coverage (demo_ui/backend);
        # the E2E test is skipped when Playwright browsers are not installed.
        run: pytest demo_ui/tests/ -v --tb=short
      - name: Upload demo UI coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: demo-ui-coverage-report
          path: coverage.xml
      - name: Smoke-test server health endpoint
        run: |
          python -m uvicorn demo_ui.backend.main:app --host 127.0.0.1 --port ${FORGE_DEMO_UI_PORT} &
          SERVER_PID=$!
          sleep ${FORGE_STARTUP_WAIT_SECS}
          python -c "import httpx, os; port = os.environ['FORGE_DEMO_UI_PORT']; r = httpx.get(f'http://127.0.0.1:{port}/health'); assert r.status_code == 200, f'Health check failed: {r.status_code}'; print('Health check passed:', r.json())"
          kill $SERVER_PID

  dashboard:
    name: Dashboard Build + Lint + Coverage
    runs-on: ubuntu-latest
    # The FORGE Control Center (React/Vite) ships unit + component tests with
    # an enforced 85% coverage threshold (configured in vite.config.ts). This
    # job builds, lints (Biome), and runs the coverage gate on every push.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Type-check + production build
        working-directory: dashboard
        run: npm run build
      - name: Lint with Biome
        working-directory: dashboard
        run: npm run lint
      - name: Run tests with 85% coverage gate
        working-directory: dashboard
        run: npm run test:coverage

  dashboard-e2e:
    name: Dashboard E2E + AQA (Playwright)
    runs-on: ubuntu-latest
    # Playwright drives the production build (vite preview) in Chromium with all
    # backends mocked, plus axe-core accessibility scans. NON-BLOCKING for now:
    # not in any job's needs[] and not a required check — promote once stable.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci
      - name: Type-check E2E sources
        working-directory: dashboard
        run: npm run typecheck:e2e
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-
      - name: Install Playwright Chromium
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Run E2E + accessibility suite
        working-directory: dashboard
        run: npm run test:e2e
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7
      - name: Upload Playwright traces/videos
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: dashboard/test-results/
          retention-days: 7

  wasm:
    name: WASM Target Check + Node Runtime Tests
    runs-on: ubuntu-latest
    # BLOCKING. Until this job existed, nothing on a PR ever compiled
    # crates/forge-wasm for wasm32-unknown-unknown: gh-pages.yml and
    # hf-space.yml build it only on `push` to the release branches, so a
    # wasm32-breaking change merged green and broke the deploy after the fact.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Keep in sync with rust-toolchain.toml -- dtolnay/rust-toolchain
          # never reads that file itself.
          toolchain: "1.94.1"
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (wasm32-unknown-unknown)
        # --all-targets matters here: the crate's wasm-runtime tests are
        # #![cfg(target_arch = "wasm32")], so the workspace-wide `clippy` job
        # compiles them to an empty crate on the host and never lints them.
        run: cargo clippy -p forge-wasm --all-targets --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install wasm-pack
        run: scripts/install_wasm_pack.sh
      - name: Run forge-wasm's tests in a real wasm runtime
        # --node, not --headless --chrome: this step proves the compiled module
        # instantiates and executes under wasm32 (32-bit usize, trap-based
        # panics). Browser-specific behaviour -- the `--target web` glue, ES
        # module loading, the real DOM -- is covered by the `wasm-e2e` job
        # against the actual demo page, which is strictly more representative
        # than wasm-pack's headless harness, so running both would be redundant.
        #
        # Wrapped rather than called directly: bare `wasm-pack test --node`
        # exits 0 when a crate has no #[wasm_bindgen_test] functions, which
        # would make this gate vacuously green. See the script's header.
        run: scripts/wasm_test_node.sh

  wasm-e2e:
    name: WASM Demo E2E (Playwright)
    runs-on: ubuntu-latest
    # Drives the REAL static demo -- web/index.html + web/app.js + the wasm-pack
    # `--target web` output -- in Chromium. Nothing is mocked: the demo is fully
    # client-side, so these bytes are the ones gh-pages.yml uploads.
    #
    # NON-BLOCKING for now, mirroring how `dashboard-e2e` was introduced: not in
    # any job's needs[] and not a required check. Promote once it has been green
    # for a full release cycle.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Keep in sync with rust-toolchain.toml (dtolnay never reads it).
          toolchain: "1.94.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/web-e2e/package-lock.json
      - name: Install wasm-pack
        run: scripts/install_wasm_pack.sh
      - name: Build the demo bundle into web/pkg/
        # The same script `make wasm` and the Playwright webServer use, so the
        # E2E can never test a differently-built artifact than local dev. A
        # separate step for clean failure attribution; the webServer's own
        # rebuild is then a warm-cache no-op.
        run: scripts/build_wasm_demo.sh
      - name: Install E2E dependencies
        working-directory: tests/web-e2e
        run: npm ci
      - name: Type-check E2E sources
        working-directory: tests/web-e2e
        run: npm run typecheck:e2e
      - name: Run app.js unit tests
        # node:test against web/app.js directly (no browser) -- covers the
        # parseSeed() boundary and BigInt-overflow-guard edge cases that a
        # DOM-driven Playwright spec can't reach cheaply. Runs after the
        # bundle build above so app.js's top-level `./pkg/forge_wasm.js`
        # import resolves.
        working-directory: tests/web-e2e
        run: npm run test:unit
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Distinct `pw-web-` prefix: dashboard-e2e's `pw-${{ runner.os }}-`
          # restore-key would otherwise cross-restore a Chromium built for a
          # different @playwright/test version.
          key: pw-web-${{ runner.os }}-${{ hashFiles('tests/web-e2e/package-lock.json') }}
          restore-keys: pw-web-${{ runner.os }}-
      - name: Install Playwright Chromium
        working-directory: tests/web-e2e
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E suite
        working-directory: tests/web-e2e
        run: npm run test:e2e
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: wasm-e2e-report
          path: tests/web-e2e/playwright-report/
          retention-days: 7
      - name: Upload Playwright traces/videos
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: wasm-e2e-traces
          path: tests/web-e2e/test-results/
          retention-days: 7

  docker:
    name: Docker Build & Publish (GHCR + optional Docker Hub)
    runs-on: ubuntu-latest
    needs: [test, clippy, fmt, python-test, api-compliance, pip-install-clean]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract GHCR metadata
        id: meta_ghcr
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
      - name: Build and push to GHCR
        id: build_ghcr
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_ghcr.outputs.tags }}
          labels: ${{ steps.meta_ghcr.outputs.labels }}
          cache-from: type=gha,scope=docker-ghcr
          cache-to: type=gha,mode=max,scope=docker-ghcr

      # ──────────────────────────────────────────────────────────────────
      # Docker Hub parallel publish — opt-in.
      # Triggers only when the repo variable DOCKERHUB_NAMESPACE is set
      # (Settings → Secrets and variables → Actions → Variables) and the
      # secret DOCKERHUB_TOKEN exists. Until both are provisioned, the
      # whole Docker Hub path skips cleanly and CI stays green.
      # Reuses the buildx + QEMU setup above (single setup, two pushes);
      # the second build is near-free thanks to the shared layer cache
      # (`docker-shared` scope) populated by the GHCR build.
      # ──────────────────────────────────────────────────────────────────
      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_NAMESPACE != ''
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract Docker Hub metadata
        if: vars.DOCKERHUB_NAMESPACE != ''
        id: meta_dockerhub
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/forge
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
      - name: Build and push to Docker Hub
        if: vars.DOCKERHUB_NAMESPACE != ''
        id: build_dockerhub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_dockerhub.outputs.tags }}
          labels: ${{ steps.meta_dockerhub.outputs.labels }}
          cache-from: |
            type=gha,scope=docker-ghcr
            type=gha,scope=docker-dockerhub
          cache-to: type=gha,mode=max,scope=docker-dockerhub

      # ──────────────────────────────────────────────────────────────────
      # Post-push smoke — pull the *first* GHCR tag we just produced
      # (`steps.meta_ghcr.outputs.tags` is multi-line; head -n1 picks the
      # first concrete reference, NOT `${{ github.sha }}` which is the full
      # 40-char SHA that metadata-action's `type=sha,prefix=` never emits).
      # On failure, surface container logs + state so a smoke regression is
      # debuggable from the Actions log alone.
      # ──────────────────────────────────────────────────────────────────
      - name: Smoke-pull GHCR image and /health probe
        env:
          IMAGE_TAGS: ${{ steps.meta_ghcr.outputs.tags }}
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s\n' "$IMAGE_TAGS" | head -n1)"
          echo "Smoke-testing $IMAGE"
          docker pull "$IMAGE"
          # Belt-and-suspenders with docker/Dockerfile runtime ENV and
          # docker/docker-compose.yml: forge-server defaults to loopback,
          # which a published container port cannot reach (22d0fb80).
          docker run -d --name forge-smoke \
            -p 127.0.0.1:8080:8080 \
            -e FORGE_SERVER_BIND=0.0.0.0:8080 \
            -e FORGE_SERVER_HISTORY_DIR=/home/forge/forge-history \
            "$IMAGE"
          ok=0
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8080/health"; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::health probe failed after 30s; container logs follow"
            echo "::group::forge-smoke logs"
            docker logs forge-smoke 2>&1 || true
            echo "::endgroup::"
            echo "::group::forge-smoke inspect"
            docker inspect forge-smoke --format '{{json .State}}' 2>&1 || true
            echo "::endgroup::"
            exit 1
          fi
          docker rm -f forge-smoke
