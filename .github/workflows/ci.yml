name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --verbose

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --no-run -p forge-bench

  python:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin ruff mypy pytest pytest-cov numpy gymnasium httpx \
            stable-baselines3 torch
      - name: Build native extension
        run: maturin develop
      - name: Ruff lint
        run: ruff check python/ tests/python/ scripts/ demo_ui/ examples/
      - name: Mypy type check
        run: mypy python/ scripts/ --config-file pyproject.toml
      - name: Pytest with coverage
        run: |
          pytest tests/python/ -v \
            --cov=forge --cov=forge_env \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            --cov-config=.coveragerc

  demo-ui:
    name: Demo UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install demo UI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo_ui/backend/requirements.txt
      - name: Run demo UI tests
        run: pytest demo_ui/tests/ -v --tb=short
      - name: Smoke-test server health endpoint
        run: |
          python -m uvicorn demo_ui.backend.main:app --host 127.0.0.1 --port 8765 &
          SERVER_PID=$!
          sleep 3
          python -c "import httpx; r = httpx.get('http://127.0.0.1:8765/health'); assert r.status_code == 200, f'Health check failed: {r.status_code}'; print('Health check passed:', r.json())"
          kill $SERVER_PID
