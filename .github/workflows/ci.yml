name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --verbose

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Performance regression threshold: flag any benchmark that regresses >5%.
    # The comparison step uses continue-on-error so the first run (no baseline)
    # does not fail the build.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Fast compile-only check (catches build errors without running benchmarks)
      - name: Compile benchmarks
        run: cargo bench --no-run -p forge-bench

      # Run benchmarks and capture output in Criterion's bencher format
      - name: Run benchmarks
        run: cargo bench -p forge-bench -- --output-format bencher 2>&1 | tee benchmark_results.txt

      # Upload raw benchmark results as a CI artifact for manual inspection
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.txt
          retention-days: 90

      # Compare against stored baseline and flag >5% regressions.
      # Uses gh-pages branch to persist historical benchmark data as JSON.
      # continue-on-error: the first run has no baseline and would otherwise fail.
      - name: Benchmark regression check (>5% threshold)
        uses: benchmark-action/github-action-benchmark@v1.20.4
        with:
          tool: cargo
          output-file-path: benchmark_results.txt
          # Store baseline JSON in gh-pages branch under dev/bench
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          # Fail the step if any benchmark regresses by more than 105% of baseline
          alert-threshold: "105%"
          fail-on-alert: true
          # Post a comment on PRs when regression is detected
          comment-on-alert: true
          # Auto-push updated baseline on pushes to main/develop (not on PRs)
          auto-push: ${{ github.event_name == 'push' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Install critcmp for local baseline comparison (useful for developers)
      - name: Install critcmp
        run: cargo install critcmp --locked
      - name: Compare with critcmp (if baseline exists)
        run: |
          if [ -d target/criterion ]; then
            echo "Criterion results found, running critcmp..."
            critcmp --list target/criterion || true
          else
            echo "No criterion baseline found (first run). Skipping comparison."
          fi
        continue-on-error: true

  coverage:
    name: Rust Coverage (tarpaulin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache tarpaulin binary
        id: cache-tarpaulin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: tarpaulin-v0.31.0-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-tarpaulin
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --version 0.31.0 --locked
      - name: Run coverage
        run: |
          cargo tarpaulin \
            --workspace \
            --exclude forge-python \
            --exclude forge-wasm \
            --skip-clean \
            --fail-under 85 \
            --out xml \
            --output-dir coverage/
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  python-fast:
    name: Python Lint & Fast Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest numpy gymnasium httpx
      - name: Ruff lint
        run: ruff check python/ tests/python/ scripts/ demo_ui/ examples/
      - name: Mypy type check
        run: mypy python/ scripts/ --config-file pyproject.toml
      - name: Pytest (pure-Python, no native extension)
        run: pytest tests/python/ -m 'not native' -q -o 'addopts='

  python-native:
    name: Python Native Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin ruff mypy pytest pytest-cov numpy gymnasium httpx \
            stable-baselines3
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build native extension
        run: maturin develop
      - name: Pytest with coverage (all tests)
        run: |
          pytest tests/python/ -v \
            --cov=forge --cov=forge_env \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            --cov-config=.coveragerc

  demo-ui:
    name: Demo UI Tests
    runs-on: ubuntu-latest
    env:
      FORGE_DEMO_UI_PORT: "8765"
      FORGE_STARTUP_WAIT_SECS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install demo UI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo_ui/backend/requirements.txt
      - name: Run demo UI tests
        run: pytest demo_ui/tests/ -v --tb=short
      - name: Smoke-test server health endpoint
        run: |
          python -m uvicorn demo_ui.backend.main:app --host 127.0.0.1 --port ${FORGE_DEMO_UI_PORT} &
          SERVER_PID=$!
          sleep ${FORGE_STARTUP_WAIT_SECS}
          python -c "import httpx, os; port = os.environ['FORGE_DEMO_UI_PORT']; r = httpx.get(f'http://127.0.0.1:{port}/health'); assert r.status_code == 200, f'Health check failed: {r.status_code}'; print('Health check passed:', r.json())"
          kill $SERVER_PID
