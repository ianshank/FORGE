name: GitHub Pages (WASM demo)

# Builds the forge-wasm crate to WebAssembly and publishes the fully static
# in-browser demo (web/) to GitHub Pages. The demo runs the simulation entirely
# client-side — no server.

on:
  push:
    branches: [claude/plan-forge-environment-htAoK]
    paths:
      - "crates/forge-wasm/**"
      - "crates/forge-core/**"
      - "crates/forge-types/**"
      - "web/**"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

# Least-privilege token; Pages deploy needs pages:write + id-token:write.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Build forge-wasm (wasm-pack, web target)
        # Emits the JS bindings + .wasm into web/pkg/, which web/app.js imports.
        run: wasm-pack build crates/forge-wasm --target web --out-dir "$GITHUB_WORKSPACE/web/pkg" --no-typescript
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
