name: GitHub Pages (WASM demo)

# Builds the forge-wasm crate to WebAssembly and publishes the fully static
# in-browser demo (web/) to GitHub Pages. The demo runs the simulation entirely
# client-side — no server.

on:
  push:
    # Mirror the repository's release/default branches so Pages keeps deploying
    # if the default branch changes (e.g. a merge to `main`). `workflow_dispatch`
    # below allows a manual deploy from any branch.
    # Deploy workflow: build/publish Pages only from the release/default
    # branches, NOT from every feature branch (a `claude/**` glob would build
    # the WASM demo on unrelated PRs and surface unrelated toolchain breakage).
    branches: [main, claude/plan-forge-environment-htAoK]
    paths:
      - "crates/forge-wasm/**"
      - "crates/forge-core/**"
      - "crates/forge-types/**"
      - "web/**"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

# Least-privilege token; Pages deploy needs pages:write + id-token:write.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Keep in sync with rust-toolchain.toml -- dtolnay/rust-toolchain
          # never reads that file itself (confirmed against its action.yml).
          toolchain: "1.94.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        # jetli/wasm-pack-action@v0.4.0 is node16 (worse than node20) with
        # no newer tag and no node24 support anywhere, including its
        # master branch -- there is no version bump that fixes it. This
        # downloads the same pinned wasm-pack release directly from
        # upstream instead: a plain shell step has no Node runtime at
        # all, so it is permanently immune to this whole class of
        # deprecation. Verified: the asset exists and its top-level entry
        # is the bare `wasm-pack` binary (musl static build, runs on any
        # ubuntu-latest). `sudo` because GitHub-hosted runners execute
        # steps as a non-root user and /usr/local/bin is root-owned;
        # `-f` on curl so a moved/missing release 404s loudly here
        # instead of failing downstream in `tar` on the error body.
        env:
          WASM_PACK_VERSION: "0.15.0"
        run: scripts/install_wasm_pack.sh
      - name: Build forge-wasm (wasm-pack, web target)
        # Emits the JS bindings + .wasm into web/pkg/, which web/app.js imports.
        # Shared with `make wasm` and the wasm-e2e job, so what CI publishes is
        # what local dev and the browser E2E suite exercise.
        run: scripts/build_wasm_demo.sh
      - name: Verify the bundle exists before publishing
        # web/index.html is static and uploads happily without pkg/, producing a
        # site that 404s on its own module. hf-space.yml has always had an
        # equivalent check (it du's the .wasm); this one had none.
        run: |
          test -f web/pkg/forge_wasm.js || { echo "::error::web/pkg/forge_wasm.js missing"; exit 1; }
          test -f web/pkg/forge_wasm_bg.wasm || { echo "::error::web/pkg/forge_wasm_bg.wasm missing"; exit 1; }
          echo "wasm size: $(du -h web/pkg/forge_wasm_bg.wasm | cut -f1)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Post-publish smoke
        # Same convention as hf-dataset.yml's "Post-publish load smoke" and
        # hf-model.yml's warm-start round-trip: fetch the published artifact
        # back and assert on it, rather than trusting that a green upload means
        # a working page. A deploy can succeed while the site serves the .wasm
        # with the wrong content type, which breaks
        # WebAssembly.instantiateStreaming for every visitor.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          # Named rather than inlined so the retry budget is visible without
          # reading loop syntax. hf-space.yml's Post-publish smoke carries the
          # same two numbers for the same reason (CDN propagation lag) under
          # its own env: block -- not sourced from one place, since the two
          # publish targets' propagation characteristics aren't guaranteed to
          # match, unlike e.g. WASM_PACK_VERSION's cross-language build pin.
          RETRY_ATTEMPTS: "5"
          RETRY_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          echo "Smoke-testing $base"

          # Pages propagation is not instant; retry briefly before failing.
          for attempt in $(seq 1 "$RETRY_ATTEMPTS"); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$base/" || echo 000)"
            [ "$code" = "200" ] && break
            echo "attempt $attempt: index.html -> $code, retrying in ${RETRY_DELAY_SECONDS}s"
            sleep "$RETRY_DELAY_SECONDS"
          done
          [ "$code" = "200" ] || { echo "::error::index.html returned $code"; exit 1; }

          ctype="$(curl -sS -o /dev/null -w '%{content_type}' "$base/pkg/forge_wasm_bg.wasm")"
          echo "pkg/forge_wasm_bg.wasm content-type: $ctype"
          case "$ctype" in
            application/wasm*) ;;
            *)
              echo "::error::.wasm served as '$ctype', not application/wasm --" \
                   "WebAssembly.instantiateStreaming will fall back for every visitor"
              exit 1
              ;;
          esac

          curl -sSf "$base/pkg/forge_wasm.js" >/dev/null
          echo "Post-publish smoke OK: $base"
