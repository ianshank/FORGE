name: Demo UI CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'demo_ui/**'
      - '.github/workflows/demo_ui_ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'demo_ui/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r demo_ui/backend/requirements.txt
        # Explicitly install the package if needed, though conftest handles sys.path
        # pip install -e . 

    - name: Install Playwright Browsers
      run: playwright install --with-deps chromium

    - name: Run Backend Tests
      run: pytest demo_ui/tests/test_backend.py

    - name: Run E2E Browser Tests
      run: pytest demo_ui/tests/test_e2e_browser.py --browser chromium --headless
