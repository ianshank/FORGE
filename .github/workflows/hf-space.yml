name: HF Space sync (WASM demo)

# Builds the forge-wasm crate to WebAssembly and mirrors the fully static
# in-browser demo (web/ + web/pkg/) to the Hugging Face Space
# `ianshank/forge-wasm-demo`. Companion to gh-pages.yml — same build, second
# publish target. Requires a write-scoped HF_TOKEN repository secret.

on:
  push:
    # Publish only from the release branch (`main`) plus the repository's
    # current default branch (`claude/plan-forge-environment-htAoK`), mirroring
    # gh-pages.yml; workflow_dispatch allows a manual sync (optionally to a
    # different Space repo) from any branch.
    branches: [main, claude/plan-forge-environment-htAoK]
    paths:
      - "crates/forge-wasm/**"
      - "crates/forge-core/**"
      - "crates/forge-types/**"
      - "web/**"
      - ".github/workflows/hf-space.yml"
  workflow_dispatch:
    inputs:
      repo_id:
        description: "Target Hugging Face Space repo id"
        required: false
        default: "ianshank/forge-wasm-demo"

permissions:
  contents: read

# One sync at a time; new pushes supersede in-flight runs.
concurrency:
  group: hf-space
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_REPO_ID: ${{ github.event.inputs.repo_id || 'ianshank/forge-wasm-demo' }}
    steps:
      - name: Check HF_TOKEN secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set. Add a write-scoped token under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Keep in sync with rust-toolchain.toml -- dtolnay/rust-toolchain
          # never reads that file itself (confirmed against its action.yml).
          toolchain: "1.94.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        # jetli/wasm-pack-action@v0.4.0 is node16 (worse than node20) with
        # no newer tag and no node24 support anywhere, including its
        # master branch -- there is no version bump that fixes it. This
        # downloads the same pinned wasm-pack release directly from
        # upstream instead: a plain shell step has no Node runtime at
        # all, so it is permanently immune to this whole class of
        # deprecation. Verified: the asset exists and its top-level entry
        # is the bare `wasm-pack` binary (musl static build, runs on any
        # ubuntu-latest). `sudo` because GitHub-hosted runners execute
        # steps as a non-root user and /usr/local/bin is root-owned;
        # `-f` on curl so a moved/missing release 404s loudly here
        # instead of failing downstream in `tar` on the error body.
        # Same invocation as gh-pages.yml -- keep WASM_PACK_VERSION in
        # lock-step across both files (enforced by
        # scripts/check_pinned_config_consistency.py).
        env:
          WASM_PACK_VERSION: "0.15.0"
        run: scripts/install_wasm_pack.sh
      - name: Build forge-wasm (wasm-pack, web target)
        # Same script as gh-pages.yml, `make wasm`, and the wasm-e2e job.
        run: scripts/build_wasm_demo.sh
      - name: Assemble Space staging directory
        run: |
          staging="$RUNNER_TEMP/space"
          mkdir -p "$staging"
          cp web/index.html web/app.js "$staging/"
          cp -r web/pkg "$staging/pkg"
          # wasm-pack emits pkg/.gitignore, which would exclude the build
          # artifacts from the Space's git repo — drop it before upload.
          rm -f "$staging/pkg/.gitignore"
          # The Space card (HF frontmatter) replaces the repo-dev README.
          cp web/space/README.md "$staging/README.md"
          echo "Staged files:" && ls -lR "$staging"
          echo "wasm size:" && du -h "$staging/pkg/forge_wasm_bg.wasm"
      - name: Install huggingface_hub
        # Pinned range: keeps the sync reproducible across hub releases.
        run: pip install "huggingface_hub>=0.23,<2.0"
      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os

          from huggingface_hub import HfApi

          repo_id = os.environ["HF_SPACE_REPO_ID"]
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(repo_id, repo_type="space", space_sdk="static", exist_ok=True)
          # delete_patterns="*" mirrors the staging dir: files removed from
          # the demo disappear from the Space instead of accumulating.
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path=os.path.join(os.environ["RUNNER_TEMP"], "space"),
              commit_message="Sync from {}@{}".format(
                  os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"][:12]
              ),
              delete_patterns="*",
          )
          print(f"Space synced: https://huggingface.co/spaces/{repo_id}")
          EOF
      - name: Post-publish smoke
        # Same convention as gh-pages.yml's smoke and hf-dataset.yml's
        # "Post-publish load smoke": fetch the published files back rather than
        # trusting that a green upload means a working Space. A static Space
        # serves from a CDN that can lag the commit, so retry before failing.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Named rather than inlined so the retry budget is visible without
          # reading loop syntax. gh-pages.yml's Post-publish smoke carries the
          # same two numbers for the same reason (CDN propagation lag) under
          # its own env: block -- not sourced from one place, since the two
          # publish targets' propagation characteristics aren't guaranteed to
          # match, unlike e.g. WASM_PACK_VERSION's cross-language build pin.
          RETRY_ATTEMPTS: "5"
          RETRY_DELAY_SECONDS: "10"
        run: |
          python - <<'EOF'
          import os
          import sys
          import time

          from huggingface_hub import HfApi

          repo_id = os.environ["HF_SPACE_REPO_ID"]
          api = HfApi(token=os.environ["HF_TOKEN"])
          retry_attempts = int(os.environ["RETRY_ATTEMPTS"])
          retry_delay_seconds = int(os.environ["RETRY_DELAY_SECONDS"])

          required = {
              "index.html",
              "app.js",
              "README.md",
              "pkg/forge_wasm.js",
              "pkg/forge_wasm_bg.wasm",
          }

          for attempt in range(1, retry_attempts + 1):
              files = set(api.list_repo_files(repo_id, repo_type="space"))
              missing = required - files
              if not missing:
                  print(f"Post-publish smoke OK: {sorted(required)}")
                  break
              print(f"attempt {attempt}: still missing {sorted(missing)}; retrying in {retry_delay_seconds}s")
              time.sleep(retry_delay_seconds)
          else:
              print(f"::error::Space {repo_id} is missing {sorted(missing)} after upload")
              sys.exit(1)
          EOF
