name: Security

# Advisory-first supply-chain + SAST scanning. Findings are REPORTED (in job
# logs / the Security tab) but never fail the build: every scanning step exits 0
# so these checks stay green while the baseline is brought clean. To make a
# scanner blocking later, drop its `|| true` (or the `continue-on-error`) and
# add the job to the `docker` gate's `needs:` list in ci.yml.
#
# NOTE: keep the branch list in sync with ci.yml (see the note there).

on:
  push:
    branches:
      - claude/plan-forge-environment-htAoK
      # Glob covers all claude/* working branches (replaces one-off entries like
      # the codebase-quality-assessment branch that previously drifted here).
      - "claude/**"
      - main
      - master
      - develop
      - v0.2/implementation
  pull_request:
    branches:
      - claude/plan-forge-environment-htAoK
      - "claude/**"
      - main
      - master
      - develop
      - v0.2/implementation
  schedule:
    # Weekly re-scan so newly-published advisories surface even without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # for CodeQL/SARIF upload when code scanning is enabled

jobs:
  # ---- Rust supply chain (advisories + licenses + bans + sources) ----
  cargo-deny:
    name: cargo-deny (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check (report-only)
        # Thresholds live in deny.toml. Report findings without failing the
        # build during the advisory-first rollout.
        run: cargo deny check --all-features || true

  # ---- Python dependency advisories ----
  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared dependencies (report-only)
        run: pip-audit --progress-spinner off || true

  # ---- Node dependency advisories (both packages) ----
  npm-audit:
    name: npm-audit (advisory)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [mc-bot, dashboard]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: npm audit (${{ matrix.package }}, report-only)
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev || true

  # ---- Trivy filesystem scan (dependencies + IaC), report to logs ----
  trivy-fs:
    name: Trivy filesystem (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Trivy
        # Install via the official script rather than a pinned marketplace
        # action tag (those move/disappear). Report-only.
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin"
      - name: Trivy filesystem scan (report-only)
        # Table output to the job log; exit 0 so findings surface without
        # failing the build. (No SARIF upload: that needs GitHub code scanning.)
        run: |
          "$RUNNER_TEMP/bin/trivy" fs --scanners vuln,misconfig \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 . || true

  # ---- Secret scanning (git history) ----
  gitleaks:
    name: gitleaks (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history -- gitleaks scans commits, not just the working tree
      - name: Install gitleaks
        # Official binary release, not a marketplace action tag (same
        # rationale as the Trivy step above: those move/disappear). Pin an
        # exact version rather than "latest" for reproducible scans.
        # Also added to $GITHUB_PATH (not just $RUNNER_TEMP/bin) so the
        # guard_staged_secrets hook self-test step below can find it via
        # `shutil.which("gitleaks")`, exactly as it would on a developer
        # machine with gitleaks installed.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gitleaks git-history scan (report-only)
        # Exit code 0 always: report-only during the advisory-first rollout,
        # matching every other scanner in this workflow. `--redact` keeps
        # actual secret values out of the job log even in report mode.
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --redact -v . || true
      - name: guard_staged_secrets hook self-tests
        # Only job in the matrix with a real gitleaks binary on PATH, so
        # this is where the gitleaks-dependent cases in
        # .claude/hooks/test_guard_staged_secrets.py actually run instead
        # of skipping themselves (ci.yml's python-lint job runs the full
        # .claude/hooks/ suite too, but those specific tests skip there).
        run: python3 .claude/hooks/test_guard_staged_secrets.py -v

  # ---- CodeQL SAST (opt-in; requires GitHub code scanning enabled) ----
  # CodeQL's analyze step uploads SARIF, which fails on repos without code
  # scanning / Advanced Security. Gated behind a repo variable so it only runs
  # where it can succeed. Enable by setting repository variable
  # ENABLE_CODEQL=true (Settings → Secrets and variables → Actions → Variables).
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
