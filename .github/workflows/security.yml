name: Security

# Mixed posture as of 2026-09-06 -- read the per-job names, not this header.
#
# BLOCKING: cargo-deny, gitleaks, pip-audit. All verified clean before being
# flipped (thresholds and the reviewed exception list live in deny.toml,
# .gitleaks.toml, and pyproject.toml respectively).
#
# ADVISORY (still `|| true`): npm-audit, trivy-fs. Each reports into the job
# log without failing the build while its baseline is brought clean.
#
# To flip one of the remaining scanners: prove it exits 0 on the current tree
# first, then drop its `|| true`. Do NOT try to add these jobs to ci.yml's
# `docker` gate `needs:` list -- an earlier version of this comment said to,
# but GitHub Actions has no cross-workflow `needs:`. Required-check status is
# configured in branch protection instead.
#
# Baseline history, kept because it records *why* each exception exists —
# see each job for detail:
#
#   cargo-deny  was NOT CLEAN — 3 `advisories` errors:
#                 RUSTSEC-2025-0141 bincode 1.3.3        (unmaintained)
#                 RUSTSEC-2026-0204 crossbeam-epoch 0.9.18 (vulnerability)
#                 RUSTSEC-2026-0097 rand 0.8.5           (unsound)
#               RESOLVED 2026-09-05. The two with upstream fixes were bumped
#               in Cargo.lock (crossbeam-epoch 0.9.20, rand 0.8.8) rather than
#               suppressed. bincode is a documented, dated exception in
#               deny.toml: unmaintained is a maintenance signal, not a
#               vulnerability, and clearing it means a bincode 2.x wire-format
#               migration that needs its own versioned PR. `cargo deny` now
#               reports "advisories ok, bans ok, licenses ok, sources ok" and
#               this job is BLOCKING.
#   gitleaks    RESOLVED 2026-09-05 and BLOCKING. The one finding was a false
#               positive — the synthetic `TEST-FIXTURE-SECRET-…` string that
#               `.claude/hooks/test_guard_staged_secrets.py` embeds as the
#               fixture its own hook tests scan for. A repo-root
#               `.gitleaks.toml` now allowlists it (path AND pattern, so a
#               real credential in that same file is still caught), plus the
#               committed .env templates, whose empty assignments make the
#               generic-api-key regex capture the following line.
#               297 commits scanned, no leaks found, exit 0.
#
# NOTE: keep the branch list in sync with ci.yml (see the note there).

on:
  push:
    branches:
      - claude/plan-forge-environment-htAoK
      # Glob covers all claude/* working branches (replaces one-off entries like
      # the codebase-quality-assessment branch that previously drifted here).
      - "claude/**"
      - main
      - master
      - develop
      - v0.2/implementation
  pull_request:
    branches:
      - claude/plan-forge-environment-htAoK
      - "claude/**"
      - main
      - master
      - develop
      - v0.2/implementation
  schedule:
    # Weekly re-scan so newly-published advisories surface even without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # for CodeQL/SARIF upload when code scanning is enabled

jobs:
  # ---- Rust supply chain (advisories + licenses + bans + sources) ----
  cargo-deny:
    name: cargo-deny (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check (blocking)
        # BLOCKING as of 2026-09-05. Thresholds and the reviewed exception
        # list live in deny.toml, not here, so one edit changes both local
        # and CI behaviour.
        #
        # `--all-features` is a GLOBAL cargo-deny option and must precede the
        # `check` subcommand. It used to be written as
        # `cargo deny check --all-features`, which cargo-deny 0.20.x rejects
        # with "unexpected argument '--all-features' found" and exit code 2 —
        # and `|| true` swallowed that, so this job reported success without
        # ever having run a scan. Keep the flag before `check`.
        run: cargo deny --all-features check

  # ---- Python dependency advisories ----
  pip-audit:
    name: pip-audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Materialise the declared dependency set
        # `pip-audit` with no target audits the *current environment*. This
        # job installs nothing but pip + pip-audit, so the bare invocation
        # used to scan exactly those two packages — torch, onnx, numpy and
        # every other declared dependency were never looked at.
        #
        # Give it a real target: derive a requirements file straight from
        # pyproject.toml's [project.optional-dependencies]. pyproject stays
        # the single source of truth, so this job cannot drift from what the
        # package actually declares (no duplicated dependency list here).
        run: |
          set -euo pipefail
          python - <<'PY' > audit-requirements.txt
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          project = data.get("project", {})
          # Base deps first (currently empty), then every extras group.
          reqs: dict[str, None] = dict.fromkeys(project.get("dependencies", []))
          for group in project.get("optional-dependencies", {}).values():
              reqs.update(dict.fromkeys(group))
          print("\n".join(reqs))
          PY
          echo "--- audit-requirements.txt ---"
          cat audit-requirements.txt
      - name: Audit declared dependencies (blocking)
        # 2026-09-05: verified locally against this dependency set —
        # "No known vulnerabilities found", exit 0. Promoted to blocking
        # 2026-09-06 as part of tech-debt reduction initiative.
        run: pip-audit -r audit-requirements.txt --progress-spinner off

  # ---- Node dependency advisories (both packages) ----
  npm-audit:
    name: npm-audit (advisory)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [mc-bot, dashboard]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: npm audit (${{ matrix.package }}, report-only)
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev || true

  # ---- Trivy filesystem scan (dependencies + IaC), report to logs ----
  trivy-fs:
    name: Trivy filesystem (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Trivy
        # Pinned release tarball + SHA-256 verification.
        #
        # This previously piped `contrib/install.sh` from the repo's MUTABLE
        # `main` branch straight into `sh`: anyone able to land a commit on
        # that branch got arbitrary code execution on this runner, with no
        # version pin and no integrity check. Now the tarball comes from an
        # immutable release tag and its digest is verified before anything is
        # unpacked or executed.
        #
        # `set -euo pipefail` makes a failed download or a digest mismatch
        # fail the STEP loudly — only the scan itself below is advisory.
        #
        # To bump: change TRIVY_VERSION and replace TRIVY_SHA256 with the
        # matching line from
        # https://github.com/aquasecurity/trivy/releases/download/v<ver>/trivy_<ver>_checksums.txt
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "$url"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" trivy
          "$RUNNER_TEMP/bin/trivy" --version
      - name: Trivy filesystem scan (report-only)
        # Table output to the job log; exit 0 so findings surface without
        # failing the build. (No SARIF upload: that needs GitHub code scanning.)
        run: |
          "$RUNNER_TEMP/bin/trivy" fs --scanners vuln,misconfig \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 . || true

  # ---- Secret scanning (git history) ----
  gitleaks:
    name: gitleaks (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history -- gitleaks scans commits, not just the working tree
      - name: Install gitleaks
        # Official binary release, not a marketplace action tag (same
        # rationale as the Trivy step above: those move/disappear). Pin an
        # exact version rather than "latest" for reproducible scans.
        # Also added to $GITHUB_PATH (not just $RUNNER_TEMP/bin) so the
        # guard_staged_secrets hook self-test step below can find it via
        # `shutil.which("gitleaks")`, exactly as it would on a developer
        # machine with gitleaks installed.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gitleaks git-history scan (blocking)
        # BLOCKING as of 2026-09-05. The precondition noted here previously —
        # "flipping this needs a repo-root .gitleaks.toml allowlisting that
        # path first" — is now met: `.gitleaks.toml` exists, extends the
        # default ruleset, and carries two narrow, documented exceptions.
        #
        # Verified locally at this commit with the same pinned 8.30.1 binary:
        # 297 commits scanned, "no leaks found", exit 0 — for both
        # `gitleaks git` (history, what this step runs) and `gitleaks dir`
        # (working tree). `--redact` keeps values out of the job log.
        #
        # If this goes red, read .gitleaks.toml before adding an exception:
        # the allowlist is deliberately scoped so a real credential in an
        # allowlisted file is still reported.
        run: |
          "$RUNNER_TEMP/bin/gitleaks" git --redact -v .
      - name: guard_staged_secrets hook self-tests
        # Only job in the matrix with a real gitleaks binary on PATH, so
        # this is where the gitleaks-dependent cases in
        # .claude/hooks/test_guard_staged_secrets.py actually run instead
        # of skipping themselves (ci.yml's python-lint job runs the full
        # .claude/hooks/ suite too, but those specific tests skip there).
        run: python3 .claude/hooks/test_guard_staged_secrets.py -v

  # ---- CodeQL SAST (opt-in; requires GitHub code scanning enabled) ----
  # CodeQL's analyze step uploads SARIF, which fails on repos without code
  # scanning / Advanced Security. Gated behind a repo variable so it only runs
  # where it can succeed. Enable by setting repository variable
  # ENABLE_CODEQL=true (Settings → Secrets and variables → Actions → Variables).
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ vars.ENABLE_CODEQL == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
