name: Benchmark Regression Gate

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always
    # Regression threshold in percent (e.g. 10 = fail if >10% slower)
    BENCH_REGRESSION_THRESHOLD: "10"

jobs:
    benchmark:
        name: Criterion Benchmarks
        runs-on: ubuntu-latest # Linux only — consistent hardware for low noise

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  key: bench-${{ github.ref_name }}

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip

            - name: Install benchmark analysis tools
              run: pip install critcmp || true # critcmp may not be pip-installable; use cargo below

            - name: Install critcmp (Rust)
              run: cargo install critcmp --quiet

            # ── Restore saved baseline (keyed on target branch for PRs, or 'main') ───
            - name: Restore baseline
              id: restore-baseline
              uses: actions/cache/restore@v4
              with:
                  path: .bench-baseline/
                  key: bench-baseline-${{ github.base_ref || 'main' }}-latest
                  restore-keys: |
                      bench-baseline-${{ github.base_ref || 'main' }}-
                      bench-baseline-main-

            # ── Run current benchmarks (save JSON results) ───────────────────────────
            - name: Run benchmarks
              run: |
                  cargo bench -p forge-bench -- --output-format=bencher 2>&1 | tee /tmp/bench_raw.txt
                  # Also capture Criterion JSON for critcmp
                  cargo bench -p forge-bench 2>&1

            # ── Compare against baseline if one exists ───────────────────────────────
            - name: Compare against baseline
              if: steps.restore-baseline.outputs.cache-hit == 'true'
              run: |
                  python scripts/bench_compare.py \
                    --current target/criterion \
                    --baseline .bench-baseline/ \
                    --threshold "${BENCH_REGRESSION_THRESHOLD}" \
                    --github-output

            # ── Post PR comment with results ─────────────────────────────────────────
            - name: Post benchmark comment
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      let body = '## 📊 Benchmark Results\n\n';
                      try {
                        const report = fs.readFileSync('/tmp/bench_report.md', 'utf8');
                        body += report;
                      } catch {
                        body += '_No benchmark report generated (baseline not yet established)._\n';
                      }
                      body += '\n\n> Threshold: ' + process.env.BENCH_REGRESSION_THRESHOLD + '% regression = ❌ FAIL';

                      const comments = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });
                      const existing = comments.data.find(c =>
                        c.user.login === 'github-actions[bot]' &&
                        c.body.startsWith('## 📊 Benchmark Results')
                      );
                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existing.id,
                          body,
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                        });
                      }

            # ── Save new baseline when on main ───────────────────────────────────────
            - name: Save new baseline (main only)
              if: github.ref == 'refs/heads/main'
              uses: actions/cache/save@v4
              with:
                  path: .bench-baseline/
                  key: bench-baseline-main-${{ github.sha }}

            - name: Copy Criterion results to baseline dir (main only)
              if: github.ref == 'refs/heads/main'
              run: |
                  mkdir -p .bench-baseline/
                  cp -r target/criterion/* .bench-baseline/ 2>/dev/null || true
