[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "forge-env"
dynamic = ["version"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "forge_env"
python-source = "python"
manifest-path = "crates/forge-python/Cargo.toml"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint
    "PERF", # perflint
]
ignore = [
    "E501",    # line-length handled by formatter
    "PLR0913", # too many arguments (env APIs have many args)
    "PLR2004", # magic value comparison (acceptable in tests)
]

[tool.ruff.lint.isort]
known-first-party = ["forge_env"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    # forge_env is a native Rust extension (PyO3/maturin) with no type stubs.
    # All submodules must be listed here so mypy/Pylance ignores missing stubs
    # when the extension isn't built locally.
    "forge_env",
    "forge_env.*",
    "tomllib",
    "tomli",
    "jax",
    "jax.*",
    "numpy",
    "numpy.*",
    "gymnasium",
    "gymnasium.*",
    "pettingzoo",
    "pettingzoo.*",
    "pytest",
    "pytest.*",
    "stable_baselines3",
    "stable_baselines3.*",
    "torch",
    "torch.*",
    "httpx",
    "httpx.*",
]
ignore_missing_imports = true
# Prevent mypy from descending into third-party source files (e.g. torch uses
# Python 3.10+ pattern matching which is incompatible with our py3.9 target).
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=python --cov-report=term-missing --cov-fail-under=85"
