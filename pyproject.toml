[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "forge-env"
version = "0.2.0"
description = "Fast Open-source Runtime for Generalist Environments — high-performance RL simulation platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "FORGE Contributors" }]
keywords = ["reinforcement-learning", "simulation", "gymnasium", "pettingzoo", "rl", "environment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Core runtime — keep minimal (no heavy ML deps)
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/ianshank/FORGE"
Repository = "https://github.com/ianshank/FORGE"
Documentation = "https://ianshank.github.io/FORGE"
Changelog = "https://github.com/ianshank/FORGE/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/ianshank/FORGE/issues"

[project.scripts]
forge-replay = "forge_env.replay:_cli"

[project.optional-dependencies]
# Base test utilities
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-benchmark>=4",
    "anyio>=4",
    "httpx>=0.27",
]
# Gymnasium / PettingZoo wrappers
gym = [
    "gymnasium>=0.29",
    "pettingzoo>=1.24",
]
# JAX-vectorized env
jax = [
    "jax>=0.4",
    "jaxlib>=0.4",
]
# Stable Baselines 3 training
sb3 = [
    "stable-baselines3>=2.0,<3",
    "torch>=2.0",
]
# CleanRL training
cleanrl = [
    "tensorboard>=2.14",
]
# W&B / MLflow optional logging hooks
logging-hooks = [
    "wandb>=0.17",
    "mlflow>=2.0",
]
# Replay / GIF export
replay = [
    "Pillow>=10.0",
]
# Dev tools (lint, type check)
dev = [
    "ruff>=0.3",
    "mypy>=1.8",
    "maturin>=1.0,<2.0",
]
# Everything for local dev
all = [
    "forge-env[test,gym,jax,sb3,cleanrl,logging-hooks,replay,dev]",
]


[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "forge_env"
python-source = "python"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint
    "PERF", # perflint
]
ignore = [
    "E501",    # line-length handled by formatter
    "PLR0913", # too many arguments (env APIs have many args)
    "PLR2004", # magic value comparison (acceptable in tests)
]

[tool.ruff.lint.isort]
known-first-party = ["forge_env"]

[tool.mypy]
python_version = "3.11"
mypy_path = "python"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
# The native Rust extension has no stub; all third-party libs without stubs.
module = [
    "forge_env.forge_env",  # Maturin/PyO3 native ext — no .pyi exists at dev time
    "jax",
    "jax.*",
    "numpy",
    "numpy.*",
    "gymnasium",
    "gymnasium.*",
    "pettingzoo",
    "pettingzoo.*",
    "pytest",
    "pytest.*",
    "stable_baselines3",
    "stable_baselines3.*",
    "torch",
    "torch.*",
    "playwright",
    "playwright.*",
    "uvicorn",
    "uvicorn.*",
    "fastapi",
    "fastapi.*",
    "pydantic",
    "pydantic.*",
    "wandb",
    "wandb.*",
    "mlflow",
    "mlflow.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These modules use type: ignore comments that may be "unused" depending on
# whether optional stubs (gymnasium, PIL) are installed in the environment.
# warn_unused_ignores is disabled to keep the ignores stable across envs.
module = ["forge_env.callbacks", "forge_env.api", "forge_env.replay"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[[tool.mypy.overrides]]
# Test files and demo_ui import the native ext. Suppress missing-stub
# noise but KEEP warn_unused_ignores=true (global) to catch stale suppresses.
module = ["tests.*", "demo_ui.*"]
ignore_missing_imports = true
