[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "forge-env"
dynamic = ["version"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
# Install individual backends as needed:
#   pip install -e ".[sb3]"       -- Stable Baselines 3
#   pip install -e ".[cleanrl]"   -- CleanRL CLI (tyro)
#   pip install -e ".[wandb]"     -- Weights & Biases
#   pip install -e ".[mlflow]"    -- MLflow
#   pip install -e ".[teacher]"   -- LM Studio offline teacher (openai + jsonschema)
#   pip install -e ".[all]"       -- everything
sb3        = ["stable-baselines3>=2.0", "torch>=2.0"]
cleanrl    = ["torch>=2.0"]
wandb      = ["wandb>=0.16"]
mlflow     = ["mlflow>=2.0"]
mousedroid = ["huggingface-hub>=1.21.0", "torch>=2.0"]
# LM Studio offline-teacher pipeline (cognitive providers + structured BC):
#   - openai SDK    -> sync/async OpenAI-compatible HTTP client
#   - jsonschema    -> validates few-shot exemplars against the action schema
teacher    = ["openai>=1.0,<2.0", "jsonschema>=4.0,<5.0"]
# Minecraft MuZero training pipeline (Phase 5 — consumed by
# `python/forge/training/muzero_mc/`):
#   - torch         -> network init + ONNX export
#   - onnx          -> ONNX graph manipulation for round-trip tests
#   - onnxruntime   -> cross-runtime validation; matches the Rust
#                      `onnxruntime`/`ort` crate version range
minecraft  = ["torch>=2.0", "onnx>=1.16", "onnxruntime>=1.17"]
all        = [
    "stable-baselines3>=2.0",
    "torch>=2.0",
    "wandb>=0.16",
    "mlflow>=2.0",
    "huggingface-hub>=1.21.0",
    "openai>=1.0,<2.0",
    "jsonschema>=4.0,<5.0",
    "onnx>=1.16",
    "onnxruntime>=1.17",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "forge_env"
python-source = "python"
manifest-path = "crates/forge-python/Cargo.toml"
# Non-Python assets that downstream consumers expect to find at runtime.
# Maturin auto-packages *.py under python-source; everything else must be
# listed here or it will be missing from built wheels.
include = [
    { path = "python/forge/cognitive/schemas/*.json", format = ["sdist", "wheel"] },
    { path = "configs/cognitive/**/*", format = ["sdist", "wheel"] },
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint
    "PERF", # perflint
]
ignore = [
    "E501",    # line-length handled by formatter
    "PLR0913", # too many arguments (env APIs have many args)
    "PLR2004", # magic value comparison (acceptable in tests)
    # FORGE has many optional ML dependencies (torch, anthropic, openai,
    # stable-baselines3, src.games.*) that are imported lazily inside the
    # functions that actually need them so a stripped-down install can still
    # import the package. Function-scope imports are the documented pattern,
    # so suppress the rule globally instead of pinning a `# noqa` to every
    # site (~50 occurrences across the agents / providers / collector layers).
    "PLC0415", # `import` should be at the top-level of a file
]

[tool.ruff.lint.isort]
known-first-party = ["forge", "forge_env"]

[tool.ruff.lint.per-file-ignores]
"python/forge/mangomas/collector.py" = ["PLR0915"]
# `scripts/calibrate_agri.py` calls `to_fixed(<float literal>)` in dataclass
# defaults. `to_fixed` is a pure function returning `int`, so the default is
# immutable; RUF009 fires only because it conservatively flags any function
# call. Suppressed file-wide to keep the calibration table readable.
"scripts/calibrate_agri.py" = ["RUF009"]

[tool.mypy]
python_version = "3.9"
mypy_path = "$MYPY_CONFIG_FILE_DIR/python,$MYPY_CONFIG_FILE_DIR/scripts,$MYPY_CONFIG_FILE_DIR/tests/python"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    # forge_env is a native Rust extension (PyO3/maturin) with no type stubs.
    # All submodules must be listed here so mypy/Pylance ignores missing stubs
    # when the extension isn't built locally.
    "forge_env",
    "forge_env.*",
    "tomllib",
    "tomli",
    "jax",
    "jax.*",
    "numpy",
    "numpy.*",
    "gymnasium",
    "gymnasium.*",
    "pettingzoo",
    "pettingzoo.*",
    "pytest",
    "pytest.*",
    "jsonschema",
    "jsonschema.*",
    # `scripts/run_lmstudio_demo.py` is imported dynamically by tests after
    # inserting `scripts/` into sys.path at runtime. Mypy doesn't follow
    # that mutation, so suppress the missing-stub error there.
    "run_lmstudio_demo",
    # Same dynamic-sys.path-insert pattern: `scripts/run_e2e_long.py` and
    # `scripts/_e2e_progress.py` are imported by the e2e long-run test +
    # progress unit test after a runtime sys.path mutation.
    "run_e2e_long",
    "_e2e_progress",
    "stable_baselines3",
    "stable_baselines3.*",
    "torch",
    "torch.*",
    "httpx",
    "httpx.*",
    "wandb",
    "wandb.*",
    "mlflow",
    "mlflow.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "huggingface_hub.cli",
    "huggingface_hub.cli.*",
    "minari",
    "minari.*",
    "onnxruntime",
    "onnxruntime.*",
    "src",
    "src.*",
    # Optional LLM SDKs imported lazily by `forge.cognitive.providers`. They
    # only need to type-check when the user actually installs them, so treat
    # the module as untyped for mypy.
    "anthropic",
    "anthropic.*",
    "openai",
    "openai.*",
    # Optional dependencies of `scripts/calibrate_agri.py` (HuggingFace
    # `datasets` for dataset I/O, `tomli_w` for writing back the calibrated
    # config). Either is installed on demand by the calibration workflow.
    "datasets",
    "datasets.*",
    "tomli_w",
    "tomli_w.*",
]
ignore_missing_imports = true
# Prevent mypy from descending into installed third-party source files. Some
# of these (notably `mlflow.tracing.utils`) use Python 3.10+ pattern matching
# which is a syntax error under our py3.9 target; without `follow_imports =
# "skip"` the workspace-wide mypy check would fail with `Pattern matching is
# only supported in Python 3.10 and greater` despite us not actually using
# those modules' typed surface.
follow_imports = "skip"

[[tool.mypy.overrides]]
# numpy operations (np.array, np.concatenate, np.mean) are typed `Any` in the
# stubs, so functions returning derived ndarrays trip `warn_return_any`.
# Suppress just `no-any-return` on the adapter module rather than weakening
# the workspace-wide setting.
module = "forge.mangomas.adapters"
disable_error_code = ["no-any-return"]
# Prevent mypy from descending into third-party source files (e.g. torch uses
# Python 3.10+ pattern matching which is incompatible with our py3.9 target).
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not lmstudio and not e2e_long and not minecraft_e2e' --cov=python --cov-report=term-missing --cov-fail-under=85"
filterwarnings = [
  "ignore::DeprecationWarning:jax.*",
  "ignore::DeprecationWarning:gymnasium.*",
  "ignore::DeprecationWarning:pkg_resources.*",
  "ignore::DeprecationWarning:stable_baselines3.*",
  "ignore::DeprecationWarning:torch.*",
  "default::DeprecationWarning:forge.*",
  "default::DeprecationWarning:forge_env.*",
]
markers = [
  "lmstudio: opt-in tests requiring a running LM Studio (or OpenAI-compatible) endpoint.",
  "e2e_long: long-running (1000+ episodes) end-to-end pipeline test; opt-in via FORGE_E2E_LONG=1.",
  "minecraft_e2e: opt-in tests requiring the docker compose Minecraft stack (mc-bot + runner + Minecraft server). Triggered by the workflow_dispatch `python-test-minecraft-e2e` CI job; never runs on a default `pytest` invocation.",
  "minecraft_e2e_smoke: fast Minecraft self-improvement smoke that drives the trainer in continuous mode against a pre-seeded trajectory dir. Runs on every PR CI (NOT opt-in) so manifest-bump regressions surface immediately. Requires torch + onnx extras (skips otherwise).",
]
