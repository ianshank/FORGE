# cargo-deny configuration — supply-chain gate for the Rust workspace.
#
# Run locally with `cargo deny check` (install via `cargo install cargo-deny`).
# In CI this is driven by `.github/workflows/security.yml` (advisory-first:
# the job is non-blocking until the baseline is clean, then flipped to a
# required check). Thresholds live here, not hard-coded in the workflow, so a
# single edit changes both local and CI behaviour.

[graph]
# All target triples we ship for: the Docker multi-arch matrix, plus the
# WebAssembly target the browser demo is published to.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    # crates/forge-wasm ships to browsers via gh-pages.yml / hf-space.yml, and
    # pulls target-only dependencies (getrandom's `js` feature,
    # console_error_panic_hook) that the two Linux triples above never see.
    # Without this triple those crates are invisible to the licence/advisory
    # gate entirely.
    { triple = "wasm32-unknown-unknown" },
]
all-features = false

[advisories]
# RUSTSEC advisory database checks. `unmaintained`/`yanked` start as warnings
# so the advisory-first rollout does not red-wall CI on pre-existing findings;
# tighten to `deny` once the baseline is green.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Explicit, dated, reviewed exceptions -- NOT a blanket suppression. Anything
# not listed here fails the build (the `cargo-deny` job in security.yml is
# blocking as of 2026-09-05). Re-review each entry when touching this file;
# delete it the moment the dependency moves.
ignore = [
    # RUSTSEC-2025-0141 -- bincode 1.3.3 is unmaintained (the team ceased
    # development). Reviewed 2026-09-05: this is a maintenance signal, not a
    # vulnerability -- no known CVE, and the crate is used only for
    # `WorldState::to_bytes`/`from_bytes` on locally-produced snapshots, never
    # on untrusted input. Clearing it means migrating to bincode 2.x, whose API
    # is a breaking change and whose encoding is a wire-format change -- that
    # needs its own versioned PR under CHARTER.md Invariant 2, not a drive-by
    # bump. Tracked as follow-up work.
    "RUSTSEC-2025-0141",
]

[licenses]
# Allow the permissive licenses already present across the dependency tree.
# Add new SPDX ids here rather than relaxing the confidence threshold.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Per-crate license clarifications go here if a crate's license is ambiguous.
exceptions = []

[bans]
# Advisory-first: duplicates and wildcard version requirements are reported as
# warnings (workspaces commonly carry a few transitively). Promote to `deny`
# after a dedupe / version-pin pass.
multiple-versions = "warn"
wildcards = "warn"
allow = []
deny = [
    # ─── Workspace Layering Model (Tiers L0 to L5) ───────────────────────────
    # Enforces strict unidirectional dependencies across architectural tiers:
    # Tier N crates may only be depended on by higher tiers (Tier > N) or the
    # root integration test suite (forge-integration-tests). Any inverted
    # dependency or leakage across tiers immediately fails CI.

    # --- Tier 5: Distributed Orchestration ---
    { crate = "forge-cloud", wrappers = ["forge-integration-tests"] },

    # --- Tier 4: Applications & Runners ---
    { crate = "forge-data", wrappers = ["forge-cloud", "forge-integration-tests"] },
    { crate = "forge-edge", wrappers = ["forge-integration-tests"] },
    { crate = "forge-mangomas", wrappers = ["forge-integration-tests"] },

    # --- Tier 3: Agents & Interfaces ---
    { crate = "forge-agent", wrappers = [
        "forge-data",
        "forge-edge",
        "forge-mangomas",
        "forge-integration-tests",
    ] },
    { crate = "forge-integration-layer", wrappers = [
        "forge-mangomas",
        "forge-integration-tests",
    ] },
    { crate = "forge-replay", wrappers = [
        "forge-cloud",
        "forge-data",
        "forge-edge",
        "forge-integration-layer",
        "forge-integration-tests",
    ] },

    # --- Tier 2: Engine & Cognitive ---
    { crate = "forge-cognitive", wrappers = [
        "forge-integration-layer",
        "forge-integration-tests",
    ] },
    { crate = "forge-core", wrappers = [
        "forge-agent",
        "forge-data",
        "forge-integration-layer",
        "forge-mangomas",
        "forge-replay",
        "forge-integration-tests",
    ] },

    # --- Tier 1: Domain Primitives ---
    { crate = "forge-civ", wrappers = ["forge-core"] },
    { crate = "forge-memory", wrappers = [
        "forge-cognitive",
        "forge-integration-layer",
        "forge-integration-tests",
    ] },
    { crate = "forge-proposal", wrappers = ["forge-integration-tests"] },
    { crate = "forge-social", wrappers = ["forge-integration-layer", "forge-integration-tests"] },
    { crate = "forge-task", wrappers = [
        "forge-core",
        "forge-data",
        "forge-mangomas",
        "forge-integration-tests",
    ] },
    { crate = "forge-worldgen", wrappers = ["forge-core", "forge-integration-tests"] },
]

[sources]
# Only crates.io is trusted by default. Git/registry sources must be allow-listed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
