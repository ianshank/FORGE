[package]
name = "forge-env-mc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Minecraft environment for FORGE — WebSocket client to a mineflayer bot, exposed via forge-env::Env"

[package.metadata.cargo-machete]
ignored = ["proptest", "url"]

[dependencies]
forge-env = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
tungstenite = "0.24"
url = { workspace = true }
sha2 = { workspace = true }

[features]
# Exposes `testing::MockBot`, a scripted stand-in for the Node mc-bot
# WebSocket server. Off by default so the mock never ships in a release
# binary. Note the gate is on the feature ALONE, not `any(test, ...)`:
# an integration test under `tests/` links this crate compiled WITHOUT
# `--cfg test`, so a `cfg(test)` arm would not exist from its point of
# view. The self dev-dependency below is what turns the feature on for
# this crate's own integration tests.
testing = []

[dev-dependencies]
forge-env-mc = { path = ".", features = ["testing"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
