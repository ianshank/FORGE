[package]
name = "forge-bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Performance benchmarks for the FORGE simulation platform"

# `cargo bench -p forge-bench -- --save-baseline current` (criterion flag)
# would otherwise be forwarded to the default libtest harness on src/lib.rs,
# which rejects `--save-baseline` and aborts the whole bench run. Disabling
# the libtest bench harness keeps the explicit [[bench]] criterion targets
# below as the only consumers of those flags.
[lib]
bench = false

[features]
# Enables the `allocation_audit` binary which installs `dhat` as the global
# allocator. Off by default so normal builds do not link a profiling
# allocator into the binary.
dhat-heap = ["dep:dhat"]

[dependencies]
forge-types = { workspace = true }
forge-core = { workspace = true }
forge-agent = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dhat = { version = "0.3", optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "step_throughput"
harness = false

[[bench]]
name = "multi_agent_scaling"
harness = false

[[bench]]
name = "latent_mcts_inference"
harness = false

[[bin]]
name = "allocation_audit"
path = "src/bin/allocation_audit.rs"
# The binary only exists when the feature is enabled; normal `cargo build
# -p forge-bench` leaves it out so we don't pay the dhat allocator cost.
required-features = ["dhat-heap"]

[lints]
workspace = true
