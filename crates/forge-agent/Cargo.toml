[package]
name = "forge-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Agent framework, MCTS planning, and baselines for FORGE"

[features]
default = []
# ONNX Runtime support (Windows MSVC only due to ort-sys binary availability)
# `ort/std` is required for `SessionBuilder::commit_from_file` -- ort 2.0.0-rc.13
# gates it behind the `std` feature (previously implicit/ungated), so it must be
# turned on explicitly since the base `ort` dependency below opts out of ort's
# defaults entirely. Pulls in only "ort-sys/std", "ndarray?/std", "tracing?/std"
# -- not the `download-binaries`/`ureq` feature that `default-features = false`
# exists to avoid.
onnx = ["ort", "ort/std", "ndarray"]
# Use ort's `load-dynamic` mode: at runtime, ort opens
# libonnxruntime.so via `ORT_DYLIB_PATH`. Used by the runner Docker
# image, which installs the shared lib manually under /usr/local/lib
# (sidesteps the rc.12 `download-binaries` ureq dep conflict).
# Implies `onnx`.
onnx-bundled = ["onnx", "ort/load-dynamic"]

[dependencies]
forge-types = { workspace = true }
forge-core = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }

# Optional ONNX Runtime for latent MCTS deployment
# Note: ort doesn't provide prebuilt binaries for x86_64-pc-windows-gnu
# Use x86_64-pc-windows-msvc or compile ort from source on GNU target
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false }
ndarray = { version = "0.16", optional = true }
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
