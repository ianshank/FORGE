[package]
name = "forge-mc-runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Episode runner that drives a FlatObsEnv + LatentMctsSearch, writes TrajectoryV2, and hot-reloads ONNX models between episodes."

[dependencies]
forge-agent = { workspace = true }
forge-env = { workspace = true }
forge-replay = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "forge-mc-runner"
path = "src/main.rs"
