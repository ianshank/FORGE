[package]
name = "forge-mc-runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Episode runner that drives a FlatObsEnv + LatentMctsSearch, writes TrajectoryV2, and hot-reloads ONNX models between episodes."

[features]
default = []
# Enables the `onnx_reload` module that wraps `OnnxMuZeroModel::reload`
# into a `ReloadFn<OnnxMuZeroModel>` callback the runner can install.
# Transitively requires `forge-agent`'s `onnx` feature (and therefore
# `ort` + a working ONNX Runtime on the host).
onnx-reload = ["forge-agent/onnx"]
# Enables the `--live-stub` runner mode + the `MockMinecraftEnv`
# helper used by the v0.4 self-improvement smoke test. Connects a
# REAL `OnnxMuZeroModel` to a STUB env so the reload path can be
# exercised on CI without a Minecraft server. Pulls `onnx-reload`
# transitively because the stub still loads ONNX bundles.
live-test-stub = ["onnx-reload"]
# Enables the live-runner path that connects a real `MinecraftEnv`
# to a planner. Pulled by default in the binary builds that ship with
# PR #58's CI. As of v0.5 Phase 1 this no longer implies
# `onnx-reload`: the random-baseline path only needs the WS client
# (the OnnxMuZeroModel branch is feature-gated separately inside
# `live.rs`).  For the trained-mode binary, add `--features
# onnx-reload` or `--features mc-live-bundled`.
mc-live = ["dep:forge-env-mc"]
# `mc-live` with the trained-mode ONNX path AND the runtime ONNX
# library plumbed in via `ort/load-dynamic`. Used by the runner
# Docker image so the container `dlopen`s libonnxruntime.so from
# /usr/local/lib at startup. Implies `mc-live` + `onnx-reload`.
mc-live-bundled = ["mc-live", "onnx-reload", "forge-agent/onnx-bundled"]

[dependencies]
forge-agent = { workspace = true }
forge-env = { workspace = true }
forge-env-mc = { workspace = true, optional = true }
forge-observability = { workspace = true }
forge-replay = { workspace = true }
anyhow = { workspace = true }
axum = "0.7"
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
prometheus = "0.13"
rand = { workspace = true }
rand_pcg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync"] }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[[bin]]
name = "forge-mc-runner"
path = "src/main.rs"
