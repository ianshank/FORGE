[package]
name = "forge-cloud"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Cloud training pipeline and edge deployment for the FORGE platform"

[features]
default = []
gcs = ["dep:object_store", "dep:tokio", "dep:futures"]

[dependencies]
forge-types = { workspace = true }
forge-core = { workspace = true }
forge-replay = { workspace = true }
forge-data = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

# Optional: GCS backend via Apache Arrow object_store
object_store = { workspace = true, features = ["gcp"], optional = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
