[package]
name = "forge-eval"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Agent-agnostic evaluation harness and benchmark suite for FORGE"

[package.metadata.cargo-machete]
ignored = ["rand", "rand_pcg"]

[features]
default = []
# MLflow HTTP tracking-server transport (Slice 2). Off by default to keep the
# crate's default build lightweight + free of HTTP/TLS deps. The
# `forge-eval-longrun` bin and the testcontainers integration test require
# this feature; the existing filesystem-only MlflowExporter does not.
#
# clap + anyhow + forge-observability are pulled in by the same gate so the
# default `cargo build` doesn't compile the CLI surface unnecessarily; the
# bin below declares `required-features = ["http-mlflow"]` to enforce this
# at the cargo-target level.
http-mlflow = [
    "dep:reqwest",
    "dep:url",
    "dep:scopeguard",
    "dep:clap",
    "dep:anyhow",
    # Shared tracing init used by the forge-eval-longrun bin; pulls
    # tracing-subscriber transitively (see [dependencies] note).
    "dep:forge-observability",
]

# CLI binary — the long-running e2e driver. Only built when the
# http-mlflow feature is active; running `cargo build -p forge-eval` (no
# features) is unaffected.
[[bin]]
name = "forge-eval-longrun"
path = "src/bin/forge_eval_longrun.rs"
required-features = ["http-mlflow"]

[dependencies]
forge-types = { workspace = true }
forge-core = { workspace = true }
forge-replay = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
toml = { workspace = true }
rayon = { workspace = true }
# Phase B exporters: MLflow meta.yaml + HF dataset card frontmatter
# both require YAML; serde_json won't round-trip the format mlflow ui parses.
serde_yaml = "0.9"
# Phase B: SHA-256 over scenario TOML files for RunManifest and
# deterministic child-run IDs.
sha2 = { workspace = true }
# Phase B: run_id generation when EvalConfig.run_id is None.
uuid = { version = "1", features = ["v4"] }
# HTTP-only optional deps (enabled by `http-mlflow` feature).
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }
scopeguard = { workspace = true, optional = true }
# CLI bin deps (also gated on `http-mlflow` since the only bin that
# consumes them is `forge-eval-longrun`).
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
# Shared tracing/log init (text/JSON, RUST_LOG-driven), replacing the bin's
# hand-rolled tracing_subscriber setup. Optional + gated on http-mlflow because
# only the forge-eval-longrun bin needs it; it pulls tracing-subscriber
# transitively so this crate no longer declares that dependency directly.
forge-observability = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
tempfile = { workspace = true }
# Always-present dev dep so test files keep compiling even when
# `--features http-mlflow` is omitted; the http_unit tests are gated
# on the feature via `#![cfg(feature = "http-mlflow")]`.
mockito = { workspace = true }
testcontainers = { workspace = true }

[lints]
workspace = true
