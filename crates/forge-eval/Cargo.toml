[package]
name = "forge-eval"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Agent-agnostic evaluation harness and benchmark suite for FORGE"

[dependencies]
forge-types = { workspace = true }
forge-core = { path = "../forge-core" }
forge-replay = { path = "../forge-replay" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
rayon = "1"
# Phase B exporters: MLflow meta.yaml + HF dataset card frontmatter
# both require YAML; serde_json won't round-trip the format mlflow ui parses.
serde_yaml = "0.9"
# Phase B: SHA-256 over scenario TOML files for RunManifest and
# deterministic child-run IDs.
sha2 = "0.10"
# Phase B: run_id generation when EvalConfig.run_id is None.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
tempfile = "3"
