[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WebSocket and REST server for FORGE simulation visualization"

[dependencies]
forge-types = { workspace = true }
forge-core = { path = "../forge-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Inherits version + features ("env-filter", "json") from the workspace
# definition in the root Cargo.toml so the whole workspace builds against a
# single version of tracing-subscriber (no duplicate copies in the dep graph).
tracing-subscriber = { workspace = true }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures = "0.3"
rand = "0.8"

[[bin]]
name = "forge-server"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "net"] }
proptest = { workspace = true }
toml = { workspace = true }
tokio-tungstenite = "0.21"
