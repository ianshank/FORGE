[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WebSocket and REST server for FORGE simulation visualization"

[dependencies]
forge-types = { workspace = true }
forge-core = { workspace = true }
forge-observability = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Tracing subscriber init is centralized in forge-observability (init_tracing),
# so this crate no longer depends on tracing-subscriber directly.
# Feature set sized to actual usage: #[tokio::main] (rt-multi-thread, macros),
# tokio::sync::{broadcast,mpsc} (sync), tokio::net::TcpListener (net),
# tokio::time::interval (time) -- not "full".
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true, features = ["cors"] }
futures = { workspace = true }
rand = { workspace = true }

[[bin]]
name = "forge-server"
path = "src/main.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "net"] }
proptest = { workspace = true }
toml = { workspace = true }
tokio-tungstenite = "0.29"
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
