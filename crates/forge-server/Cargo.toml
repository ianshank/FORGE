[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WebSocket and REST server for FORGE simulation visualization"

[dependencies]
forge-types = { workspace = true }
forge-core = { path = "../forge-core" }
forge-observability = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Tracing subscriber init is centralized in forge-observability (init_tracing),
# so this crate no longer depends on tracing-subscriber directly.
tokio = { version = "1", features = ["full"] }
axum = { workspace = true, features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures = { workspace = true }
rand = { workspace = true }

[[bin]]
name = "forge-server"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "net"] }
proptest = { workspace = true }
toml = { workspace = true }
tokio-tungstenite = "0.24"
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
