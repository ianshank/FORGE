[package]
name = "forge-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "WebAssembly visualization module for FORGE"

[package.metadata.cargo-machete]
ignored = ["getrandom"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
forge-types = { workspace = true }
forge-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = "0.2"

# On wasm32 the transitive `getrandom` (via rand 0.8 → rand_core) needs the
# "js" feature to source entropy from the browser Crypto API. This block only
# applies to wasm builds, so native builds are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# Routes Rust panics to console.error with a readable stack trace. Without it a
# panic crossing the wasm boundary surfaces as an opaque
# `RuntimeError: unreachable executed`, which is what every `.expect()` in this
# crate used to look like in a browser. Installed once in the constructor --
# the pattern wasm-pack's own project template prescribes.
console_error_panic_hook = "0.1"

# wasm-bindgen-test only does anything on the wasm target -- its harness works
# by emitting `__wbgt_*` wasm exports. Target-gating it keeps its transitive
# `minicov` -> `cc` C build script out of every host `cargo test --workspace`
# and `cargo clippy --workspace --all-targets`. wasm-pack still resolves it:
# its presence check reads Cargo.lock, which is target-independent.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
