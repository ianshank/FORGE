[package]
name = "forge-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "WebAssembly visualization module for FORGE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
forge-types = { workspace = true }
forge-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
wasm-bindgen = "0.2"

# On wasm32 the transitive `getrandom` (via rand 0.8 → rand_core) needs the
# "js" feature to source entropy from the browser Crypto API. This block only
# applies to wasm builds, so native builds are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
