[package]
name = "forge-replay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Compact deterministic replay and trajectory storage for FORGE"

[package.metadata.cargo-machete]
ignored = ["rand", "rand_pcg"]

[dependencies]
forge-types = { workspace = true }
forge-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
# Gzip compression for the opt-in `TrajectoryV2::save_json_gz` path
# (RunnerConfig.trajectory_compression = "gzip"). Always available;
# the on-disk file extension drives the codec choice in `load_json`.
flate2 = "1"
# HuggingFace Datasets (Parquet) export, gated behind the `hf` feature so
# the default build stays lean. Pinned to a single major to keep the dep
# graph stable across the workspace. `flate2` enables gzip codec support
# at runtime (without it, `ParquetCompression::Gzip` would fail when
# writing actual rows).
arrow = { version = "53", optional = true }
parquet = { version = "53", default-features = false, features = ["arrow", "snap", "zstd", "flate2"], optional = true }

[features]
default = []
# Enables HuggingFace Datasets-compatible Parquet export via
# `forge_replay::hf`. Pulls in `arrow` + `parquet` (heavy).
hf = ["dep:arrow", "dep:parquet"]

[dev-dependencies]
proptest = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
