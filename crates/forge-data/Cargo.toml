[package]
name = "forge-data"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Training data loaders, dataset adapters, and expert demo generation for FORGE"

[features]
# HuggingFace Datasets (Parquet) export: forwards forge-replay's `hf` feature
# and unlocks the `forge-gen-dataset` bin. Off by default so default builds
# carry no arrow/parquet code.
hf = ["forge-replay/hf", "dep:clap", "dep:anyhow", "dep:forge-observability"]

[dependencies]
forge-types = { workspace = true }
forge-core = { workspace = true }
forge-task = { workspace = true }
forge-agent = { workspace = true }
forge-replay = { workspace = true }
forge-observability = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
rayon = { workspace = true }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[[bin]]
name = "forge-gen-dataset"
path = "src/bin/forge_gen_dataset.rs"
required-features = ["hf"]

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
