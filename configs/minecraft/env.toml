# Minecraft environment runtime config shared by the Rust client and
# Node mc-bot. Rust ignores Node-only tables; Node uses the full file.

action_map_path = "configs/minecraft/action_map.toml"
rewards_path = "configs/minecraft/rewards.toml"
reset_path = "configs/minecraft/reset.toml"
# Local-dev default — works when the bot runs natively on the host.
# Docker compose runs override this via `configs/minecraft/env.docker.toml`
# (mounted at /app/configs/env.toml by docker/compose.minecraft.yml).
ws_url = "ws://127.0.0.1:8765"
heartbeat_ms = 2000

[bot]
# Local-dev default — points at the host's loopback MC server.
# Docker compose runs override this via `env.docker.toml` so the
# bot container reaches the `minecraft` service via docker DNS.
host = "127.0.0.1"
port = 25565
username = "ForgeBot"
version = "1.20.4"
auth = "offline"

[episode]
max_ticks = 6000
action_repeat = 4
terminate_on_death = true

[observation]
# Ego-centric block-grid encoder (v0.5 Phase 1). Together with the
# `flat_vector_dim` zero-padding below, these knobs give an
# 11*11*1*7 + 73 = 920-float observation matching MuZeroConfig's
# default grid + vector_dim split.
include_block_grid = true
grid_radius = 5
grid_height_radius = 0  # single Y-layer → MuZero 2D CNN
grid_channels = 7
block_id_hash_mod = 4096
biome_id_hash_mod = 256
grid_hardness_scale = 10.0

# Legacy flat sections (kept for the non-grid suffix of the obs).
include_position = true
include_velocity = true
include_orientation = true
include_vitals = true
include_inventory = true
inventory_slots = 9
inventory_features_per_slot = 2
position_scale = 1024.0
hash_mod = 4096
max_stack_size = 64

# Zero-pad the flat (non-grid) suffix up to MuZeroConfig.vector_dim
# so adding new flat features doesn't immediately bump the trainer's
# expected shape. Raw flat surface today is 31 (3+3+2+5+9*2);
# padding fills the remainder with deterministic zeros.
flat_vector_dim = 73

# v0.5 Phase 1: pin the expected total observation dim + grid shape
# so the runner fails the handshake fast if the bot regresses to a
# legacy layout. With the defaults above:
#   11*11*1*7 (grid) + 73 (flat) = 920
expected_dim = 920

[observation.expected_grid_shape]
height = 11
width = 11
depth = 1
channels = 7
vector_dim = 73

[viewer]
enabled = false
host = "127.0.0.1"
port = 3007
first_person = true
view_distance = 6