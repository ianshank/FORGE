# Docker-compose overlay for configs/minecraft/env.toml.
#
# Mounted at /configs/minecraft/env.toml (replacing the dir-mounted
# default) by docker/compose.minecraft.yml. Same schema as env.toml;
# only the network-hostname fields shift from `127.0.0.1` →
# docker service names so the bot container reaches the minecraft
# server via docker DNS and the runner reaches the bot the same way.
#
# Local-dev operators do NOT mount this file; they use the
# checked-in env.toml directly.

action_map_path = "configs/minecraft/action_map.toml"
rewards_path = "configs/minecraft/rewards.toml"
reset_path = "configs/minecraft/reset.toml"
# Docker DNS hostname for the mc-bot service. Port 8766 matches the
# host-side compose port mapping (see docker/compose.minecraft.env's
# MC_BOT_WS_PORT) — picked to avoid colliding with the v0.4 stack's
# 8765 default.
ws_url = "ws://mc-bot:8766"
heartbeat_ms = 2000

[bot]
# Docker service name for the minecraft server. Resolved via docker
# DNS inside the compose network.
host = "minecraft"
port = 25565
username = "ForgeBot"
version = "1.20.4"
auth = "offline"

[episode]
max_ticks = 6000
action_repeat = 4
terminate_on_death = true

[observation]
# v0.5 Phase 1 block-grid encoder defaults. See env.toml for the full
# annotated version — every field below is byte-identical to the
# local-dev file, only the network hostnames above differ.
include_block_grid = true
grid_radius = 5
grid_height_radius = 0
grid_channels = 7
block_id_hash_mod = 4096
biome_id_hash_mod = 256
grid_hardness_scale = 10.0

include_position = true
include_velocity = true
include_orientation = true
include_vitals = true
include_inventory = true
inventory_slots = 9
inventory_features_per_slot = 2
position_scale = 1024.0
hash_mod = 4096
max_stack_size = 64

flat_vector_dim = 73
expected_dim = 920

[observation.expected_grid_shape]
height = 11
width = 11
depth = 1
channels = 7
vector_dim = 73

[viewer]
enabled = false
host = "127.0.0.1"
port = 3007
first_person = true
view_distance = 6
