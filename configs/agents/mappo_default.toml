# MAPPO (Multi-Agent PPO) default agent configuration.
[agent]
name = "mappo_default"
type = "mappo"
description = "Multi-Agent PPO with shared critic and individual actors"

[agent.policy]
hidden_sizes = [256, 256]
activation = "relu"
use_recurrent = false
rnn_hidden_size = 64

[agent.training]
learning_rate = 3e-4
gamma = 0.99
gae_lambda = 0.95
clip_ratio = 0.2
epochs = 4
batch_size = 256
entropy_coeff = 0.01
value_coeff = 0.5
max_grad_norm = 0.5

[agent.exploration]
initial_epsilon = 1.0
final_epsilon = 0.01
decay_steps = 100000
