# FORGE hierarchical skill catalog (options / HRL primitives).
#
# High-level policies select a skill `id`; low-level executors emit the
# matching primitive Action family until `max_horizon` ticks elapse.
# Values here are the single source of truth for Python loaders; Rust
# `SkillsConfig::default()` mirrors the same constants from
# `crates/forge-types/src/constants.rs`.
#
# schema_version is documentation-only for operators; the Rust loader
# uses `deny_unknown_fields` and does not accept extra keys.

enabled = false
default_skill = "explore"
default_horizon = 32

[[skills]]
id = "idle"
category = "idle"
enabled = true
max_horizon = 1
requires_drone = false
recipe_index = 0
