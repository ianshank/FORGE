# Default cognitive provider config. Headline model: google/gemma-4-e4b
# via LM Studio. Alternative preset: configs/cognitive/qwen14b_teacher.toml.

[cognitive]
enabled = false
provider = "mock"
model = ""
temperature = 0.7
max_tokens = 1024
reasoning_steps = 5
api_base_url = ""

[cognitive.lmstudio]
enabled = false
model = "google/gemma-4-e4b"
base_url = "http://localhost:1234/v1"
timeout_secs = 120.0
max_retries = 2
retry_backoff_secs = 1.0
top_p = 1.0
seed = 0

[cognitive.structured]
enabled = false
prompt_template_path = "configs/cognitive/templates/gemma_teacher.txt"
response_schema_path = "python/forge/cognitive/schemas/gemma_action.json"
few_shot_examples_path = "configs/cognitive/few_shots/gemma_teacher.jsonl"
include_legal_actions = true
log_payloads = false
validate_action = true
payload_preview_chars = 256
