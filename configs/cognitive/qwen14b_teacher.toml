# Opinionated preset for an offline LM Studio Qwen 2.5 14B teacher.
#
# Pair this with `scripts/train.py --collection-policy llm
# --mangomas-config configs/cognitive/qwen14b_teacher.toml` to collect
# behavioural-cloning data from a locally-running LM Studio server.

platform = "drone"

[teacher]
enabled = true
provider = "lmstudio"
base_url = "http://localhost:1234/v1"
model = "qwen2.5-14b-instruct"
temperature = 0.0
top_p = 1.0
max_tokens = 1024
seed = 42
timeout_secs = 120.0
max_retries = 2
retry_backoff_secs = 1.0
concurrency = 4
prompt_template_path = "configs/cognitive/templates/qwen_teacher.txt"
response_schema_path = "python/forge/cognitive/schemas/qwen_action.json"
few_shot_examples_path = "configs/cognitive/few_shots/qwen_teacher.jsonl"
system_prompt = ""
output_root = "artifacts/teacher_traces"
log_payloads = false
validate_action = true
include_legal_actions = true
response_format_enabled = true
shard_size = 1000
compress_traces = true
trace_schema_version = "1.0"
payload_preview_chars = 256
