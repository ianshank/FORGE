# MuZero training configuration for drone reconnaissance scenarios.
#
# All values are overridable — see MuZeroTrainerConfig in
# python/forge/mangomas/config.py for field descriptions.

platform = "drone"

[muzero]
# Network architecture
latent_dim = 256
hidden_dim = 256
num_blocks = 4
reward_support_size = 31
value_support_size = 31

# Training
num_unroll_steps = 5
td_steps = 10
discount = 0.997
learning_rate = 3e-4
weight_decay = 1e-4
batch_size = 256
training_steps_per_iter = 100
self_play_games_per_iter = 10
max_episode_steps = 500
checkpoint_interval = 50
seed = 42

# MCTS
num_simulations = 50
c_puct = 1.25
dirichlet_alpha = 0.3
temperature_init = 1.0
temperature_final = 0.25
temperature_schedule_steps = 500

# Replay buffer
buffer_capacity = 10000

[curriculum]
platform = "drone"
num_tiers = 5
target_success_rate = 0.6
window_size = 100
warmup_episodes = 20

[observation_adapter]
grid_summary_dim = 64
include_inventory = true
include_drone_fields = true
grid_channels = 7
scalar_fields = 5
drone_fields = 4

[sweep]
episodes_per_config = 50
num_workers = 4

[sweep.c_puct]
range = [0.5, 3.0]
steps = 6

[sweep.sim_budget]
range = [10, 200]
steps = 5

[sweep.depth]
range = [10, 50]
steps = 4
