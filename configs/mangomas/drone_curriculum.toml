# MangoMAS Drone Curriculum — 5-Tier Progressive Training

[curriculum]
platform = "Drone"
num_tiers = 5
target_success_rate = 0.6
window_size = 100
warmup_episodes = 20
adjustment_rate = 0.1

[[curriculum.tiers]]
tier = 1
name = "Hover and Altitude"
forge_scenario = "patrol"
description = "Maintain stable hover and altitude control"
success_threshold = 0.7

[[curriculum.tiers]]
tier = 2
name = "Waypoint Navigation"
forge_scenario = "patrol"
description = "Navigate to waypoints with altitude management"
success_threshold = 0.6

[[curriculum.tiers]]
tier = 3
name = "Patrol Pattern"
forge_scenario = "patrol"
description = "Execute patrol patterns with battery management"
success_threshold = 0.5

[[curriculum.tiers]]
tier = 4
name = "Search and Rescue"
forge_scenario = "search_and_rescue"
description = "Search grid areas and locate targets"
success_threshold = 0.4

[[curriculum.tiers]]
tier = 5
name = "Multi-Drone Escort"
forge_scenario = "escort"
description = "Coordinate with other drones for escort mission"
success_threshold = 0.3
