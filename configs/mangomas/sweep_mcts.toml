# MCTS Hyperparameter Sweep Configuration

[sweep]
episodes_per_config = 50
num_workers = 4
seed = 42

[sweep.c_puct]
range = [0.5, 3.0]
steps = 6

[sweep.sim_budget]
range = [10, 500]
steps = 5

[sweep.depth]
range = [10, 100]
steps = 4

[sweep.discount]
range = [0.9, 0.999]
steps = 4

# Surprise-adaptive validation
[sweep.surprise]
low_budget = 25
base_budget = 100
full_budget = 300
low_threshold = 0.1
high_threshold = 0.5
episodes_per_level = 100
