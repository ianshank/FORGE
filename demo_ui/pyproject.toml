[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-demo-ui"
version = "0.2.0"
description = "Interactive web UI for the FORGE simulation demo"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=1.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "anyio>=4",
    "playwright==1.48.*",
]

[tool.setuptools.packages.find]
include = ["demo_ui*"]
