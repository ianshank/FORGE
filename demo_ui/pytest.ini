[pytest]
asyncio_mode = auto
testpaths = demo_ui/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; Enforced coverage gate: demo_ui/backend is gated at 70% baseline (target ratchet to 85%).
; --cov-config points at a local .coveragerc with fail_under=70.
addopts = -v --tb=short --cov=demo_ui/backend --cov-report=term-missing --cov-report=xml --cov-fail-under=70 --cov-config=demo_ui/.coveragerc
markers =
    anyio: mark test to run with anyio backend
