[pytest]
asyncio_mode = auto
testpaths = demo_ui/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; Report-only coverage: measures demo_ui/backend so a real baseline exists
; before a --cov-fail-under threshold is picked (see docs/next_steps.md).
; --cov-config points at a local .coveragerc with no fail_under, so this
; never accidentally inherits the workspace-root .coveragerc's fail_under=85
; via coverage.py's cwd-based auto-discovery (confirmed this happens if
; --cov-config is omitted here, since CI invokes pytest from the repo root).
addopts = -v --tb=short --cov=demo_ui/backend --cov-report=term-missing --cov-report=xml --cov-config=demo_ui/.coveragerc
markers =
    anyio: mark test to run with anyio backend
