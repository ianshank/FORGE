<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

        \"NoopAgent\"\n    }\n}\n\n/// Greedy navigation agent: moves toward a target position using\n/// manhattan distance heuristic.\n#[derive(Debug)]\npub struct GreedyNavigator {\n    target_x: u16,\n    target_y: u16,\n}\n\nimpl GreedyNavigator {\n    /// Creates a new greedy navigator targeting the given position.\n    pub fn new(target_x: u16, target_y: u16) -\u003e Self {\n        Self { target_x, target_y }\n    }\n}\n\nimpl Agent for GreedyNavigator {\n    fn select_action(\u0026mut self, state: \u0026WorldState, agent_idx: usize) -\u003e Action {\n        if agent_idx \u003e= state.agents.len() {\n            return Action::Noop;\n        }\n\n        let agent = \u0026state.agents[agent_idx];\n        if !agent.alive {\n            return Action::Noop;\n        }\n\n        let ax = agent.position.x as i32;\n        let ay = agent.position.y as i32;\n        let tx = self.target_x as i32;\n        let ty = self.target_y as i32;\n\n        let dx = tx - ax;\n        let dy = ty - ay;\n\n        // Already at target\n        if dx == 0 \u0026\u0026 dy == 0 {\n            return Action::Noop;\n        }\n\n        // Prefer the axis with the larger delta\n        let action = if dx.abs() \u003e= dy.abs() {\n            if dx \u003e 0 {\n                Action::Move(forge_types::grid::Direction::Right)\n            } else {\n                Action::Move(forge_types::grid::Direction::Left)\n            }\n        } else if dy \u003e 0 {\n            Action::Move(forge_types::grid::Direction::Down)\n        } else {\n            Action::Move(forge_types::grid::Direction::Up)\n        };\n\n        trace!(agent_idx, ?action, dx, dy, \"greedy navigator action\");\n\n        action\n    }\n\n    fn name(\u0026self) -\u003e \u0026str {\n        \"GreedyNavigator\"\n    }\n}\n\n/// Heuristic agent: uses a simple strategy combining collection and navigation.\n/// Picks up items when available, otherwise moves randomly.\n#[derive(Debug)]\npub struct HeuristicAgent\u003cR: Rng\u003e {\n    rng: R,\n    comm_vocab_size: u16,\n}\n\nimpl\u003cR: Rng\u003e HeuristicAgent\u003cR\u003e {\n    /// Creates a new heuristic agent.\n    pub fn new(rng: R, comm_vocab_size: u16) -\u003e Self {\n        Self {\n            rng,\n            comm_vocab_size,\n        }\n    }\n}\n\nimpl\u003cR: Rng + Send\u003e Agent for HeuristicAgent\u003cR\u003e {\n    fn select_action(\u0026mut self, state: \u0026WorldState, agent_idx: usize) -\u003e Action {\n        if agent_idx \u003e= state.agents.len() {\n            return Action::Noop;\n        }\n\n        let agent = \u0026state.agents[agent_idx];\n        if !agent.alive {\n            return Action::Noop;\n        }\n\n        // Check if standing on a resource tile\n        if let Some(tile) = state.grid.get(agent.position.x, agent.position.y) {\n            if tile.resource_id.is_some() \u0026\u0026 !agent.inventory.is_full() {\n                return Action::PickUp;\n            }\n        }\n\n        // Otherwise, move in a random direction\n        let dir_idx = self.rng.gen_range(0..4u32);\n        Action::from_discrete(1 + dir_idx, self.comm_vocab_size).unwrap_or(Action::Noop)\n    }\n\n    fn name(\u0026self) -\u003e \u0026str {\n        \"HeuristicAgent\"\n    }\n}\n\n/// Runs an episode with the given agent(s), returning total per-agent rewards.\n#[instrument(skip_all)]\npub fn run_episode(\n    state: \u0026mut WorldState,\n    agents: \u0026mut [Box\u003cdyn Agent\u003e],\n    max_steps: u64,\n) -\u003e Vec\u003cf32\u003e {\n    let num_agents = state.agents.len();\n    let mut total_rewards = vec![0.0_f32; num_agents];\n\n    for _step in 0..max_steps {\n        if state.terminated || state.truncated {\n            break;\n        }\n\n        let mut actions = Vec::with_capacity(num_agents);\n        for (i, agent) in agents.iter_mut().enumerate() {\n            if i \u003c num_agents {\n                actions.push(agent.select_action(state, i));\n            }\n        }\n\n        let result = state.step(\u0026actions);\n\n        for (i, reward) in result.rewards.iter().enumerate() {\n            if i \u003c total_rewards.len() {\n                total_rewards[i] += reward;\n            }\n        }\n    }\n\n    total_rewards\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::ForgeConfig;\n    use forge_types::grid::{Direction, Position};\n    use rand::SeedableRng;\n    use rand_pcg::Pcg64Mcg;\n\n    fn make_test_world() -\u003e WorldState {\n        let mut config = ForgeConfig::default();\n        config.world.width = 16;\n        config.world.height = 16;\n        config.world.seed = 42;\n        config.agents.num_agents = 1;\n        config.agents.comm_vocab_size = 0;\n        config.task.max_episode_length = 100;\n        WorldState::new(config).unwrap()\n    }\n\n    #[test]\n    fn test_random_agent_selects_valid_actions() {\n        let rng = Pcg64Mcg::seed_from_u64(42);\n        let mut agent = RandomAgent::new(rng, 0);\n        let state = make_test_world();\n\n        for _ in 0..100 {\n            let action = agent.select_action(\u0026state, 0);\n            // Should always be a valid action\n            let discrete = action.to_discrete();\n            assert!(discrete \u003c Action::space_size(0));\n        }\n    }\n\n    #[test]\n    fn test_noop_agent() {\n        let mut agent = NoopAgent;\n        let state = make_test_world();\n\n        let action = agent.select_action(\u0026state, 0);\n        assert_eq!(action, Action::Noop);\n    }\n\n    #[test]\n    fn test_greedy_navigator_moves_toward_target() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 16;\n        config.world.height = 16;\n        config.agents.num_agents = 1;\n        let mut state = WorldState::new(config).unwrap();\n\n        // Place agent at (2, 2), target at (5, 2)\n        state.agents[0].position = Position::new(2, 2);\n\n        let mut agent = GreedyNavigator::new(5, 2);\n        let action = agent.select_action(\u0026state, 0);\n\n        // Should move right (toward target)\n        assert_eq!(action, Action::Move(Direction::Right));\n    }\n\n    #[test]\n    fn test_greedy_navigator_at_target() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 16;\n        config.world.height = 16;\n        config.agents.num_agents = 1;\n        let mut state = WorldState::new(config).unwrap();\n\n        state.agents[0].position = Position::new(5, 5);\n        let mut agent = GreedyNavigator::new(5, 5);\n        let action = agent.select_action(\u0026state, 0);\n\n        assert_eq!(action, Action::Noop);\n    }\n\n    #[test]\n    fn test_greedy_navigator_vertical() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 16;\n        config.world.height = 16;\n        config.agents.num_agents = 1;\n        let mut state = WorldState::new(config).unwrap();\n\n        state.agents[0].position = Position::new(5, 2);\n        let mut agent = GreedyNavigator::new(5, 8);\n        let action = agent.select_action(\u0026state, 0);\n\n        assert_eq!(action, Action::Move(Direction::Down));\n    }\n\n    #[test]\n    fn test_heuristic_agent() {\n        let rng = Pcg64Mcg::seed_from_u64(42);\n        let mut agent = HeuristicAgent::new(rng, 0);\n        let state = make_test_world();\n\n        // Should produce valid actions\n        for _ in 0..50 {\n            let action = agent.select_action(\u0026state, 0);\n            let discrete = action.to_discrete();\n            assert!(discrete \u003c Action::space_size(0) || action == Action::PickUp);\n        }\n    }\n\n    #[test]\n    fn test_run_episode_noop() {\n        let mut state = make_test_world();\n        let mut agents: Vec\u003cBox\u003cdyn Agent\u003e\u003e = vec![Box::new(NoopAgent)];\n\n        let rewards = run_episode(\u0026mut state, \u0026mut agents, 10);\n\n        assert_eq!(rewards.len(), 1);\n        // Noop agent should accumulate 0 reward (no tasks to complete)\n        assert_eq!(rewards[0], 0.0);\n    }\n\n    #[test]\n    fn test_run_episode_random() {\n        let mut state = make_test_world();\n        let rng = Pcg64Mcg::seed_from_u64(42);\n        let mut agents: Vec\u003cBox\u003cdyn Agent\u003e\u003e = vec![Box::new(RandomAgent::new(rng, 0))];\n\n        let rewards = run_episode(\u0026mut state, \u0026mut agents, 50);\n\n        assert_eq!(rewards.len(), 1);\n        // Random agent should complete some steps without crashing\n        assert!(state.tick \u003e 0);\n    }\n\n    #[test]\n    fn test_run_episode_terminates_on_truncation() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 8;\n        config.world.height = 8;\n        config.agents.num_agents = 1;\n        config.agents.default_vision_radius = 3;\n        config.agents.comm_vocab_size = 0;\n        config.task.max_episode_length = 5;\n        let mut state = WorldState::new(config).unwrap();\n\n        let mut agents: Vec\u003cBox\u003cdyn Agent\u003e\u003e = vec![Box::new(NoopAgent)];\n        run_episode(\u0026mut state, \u0026mut agents, 1000);\n\n        // Should have stopped at truncation\n        assert!(state.truncated);\n        assert_eq!(state.tick, 5);\n    }\n\n    #[test]\n    fn test_run_episode_max_steps_zero() {\n        let mut state = make_test_world();\n        let mut agents: Vec\u003cBox\u003cdyn Agent\u003e\u003e = vec![Box::new(NoopAgent)];\n        let initial_tick = state.tick;\n\n        let rewards = run_episode(\u0026mut state, \u0026mut agents, 0);\n\n        assert_eq!(rewards.len(), 1);\n        assert_eq!(rewards[0], 0.0);\n        // Tick should not have advanced\n        assert_eq!(state.tick, initial_tick);\n    }\n\n    #[test]\n    fn test_agent_name() {\n        let noop = NoopAgent;\n        assert_eq!(noop.name(), \"NoopAgent\");\n\n        let rng = Pcg64Mcg::seed_from_u64(42);\n        let random = RandomAgent::new(rng, 0);\n        as pub fn new(comm_vocab_size: u16) -\u003e Self {\n        Self {\n            action_space: Action::space_size(comm_vocab_size),\n        }\n    }\n}\n\nimpl ForwardModel for DefaultForwardModel {\n    fn simulate(\u0026self, state: \u0026WorldState, actions: \u0026[Action]) -\u003e (WorldState, StepResult) {\n        let mut next_state = state.clone();\n        let result = next_state.step(actions);\n        (next_state, result)\n    }\n\n    fn is_terminal(\u0026self, state: \u0026WorldState) -\u003e bool {\n        state.terminated || state.truncated\n    }\n\n    fn num_agents(\u0026self, state: \u0026WorldState) -\u003e usize {\n        state.agents.len()\n    }\n\n    fn action_space_size(\u0026self) -\u003e u32 {\n        self.action_space\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::ForgeConfig;\n    use forge_types::grid::Direction;\n\n    fn make_test_config() -\u003e ForgeConfig {\n        let mut config = ForgeConfig::default();\n        config.world.width = 16;\n        config.world.height = 16;\n        config.world.seed = 42;\n        config.agents.num_agents = 1;\n        config.agents.comm_vocab_size = 0;\n        config\n    }\n\n    #[test]\n    fn test_simulate_produces_new_state() {\n        let config = make_test_config();\n        let state = WorldState::new(config).unwrap();\n        let model = DefaultForwardModel::new(0);\n\n        let (next_state, result) = model.simulate(\u0026state, \u0026[Action::Move(Direction::Right)]);\n\n        // Original state unchanged\n        assert_eq!(state.tick, 0);\n        // New state advanced\n        assert_eq!(next_state.tick, 1);\n        assert!(!result.terminated);\n    }\n\n    #[test]\n    fn test_simulate_determinism() {\n        let config = make_test_config();\n        let state = WorldState::new(config).unwrap();\n        let model = DefaultForwardModel::new(0);\n\n        let actions = vec![Action::Move(Direction::Right)];\n        let (s1, r1) = model.simulate(\u0026state, \u0026actions);\n        let (s2, r2) = model.simulate(\u0026state, \u0026actions);\n\n        assert_eq!(s1.tick, s2.tick);\n        assert_eq!(s1.agents[0].position, s2.agents[0].position);\n        assert_eq!(r1.terminated, r2.terminated);\n    }\n\n    #[test]\n    fn test_is_terminal() {\n        let config = make_test_config();\n        let state = WorldState::new(config).unwrap();\n        let model = DefaultForwardModel::new(0);\n\n        assert!(!model.is_terminal(\u0026state));\n    }\n\n    #[test]\n    fn test_num_agents() {\n        let config = make_test_config();\n        let state = WorldState::new(config).unwrap();\n        let model = DefaultForwardModel::new(0);\n\n        assert_eq!(model.num_agents(\u0026state), 1);\n    }\n\n    #[test]\n    fn test_action_space_size() {\n        let model = DefaultForwardModel::new(16);\n        assert_eq!(model.action_space_size(), 56);\n\n        let model = DefaultForwardModel::new(0);\n        assert_eq!(model.action_space_size(), 40);\n    }\n}\n","traces":[{"line":40,"address":[2759065,2758208,2759059],"length":1,"stats":{"Line":1}},{"line":42,"address":[2758328],"length":1,"stats":{"Line":1}},{"line":48,"address":[2758188,2757936,2758182],"length":1,"stats":{"Line":1}},{"line":49,"address":[2758016],"length":1,"stats":{"Line":1}},{"line":50,"address":[2758036],"length":1,"stats":{"Line":1}},{"line":51,"address":[2758093],"length":1,"stats":{"Line":1}},{"line":54,"address":[2757856],"length":1,"stats":{"Line":1}},{"line":55,"address":[2757871],"length":1,"stats":{"Line":1}},{"line":58,"address":[2757808],"length":1,"stats":{"Line":1}},{"line":59,"address":[2757833],"length":1,"stats":{"Line":1}},{"line":62,"address":[2757920],"length":1,"stats":{"Line":1}},{"line":63,"address":[2757925],"length":1,"stats":{"Line":1}}],"covered":12,"coverable":12},{"path":["/","home","user","FORGE","crates","forge-agent","src","lib.rs"],"content":"#![deny(missing_docs)]\n#![deny(clippy::all)]\n\n//! # forge-agent\n//!\n//! Agent framework, MCTS planning engine, and baseline agents\n//! for the FORGE platform.\n//!\n//! This crate provides:\n//! - **Forward model** (`forward_model`): Simulation interface for planning\n//! - **MCTS** (`mcts`): Monte Carlo Tree Search with PUCT selection\n//! - **Baselines** (`baselines`): Random, heuristic, and greedy baseline agents\n\npub mod baselines;\npub mod forward_model;\npub mod mcts;\npub mod prelude;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-agent","src","mcts","mod.rs"],"content":"//! Monte Carlo Tree Search (MCTS) implementation.\n//!\n//! Provides a configurable MCTS planner using the PUCT (Predictor + Upper\n//! Confidence bounds applied to Trees) algorithm. The search uses the\n//! forward model to simulate rollouts and backpropagates value estimates.\n\npub mod policy;\npub mod search;\npub mod tree;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-agent","src","mcts","policy.rs"],"content":"//! Policy and value network interface for MCTS.\n//!\n//! Defines the trait that policy/value networks must implement\n//! to guide the MCTS search. Provides a uniform random policy\n//! as a default.\n\nuse forge_core::WorldState;\n\n/// A policy/value function that guides MCTS search.\n///\n/// Implementations can be neural networks, heuristics, or random.\npub trait PolicyValue: Send + Sync {\n    /// Evaluates a state, returning:\n    /// - `prior`: Action probability distribution (unnormalized or normalized).\n    /// - `value`: Estimated state value for the current agent.\n    fn evaluate(\u0026self, state: \u0026WorldState, agent_idx: usize) -\u003e PolicyValueOutput;\n}\n\n/// Output of a policy-value evaluation.\n#[derive(Debug, Clone)]\npub struct PolicyValueOutput {\n    /// Prior probability for each action (indexed by discrete action id).\n    pub priors: Vec\u003cf32\u003e,\n    /// Estimated state value for the agent.\n    pub value: f32,\n}\n\n/// Uniform random policy: all actions get equal probability.\n#[derive(Debug, Default)]\npub struct UniformPolicy {\n    action_space: u32,\n}\n\nimpl UniformPolicy {\n    /// Creates a new uniform policy for the given action space.\n    pub fn new(action_space: u32) -\u003e Self {\n        Self { action_space }\n    }\n}\n\nimpl PolicyValue for UniformPolicy {\n    fn evaluate(\u0026self, _state: \u0026WorldState, _agent_idx: usize) -\u003e PolicyValueOutput {\n        let prior = 1.0 / self.action_space.max(1) as f32;\n        PolicyValueOutput {\n            priors: vec![prior; self.action_space as usize],\n            value: 0.0,\n        }\n    }\n}\n\n/// Heuristic policy: gives higher probability to movement actions.\n#[derive(Debug)]\npub struct HeuristicPolicy {\n    action_space: u32,\n}\n\nimpl HeuristicPolicy {\n    /// Creates a new heuristic policy.\n    pub fn new(action_space: u32) -\u003e Self {\n        Self { action_space }\n    }\n}\n\nimpl PolicyValue for HeuristicPolicy {\n    fn evaluate(\u0026self, _state: \u0026WorldState, _agent_idx: usize) -\u003e PolicyValueOutput {\n        let mut priors = vec![0.05; self.action_space as usize];\n\n        // Boost movement actions (indices 1-4)\n        for i in 1..=4.min(self.action_space.saturating_sub(1)) {\n            if (i as usize) \u003c priors.len() {\n                priors[i as usize] = 0.2;\n            }\n        }\n\n        // Boost PickUp (index 5)\n        if priors.len() \u003e 5 {\n            priors[5] = 0.15;\n        }\n\n        // Normalize\n        let total: f32 = priors.iter().sum();\n        if total \u003e 0.0 {\n            for p in \u0026mut priors {\n                *p /= total;\n            }\n        }\n\n        PolicyValueOutput { priors, value: 0.0 }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::ForgeConfig;\n\n    fn make_state() -\u003e WorldState {\n        let mut config = ForgeConfig::default();\n        config.world.width = 8;\n        config.world.height = 8;\n        config.agents.num_agents = 1;\n        config.agents.default_vision_radius = 3;\n        WorldState::new(config).unwrap()\n    }\n\n    #[test]\n    fn test_uniform_policy() {\n        let policy = UniformPolicy::new(32);\n        let state = make_state();\n        let output = policy.evaluate(\u0026state, 0);\n\n        assert_eq!(output.priors.len(), 32);\n        let sum: f32 = output.priors.iter().sum();\n        assert!((sum - 1.0).abs() \u003c 1e-5);\n        assert_eq!(output.value, 0.0);\n    }\n\n    #[test]\n    fn test_heuristic_policy() {\n        let policy = HeuristicPolicy::new(32);\n        let state = make_state();\n        let output = policy.evaluate(\u0026state, 0);\n\n        assert_eq!(output.priors.len(), 32);\n        let sum: f32 = output.priors.iter().sum();\n        assert!((sum - 1.0).abs() \u003c 1e-4);\n\n        // Movement actions should have higher prior than noop\n        assert!(output.priors[1] \u003e output.priors[0]);\n    }\n\n    #[test]\n    fn test_uniform_policy_normalization() {\n        let policy = UniformPolicy::new(4);\n        let state = make_state();\n        let output = policy.evaluate(\u0026state, 0);\n\n        assert_eq!(output.priors.len(), 4);\n        for p in \u0026output.priors {\n            assert!((p - 0.25).abs() \u003c 1e-5);\n        }\n    }\n}\n","traces":[{"line":36,"address":[2756448],"length":1,"stats":{"Line":1}},{"line":42,"address":[2756928],"length":1,"stats":{"Line":1}},{"line":43,"address":[2756962],"length":1,"stats":{"Line":2}},{"line":45,"address":[2757004],"length":1,"stats":{"Line":2}},{"line":59,"address":[2756464],"length":1,"stats":{"Line":1}},{"line":65,"address":[2755504,2756429,2756423],"length":1,"stats":{"Line":1}},{"line":66,"address":[2755559],"length":1,"stats":{"Line":1}},{"line":69,"address":[2755596,2755673],"length":1,"stats":{"Line":2}},{"line":70,"address":[2756418,2756355,2755844],"length":1,"stats":{"Line":3}},{"line":71,"address":[2756368],"length":1,"stats":{"Line":1}},{"line":76,"address":[2755871,2755988],"length":1,"stats":{"Line":2}},{"line":77,"address":[2755935],"length":1,"stats":{"Line":1}},{"line":81,"address":[2756000,2755906],"length":1,"stats":{"Line":2}},{"line":82,"address":[2756063],"length":1,"stats":{"Line":1}},{"line":83,"address":[2756343,2756194],"length":1,"stats":{"Line":2}},{"line":84,"address":[2756331],"length":1,"stats":{"Line":1}}],"covered":16,"coverable":16},{"path":["/","home","user","FORGE","crates","forge-agent","src","mcts","search.rs"],"content":"//! MCTS search implementation with PUCT selection.\n//!\n//! Performs tree search by repeatedly selecting, expanding, evaluating,\n//! and backpropagating through the tree to find the best action.\n\nuse forge_core::WorldState;\nuse forge_types::Action;\nuse tracing::{instrument, trace};\n\nuse super::policy::PolicyValue;\nuse super::tree::{MctsConfig, MctsTree};\nuse crate::forward_model::ForwardModel;\n\n/// MCTS search engine.\npub struct MctsSearch\u003cF: ForwardModel, P: PolicyValue\u003e {\n    /// Forward model for simulation.\n    model: F,\n    /// Policy/value network.\n    policy: P,\n    /// Configuration.\n    config: MctsConfig,\n    /// Communication vocabulary size for action conversion.\n    comm_vocab_size: u16,\n}\n\nimpl\u003cF: ForwardModel, P: PolicyValue\u003e MctsSearch\u003cF, P\u003e {\n    /// Creates a new MCTS search engine.\n    #[instrument(skip_all)]\n    pub fn new(model: F, policy: P, config: MctsConfig, comm_vocab_size: u16) -\u003e Self {\n        Self {\n            model,\n            policy,\n            config,\n            comm_vocab_size,\n        }\n    }\n\n    /// Runs MCTS from the given state and returns the best action.\n    #[instrument(skip_all)]\n    pub fn search(\u0026self, state: \u0026WorldState, agent_idx: usize) -\u003e Action {\n        let mut tree = MctsTree::new(self.config.clone());\n\n        // Run simulations\n        for sim in 0..self.config.num_simulations {\n            self.simulate(\u0026mut tree, state, agent_idx);\n\n            trace!(\n                simulation = sim,\n                tree_size = tree.size(),\n                \"MCTS simulation complete\"\n            );\n        }\n\n        // Select best action based on visit counts\n        let action_id = tree.best_action().unwrap_or(0);\n        Action::from_discrete(action_id, self.comm_vocab_size).unwrap_or(Action::Noop)\n    }\n\n    /// Runs a single MCTS simulation: select, expand, evaluate, backpropagate.\n    fn simulate(\u0026self, tree: \u0026mut MctsTree, root_state: \u0026WorldState, agent_idx: usize) {\n        // Phase 1: Selection — traverse down the tree using PUCT\n        let mut node_id = tree.root_id();\n        let mut state = root_state.clone();\n\n        while tree.node(node_id).is_expanded() \u0026\u0026 !tree.node(node_id).is_terminal {\n            match tree.select_child(node_id) {\n                Some(child_id) =\u003e {\n                    // Simulate the action to get the next state\n                    let action_id = tree.node(child_id).action.unwrap_or(0);\n                    let action = Action::from_discrete(action_id, self.comm_vocab_size)\n                        .unwrap_or(Action::Noop);\n\n                    let num_agents = self.model.num_agents(\u0026state);\n                    let mut actions = vec![Action::Noop; num_agents];\n                    if agent_idx \u003c num_agents {\n                        actions[agent_idx] = action;\n                    }\n\n                    let (next_state, _result) = self.model.simulate(\u0026state, \u0026actions);\n                    state = next_state;\n                    node_id = child_id;\n                }\n                None =\u003e break,\n            }\n\n            // Stop at max depth\n            if tree.node(node_id).depth \u003e= self.config.max_depth {\n                break;\n            }\n        }\n\n        // Phase 2: Expansion — if the node is not terminal and not fully expanded\n        if !tree.node(node_id).is_terminal \u0026\u0026 !tree.node(node_id).is_expanded() {\n            let pv_output = self.policy.evaluate(\u0026state, agent_idx);\n\n            // Expand all actions with their priors\n            let action_space = self.config.action_space;\n            for action_id in 0..action_space {\n                let prior = pv_output\n                    .priors\n                    .get(action_id as usize)\n                    .copied()\n                    .unwrap_or(1.0 / action_space as f32);\n                tree.add_child(node_id, action_id, prior);\n            }\n\n            // Check if terminal\n            if self.model.is_terminal(\u0026state) {\n                tree.node_mut(node_id).is_terminal = true;\n            }\n        }\n\n        // Phase 3: Evaluation — get value estimate from policy\n        let value = if tree.node(node_id).is_terminal {\n            0.0 // Terminal states have no future value\n        } else {\n            let pv_output = self.policy.evaluate(\u0026state, agent_idx);\n            pv_output.value as f64\n        };\n\n        // Phase 4: Backpropagation\n        tree.backpropagate(node_id, value);\n    }\n\n    /// Returns the MCTS config.\n    pub fn config(\u0026self) -\u003e \u0026MctsConfig {\n        \u0026self.config\n    }\n}\n\n/// MCTS-based agent that uses search to select actions.\npub struct MctsAgent\u003cF: ForwardModel, P: PolicyValue\u003e {\n    search: MctsSearch\u003cF, P\u003e,\n}\n\nimpl\u003cF: ForwardModel, P: PolicyValue\u003e MctsAgent\u003cF, P\u003e {\n    /// Creates a new MCTS agent.\n    pub fn new(model: F, policy: P, config: MctsConfig, comm_vocab_size: u16) -\u003e Self {\n        Self {\n            search: MctsSearch::new(model, policy, config, comm_vocab_size),\n        }\n    }\n\n    /// Selects an action using MCTS search.\n    #[instrument(skip_all)]\n    pub fn select_action(\u0026self, state: \u0026WorldState, agent_idx: usize) -\u003e Action {\n        self.search.search(state, agent_idx)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::forward_model::DefaultForwardModel;\n    use crate::mcts::policy::UniformPolicy;\n    use forge_types::config::ForgeConfig;\n\n    fn make_test_state() -\u003e WorldState {\n        let mut config = ForgeConfig::default();\n        config.world.width = 8;\n        config.world.height = 8;\n        config.world.seed = 42;\n        config.agents.num_agents = 1;\n        config.agents.default_vision_radius = 3;\n        config.agents.comm_vocab_size = 0;\n        config.task.max_episode_length = 100;\n        WorldState::new(config).unwrap()\n    }\n\n    fn make_search() -\u003e MctsSearch\u003cDefaultForwardModel, UniformPolicy\u003e {\n        let model = DefaultForwardModel::new(0);\n        let policy = UniformPolicy::new(32);\n        let config = MctsConfig {\n            num_simulations: 10,\n            action_space: 32,\n            max_depth: 5,\n            ..MctsConfig::default()\n        };\n        MctsSearch::new(model, policy, config, 0)\n    }\n\n    #[test]\n    fn test_mcts_search_returns_valid_action() {\n        let state = make_test_state();\n        let search = make_search();\n\n        let action = search.search(\u0026state, 0);\n        let discrete = action.to_discrete();\n        assert!(discrete \u003c Action::space_size(0));\n    }\n\n    #[test]\n    fn test_mcts_search_determinism() {\n        let state = make_test_state();\n\n        // Two searches from the same state with the same policy should\n        // produce valid actions (though not necessarily identical due to\n        // tree structure being non-deterministic with uniform policy)\n        let search = make_search();\n        let a1 = search.search(\u0026state, 0);\n        assert!(a1.to_discrete() \u003c Action::space_size(0));\n    }\n\n    #[test]\n    fn test_mct ig().action_space, 32);\n    }\n}\n","traces":[{"line":29,"address":[2761808,2760816,2761828],"length":1,"stats":{"Line":1}},{"line":40,"address":[2761872,2763843,2763871],"length":1,"stats":{"Line":1}},{"line":41,"address":[2762726,2762041],"length":1,"stats":{"Line":3}},{"line":44,"address":[2762741,2762813],"length":1,"stats":{"Line":6}},{"line":45,"address":[2762937],"length":1,"stats":{"Line":3}},{"line":47,"address":[2763287,2763669],"length":1,"stats":{"Line":3}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":49,"address":[],"length":0,"stats":{"Line":0}},{"line":50,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[2762955],"length":1,"stats":{"Line":1}},{"line":56,"address":[2763014],"length":1,"stats":{"Line":1}},{"line":60,"address":[2766213,2765425,2763952],"length":1,"stats":{"Line":3}},{"line":62,"address":[2764042],"length":1,"stats":{"Line":3}},{"line":63,"address":[2764071],"length":1,"stats":{"Line":3}},{"line":65,"address":[2764236,2764167,2764092],"length":1,"stats":{"Line":9}},{"line":66,"address":[2764281],"length":1,"stats":{"Line":3}},{"line":67,"address":[2764370],"length":1,"stats":{"Line":3}},{"line":69,"address":[2764394],"length":1,"stats":{"Line":3}},{"line":70,"address":[2764522,2764593,2764465],"length":1,"stats":{"Line":9}},{"line":71,"address":[2764564,2764514],"length":1,"stats":{"Line":6}},{"line":73,"address":[],"length":0,"stats":{"Line":3}},{"line":74,"address":[2764657],"length":1,"stats":{"Line":3}},{"line":75,"address":[2764876,2764717],"length":1,"stats":{"Line":6}},{"line":76,"address":[2764785,2764867],"length":1,"stats":{"Line":6}},{"line":79,"address":[],"length":0,"stats":{"Line":6}},{"line":80,"address":[2765266,2765130,2765195],"length":1,"stats":{"Line":6}},{"line":81,"address":[2765276],"length":1,"stats":{"Line":3}},{"line":83,"address":[],"length":0,"stats":{"Line":0}},{"line":87,"address":[],"length":0,"stats":{"Line":3}},{"line":88,"address":[],"length":0,"stats":{"Line":0}},{"lin   pub c_puct: f32,\n    /// Number of simulations per search.\n    pub num_simulations: u32,\n    /// Maximum tree depth.\n    pub max_depth: u32,\n    /// Discount factor for future rewards.\n    pub discount: f32,\n    /// Temperature for action selection (0 = greedy, 1 = proportional to visits).\n    pub temperature: f32,\n    /// Number of actions in the action space.\n    pub action_space: u32,\n}\n\nimpl Default for MctsConfig {\n    fn default() -\u003e Self {\n        Self {\n            c_puct: 1.41,\n            num_simulations: 100,\n            max_depth: 50,\n            discount: 0.99,\n            temperature: 1.0,\n            action_space: 32,\n        }\n    }\n}\n\n/// A node in the MCTS tree.\n#[derive(Debug, Clone)]\npub struct MctsNode {\n    /// Parent node index. Root has parent = None.\n    pub parent: Option\u003cNodeId\u003e,\n    /// Action that led to this node from the parent.\n    pub action: Option\u003cu32\u003e,\n    /// Visit count.\n    pub visits: u32,\n    /// Cumulative value estimate (sum of backpropagated values).\n    pub value_sum: f64,\n    /// Prior probability from the policy network.\n    pub prior: f32,\n    /// Child node indices, indexed by action.\n    pub children: Vec\u003cOption\u003cNodeId\u003e\u003e,\n    /// Whether this node represents a terminal state.\n    pub is_terminal: bool,\n    /// The depth of this node in the tree.\n    pub depth: u32,\n}\n\nimpl MctsNode {\n    /// Creates a new root node.\n    pub fn root(action_space: u32) -\u003e Self {\n        Self {\n            parent: None,\n            action: None,\n            visits: 0,\n            value_sum: 0.0,\n            prior: 1.0,\n            children: vec![None; action_space as usize],\n            is_terminal: false,\n            depth: 0,\n        }\n    }\n\n    /// Creates a new child node.\n    pub fn child(parent: NodeId, action: u32, prior: f32, depth: u32, action_space: u32) -\u003e Self {\n        Self {\n            parent: Some(parent),\n            action: Some(action),\n            visits: 0,\n            value_sum: 0.0,\n            prior,\n            children: vec![None; action_space as usize],\n            is_terminal: false,\n            depth,\n        }\n    }\n\n    /// Returns the mean value estimate Q(s, a).\n    pub fn mean_value(\u0026self) -\u003e f64 {\n        if self.visits == 0 {\n            0.0\n        } else {\n            self.value_sum / self.visits as f64\n        }\n    }\n\n    /// Whether this node has been expanded (has any children).\n    pub fn is_expanded(\u0026self) -\u003e bool {\n        self.children.iter().any(|c| c.is_some())\n    }\n\n    /// Returns the number of expanded children.\n    pub fn num_children(\u0026self) -\u003e usize {\n        self.children.iter().filter(|c| c.is_some()).count()\n    }\n}\n\n/// The MCTS tree, stored as a flat vector of nodes.\n#[derive(Debug)]\npub struct MctsTree {\n    /// All nodes in the tree.\n    pub nodes: Vec\u003cMctsNode\u003e,\n    /// Configuration.\n    pub config: MctsConfig,\n}\n\nimpl MctsTree {\n    /// Creates a new tree with a root node.\n    #[instrument(skip_all)]\n    pub fn new(config: MctsConfig) -\u003e Self {\n        let root = MctsNode::root(config.action_space);\n        Self {\n            nodes: vec![root],\n            config,\n        }\n    }\n\n    /// Returns the root node index (always 0).\n    pub fn root_id(\u0026self) -\u003e NodeId {\n        0\n    }\n\n    /// Returns a reference to a node.\n    pub fn node(\u0026self, id: NodeId) -\u003e \u0026MctsNode {\n        \u0026self.nodes[id]\n    }\n\n    /// Returns a mutable reference to a node.\n    pub fn node_mut(\u0026mut self, id: NodeId) -\u003e \u0026mut MctsNode {\n        \u0026mut self.nodes[id]\n    }\n\n    /// Adds a new child node to the tree.\n    /// Returns the new node's ID.\n    pub fn add_child(\u0026mut self, parent: NodeId, action: u32, prior: f32) -\u003e NodeId {\n        let depth = self.nodes[parent].depth + 1;\n        let child = MctsNode::child(parent, action, prior, depth, self.config.action_space);\n        let child_id = self.nodes.len();\n        self.nodes.push(child);\n        self.nodes[parent].children[action as usize] = Some(child_id);\n        child_id\n    }\n\n    /// Selects the best child of a node using PUCT formula.\n    ///\n    /// UCB score = Q(s,a) + c_puct * P(s,a) * sqrt(N_parent) / (1 + N_child)\n    #[instrument(skip_all)]\n    pub fn select_child(\u0026self, node_id: NodeId) -\u003e Option\u003cNodeId\u003e {\n        let node = \u0026self.nodes[node_id];\n        let sqrt_parent = (node.visits as f64).sqrt();\n\n        let mut best_score = f64::NEG_INFINITY;\n        let mut best_child = None;\n\n        for child_id in node.children.iter().flatten() {\n            let child = \u0026self.nodes[*child_id];\n            let q_value = child.mean_value();\n            let exploration = self.config.c_puct as f64 * child.prior as f64 * sqrt_parent\n                / (1.0 + child.visits as f64);\n            let score = q_value + exploration;\n\n            if score \u003e best_score {\n                best_score = score;\n                best_child = Some(*child_id);\n            }\n        }\n\n        best_child\n    }\n\n    /// Selects the best action from the root based on visit counts.\n    ///\n    /// With temperature 0: returns the most-visited action (greedy).\n    /// With temperature \u003e 0: samples proportional to visit^(1/temp).\n    #[instrument(skip_all)]\n    pub fn best_action(\u0026self) -\u003e Option\u003cu32\u003e {\n        let root = \u0026self.nodes[0];\n        let mut best_visits = 0;\n        let mut best_action = None;\n\n        for (action, child_id) in root.children.iter().enumerate() {\n            if let Some(id) = child_id {\n                let visits = self.nodes[*id].visits;\n                if visits \u003e best_visits {\n                    best_visits = visits;\n                    best_action = Some(action as u32);\n                }\n            }\n        }\n\n        best_action\n    }\n\n    /// Backpropagates a value estimate from a leaf up to the root.\n    #[instrument(skip_all)]\n    pub fn backpropagate(\u0026mut self, mut node_id: NodeId, value: f64) {\n        let discount = self.config.discount as f64;\n        let mut current_value = value;\n\n        loop {\n            let node = \u0026mut self.nodes[node_id];\n            node.visits += 1;\n            node.value_sum += current_value;\n            current_value *= discount;\n\n            match node.parent {\n                Some(parent) =\u003e node_id = parent,\n                None =\u003e break,\n            }\n        }\n    }\n\n    /// Returns the total number of nodes in the tree.\n    pub fn size(\u0026self) -\u003e usize {\n        self.nodes.len()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    fn make_config() -\u003e MctsConfig {\n        MctsConfig {\n            action_space: 4,\n            num_simulations: 10,\n            ..MctsConfig::default()\n        }\n    }\n\n    #[test]\n    fn test_tree_creation() {\n        let tree = MctsTree::new(make_config());\n        assert_eq!(tree.size(), 1);\n        assert_eq!(tree.root_id(), 0);\n\n        let root = tree.node(0);\n        assert!(root.parent.is_none());\n        assert_eq!(root.visits, 0);\n        assert_eq!(root.children.len(), 4);\n    }\n\n    #[test]\n    fn test_add_child() {\n        let mut tree = MctsTree::new(make_config());\n        let child_id = tree.add_child(0, 2, 0.25);\n\n        assert_eq!(child_id, 1);\n        assert_eq!(tree.size(), 2);\n\n        let child = tree.node(child_id);\n        assert_eq!(child.parent, Some(0));\n        assert_eq!(child.action, Some(2));\n        assert_eq!(child.prior, 0.25);\n        assert_eq!(child.depth, 1);\n\n        let root = tree.node(0);\n        assert_eq!(root.children[2], Some(1));\n    }\n\n    #[test]\n    fn test_backpropagate() {\n        let mut tree = MctsTree::new(make_config());\n        let c1 = tree.add_child(0, 0, 0.5);\n        let c2 = tree.add_child(c1, 1, 0.5);\n\n        tree.backpropagate(c2, 1.0);\n\n        // Leaf should have visit=1, value=1.0\n        assert_eq!(tree.node(c2).visits, 1);\n        assert!((tree.node(c2).value_sum - 1.0).abs() \u003c 1e-6);\n\n        // Middle should have visit=1, value=1.0*discount\n        assert_eq!(tree.node(c1).visits, 1);\n\n        // Root should have visit=1\n        assert_eq!(tree.node(0).visits, 1);\n    }\n\n    #[test]\n    fn test_mean_value() {\n        let mut node = MctsNode::root(4);\n        assert_eq!(node.mean_value(), 0.0);\n\n        node.visits = 2;\n        node.value_sum = 3.0;\n        assert!((node.mean_value() - 1.5).abs() \u003c 1e-6);\n    }\n\n    #[test]\n    fn test_select_child_exploration() {\n        let mut tree = MctsTree::new(make_config());\n\n        // Add two children with different priors\n        let c1 = tree.add_child(0, 0, 0.9);\n        let _c2 = tree.add_child(0, 1, 0.1);\n\n        // Set root visits\n        tree.node_mut(0).visits = 1;\n\n        // With no visits, the child with higher prior should be selected\n        let selected = tree.select_child(0).unwrap();\n        assert_eq!(selected, c1);\n    }\n\n    #[test]\n    fn test_best_action() {\n        let mut tree = MctsTree::new(make_config());\n        let _c1 = tree.add_child(0, 0, 0.25);\n        let c2 = tree.add_child(0, 1, 0.25);\n\n        // Give child 2 more visits\n        tree.node_mut(c2).visits = 10;\n\n        let best = tree.best_action().unwrap();\n        assert_eq!(best, 1);\n    }\n\n    #[test]\n    fn test_is_expanded() {\n        let mut tree = MctsTree::new(make_config());\n\n        assert!(!tree.node(0).is_expanded());\n\n        tree.add_child(0, 0, 0.5);\n        assert!(tree.node(0).is_expanded());\n    }\n\n    #[test]\n    fn test_select_child_no_children() {\n        let tree = MctsTree::new(make_config());\n        // Root has no children, so select_child should return None\n        let result = tree.select_child(0);\n        assert!(\n            result.is_none(),\n            \"select_child on root with no children should return None\"\n        );\n    }\n\n    #[test]\n    fn test_node_num_children() {\n        let mut tree = MctsTree::new(make_config());\n\n        assert_eq!(tree.node(0).num_children(), 0);\n\n        tree.add_child(0, 0, 0.5);\n        tree.add_child(0, 2, 0.3);\n\n        assert_eq!(tree.node(0).num_children(), 2);\n    }\n}\n","traces":[{"line":30,"address":[2773904],"length":1,"stats":{"Line":1}},{"line":65,"address":[2766464],"length":1,"stats":{"Line":3}},{"line":72,"address":[2766482],"length":1,"stats":{"Line":3}},{"line":79,"address":[2766608],"length":1,"stats":{"Line":3}},{"line":86,"address":[2766664],"length":1,"stats":{"Line":2}},{"line":93,"address":[2766272],"length":1,"stats":{"Line":3}},{"line":94,"address":[2766316,2766282],"length":1,"stats":{"Line":4}},{"line":95,"address":[2766318],"length":1,"stats":{"Line":3}},{"line":97,"address":[2766293],"length":1,"stats":{"Line":1}},{"line":102,"address":[2766336],"length":1,"stats":{"Line":3}},{"line":103,"address":[2766345],"length":1,"stats":{"Line":9}},{"line":107,"address":[2766400],"length":1,"stats":{"Line":1}},{"line":108,"address":[2766405],"length":1,"stats":{"Line":3}},{"line":124,"address":[2772209,2772184,2770976],"length":1,"stats":{"Line":2}},{"line":125,"address":[2771103,2771708],"length":1,"stats":{"Line":6}},{"line":127,"address":[2771726,2771779],"length":1,"stats":{"Line":6}},{"line":133,"address":[2772304],"length":1,"stats":{"Line":3}},{"line":138,"address":[2772256],"length":1,"stats":{"Line":3}},{"line":139,"address":[2772270],"length":1,"stats":{"Line":3}},{"line":143,"address":[2772320],"length":1,"stats":{"Line":1}},{"line":144,"address":[2772334],"length":1,"stats":{"Line":1}},{"line":149,"address":[2772802,2772777,2772352],"length":1,"stats":{"Line":3}},{ config.world.seed = 42;\n    config.agents.num_agents = num_agents;\n    config.task.max_episode_length = 0; // no truncation during bench\n    config\n}\n\nfn bench_step_single_agent(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"step_single_agent\");\n\n    for size in [16u16, 32, 64, 128] {\n        let config = make_config(size, size, 1);\n        let mut world = WorldState::new(config).unwrap();\n        let actions = vec![Action::Move(Direction::Right)];\n\n        group.bench_with_input(\n            BenchmarkId::new(\"grid_size\", format!(\"{}x{}\", size, size)),\n            \u0026size,\n            |b, _| {\n                b.iter(|| {\n                    black_box(world.step(\u0026actions));\n                });\n            },\n        );\n    }\n\n    group.finish();\n}\n\nfn bench_step_multi_agent(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"step_multi_agent\");\n\n    for num_agents in [1u32, 2, 4, 8] {\n        let config = make_config(64, 64, num_agents);\n        let mut world = WorldState::new(config).unwrap();\n        let actions: Vec\u003cAction\u003e = (0..num_agents)\n            .map(|i| Action::Move(Direction::from_index((i % 4) as u8).unwrap()))\n            .collect();\n\n        group.bench_with_input(\n            BenchmarkId::new(\"num_agents\", num_agents),\n            \u0026num_agents,\n            |b, _| {\n                b.iter(|| {\n                    black_box(world.step(\u0026actions));\n                });\n            },\n        );\n    }\n\n    group.finish();\n}\n\nfn bench_step_noop(c: \u0026mut Criterion) {\n    let config = make_config(64, 64, 1);\n    let mut world = WorldState::new(config).unwrap();\n    let actions = vec![Action::Noop];\n\n    c.bench_function(\"step_noop_64x64\", |b| {\n        b.iter(|| {\n            black_box(world.step(\u0026actions));\n        });\n    });\n}\n\nfn bench_world_creation(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"world_creation\");\n\n    for size in [16u16, 32, 64, 128] {\n        let config = make_config(size, size, 1);\n\n        group.bench_with_input(\n            BenchmarkId::new(\"grid_size\", format!(\"{}x{}\", size, size)),\n            \u0026size,\n            |b, _| {\n                b.iter(|| {\n                    black_box(WorldState::new(config.clone()).unwrap());\n                });\n            },\n        );\n    }\n\n    group.finish();\n}\n\nfn bench_serialization(c: \u0026mut Criterion) {\n    let mut group = c.benchmark_group(\"serialization\");\n\n    for size in [16u16, 32, 64] {\n        let config = make_config(size, size, 1);\n        let world = WorldState::new(config).unwrap();\n\n        group.bench_with_input(\n            BenchmarkId::new(\"to_bytes\", format!(\"{}x{}\", size, size)),\n            \u0026size,\n            |b, _| {\n                b.iter(|| {\n                    black_box(world.to_bytes());\n                });\n            },\n        );\n    }\n\n    group.finish();\n}\n\ncriterion_group!(\n    benches,\n    bench_step_single_agent,\n    bench_step_multi_agent,\n    bench_step_noop,\n    bench_world_creation,\n    bench_serialization\n);\ncriterion_main!(benches);\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-bench","src","lib.rs"],"content":"#![deny(missing_docs)]\n#![deny(clippy::all)]\n\n//! # forge-bench\n//!\n//! Performance benchmarks for the FORGE simulation platform.\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-core","src","combat.rs"],"content":"//! Combat system for the FORGE simulation.\n//!\n//! Handles melee combat (sword attacks), health tracking, agent death,\n//! and environmental damage from hazardous terrain such as lava.\n\nuse forge_types::constants::{DEFAULT_LAVA_DAMAGE, DEFAULT_SWORD_DAMAGE};\nuse forge_types::entity::Agent;\nuse forge_types::grid::{Direction, Grid, TerrainType};\nuse forge_types::resource::ItemType;\nuse forge_types::Action;\nuse tracing::{instrument, trace};\n\n/// Processes combat damage from Use actions when using a weapon.\n///\n/// When an agent performs `Use(slot)` and the item in that slot is a Sword:\n/// - Checks all 4 adjacent tiles in canonical order (Up, Down, Left, Right)\n///   for a living agent\n/// - Deals `DEFAULT_SWORD_DAMAGE` to the first adjacent agent found\n/// - If the target's health drops to 0 or below, marks them as dead\n///\n/// Adjacent tiles are checked in a fixed deterministic order to ensure\n/// reproducible behavior.\n#[instrument(skip_all)]\npub fn process_combat(agents: \u0026mut [Agent], grid: \u0026Grid, actions: \u0026[Action]) {\n    // Collect attack intents first to avoid borrow issues\n    let mut attacks: Vec\u003c(usize, usize)\u003e = Vec::new(); // (attacker_idx, target_idx)\n\n    for (i, action) in actions.iter().enumerate() {\n        let slot = match action {\n            Action::Use(s) =\u003e *s as usize,\n            _ =\u003e continue,\n        };\n\n        if i \u003e= agents.len() {\n            continue;\n        }\n\n        let agent = \u0026agents[i];\n        if !agent.alive {\n            continue;\n        }\n\n        // Check if the item in the slot is a sword\n        let has_sword = match agent.inventory.get_slot(slot) {\n            Some(stack) =\u003e stack.item_type == ItemType::Sword,\n            None =\u003e false,\n        };\n\n        if !has_sword {\n            continue;\n        }\n\n        // Check all 4 adjacent tiles for a target agent\n        let attacker_pos = agent.position;\n        let mut target_idx = None;\n\n        for dir in Direction::all() {\n            if let Some(adj_pos) = attacker_pos.offset(dir, grid.width, grid.height) {\n                if let Some(tile) = grid.get(adj_pos.x, adj_pos.y) {\n                    if let Some(target_id) = tile.agent_id {\n                        // Find the agent index for this target\n                        if let Some(idx) = agents.iter().position(|a| a.id == target_id \u0026\u0026 a.alive)\n                        {\n                            // Don't attack yourself\n                            if idx != i {\n                                target_idx = Some(idx);\n                                break;\n                            }\n                        }\n                    }\n                }\n            }\n        }\n\n        if let Some(target) = target_idx {\n            attacks.push((i, target));\n            trace!(\n                attacker_id = agents[i].id,\n                target_id = agents[target].id,\n                damage = DEFAULT_SWORD_DAMAGE,\n                \"sword attack\"\n            );\n        } else {\n            trace!(agent_id = agents[i].id, \"sword attack: no adjacent target\");\n        }\n    }\n\n    // Apply damage\n    for (attacker_idx, target_idx) in attacks {\n        let damage = DEFAULT_SWORD_DAMAGE;\n        agents[target_idx].health -= damage;\n\n        trace!(\n            target_id = agents[target_idx].id,\n            remaining_health = agents[target_idx].health,\n            \"damage applied\"\n        );\n\n        if agents[target_idx].health \u003c= 0 {\n            agents[target_idx].health = 0;\n            agents[target_idx].alive = false;\n            trace!(\n                agent_id = agents[target_idx].id,\n                killed_by = agents[attacker_idx].id,\n                \"agent killed\"\n            );\n        }\n    }\n}\n\n/// Applies environmental damage to agents standing on hazardous terrain.\n///\n/// Currently handles:\n/// - **Lava**: Agents on Lava terrain take `DEFAULT_LAVA_DAMAGE` per tick.\n///   If their health drops to 0, they are marked as dead.\n///\n/// Note: Lava is normally not walkable (is_walkable() returns false),\n/// but agents may end up on lava tiles through external placement,\n/// terrain changes, or being pushed. This system handles those cases.\n#[instrument(skip_all)]\npub fn apply_environmental_damage(agents: \u0026mut [Agent], grid: \u0026Grid) {\n    for agent in agents.iter_mut() {\n        if !agent.alive {\n            continue;\n        }\n\n        let tile = match grid.get(agent.position.x, agent.position.y) {\n            Some(t) =\u003e t,\n            None =\u003e continue,\n        };\n\n        if tile.terrain == TerrainType::Lava {\n            agent.health -= DEFAULT_LAVA_DAMAGE;\n\n            trace!(\n                agent_id = agent.id,\n                damage = DEFAULT_LAVA_DAMAGE,\n                remaining_health = agent.health,\n                \"lava damage\"\n            );\n\n            if agent.health \u003c= 0 {\n                agent.health = 0;\n                agent.alive = false;\n                trace!(agent_id = agent.id, \"agent killed by lava\");\n            }\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::AgentConfig;\n    use forge_types::grid::Position;\n\n    fn make_test_agent(id: u32, x: u16, y: u16) -\u003e Agent {\n        let config = AgentConfig::default();\n        Agent::new(id, Position::new(x, y), \u0026config)\n    }\n\n    fn make_test_grid(width: u16, height: u16) -\u003e Grid {\n        Grid::new(width, height)\n    }\n\n    // ---- Combat tests ----\n\n    #[test]\n    fn test_combat_sword_attack() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![\n            make_test_agent(0, 5, 5), // attacker\n            make_test_agent(1, 5, 4), // target (above attacker)\n        ];\n        // Give attacker a sword in slot 0\n        agents[0].inventory.add_item(ItemType::Sword, 1);\n\n        // Place agents on grid\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n        grid.get_mut(5, 4).unwrap().agent_id = Some(1);\n\n        let initial_health = agents[1].health;\n        let actions = vec![Action::Use(0), Action::Noop];\n\n        process_combat(\u0026mut agents, \u0026grid, \u0026actions);\n\n        assert!(agents[1].health \u003c initial_health);\n        assert_eq!(initial_health - agents[1].health, DEFAULT_SWORD_DAMAGE);\n    }\n\n    #[test]\n    fn test_combat_agent_death() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 5, 5), make_test_agent(1, 5, 4)];\n        agents[0].inventory.add_item(ItemType::Sword, 1);\n        // Set target health low enough to die from one hit\n        agents[1].health = DEFAULT_SWORD_DAMAGE;\n\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n        grid.get_mut(5, 4).unwrap().agent_id = Some(1);\n\n        let actions = vec![Action::Use(0), Action::Noop];\n\n        process_combat(\u0026mut agents, \u0026grid, \u0026actions);\n\n        assert_eq!(agents[1].health, 0);\n        assert!(!agents[1].alive);\n    }\n\n    #[test]\n    fn test_combat_no_sword_no_damage() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 5, 5), make_test_agent(1, 5, 4)];\n        // Agent has wood in slot 0, not a sword\n        agents[0].inventory.add_item(ItemType::Wood, 1);\n\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n        grid.get_mut(5, 4).unwrap().agent_id = Some(1);\n\n        let initial_health = agents[1].health;\n        let actions = vec![Action::Use(0), Action::Noop];\n\n        process_combat(\u0026mut agents, \u0026grid, \u0026actions);\n\n        assert_eq!(agents[1].health, initial_health);\n    }\n\n    #[test]\n    fn test_combat_no_adjacent_target() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![\n            make_test_agent(0, 5, 5),\n            make_test_agent(1, 10, 10), // far away\n        ];\n        agents[0].inventory.add_item(ItemType::Sword, 1);\n\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n        grid.get_mut(10, 10).unwrap().agent_id = Some(1);\n\n        let initial_health = agents[1].health;\n        let actions = vec![Action::Use(0), Action::Noop];\n\n        process_combat(\u0026mut agents, \u0026grid, \u0026actions);\n\n        assert_eq!(agents[1].health, initial_health);\n    }\n\n    #[test]\n    fn test_combat_dead_attacker_ignored() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 5, 5), make_test_agent(1, 5, 4)];\n        agents[0].inventory.add_item(ItemType::Sword, 1);\n        agents[0].alive = false;\n\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n        grid.get_mut(5, 4).unwrap().agent_id = Some(1);\n\n        let initial_health = agents[1].health;\n        let actions = vec![Action::Use(0), Action::Noop];\n\n        process_combat(\u0026mut agents, \u0026grid, \u0026actions);\n\n        assert_eq!(agents[1].health, initial_health);\n    }\n\n    #[test]\n    fn test_combat_dead_target_not_attacked() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 5, 5), make_test_agent(1, 5, 4)];\n        agents[0].inventory.add_item(ItemType::Sword, 1);\n        agents[1].alive = false;\n\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n        grid.get_mut(5, 4).unwrap().agent_id = Some(1);\n\n        let initial_health = agents[1].health;\n        let actions = vec![Action::Use(0), Action::Noop];\n\n        process_combat(\u0026mut agents, \u0026grid, \u0026actions);\n\n        assert_eq!(agents[1].health, initial_health);\n    }\n\n    #[test]\n    fn test_combat_empty_slot() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 5, 5), make_test_agent(1, 5, 4)];\n        // Slot 0 is empty\n\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n        grid.get_mut(5, 4).unwrap().agent_id = Some(1);\n\n        let initial_health = agents[1].health;\n        let actions = vec![Action::Use(0), Action::Noop];\n\n        process_combat(\u0026mut agents, \u0026grid, \u0026actions);\n\n        assert_eq!(agents[1].health, initial_health);\n    }\n\n    #[test]\n    fn test_combat_direction_priority() {\n        // When multiple agents are adjacent, the one in the first checked direction\n        // (Up) should be attacked\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![\n            make_test_agent(0, 5, 5), // attacker\n            make_test_agent(1, 5, 4), // Up\n            make_test_agent(2, 5, 6), // Down\n        ];\n        agents[0].inventory.add_item(ItemType::Sword, 1);\n\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n        grid.get_mut(5, 4).unwrap().agent_id = Some(1);\n        grid.get_mut(5, 6).unwrap().agent_id = Some(2);\n\n        let initial_health_1 = agents[1].health;\n        let initial_health_2 = agents[2].health;\n        let actions = vec![Action::Use(0), Action::Noop, Action::Noop];\n\n        process_combat(\u0026mut agents, \u0026grid, \u0026actions);\n\n        // Agent 1 (Up) should be attacked, agent 2 (Down) should be unharmed\n        assert!(agents[1].health \u003c initial_health_1);\n        assert_eq!(agents[2].health, initial_health_2);\n    }\n\n    #[test]\n    fn test_combat_mutual_attack() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 5, 5), make_test_agent(1, 5, 4)];\n        agents[0].inventory.add_item(ItemType::Sword, 1);\n        agents[1].inventory.add_item(ItemType::Sword, 1);\n\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n        grid.get_mut(5, 4).unwrap().agent_id = Some(1);\n\n        let initial_health_0 = agents[0].health;\n        let initial_health_1 = agents[1].health;\n        let actions = vec![Action::Use(0), Action::Use(0)]; // both attack\n\n        process_combat(\u0026mut agents, \u0026grid, \u0026actions);\n\n        // Both should take damage\n        assert!(agents[0].health \u003c initial_health_0);\n        assert!(agents[1].health \u003c initial_health_1);\n    }\n\n    // ---- Environmental damage tests ----\n\n    #[test]\n    fn test_lava_damage() {\n        let mut grid = make_test_grid(16, 16);\n        grid.get_mut(5, 5).unwrap().terrain = TerrainType::Lava;\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        let initial_health = agents[0].health;\n\n        apply_environmental_damage(\u0026mut agents, \u0026grid);\n\n        assert!(agents[0].health \u003c initial_health);\n        assert_eq!(initial_health - agents[0].health, DEFAULT_LAVA_DAMAGE);\n    }\n\n    #[test]\n    fn test_lava_kills_agent() {\n        let mut grid = make_test_grid(16, 16);\n        grid.get_mut(5, 5).unwrap().terrain = TerrainType::Lava;\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        agents[0].health = DEFAULT_LAVA_DAMAGE; // just enough to die\n\n        apply_environmental_damage(\u0026mut agents, \u0026grid);\n\n        assert_eq!(agents[0].health, 0);\n        assert!(!agents[0].alive);\n    }\n\n    #[test]\n    fn test_no_damage_on_ground() {\n        let mut grid = make_test_grid(16, 16);\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n        // Ground is default terrain\n\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        let initial_health = agents[0].health;\n\n        apply_environmental_damage(\u0026mut agents, \u0026grid);\n\n        assert_eq!(agents[0].health, initial_health);\n    }\n\n    #[test]\n    fn test_dead_agent_no_environmental_damage() {\n        let mut grid = make_test_grid(16, 16);\n        grid.get_mut(5, 5).unwrap().terrain = TerrainType::Lava;\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        agents[0].alive = false;\n        let initial_health = agents[0].health;\n\n        apply_environmental_damage(\u0026mut agents, \u0026grid);\n\n        assert_eq!(agents[0].health, initial_health);\n    }\n\n    #[test]\n    fn test_lava_cumulative_damage() {\n        let mut grid = make_test_grid(16, 16);\n        grid.get_mut(5, 5).unwrap().terrain = TerrainType::Lava;\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        let initial_health = agents[0].health;\n\n        // Apply damage 3 times\n        apply_environmental_damage(\u0026mut agents, \u0026grid);\n        apply_environmental_damage(\u0026mut agents, \u0026grid);\n        apply_environmental_damage(\u0026mut agents, \u0026grid);\n\n        assert_eq!(agents[0].health, initial_health - 3 * DEFAULT_LAVA_DAMAGE);\n        assert!(agents[0].alive); // still alive with default health (10.0)\n    }\n\n    #[test]\n    fn test_multiple_agents_environmental_damage() {\n        let mut grid = make_test_grid(16, 16);\n        grid.get_mut(5, 5).unwrap().terrain = TerrainType::Lava;\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n        grid.get_mut(7, 7).unwrap().agent_id = Some(1);\n        // Agent 1 is on ground\n\n        let mut agents = vec![make_test_agent(0, 5, 5), make_test_agent(1, 7, 7)];\n        let initial_health_0 = agents[0].health;\n        let initial_health_1 = agents[1].health;\n\n        apply_environmental_damage(\u0026mut agents, \u0026grid);\n\n        // Agent 0 on lava should take damage\n        assert!(agents[0].health \u003c initial_health_0);\n        // Agent 1 on ground should be fine\n        assert_eq!(agents[1].health, initial_health_1);\n    }\n}\n","traces":[{"line":24,"address":[3476904,3473280,3479522],"length":1,"stats":{"Line":8}},{"line":26,"address":[3473484],"length":1,"stats":{"Line":8}},{"line":28,"address":[3497588,3497680],"length":1,"stats":{"Line":11}},{"line":29,"address":[3913280],"length":1,"stats":{"Line":5}},{"line":30,"address":[3915686],"length":1,"stats":{"Line":3}},{"line":34,"address":[3915721],"length":1,"stats":{"Line":5}},{"line":38,"address":[3238021,3237950] s.len() {\n            continue;\n        }\n\n        let token = match action {\n            Action::Communicate(t) =\u003e *t,\n            _ =\u003e continue,\n        };\n\n        let agent = \u0026agents[i];\n\n        // Dead agents cannot send\n        if !agent.alive {\n            trace!(agent_id = agent.id, \"dead agent cannot communicate\");\n            continue;\n        }\n\n        // Check capability\n        if !agent.capabilities.can_communicate {\n            trace!(agent_id = agent.id, \"agent lacks communicate capability\");\n            continue;\n        }\n\n        // Validate token is within vocabulary\n        if token \u003e= config.comm_vocab_size {\n            trace!(\n                agent_id = agent.id,\n                token = token,\n                vocab_size = config.comm_vocab_size,\n                \"token exceeds vocabulary size\"\n            );\n            continue;\n        }\n\n        messages.push((i, token));\n    }\n\n    // Deliver each message to agents within range\n    for (sender_idx, token) in messages {\n        let sender_pos = agents[sender_idx].position;\n        let sender_id = agents[sender_idx].id;\n        let comm_radius = config.comm_radius;\n        let buffer_size = config.comm_buffer_size as usize;\n\n        trace!(\n            agent_id = sender_id,\n            token = token,\n            comm_radius = comm_radius,\n            \"broadcasting message\"\n        );\n\n        for (j, recipient) in agents.iter_mut().enumerate() {\n            if j == sender_idx {\n                continue;\n            }\n\n            if !recipient.alive {\n                continue;\n            }\n\n            // Check distance: comm_radius == 0 means global broadcast\n            if comm_radius \u003e 0 {\n                let dist = sender_pos.manhattan_distance(\u0026recipient.position);\n                if dist \u003e comm_radius as u32 {\n                    continue;\n                }\n            }\n\n            // Deliver: evict oldest if buffer is full\n            if buffer_size \u003e 0 \u0026\u0026 recipient.comm_buffer.len() \u003e= buffer_size {\n                recipient.comm_buffer.remove(0);\n            }\n            recipient.comm_buffer.push(token);\n\n            trace!(\n                sender_id = sender_id,\n                recipient_id = recipient.id,\n                token = token,\n                \"message delivered\"\n            );\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::AgentConfig;\n    use forge_types::entity::Agent;\n    use forge_types::grid::Position;\n\n    fn make_agent(id: u32, x: u16, y: u16) -\u003e Agent {\n        let config = AgentConfig::default();\n        Agent::new(id, Position::new(x, y), \u0026config)\n    }\n\n    fn make_config() -\u003e AgentConfig {\n        AgentConfig::default()\n    }\n\n    #[test]\n    fn test_broadcast_message() {\n        let mut agents = vec![make_agent(0, 5, 5), make_agent(1, 6, 5)];\n        let actions = vec![Action::Communicate(3), Action::Noop];\n        let config = make_config();\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        assert!(\n            agents[0].comm_buffer.is_empty(),\n            \"sender should not receive own message\"\n        );\n        assert_eq!(agents[1].comm_buffer.len(), 1);\n        assert_eq!(agents[1].comm_buffer[0], 3);\n    }\n\n    #[test]\n    fn test_comm_radius_filtering() {\n        let mut config = make_config();\n        config.comm_radius = 3;\n\n        let mut agents = vec![\n            make_agent(0, 5, 5),   // sender\n            make_agent(1, 6, 5),   // distance 1 — in range\n            make_agent(2, 20, 20), // distance 30 — out of range\n        ];\n        let actions = vec![Action::Communicate(1), Action::Noop, Action::Noop];\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        assert_eq!(agents[1].comm_buffer.len(), 1);\n        assert!(agents[2].comm_buffer.is_empty());\n    }\n\n    #[test]\n    fn test_comm_buffer_overflow() {\n        let mut config = make_config();\n        config.comm_buffer_size = 3;\n        config.comm_radius = 0; // global\n\n        let mut agents = vec![make_agent(0, 0, 0), make_agent(1, 1, 0)];\n\n        // Send 5 messages — buffer should only keep the latest 3\n        for token in 0u16..5 {\n            let actions = vec![Action::Communicate(token), Action::Noop];\n            process_communication(\u0026mut agents, \u0026actions, \u0026config);\n        }\n\n        assert_eq!(agents[1].comm_buffer.len(), 3);\n        // Oldest messages (0 and 1) should have been evicted\n        assert_eq!(agents[1].comm_buffer[0], 2);\n        assert_eq!(agents[1].comm_buffer[1], 3);\n        assert_eq!(agents[1].comm_buffer[2], 4);\n    }\n\n    #[test]\n    fn test_dead_agent_no_send() {\n        let mut agents = vec![make_agent(0, 5, 5), make_agent(1, 6, 5)];\n        agents[0].alive = false;\n        let actions = vec![Action::Communicate(1), Action::Noop];\n        let config = make_config();\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        assert!(agents[1].comm_buffer.is_empty());\n    }\n\n    #[test]\n    fn test_dead_agent_no_receive() {\n        let mut agents = vec![make_agent(0, 5, 5), make_agent(1, 6, 5)];\n        agents[1].alive = false;\n        let actions = vec![Action::Communicate(1), Action::Noop];\n        let config = make_config();\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        assert!(agents[1].comm_buffer.is_empty());\n    }\n\n    #[test]\n    fn test_global_broadcast() {\n        let mut config = make_config();\n        config.comm_radius = 0; // global\n\n        let mut agents = vec![\n            make_agent(0, 0, 0),\n            make_agent(1, 100, 100),\n            make_agent(2, 200, 200),\n        ];\n        let actions = vec![Action::Communicate(7), Action::Noop, Action::Noop];\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        assert_eq!(agents[1].comm_buffer.len(), 1);\n        assert_eq!(agents[1].comm_buffer[0], 7);\n        assert_eq!(agents[2].comm_buffer.len(), 1);\n        assert_eq!(agents[2].comm_buffer[0], 7);\n    }\n\n    #[test]\n    fn test_vocab_validation() {\n        let mut config = make_config();\n        config.comm_vocab_size = 10;\n\n        let mut agents = vec![make_agent(0, 5, 5), make_agent(1, 6, 5)];\n        // Token 10 is out of vocabulary (valid: 0..9)\n        let actions = vec![Action::Communicate(10), Action::Noop];\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        assert!(agents[1].comm_buffer.is_empty());\n    }\n\n    #[test]\n    fn test_can_communicate_flag() {\n        let mut agents = vec![make_agent(0, 5, 5), make_agent(1, 6, 5)];\n        agents[0].capabilities.can_communicate = false;\n        let actions = vec![Action::Communicate(1), Action::Noop];\n        let config = make_config();\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        assert!(agents[1].comm_buffer.is_empty());\n    }\n\n    #[test]\n    fn test_multiple_messages() {\n        let mut config = make_config();\n        config.comm_radius = 0; // global\n\n        let mut agents = vec![\n            make_agent(0, 0, 0),\n            make_agent(1, 1, 0),\n            make_agent(2, 2, 0),\n        ];\n        // Agents 0 and 2 both send\n        let actions = vec![Action::Communicate(5), Action::Noop, Action::Communicate(9)];\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        // Agent 0 should receive from agent 2 only\n        assert_eq!(agents[0].comm_buffer.len(), 1);\n        assert_eq!(agents[0].comm_buffer[0], 9);\n\n        // Agent 1 should receive from both 0 and 2\n        assert_eq!(agents[1].comm_buffer.len(), 2);\n        assert_eq!(agents[1].comm_buffer[0], 5);\n        assert_eq!(agents[1].comm_buffer[1], 9);\n\n        // Agent 2 should receive from agent 0 only\n        assert_eq!(agents[2].comm_buffer.len(), 1);\n        assert_eq!(agents[2].comm_buffer[0], 5);\n    }\n\n    // ---- Edge case tests ----\n\n    #[test]\n    fn test_comm_buffer_size_zero() {\n        let mut config = make_config();\n        config.comm_buffer_size = 0;\n        config.comm_radius = 0; // global\n\n        let mut agents = vec![make_agent(0, 0, 0), make_agent(1, 1, 0)];\n        let actions = vec![Action::Communicate(1), Action::Noop];\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        // With buffer_size = 0, the condition `recipient.comm_buffer.len() \u003e= buffer_size`\n        // is always true, so the oldest message is evicted each time.\n        // After pushing 1 message and evicting 0 (buffer was empty), the buffer should\n        // contain the message since push happens after the eviction check.\n        // Actually: buffer_size = 0 means len() \u003e= 0 is always true, so remove(0) is\n        // called before push. If buffer is empty, remove(0) would panic.\n        // Let's verify the behavior doesn't panic — if it does, the test catches it.\n        // With the current code: `if buffer_size \u003e 0 \u0026\u0026 ...` — since buffer_size is 0,\n        // the eviction is skipped, and the message is always pushed.\n        assert_eq!(agents[1].comm_buffer.len(), 1);\n        assert_eq!(agents[1].comm_buffer[0], 1);\n    }\n\n    #[test]\n    fn test_comm_buffer_size_zero_multiple_messages() {\n        let mut config = make_config();\n        config.comm_buffer_size = 0;\n        config.comm_radius = 0; // global\n\n        let mut agents = vec![make_agent(0, 0, 0), make_agent(1, 1, 0)];\n\n        // Send 5 messages — with buffer_size 0 the guard `buffer_size \u003e 0` is false\n        // so no eviction ever happens, messages accumulate\n        for token in 0u16..5 {\n            let actions = vec![Action::Communicate(token), Action::Noop];\n            process_communication(\u0026mut agents, \u0026actions, \u0026config);\n        }\n\n        assert_eq!(agents[1].comm_buffer.len(), 5);\n    }\n\n    #[test]\n    fn test_very_large_comm_radius() {\n        let mut config = make_config();\n        config.comm_radius = u16::MAX;\n\n        let mut agents = vec![\n            make_agent(0, 0, 0),\n            make_agent(1, 500, 500), // far away\n        ];\n        let actions = vec![Action::Communicate(7), Action::Noop];\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        // Manhattan distance = 1000. u16::MAX = 65535 \u003e 1000, so should be in range.\n        assert_eq!(agents[1].comm_buffer.len(), 1);\n        assert_eq!(agents[1].comm_buffer[0], 7);\n    }\n\n    #[test]\n    fn test_comm_radius_exactly_at_boundary() {\n        let mut config = make_config();\n        config.comm_radius = 5;\n\n        let mut agents = vec![\n            make_agent(0, 0, 0),\n            make_agent(1, 3, 2), // distance = 5, exactly at boundary\n            make_agent(2, 3, 3), // distance = 6, just outside\n        ];\n        let actions = vec![Action::Communicate(1), Action::Noop, Action::Noop];\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        assert_eq!(\n            agents[1].comm_buffer.len(),\n            1,\n            \"agent at exactly comm_radius should receive\"\n        );\n        assert!(\n            agents[2].comm_buffer.is_empty(),\n            \"agent just outside comm_radius should not receive\"\n        );\n    }\n\n    #[test]\n    fn test_single_agent_comm_no_recipients() {\n        let mut config = make_config();\n        config.comm_radius = 0; // global\n\n        let mut agents = vec![make_agent(0, 5, 5)];\n        let actions = vec![Action::Communicate(1)];\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        // Single agent — no one to receive\n        assert!(agents[0].comm_buffer.is_empty());\n    }\n\n    #[test]\n    fn test_comm_token_zero_is_valid() {\n        let mut config = make_config();\n        config.comm_vocab_size = 10;\n        config.comm_radius = 0;\n\n        let mut agents = vec![make_agent(0, 0, 0), make_agent(1, 1, 0)];\n        let actions = vec![Action::Communicate(0), Action::Noop];\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        assert_eq!(agents[1].comm_buffer.len(), 1);\n        assert_eq!(agents[1].comm_buffer[0], 0);\n    }\n\n    #[test]\n    fn test_comm_excess_actions_ignored() {\n        let config = make_config();\n\n        let mut agents = vec![make_agent(0, 0, 0)];\n        // More actions than agents\n        let actions = vec![Action::Communicate(1), Action::Communicate(2)];\n\n        process_communication(\u0026mut agents, \u0026actions, \u0026config);\n\n        // The second action should be skipped (index \u003e= agents.len())\n        assert!(agents[0].comm_buffer.is_empty());\n    }\n}\n","traces":[{"line":22,"address":[3656885,3653200,3658853],"length":1,"stats":{"Line":5}},{"line":25,"address":[3653393],"length":1,"stats":{"Line":7}},{"line":27,"address":[3654105,3654197],"length":1,"stats":{"Line":14}},{"line":28,"address":[3069561],"length":1,"stats":{"Line":5}},{"line":32,"address":[3656899],"length":1,"stats":{"Line":9}},{"line":33,"address":[3656936],"length":1,"stats":{"Line":5}},{"line":37,"address":[4072391,4072323],"length":1,"stats":{"Line":5}},{"line":40,"address":[4072367],"length":1,"stats":{"Line":5}},{"line":41,"address":[3657052,3657106],"length":1,"stats":{"Line":2}},{"line":46,"address":[3657084],"length":1,"stats":{"Line":5}},{"line":47,"address":[3634316,3634254],"length":1,"stats":{"Line":2}},{"line":52,"address":[4073038],"length":1,"stats":{"Line":4}},{"line":53,"address":[4073637,4073607]
