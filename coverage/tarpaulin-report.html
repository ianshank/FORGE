ntities: u16,\n    /// Minimum world dimension (width or height).\n    pub min_dimension: u16,\n    /// Maximum world dimension (width or height).\n    pub max_dimension: u16,\n}\n\nimpl Default for WorldConfig {\n    fn default() -\u003e Self {\n        Self {\n            width: constants::DEFAULT_WORLD_WIDTH,\n            height: constants::DEFAULT_WORLD_HEIGHT,\n            seed: constants::DEFAULT_SEED,\n            biome_scale: constants::DEFAULT_BIOME_SCALE,\n            resource_density: constants::DEFAULT_RESOURCE_DENSITY,\n            day_night_cycle_length: constants::DEFAULT_DAY_NIGHT_CYCLE_LENGTH,\n            max_entities: constants::DEFAULT_MAX_ENTITIES,\n            min_dimension: constants::MIN_WORLD_DIMENSION,\n            max_dimension: constants::MAX_WORLD_DIMENSION,\n        }\n    }\n}\n\n/// Physics system configuration.\n#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(default)]\npub struct PhysicsConfig {\n    /// Whether collision detection is enabled.\n    pub collision_enabled: bool,\n    /// Base movement cost in stamina units (fixed-point, stored as i32 with 16 fractional bits).\n    pub stamina_cost_move: i32,\n    /// Stamina regeneration per tick (fixed-point).\n    pub stamina_regen_rate: i32,\n    /// Maximum agent velocity in tiles per tick (fixed-point).\n    pub max_velocity: i32,\n    /// Friction coefficient (fixed-point). Affects sliding on ice, etc.\n    pub friction: i32,\n    /// Whether projectile physics is enabled.\n    pub projectiles_enabled: bool,\n}\n\nimpl Default for PhysicsConfig {\n    fn default() -\u003e Self {\n        Self {\n            collision_enabled: true,\n            stamina_cost_move: constants::DEFAULT_STAMINA_COST_MOVE,\n            stamina_regen_rate: constants::DEFAULT_STAMINA_REGEN_RATE,\n            max_velocity: constants::DEFAULT_MAX_VELOCITY,\n            friction: constants::DEFAULT_FRICTION,\n            projectiles_enabled: false,\n        }\n    }\n}\n\n/// Crafting system configuration.\n#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(default)]\npub struct CraftingConfig {\n    /// Whether the crafting system is enabled.\n    pub enabled: bool,\n    /// Whether recipes vary per world seed (procedural recipes).\n    pub procedural_recipes: bool,\n    /// Maximum number of ingredients per recipe.\n    pub max_ingredients: u8,\n    /// Whether agents must discover recipes before crafting.\n    pub require_discovery: bool,\n}\n\nimpl Default for CraftingConfig {\n    fn default() -\u003e Self {\n        Self {\n            enabled: true,\n            procedural_recipes: false,\n            max_ingredients: constants::DEFAULT_MAX_INGREDIENTS,\n            require_discovery: false,\n        }\n    }\n}\n\n/// Agent configuration.\n#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(default)]\npub struct AgentConfig {\n    /// Number of agents in the simulation.\n    pub num_agents: u32,\n    /// Default vision radius in tiles.\n    pub default_vision_radius: u8,\n    /// Default carry capacity (inventory slots).\n    pub default_carry_capacity: u8,\n    /// Starting health (fixed-point).\n    pub starting_health: i32,\n    /// Maximum health (fixed-point).\n    pub max_health: i32,\n    /// Starting stamina (fixed-point).\n    pub starting_stamina: i32,\n    /// Maximum stamina (fixed-point).\n    pub max_stamina: i32,\n    /// Whether agents can have heterogeneous capabilities.\n    pub heterogeneous: bool,\n    /// Communication vocabulary size (0 = communication disabled).\n    pub comm_vocab_size: u16,\n    /// Communication broadcast radius in tiles. 0 = global broadcast.\n    pub comm_radius: u16,\n    /// Maximum messages stored in agent's communication buffer.\n    pub comm_buffer_size: u8,\n}\n\nimpl Default for AgentConfig {\n    fn default() -\u003e Self {\n        Self {\n            num_agents: constants::DEFAULT_NUM_AGENTS,\n            default_vision_radius: constants::DEFAULT_VISION_RADIUS,\n            default_carry_capacity: constants::DEFAULT_CARRY_CAPACITY,\n            starting_health: constants::DEFAULT_STARTING_HEALTH,\n            max_health: constants::DEFAULT_MAX_HEALTH,\n            starting_stamina: constants::DEFAULT_STARTING_STAMINA,\n            max_stamina: constants::DEFAULT_MAX_STAMINA,\n            heterogeneous: false,\n            comm_vocab_size: constants::DEFAULT_COMM_VOCAB_SIZE,\n            comm_radius: constants::DEFAULT_COMM_RADIUS,\n            comm_buffer_size: constants::DEFAULT_COMM_BUFFER_SIZE,\n        }\n    }\n}\n\n/// Task system configuration.\n#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(default)]\npub struct TaskConfig {\n    /// Whether the task system is enabled.\n    pub enabled: bool,\n    /// Maximum task tier to generate (1-6).\n    pub max_tier: u8,\n    /// Maximum number of predicates in a single task.\n    pub max_predicates: u16,\n    /// Maximum episode length in ticks. 0 = unlimited.\n    pub max_episode_length: u64,\n    /// Reward scale factor.\n    pub reward_scale: f32,\n    /// Whether to provide dense reward shaping.\n    pub dense_rewards: bool,\n}\n\nimpl Default for TaskConfig {\n    fn default() -\u003e Self {\n        Self {\n            enabled: true,\n            max_tier: constants::DEFAULT_MAX_TASK_TIER,\n            max_predicates: constants::DEFAULT_MAX_PREDICATES,\n            max_episode_length: constants::DEFAULT_MAX_EPISODE_LENGTH,\n            reward_scale: constants::DEFAULT_REWARD_SCALE,\n            dense_rewards: true,\n        }\n    }\n}\n\n/// Curriculum controller configuration.\n#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(default)]\npub struct CurriculumConfig {\n    /// Whether the curriculum controller is enabled.\n    pub enabled: bool,\n    /// Target success rate to maintain (0.0-1.0).\n    pub target_success_rate: f32,\n    /// Window size for computing rolling success rate.\n    pub window_size: u32,\n    /// Minimum episodes before adjusting difficulty.\n    pub warmup_episodes: u32,\n    /// How aggressively to adjust difficulty (learning rate).\n    pub adjustment_rate: f32,\n}\n\nimpl Default for CurriculumConfig {\n    fn default() -\u003e Self {\n        Self {\n            enabled: false,\n            target_success_rate: constants::DEFAULT_TARGET_SUCCESS_RATE,\n            window_size: constants::DEFAULT_CURRICULUM_WINDOW_SIZE,\n            warmup_episodes: constants::DEFAULT_CURRICULUM_WARMUP,\n            adjustment_rate: constants::DEFAULT_CURRICULUM_ADJUSTMENT_RATE,\n        }\n    }\n}\n\n/// Rendering and visualization configuration.\n#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(default)]\npub struct RenderConfig {\n    /// Whether to generate pixel observations (slower).\n    pub pixel_observations: bool,\n    /// Pixel observation width (if enabled).\n    pub pixel_width: u32,\n    /// Pixel observation height (if enabled).\n    pub pixel_height: u32,\n    /// Whether to record replays.\n    pub record_replays: bool,\n}\n\nimpl Default for RenderConfig {\n    fn default() -\u003e Self {\n        Self {\n            pixel_observations: false,\n            pixel_width: constants::DEFAULT_PIXEL_WIDTH,\n            pixel_height: constants::DEFAULT_PIXEL_HEIGHT,\n            record_replays: false,\n        }\n    }\n}\n\n/// Team configuration for multi-agent scenarios.\n#[derive(Debug, Clone, Default, Serialize, Deserialize, PartialEq)]\n#[non_exhaustive]\npub enum TeamStructure {\n    /// Every agent is independent.\n    #[default]\n    FreeForAll,\n    /// Fixed teams specified by team assignments.\n    FixedTeams(Vec\u003cVec\u003cu32\u003e\u003e),\n    /// Dynamic alliances formed through communication.\n    DynamicAlliances,\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_default_config_is_valid() {\n        let config = ForgeConfig::default();\n        assert!(config.world.width \u003e= config.world.min_dimension);\n        assert!(config.world.width \u003c= config.world.max_dimension);\n        assert!(config.world.height \u003e= config.world.min_dimension);\n        assert!(config.world.height \u003c= config.world.max_dimension);\n        assert!((0.0..=1.0).contains(\u0026config.world.resource_density));\n        assert!(config.agents.num_agents \u003e= 1);\n    }\n\n    #[test]\n    fn test_config_serialization_roundtrip() {\n        let config = ForgeConfig::default();\n        let json = serde_json::to_string(\u0026config).unwrap();\n        let deserialized: ForgeConfig = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(deserialized.world.width, config.world.width);\n        assert_eq!(deserialized.world.height, config.world.height);\n        assert_eq!(deserialized.world.seed, config.world.seed);\n        assert_eq!(deserialized.agents.num_agents, config.agents.num_agents);\n    }\n\n    #[test]\n    fn test_config_toml_roundtrip() {\n        let config = ForgeConfig::default();\n        let toml_str = toml::to_string(\u0026config).unwrap();\n        let deserialized: ForgeConfig = toml::from_str(\u0026toml_str).unwrap();\n        assert_eq!(deserialized.world.width, config.world.width);\n        assert_eq!(\n            deserialized.physics.collision_enabled,\n            config.physics.collision_enabled\n        );\n    }\n\n    #[test]\n    fn test_team_structure_variants() {\n        let ffa = TeamStructure::FreeForAll;\n        let fixed = TeamStructure::FixedTeams(vec![vec![0, 1], vec![2, 3]]);\n        let dynamic = TeamStructure::DynamicAlliances;\n\n        // Verify serialization works for all variants\n        for team in \u0026[ffa, fixed, dynamic] {\n            let json = serde_json::to_string(team).unwrap();\n            let _: TeamStructure = serde_json::from_str(\u0026json).unwrap();\n        }\n    }\n\n    #[test]\n    fn test_config_partial_json_deserialization() {\n        // Only set a few fields; everything else should get defaults\n        let json = r#\"{\"world\": {\"width\": 32, \"height\": 128}, \"agents\": {\"num_agents\": 4}}\"#;\n        let config: ForgeConfig = serde_json::from_str(json).unwrap();\n\n        // Explicitly set fields\n        assert_eq!(config.world.width, 32);\n        assert_eq!(config.world.height, 128);\n        assert_eq!(config.agents.num_agents, 4);\n\n        // Default-filled fields\n        let defaults = ForgeConfig::default();\n        assert_eq!(config.world.seed, defaults.world.seed);\n        assert_eq!(config.world.biome_scale, defaults.world.biome_scale);\n        assert_eq!(\n            config.world.resource_density,\n            defaults.world.resource_density\n        );\n        assert_eq!(\n            config.physics.collision_enabled,\n            defaults.physics.collision_enabled\n        );\n        assert_eq!(config.physics.friction, defaults.physics.friction);\n        assert_eq!(config.crafting.enabled, defaults.crafting.enabled);\n        assert_eq!(\n            config.crafting.max_ingredients,\n            defaults.crafting.max_ingredients\n        );\n        assert_eq!(config.task.max_tier, defaults.task.max_tier);\n        assert_eq!(\n            config.task.max_episode_length,\n            defaults.task.max_episode_length\n        );\n        assert_eq!(config.curriculum.enabled, defaults.curriculum.enabled);\n        assert_eq!(\n            config.rendering.pixel_observations,\n            defaults.rendering.pixel_observations\n        );\n    }\n\n    #[test]\n    fn test_all_configs_implement_default() {\n        let _world = WorldConfig::default();\n        let _physics = PhysicsConfig::default();\n        let _crafting = CraftingConfig::default();\n        let _agent = AgentConfig::default();\n        let _task = TaskConfig::default();\n        let _curriculum = CurriculumConfig::default();\n        let _render = RenderConfig::default();\n        let _forge = ForgeConfig::default();\n        let _team = TeamStructure::default();\n\n        // Verify sub-config defaults match constant values\n        let world = WorldConfig::default();\n        assert_eq!(world.width, constants::DEFAULT_WORLD_WIDTH);\n        assert_eq!(world.height, constants::DEFAULT_WORLD_HEIGHT);\n\n        let physics = PhysicsConfig::default();\n        assert_eq!(\n            physics.stamina_cost_move,\n            constants::DEFAULT_STAMINA_COST_MOVE\n        );\n        assert_eq!(physics.max_velocity, constants::DEFAULT_MAX_VELOCITY);\n\n        let crafting = CraftingConfig::default();\n        assert_eq!(crafting.max_ingredients, constants::DEFAULT_MAX_INGREDIENTS);\n\n        let agent = AgentConfig::default();\n        assert_eq!(agent.starting_health, constants::DEFAULT_STARTING_HEALTH);\n        assert_eq!(agent.max_stamina, constants::DEFAULT_MAX_STAMINA);\n\n        let task = TaskConfig::default();\n        assert_eq!(task.max_tier, constants::DEFAULT_MAX_TASK_TIER);\n        assert_eq!(task.reward_scale, constants::DEFAULT_REWARD_SCALE);\n\n        let curriculum = CurriculumConfig::default();\n        assert_eq!(\n            curriculum.target_success_rate,\n            constants::DEFAULT_TARGET_SUCCESS_RATE\n        );\n\n        let render = RenderConfig::default();\n        assert_eq!(render.pixel_width, constants::DEFAULT_PIXEL_WIDTH);\n        assert_eq!(render.pixel_height, constants::DEFAULT_PIXEL_HEIGHT);\n    }\n\n    #[test]\n    fn test_config_clone_equality() {\n        let original = ForgeConfig::default();\n        let cloned = original.clone();\n\n        // WorldConfig fields\n        assert_eq!(cloned.world.width, original.world.width);\n        assert_eq!(cloned.world.height, original.world.height);\n        assert_eq!(cloned.world.seed, original.world.seed);\n        assert_eq!(cloned.world.biome_scale, original.world.biome_scale);\n        assert_eq!(\n            cloned.world.resource_density,\n            original.world.resource_density\n        );\n        assert_eq!(\n            cloned.world.day_night_cycle_length,\n            original.world.day_night_cycle_length\n        );\n        assert_eq!(cloned.world.max_entities, original.world.max_entities);\n        assert_eq!(cloned.world.min_dimension, original.world.min_dimension);\n        assert_eq!(cloned.world.max_dimension, original.world.max_dimension);\n\n        // PhysicsConfig fields\n        assert_eq!(\n            cloned.physics.collision_enabled,\n            original.physics.collision_enabled\n        );\n        assert_eq!(\n            cloned.physics.stamina_cost_move,\n            original.physics.stamina_cost_move\n        );\n        assert_eq!(\n            cloned.physics.stamina_regen_rate,\n            original.physics.stamina_regen_rate\n        );\n        assert_eq!(cloned.physics.max_velocity, original.physics.max_velocity);\n        assert_eq!(cloned.physics.friction, original.physics.friction);\n        assert_eq!(\n            cloned.physics.projectiles_enabled,\n            original.physics.projectiles_enabled\n        );\n\n        // CraftingConfig fields\n        assert_eq!(cloned.crafting.enabled, original.crafting.enabled);\n        assert_eq!(\n            cloned.crafting.procedural_recipes,\n            original.crafting.procedural_recipes\n        );\n        assert_eq!(\n            cloned.crafting.max_ingredients,\n            original.crafting.max_ingredients\n        );\n        assert_eq!(\n            cloned.crafting.require_discovery,\n            original.crafting.require_discovery\n        );\n\n        // AgentConfig fields\n        assert_eq!(cloned.agents.num_agents, original.agents.num_agents);\n        assert_eq!(\n            cloned.agents.default_vision_radius,\n            original.agents.default_vision_radius\n        );\n        assert_eq!(\n            cloned.agents.default_carry_capacity,\n            original.agents.default_carry_capacity\n        );\n        assert_eq!(\n            cloned.agents.starting_health,\n            original.agents.starting_health\n        );\n        assert_eq!(cloned.agents.max_health, original.agents.max_health);\n        assert_eq!(\n            cloned.agents.starting_stamina,\n            original.agents.starting_stamina\n        );\n        assert_eq!(cloned.agents.max_stamina, original.agents.max_stamina);\n        assert_eq!(cloned.agents.heterogeneous, original.agents.heterogeneous);\n        assert_eq!(\n            cloned.agents.comm_vocab_size,\n            original.agents.comm_vocab_size\n        );\n        assert_eq!(cloned.agents.comm_radius, original.agents.comm_radius);\n        assert_eq!(\n            cloned.agents.comm_buffer_size,\n            original.agents.comm_buffer_size\n        );\n\n        // TaskConfig fields\n        assert_eq!(cloned.task.enabled, original.task.enabled);\n        assert_eq!(cloned.task.max_tier, original.task.max_tier);\n        assert_eq!(cloned.task.max_predicates, original.task.max_predicates);\n        assert_eq!(\n            cloned.task.max_episode_length,\n            original.task.max_episode_length\n        );\n        assert_eq!(cloned.task.reward_scale, original.task.reward_scale);\n        assert_eq!(cloned.task.dense_rewards, original.task.dense_rewards);\n\n        // CurriculumConfig fields\n        assert_eq!(cloned.curriculum.enabled, original.curriculum.enabled);\n        assert_eq!(\n            cloned.curriculum.target_success_rate,\n            original.curriculum.target_success_rate\n        );\n        assert_eq!(\n            cloned.curriculum.window_size,\n            original.curriculum.window_size\n        );\n        assert_eq!(\n            cloned.curriculum.warmup_episodes,\n            original.curriculum.warmup_episodes\n        );\n        assert_eq!(\n            cloned.curriculum.adjustment_rate,\n            original.curriculum.adjustment_rate\n        );\n\n        // RenderConfig fields\n        assert_eq!(\n            cloned.rendering.pixel_observations,\n            original.rendering.pixel_observations\n        );\n t per movement action (fixed-point ~0.1).\npub const DEFAULT_STAMINA_COST_MOVE: i32 = 6554; // ~0.1\n/// Default stamina regeneration rate per tick (fixed-point ~0.05).\npub const DEFAULT_STAMINA_REGEN_RATE: i32 = 3277; // ~0.05\n/// Default maximum velocity in tiles per tick (fixed-point 1.0).\npub const DEFAULT_MAX_VELOCITY: i32 = 65536; // 1.0 tile/tick\n/// Default friction coefficient (fixed-point ~0.8).\npub const DEFAULT_FRICTION: i32 = 52429; // ~0.8\n\n/// Default number of agents.\npub const DEFAULT_NUM_AGENTS: u32 = 1;\n/// Default agent vision radius in tiles.\npub const DEFAULT_VISION_RADIUS: u8 = 5;\n/// Default agent inventory carry capacity.\npub const DEFAULT_CARRY_CAPACITY: u8 = 10;\n/// Default starting health (fixed-point 10.0).\npub const DEFAULT_STARTING_HEALTH: i32 = 655360; // 10.0\n/// Default maximum health (fixed-point 10.0).\npub const DEFAULT_MAX_HEALTH: i32 = 655360; // 10.0\n/// Default starting stamina (fixed-point 10.0).\npub const DEFAULT_STARTING_STAMINA: i32 = 655360; // 10.0\n/// Default maximum stamina (fixed-point 10.0).\npub const DEFAULT_MAX_STAMINA: i32 = 655360; // 10.0\n/// Default communication vocabulary size.\npub const DEFAULT_COMM_VOCAB_SIZE: u16 = 16;\n/// Default communication broadcast radius.\npub const DEFAULT_COMM_RADIUS: u16 = 10;\n/// Default communication buffer size per agent.\npub const DEFAULT_COMM_BUFFER_SIZE: u8 = 8;\n\n/// Default maximum number of ingredients per crafting recipe.\npub const DEFAULT_MAX_INGREDIENTS: u8 = 4;\n\n/// Default maximum task difficulty tier.\npub const DEFAULT_MAX_TASK_TIER: u8 = 6;\n/// Default maximum number of predicates per task.\npub const DEFAULT_MAX_PREDICATES: u16 = 32;\n/// Default maximum episode length in ticks.\npub const DEFAULT_MAX_EPISODE_LENGTH: u64 = 10000;\n/// Default reward scaling factor.\npub const DEFAULT_REWARD_SCALE: f32 = 1.0;\n\n/// Default target success rate for curriculum advancement.\npub const DEFAULT_TARGET_SUCCESS_RATE: f32 = 0.5;\n/// Default sliding window size for curriculum statistics.\npub const DEFAULT_CURRICULUM_WINDOW_SIZE: u32 = 100;\n/// Default number of warmup episodes before curriculum adapts.\npub const DEFAULT_CURRICULUM_WARMUP: u32 = 50;\n/// Default rate of curriculum difficulty adjustment.\npub const DEFAULT_CURRICULUM_ADJUSTMENT_RATE: f32 = 0.1;\n\n/// Default render output width in pixels.\npub const DEFAULT_PIXEL_WIDTH: u32 = 64;\n/// Default render output height in pixels.\npub const DEFAULT_PIXEL_HEIGHT: u32 = 64;\n\n/// Default inventory size (number of slots).\npub const DEFAULT_INVENTORY_SIZE: usize = 10;\n/// Maximum items per inventory stack.\npub const MAX_STACK_SIZE: u16 = 64;\n\n/// Default ticks between resource respawn increments.\npub const DEFAULT_RESOURCE_RESPAWN_TICKS: u32 = 100;\n\n/// Number of terrain types (for observation encoding).\npub const NUM_TERRAIN_TYPES: usize = 8;\n\n/// Default damage dealt by a sword attack per hit.\npub const DEFAULT_SWORD_DAMAGE: i32 = 196608; // 3.0\n/// Default damage per tick from standing on lava.\npub const DEFAULT_LAVA_DAMAGE: i32 = 65536; // 1.0\n\n/// Number of cardinal directions.\npub const NUM_DIRECTIONS: usize = 4;\n\n/// Number of fractional bits in fixed-point representation (16 bits).\npub const FIXED_POINT_SHIFT: u32 = 16;\n/// 1.0 in fixed-point representation.\npub const FIXED_POINT_ONE: i32 = 1 \u003c\u003c FIXED_POINT_SHIFT; // 65536\n\n/// Sentinel value for \"no object\" in observation encoding.\npub const OBS_NO_OBJECT: u8 = 255;\n/// Sentinel value for \"no resource\" in observation encoding.\npub const OBS_NO_RESOURCE: u8 = 255;\n/// Sentinel value for empty inventory slot item type.\npub const OBS_EMPTY_SLOT_ITEM: u8 = 255;\n\n/// Dawn phase index.\npub const DAY_PHASE_DAWN: u8 = 0;\n/// Day phase index.\npub const DAY_PHASE_DAY: u8 = 1;\n/// Dusk phase index.\npub const DAY_PHASE_DUSK: u8 = 2;\n/// Night phase index.\npub const DAY_PHASE_NIGHT: u8 = 3;\n/// Number of day/night phases.\npub const NUM_DAY_PHASES: u8 = 4;\n\n/// Vision multiplier during day.\npub const VISION_MODIFIER_DAY: f32 = 1.0;\n/// Vision multiplier during dawn/dusk.\npub const VISION_MODIFIER_TWILIGHT: f32 = 0.75;\n/// Vision multiplier during night.\npub const VISION_MODIFIER_NIGHT: f32 = 0.5;\n\n/// Number of features per tile in grid observation encoding.\npub const OBS_FEATURES_PER_TILE: usize = 7;\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_fixed_point_one_equals_shift() {\n        assert_eq!(FIXED_POINT_ONE, 1 \u003c\u003c FIXED_POINT_SHIFT);\n        assert_eq!(FIXED_POINT_ONE, 65536);\n    }\n\n    #[test]\n    fn test_starting_health_equals_max_health() {\n        assert_eq!(DEFAULT_STARTING_HEALTH, DEFAULT_MAX_HEALTH);\n    }\n\n    #[test]\n    fn test_starting_stamina_equals_max_stamina() {\n        assert_eq!(DEFAULT_STARTING_STAMINA, DEFAULT_MAX_STAMINA);\n    }\n\n    #[test]\n    fn test_num_day_phases() {\n        assert_eq!(NUM_DAY_PHASES, 4);\n    }\n\n    #[test]\n    fn test_min_less_than_max_world_dimension() {\n        const { assert!(MIN_WORLD_DIMENSION \u003c MAX_WORLD_DIMENSION) };\n    }\n\n    #[test]\n    fn test_default_world_dimensions_within_range() {\n        const { assert!(DEFAULT_WORLD_WIDTH \u003e= MIN_WORLD_DIMENSION) };\n        const { assert!(DEFAULT_WORLD_WIDTH \u003c= MAX_WORLD_DIMENSION) };\n        const { assert!(DEFAULT_WORLD_HEIGHT \u003e= MIN_WORLD_DIMENSION) };\n        const { assert!(DEFAULT_WORLD_HEIGHT \u003c= MAX_WORLD_DIMENSION) };\n    }\n\n    #[test]\n    fn test_obs_features_per_tile() {\n        assert_eq!(OBS_FEATURES_PER_TILE, 7);\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-types","src","entity.rs"],"content":"//! Entity types: agents, objects, and their properties.\n//!\n//! Entities are the dynamic actors in the FORGE world. Agents are player-controlled\n//! or AI-controlled entities. Objects are interactive world elements.\n\nuse serde::{Deserialize, Serialize};\nuse smallvec::SmallVec;\n\nuse crate::grid::Position;\nuse crate::resource::ItemType;\n\n/// Unique identifier for an agent.\npub type AgentId = u32;\n\n/// Unique identifier for an object.\npub type ObjectId = u32;\n\n/// Unique identifier for a team.\npub type TeamId = u8;\n\n/// Communication token — a discrete symbol from the vocabulary.\npub type CommToken = u16;\n\n/// An agent in the simulation.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Agent {\n    /// Unique agent identifier.\n    pub id: AgentId,\n    /// Current grid position.\n    pub position: Position,\n    /// Current health (fixed-point i32, 16 fractional bits).\n    pub health: i32,\n    /// Current stamina (fixed-point i32, 16 fractional bits).\n    pub stamina: i32,\n    /// Agent's inventory.\n    pub inventory: Inventory,\n    /// Team assignment.\n    pub team: TeamId,\n    /// Vision radius in tiles.\n    pub vision_radius: u8,\n    /// Maximum inventory slots.\n    pub carry_capacity: u8,\n    /// Recent communication messages received.\n    pub comm_buffer: SmallVec\u003c[CommToken; 8]\u003e,\n    /// Agent capabilities (may differ in heterogeneous mode).\n    pub capabilities: AgentCapabilities,\n    /// Whether this agent is alive.\n    pub alive: bool,\n}\n\nimpl Agent {\n    /// Creates a new agent with default capabilities at the given position.\n    pub fn new(id: AgentId, position: Position, config: \u0026crate::config::AgentConfig) -\u003e Self {\n        Self {\n            id,\n            position,\n            health: config.starting_health,\n            stamina: config.starting_stamina,\n            inventory: Inventory::new(config.default_carry_capacity as usize),\n            team: 0,\n            vision_radius: config.default_vision_radius,\n            carry_capacity: config.default_carry_capacity,\n            comm_buffer: SmallVec::new(),\n            capabilities: AgentCapabilities::default(),\n            alive: true,\n        }\n    }\n\n    /// Whether the agent can perform actions (alive and has stamina).\n    pub fn can_act(\u0026self) -\u003e bool {\n        self.alive \u0026\u0026 self.stamina \u003e 0\n    }\n}\n\n/// Capabilities that may vary between heterogeneous agents.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct AgentCapabilities {\n    /// Movement speed multiplier (fixed-point). 65536 = 1.0x.\n    pub speed_multiplier: i32,\n    /// Crafting skill level (affects which recipes are available).\n    pub crafting_level: u8,\n    /// Whether this agent can communicate.\n    pub can_communicate: bool,\n    /// Whether this agent can trade.\n    pub can_trade: bool,\n}\n\nimpl Default for AgentCapabilities {\n    fn default() -\u003e Self {\n        Self {\n            speed_multiplier: 65536, // 1.0x\n            crafting_level: 1,\n            can_communicate: true,\n            can_trade: true,\n        }\n    }\n}\n\n/// An agent's inventory, storing item stacks.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Inventory {\n    /// Item slots. Each slot can hold a stack of one item type.\n    pub slots: Vec\u003cOption\u003cItemStack\u003e\u003e,\n}\n\nimpl Inventory {\n    /// Creates a new empty inventory with the given capacity.\n    pub fn new(capacity: usize) -\u003e Self {\n        Self {\n            slots: vec![None; capacity],\n        }\n    }\n\n    /// Returns the number of slots.\n    pub fn capacity(\u0026self) -\u003e usize {\n        self.slots.len()\n    }\n\n    /// Returns the number of occupied slots.\n    pub fn occupied_slots(\u0026self) -\u003e usize {\n        self.slots.iter().filter(|s| s.is_some()).count()\n    }\n\n    /// Whether the inventory is full.\n    pub fn is_full(\u0026self) -\u003e bool {\n        self.occupied_slots() \u003e= self.capacity()\n    }\n\n    /// Attempts to add an item. Returns true if successful.\n    pub fn add_item(\u0026mut self, item_type: ItemType, count: u16) -\u003e bool {\n        // First, try to stack with existing items of the same type\n        for stack in self.slots.iter_mut().flatten() {\n            if stack.item_type == item_type {\n                let space = crate::constants::MAX_STACK_SIZE - stack.count;\n                if space \u003e= count {\n                    stack.count += count;\n                    return true;\n                }\n            }\n        }\n        // Otherwise, find an empty slot\n        for slot in self.slots.iter_mut() {\n            if slot.is_none() {\n                *slot = Some(ItemStack { item_type, count });\n                return true;\n            }\n        }\n        false\n    }\n\n    /// Removes items from inventory. Returns true if successful.\n    pub fn remove_item(\u0026mut self, item_type: ItemType, count: u16) -\u003e bool {\n        if self.count_item(item_type) \u003c count {\n            return false;\n        }\n        let mut remaining = count;\n        for slot in self.slots.iter_mut() {\n            if remaining == 0 {\n                break;\n            }\n            if let Some(stack) = slot {\n                if stack.item_type == item_type {\n                    let take = remaining.min(stack.count);\n                    stack.count -= take;\n                    remaining -= take;\n                    if stack.count == 0 {\n                        *slot = None;\n                    }\n                }\n            }\n        }\n        remaining == 0\n    }\n\n    /// Counts total items of a given type across all slots.\n    pub fn count_item(\u0026self, item_type: ItemType) -\u003e u16 {\n        self.slots\n            .iter()\n            .filter_map(|s| s.as_ref())\n            .filter(|s| s.item_type == item_type)\n            .map(|s| s.count)\n            .sum()\n    }\n\n    /// Returns the item stack at a given slot index.\n    pub fn get_slot(\u0026self, index: usize) -\u003e Option\u003c\u0026ItemStack\u003e {\n        self.slots.get(index).and_then(|s| s.as_ref())\n    }\n\n    /// Whether the inventory contains at least `count` of the given item.\n    pub fn has_item(\u0026self, item_type: ItemType, count: u16) -\u003e bool {\n        self.count_item(item_type) \u003e= count\n    }\n}\n\n/// A stack of items in an inventory slot.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\npub struct ItemStack {\n    /// The type of item.\n    pub item_type: ItemType,\n    /// Number of items in this stack.\n    pub count: u16,\n}\n\n/// An interactive object in the world.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Object {\n    /// Unique object identifier.\n    pub id: ObjectId,\n    /// Grid position.\n    pub position: Position,\n    /// The type of object.\n    pub object_type: ObjectType,\n    /// Mass (fixed-point). Affects pushability.\n    pub mass: i32,\n    /// Durability (fixed-point). 0 = destroyed.\n    pub durability: i32,\n    /// Current object state.\n    pub state: ObjectState,\n}\n\n/// Types of interactive objects.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash, Serialize, Deserialize)]\n#[non_exhaustive]\n#[repr(u8)]\npub enum ObjectType {\n    /// Heavy pushable boulder.\n    Boulder = 0,\n    /// Openable/closeable door.\n    Door = 1,\n    /// Toggleable switch or lever.\n    Switch = 2,\n    /// Storage container for items.\n    Container = 3,\n    /// Station required for advanced crafting recipes.\n    CraftingStation = 4,\n    /// Placeable bridge for crossing water.\n    Bridge = 5,\n    /// Floor-activated pressure plate.\n    PressurePlate = 6,\n    /// Light-emitting torch object.\n    Torch = 7,\n}\n\n/// State of an object.\n#[derive(Debug, Clone, Copy, Default, PartialEq, Eq, Serialize, Deserialize)]\n#[non_exhaustive]\npub enum ObjectState {\n    /// Default active state.\n    #[default]\n    Active,\n    /// Inactive / off.\n    Inactive,\n    /// Open (for doors, containers).\n    Open,\n    /// Closed (for doors, containers).\n    Closed,\n    /// Destroyed / broken.\n    Destroyed,\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::config::AgentConfig;\n\n    #[test]\n    fn test_agent_creation() {\n        let config = AgentConfig::default();\n        let agent = Agent::new(0, Position::new(5, 5), \u0026config);\n        assert_eq!(agent.id, 0);\n        assert_eq!(agent.position, Position::new(5, 5));\n        assert!(agent.alive);\n        assert!(agent.can_act());\n    }\n\n    #[test]\n    fn test_inventory_add_remove() {\n        let mut inv = Inventory::new(3);\n        assert!(inv.add_item(ItemType::Wood, 5));\n        assert_eq!(inv.count_item(ItemType::Wood), 5);\n\n        assert!(inv.remove_item(ItemType::Wood, 3));\n        assert_eq!(inv.count_item(ItemType::Wood), 2);\n\n        assert!(!inv.remove_item(ItemType::Wood, 10)); // not enough\n        assert_eq!(inv.count_item(ItemType::Wood), 2); // unchanged\n    }\n\n    #[test]\n    fn test_inventory_full() {\n        let mut inv = Inventory::new(2);\n        assert!(inv.add_item(ItemType::Wood, 1));\n        assert!(inv.add_item(ItemType::Stone, 1));\n        assert!(inv.is_full());\n        assert!(!inv.add_item(ItemType::Ore, 1)); // full\n    }\n\n    #[test]\n    fn test_inventory_stacking() {\n        let mut inv = Inventory::new(2);\n        assert!(inv.add_item(ItemType::Wood, 3));\n        assert!(inv.add_item(ItemType::Wood, 5));\n        assert_eq!(inv.count_item(ItemType::Wood), 8);\n        assert_eq!(inv.occupied_slots(), 1); // stacked into one slot\n    }\n\n    #[test]\n    fn test_inventory_has_item() {\n        let mut inv = Inventory::new(5);\n        inv.add_item(ItemType::Stone, 10);\n        assert!(inv.has_item(ItemType::Stone, 5));\n        assert!(inv.has_item(ItemType::Stone, 10));\n        assert!(!inv.has_item(ItemType::Stone, 11));\n        assert!(!inv.has_item(ItemType::Wood, 1));\n    }\n\n    #[test]\n    fn test_object_state() {\n        let obj = Object {\n            id: 0,\n            position: Position::new(1, 1),\n            object_type: ObjectType::Door,\n            mass: 65536,\n            durability: 655360,\n            state: ObjectState::Closed,\n        };\n        assert_eq!(obj.state, ObjectState::Closed);\n    }\n\n    #[test]\n    fn test_agent_capabilities_default() {\n        let caps = AgentCapabilities::default();\n        assert_eq!(caps.speed_multiplier, 65536);\n        assert!(caps.can_communicate);\n        assert!(caps.can_trade);\n    }\n\n    #[test]\n    fn test_inventory_capacity() {\n        let inv = Inventory::new(5);\n        assert_eq!(inv.capacity(), 5);\n\n        let inv_zero = Inventory::new(0);\n        assert_eq!(inv_zero.capacity(), 0);\n\n        let inv_large = Inventory::new(100);\n        assert_eq!(inv_large.capacity(), 100);\n    }\n\n    #[test]\n    fn test_inventory_occupied_slots() {\n        let mut inv = Inventory::new(5);\n        assert_eq!(inv.occupied_slots(), 0);\n\n        inv.add_item(ItemType::Wood, 1);\n        assert_eq!(inv.occupied_slots(), 1);\n\n        inv.add_item(ItemType::Stone, 2);\n        assert_eq!(inv.occupied_slots(), 2);\n\n        inv.add_item(ItemType::Ore, 3);\n        assert_eq!(inv.occupied_slots(), 3);\n    }\n\n    #[test]\n    fn test_inventory_get_slot() {\n        let mut inv = Inventory::new(3);\n        inv.add_item(ItemType::Wood, 5);\n\n        // Valid index with an item returns Some.\n        let slot0 = inv.get_slot(0);\n        assert!(slot0.is_some());\n        let stack = slot0.unwrap();\n        assert_eq!(stack.item_type, ItemType::Wood);\n        assert_eq!(stack.count, 5);\n\n        // Valid index but empty slot returns None.\n        assert!(inv.get_slot(1).is_none());\n\n        // Invalid index (out of bounds) returns None.\n        assert!(inv.get_slot(10).is_none());\n    }\n\n    #[test]\n    fn test_inventory_empty() {\n        let mut inv = Inventory::new(0);\n        assert_eq!(inv.capacity(), 0);\n        assert!(inv.is_full());\n        // Adding an item to a zero-capacity inventory should fail gracefully.\n        assert!(!inv.add_item(ItemType::Wood, 1));\n        assert_eq!(inv.occupied_slots(), 0);\n        assert_eq!(inv.count_item(ItemType::Wood), 0);\n    }\n}\n","traces":[{"line":53,"address":[1788806,1788384,1788800],"length":1,"stats":{"Line":15}},{"line":57,"address":[8269882],"length":1,"stats":{"Line":19}},{"line":58,"address":[8107458],"length":1,"stats":{"Line":15}},{"line":59,"address":[6340090],"length":1,"stats":{"Line":19}},{"line":61,"address":[1788496],"length":1,"stats":{"Line":19}},{"line":62,"address":[6340124],"length":1,"stats":{"Line":19}},{"line":63,"address":[6190052],"length":1,"stats":{"Line":17}},{"line":64,"address":[1788657,1788561],"length":1,"stats":{"Line":34}},{"line":70,"address":[8270272],"length":1,"stats":{"Line":1}},{"line":71,"address":[8107850],"length":1,"stats":{"Line":1}},{"line":108,"address":[8124960],"length":1,"stats":{"Line":15}},{"line":110,"address":[8540342],"length":1,"stats":{"Line":18}},{"line":115,"address":[6341856],"length":1,"stats":{"Line":5}},{"line":116,"address":[6341861],"length":1,"stats":{"Line":5}},{"line":120,"address":[8540256],"length":1,"stats":{"Line":4}},{"line":121,"address":[8140014,8140000],"length":1,"stats":{"Line":12}},{"line":125,"address":[6191168],"length":1,"stats":{"Line":3}},{"line":126,"address":[6341261],"length":1,"stats":{"Line":3}},{"line":130,"address":[8540480],"length":1,"stats":{"Line":7}},{"line":132,"address":[8540594,8540523],"length":1,"stats":{"Line":14}},{"line":133,"address":[8125308],"length":1,"stats":{"Line":4}},{"line":134,"address":[8540932,8540880],"length":1,"stats":{"Line":2}},{"line":135,"address":[1790064],"length":1,"stats":{"Line":2}},{"line":136,"address":[6191749,6191707],"length":1,"stats":{"Line":2}},{"line":137,"address":[8109195],"length":1,"stats":{"Line":2}},{"line":142,"address":[6341529,6341575],"length":1,"stats":{"Line":14}},{"line":143,"address":[8540817],"length":1,"stats":{ :Error;\n\n/// Top-level error type for FORGE operations.\n#[derive(Debug, Error)]\npub enum ForgeError {\n    /// An error occurred during world generation.\n    #[error(\"world generation error: {0}\")]\n    WorldGen(#[from] WorldGenError),\n\n    /// An error occurred during simulation stepping.\n    #[error(\"simulation error: {0}\")]\n    Simulation(#[from] SimulationError),\n\n    /// An error occurred with configuration.\n    #[error(\"configuration error: {0}\")]\n    Config(#[from] ConfigError),\n\n    /// An error occurred during serialization/deserialization.\n    #[error(\"serialization error: {0}\")]\n    Serialization(String),\n\n    /// An error occurred in the task system.\n    #[error(\"task error: {0}\")]\n    Task(#[from] TaskError),\n}\n\n/// Errors that can occur during world generation.\n#[derive(Debug, Error)]\npub enum WorldGenError {\n    /// The world dimensions are invalid.\n    #[error(\"invalid world dimensions: {width}x{height} (min: {min_size}, max: {max_size})\")]\n    InvalidDimensions {\n        /// Requested world width.\n        width: u16,\n        /// Requested world height.\n        height: u16,\n        /// Minimum allowed dimension.\n        min_size: u16,\n        /// Maximum allowed dimension.\n        max_size: u16,\n    },\n\n    /// Resource density is out of range.\n    #[error(\"resource density {0} out of range [0.0, 1.0]\")]\n    InvalidResourceDensity(f32),\n\n    /// Too many entities requested for the world size.\n    #[error(\"max entities {requested} exceeds capacity for {width}x{height} world\")]\n    TooManyEntities {\n        /// Number of entities requested.\n        requested: u16,\n        /// World width in tiles.\n        width: u16,\n        /// World height in tiles.\n        height: u16,\n    },\n}\n\n/// Errors that can occur during simulation stepping.\n#[derive(Debug, Error)]\npub enum SimulationError {\n    /// An invalid action was submitted.\n    #[error(\"invalid action for agent {agent_id}: {reason}\")]\n    InvalidAction {\n        /// ID of the agent that submitted the action.\n        agent_id: u32,\n        /// Description of why the action was invalid.\n        reason: String,\n    },\n\n    /// Wrong number of actions provided.\n    #[error(\"expected {expected} actions, got {got}\")]\n    ActionCountMismatch {\n        /// Expected number of actions.\n        expected: usize,\n        /// Actual number of actions received.\n        got: usize,\n    },\n\n    /// Agent referenced does not exist.\n    #[error(\"agent {0} not found\")]\n    AgentNotFound(u32),\n\n    /// The simulation is in a terminal state.\n    #[error(\"simulation has terminated, call reset()\")]\n    AlreadyTerminated,\n\n    /// Inventory operation failed.\n    #[error(\"inventory error for agent {agent_id}: {reason}\")]\n    InventoryError {\n        /// ID of the agent whose inventory operation failed.\n        agent_id: u32,\n        /// Description of the inventory error.\n        reason: String,\n    },\n}\n\n/// Errors related to configuration.\n#[derive(Debug, Error)]\npub enum ConfigError {\n    /// A configuration value is out of its valid range.\n    #[error(\"config field '{field}': value {value} out of range [{min}, {max}]\")]\n    OutOfRange {\n        /// Name of the configuration field.\n        field: String,\n        /// The invalid value that was provided.\n        value: String,\n        /// Minimum allowed value.\n        min: String,\n        /// Maximum allowed value.\n        max: String,\n    },\n\n    /// Configuration deserialization failed.\n    #[error(\"failed to parse config: {0}\")]\n    ParseError(String),\n}\n\n/// Errors in the task system.\n#[derive(Debug, Error)]\npub enum TaskError {\n    /// A predicate references an invalid entity.\n    #[error(\"predicate references unknown entity: {0}\")]\n    UnknownEntity(String),\n\n    /// Task composition is invalid.\n    #[error(\"invalid task composition: {0}\")]\n    InvalidComposition(String),\n\n    /// Task difficulty is out of range.\n    #[error(\"task difficulty {0} out of range [1, 6]\")]\n    InvalidDifficulty(u8),\n}\n\n/// Result type alias for FORGE operations.\npub type ForgeResult\u003cT\u003e = Result\u003cT, ForgeError\u003e;\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_error_display() {\n        let err = SimulationError::InvalidAction {\n            agent_id: 0,\n            reason: \"cannot move into wall\".to_string(),\n        };\n        assert!(err.to_string().contains(\"agent 0\"));\n        assert!(err.to_string().contains(\"cannot move into wall\"));\n    }\n\n    #[test]\n    fn test_error_conversion() {\n        let sim_err = SimulationError::AgentNotFound(5);\n        let forge_err: ForgeError = sim_err.into();\n        assert!(matches!(forge_err, ForgeError::Simulation(_)));\n    }\n\n    #[test]\n    fn test_config_error_display() {\n        let config_err = ConfigError::OutOfRange {\n            field: \"width\".to_string(),\n            value: \"999\".to_string(),\n            min: \"8\".to_string(),\n            max: \"256\".to_string(),\n        };\n        let forge_err: ForgeError = config_err.into();\n        let msg = forge_err.to_string();\n        assert!(msg.contains(\"configuration error\"));\n        assert!(msg.contains(\"width\"));\n        assert!(msg.contains(\"999\"));\n        assert!(msg.contains(\"8\"));\n        assert!(msg.contains(\"256\"));\n    }\n\n    #[test]\n    fn test_serialization_error_display() {\n        let forge_err = ForgeError::Serialization(\"invalid JSON at line 5\".to_string());\n        let msg = forge_err.to_string();\n        assert!(msg.contains(\"serialization error\"));\n        assert!(msg.contains(\"invalid JSON at line 5\"));\n    }\n\n    #[test]\n    fn test_forge_result_ok() {\n        let result: ForgeResult\u003cu32\u003e = Ok(42);\n        assert!(result.is_ok());\n        assert!(matches!(result, Ok(42)));\n    }\n\n    #[test]\n    fn test_forge_result_err() {\n        let result: ForgeResult\u003cu32\u003e = Err(ForgeError::Serialization(\"bad data\".to_string()));\n        assert!(result.is_err());\n        assert!(matches!(result, Err(ForgeError::Serialization(_))));\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-types","src","grid.rs"],"content":"//! Grid, tile, and coordinate types for the FORGE world representation.\n//!\n//! The grid is stored as a flat row-major array for cache-friendly access.\n//! All coordinate types are compact for minimal memory footprint.\n\nuse serde::{Deserialize, Serialize};\n\n/// A 2D position on the grid.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash, Serialize, Deserialize)]\npub struct Position {\n    /// Horizontal coordinate (column).\n    pub x: u16,\n    /// Vertical coordinate (row).\n    pub y: u16,\n}\n\nimpl Position {\n    /// Creates a new position.\n    pub fn new(x: u16, y: u16) -\u003e Self {\n        Self { x, y }\n    }\n\n    /// Computes Manhattan distance to another position.\n    pub fn manhattan_distance(\u0026self, other: \u0026Position) -\u003e u32 {\n        let dx = (self.x as i32 - other.x as i32).unsigned_abs();\n        let dy = (self.y as i32 - other.y as i32).unsigned_abs();\n        dx + dy\n    }\n\n    /// Returns the position offset by a direction, if within bounds.\n    pub fn offset(\u0026self, dir: Direction, width: u16, height: u16) -\u003e Option\u003cPosition\u003e {\n        match dir {\n            Direction::Up if self.y \u003e 0 =\u003e Some(Position::new(self.x, self.y - 1)),\n            Direction::Down if self.y + 1 \u003c height =\u003e Some(Position::new(self.x, self.y + 1)),\n            Direction::Left if self.x \u003e 0 =\u003e Some(Position::new(self.x - 1, self.y)),\n            Direction::Right if self.x + 1 \u003c width =\u003e Some(Position::new(self.x + 1, self.y)),\n            _ =\u003e None,\n        }\n    }\n}\n\n/// Cardinal directions for movement and facing.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash, Serialize, Deserialize)]\n#[repr(u8)]\npub enum Direction {\n    /// Upward (decreasing y).\n    Up = 0,\n    /// Downward (increasing y).\n    Down = 1,\n    /// Leftward (decreasing x).\n    Left = 2,\n    /// Rightward (increasing x).\n    Right = 3,\n}\n\nimpl Direction {\n    /// Returns all four cardinal directions.\n    pub fn all() -\u003e [Direction; 4] {\n        [\n            Direction::Up,\n            Direction::Down,\n            Direction::Left,\n            Direction::Right,\n        ]\n    }\n\n    /// Returns the opposite direction.\n    pub fn opposite(\u0026self) -\u003e Direction {\n        match self {\n            Direction::Up =\u003e Direction::Down,\n            Direction::Down =\u003e Direction::Up,\n            Direction::Left =\u003e Direction::Right,\n            Direction::Right =\u003e Direction::Left,\n        }\n    }\n\n    /// Converts from a u8 index (0-3).\n    pub fn from_index(index: u8) -\u003e Option\u003cDirection\u003e {\n        match index {\n            0 =\u003e Some(Direction::Up),\n            1 =\u003e Some(Direction::Down),\n            2 =\u003e Some(Direction::Left),\n            3 =\u003e Some(Direction::Right),\n            _ =\u003e None,\n        }\n    }\n}\n\n/// Terrain types that make up the world grid.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash, Serialize, Deserialize)]\n#[non_exhaustive]\n#[repr(u8)]\npub enum TerrainType {\n    /// Normal walkable ground.\n    Ground = 0,\n    /// Impassable water terrain.\n    Water = 1,\n    /// Impassable wall (blocks vision).\n    Wall = 2,\n    /// Damaging lava terrain.\n    Lava = 3,\n    /// Slippery ice (reduced stamina cost).\n    Ice = 4,\n    /// Sandy terrain (increased stamina cost).\n    Sand = 5,\n    /// Dense forest (high stamina cost).\n    Forest = 6,\n    /// Impassable mountain (blocks vision).\n    Mountain = 7,\n}\n\nimpl TerrainType {\n    /// Whether agents can walk on this terrain.\n    pub fn is_walkable(\u0026self) -\u003e bool {\n        matches!(\n            self,\n            TerrainType::Ground | TerrainType::Ice | TerrainType::Sand | TerrainType::Forest\n        )\n    }\n\n    /// Movement cost multiplier (fixed-point). Higher = more stamina drain.\n    /// 65536 = 1.0x cost (normal), 131072 = 2.0x cost, etc.\n    pub fn movement_cost(\u0026self) -\u003e i32 {\n        match self {\n            TerrainType::Ground =\u003e 65536,  // 1.0x\n            TerrainType::Ice =\u003e 32768,     // 0.5x (slippery, less stamina)\n            TerrainType::Sand =\u003e 98304,    // 1.5x\n            TerrainType::Forest =\u003e 131072, // 2.0x\n            // Non-walkable terrains return max cost\n            _ =\u003e i32::MAX,\n        }\n    }\n\n    /// Whether this terrain blocks line-of-sight.\n    pub fn blocks_vision(\u0026self) -\u003e bool {\n        matches!(self, TerrainType::Wall | TerrainType::Mountain)\n    }\n\n    /// Converts from a u8 discriminant.\n    pub fn from_u8(value: u8) -\u003e Option\u003cTerrainType\u003e {\n        match value {\n            0 =\u003e Some(TerrainType::Ground),\n            1 =\u003e Some(TerrainType::Water),\n            2 =\u003e Some(TerrainType::Wall),\n            3 =\u003e Some(TerrainType::Lava),\n            4 =\u003e Some(TerrainType::Ice),\n            5 =\u003e Some(TerrainType::Sand),\n            6 =\u003e Some(TerrainType::Forest),\n            7 =\u003e Some(TerrainType::Mountain),\n            _ =\u003e None,\n        }\n    }\n}\n\n/// Visibility state for fog-of-war.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[non_exhaustive]\n#[repr(u8)]\npub enum VisibilityState {\n    /// Never been seen.\n    Hidden = 0,\n    /// Previously seen but not currently visible.\n    Explored = 1,\n    /// Currently visible to at least one agent.\n    Visible = 2,\n}\n\n/// A single tile in the world grid.\n#[derive(Debug, Clone, Copy, Serialize, Deserialize)]\npub struct Tile {\n    /// The terrain type of this tile.\n    pub terrain: TerrainType,\n    /// Elevation (0-255). Affects visibility and terrain generation.\n    pub elevation: u8,\n    /// Agent occupying this tile, if any.\n    pub agent_id: Option\u003cu32\u003e,\n    /// Object on this tile, if any.\n    pub object_id: Option\u003cu32\u003e,\n    /// Resource node at this tile, if any.\n    pub resource_id: Option\u003cu32\u003e,\n    /// Fog-of-war visibility state.\n    pub visibility: VisibilityState,\n}\n\nimpl Default for Tile {\n    fn default() -\u003e Self {\n        Self {\n            terrain: TerrainType::Ground,\n            elevation: 0,\n            agent_id: None,\n            object_id: None,\n            resource_id: None,\n            visibility: VisibilityState::Hidden,\n        }\n    }\n}\n\n/// The 2D grid representing the world.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Grid {\n    /// Width of the grid in tiles.\n    pub width: u16,\n    /// Height of the grid in tiles.\n    pub height: u16,\n    /// Flat row-major array of tiles. Index = y * width + x.\n    pub tiles: Vec\u003cTile\u003e,\n}\n\nimpl Grid {\n    /// Creates a new grid filled with the default tile.\n    pub fn new(width: u16, height: u16) -\u003e Self {\n        let size = width as usize * height as usize;\n        Self {\n            width,\n            height,\n            tiles: vec![Tile::default(); size],\n        }\n    }\n\n    /// Returns the tile at (x, y), or None if out of bounds.\n    #[inline]\n    pub fn get(\u0026self, x: u16, y: u16) -\u003e Option\u003c\u0026Tile\u003e {\n        if x \u003c self.width \u0026\u0026 y \u003c self.height {\n            Some(\u0026self.tiles[y as usize * self.width as usize + x as usize])\n        } else {\n            None\n        }\n    }\n\n    /// Returns a mutable reference to the tile at (x, y), or None if out of bounds.\n    #[inline]\n    pub fn get_mut(\u0026mut self, x: u16, y: u16) -\u003e Option\u003c\u0026mut Tile\u003e {\n        if x \u003c self.width \u0026\u0026 y \u003c self.height {\n            let idx = y as usize * self.width as usize + x as usize;\n            Some(\u0026mut self.tiles[idx])\n        } else {\n            None\n        }\n    }\n\n    /// Returns the tile at a Position.\n    #[inline]\n    pub fn get_pos(\u0026self, pos: \u0026Position) -\u003e Option\u003c\u0026Tile\u003e {\n        self.get(pos.x, pos.y)\n    }\n\n    /// Returns a mutable reference to the tile at a Position.\n    #[inline]\n    pub fn get_pos_mut(\u0026mut self, pos: \u0026Position) -\u003e Option\u003c\u0026mut Tile\u003e {\n        self.get_mut(pos.x, pos.y)\n    }\n\n    /// Checks if a position is within grid bounds.\n    #[inline]\n    pub fn in_bounds(\u0026self, x: u16, y: u16) -\u003e bool {\n        x \u003c self.width \u0026\u0026 y \u003c self.height\n    }\n\n    /// Total number of tiles.\n    #[inline]\n    pub fn len(\u0026self) -\u003e usize {\n        self.tiles.len()\n    }\n\n    /// Whether the grid is empty (zero dimensions).\n    #[inline]\n    pub fn is_empty(\u0026self) -\u003e bool {\n        self.tiles.is_empty()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_position_manhattan_distance() {\n        let a = Position::new(0, 0);\n        let b = Position::new(3, 4);\n        assert_eq!(a.manhattan_distance(\u0026b), 7);\n        assert_eq!(b.manhattan_distance(\u0026a), 7);\n    }\n\n    #[test]\n    fn test_position_offset_in_bounds() {\n        let pos = Position::new(5, 5);\n        let up = pos.offset(Direction::Up, 10, 10);\n        assert_eq!(up, Some(Position::new(5, 4)));\n    }\n\n    #[test]\n    fn test_position_offset_out_of_bounds() {\n        let pos = Position::new(0, 0);\n        assert_eq!(pos.offset(Direction::Up, 10, 10), None);\n        assert_eq!(pos.offset(Direction::Left, 10, 10), None);\n    }\n\n    #[test]\n    fn test_position_offset_at_boundary() {\n        let pos = Position::new(9, 9);\n        assert_eq!(pos.offset(Direction::Down, 10, 10), None);\n        assert_eq!(pos.offset(Direction::Right, 10, 10), None);\n    }\n\n    #[test]\n    fn test_direction_opposite() {\n        assert_eq!(Direction::Up.opposite(), Direction::Down);\n        assert_eq!(Direction::Left.opposite(), Direction::Right);\n    }\n\n    #[test]\n    fn test_direction_from_index() {\n        assert_eq!(Direction::from_index(0), Some(Direction::Up));\n        assert_eq!(Direction::from_index(4), None);\n    }\n\n    #[test]\n    fn test_terrain_walkable() {\n        assert!(TerrainType::Ground.is_walkable());\n        assert!(TerrainType::Forest.is_walkable());\n        assert!(!TerrainType::Water.is_walkable());\n        assert!(!TerrainType::Wall.is_walkable());\n        assert!(!TerrainType::Lava.is_walkable());\n    }\n\n    #[test]\n    fn test_terrain_blocks_vision() {\n        assert!(TerrainType::Wall.blocks_vision());\n        assert!(TerrainType::Mountain.blocks_vision());\n        assert!(!TerrainType::Ground.blocks_vision());\n        assert!(!TerrainType::Forest.blocks_vision());\n    }\n\n    #[test]\n    fn test_grid_creation() {\n        let grid = Grid::new(16, 16);\n        assert_eq!(grid.len(), 256);\n        assert_eq!(grid.width, 16);\n        assert_eq!(grid.height, 16);\n    }\n\n    #[test]\n    fn test_grid_get_and_set() {\n        let mut grid = Grid::new(8, 8);\n        assert!(grid.get(0, 0).is_some());\n        assert!(grid.get(7, 7).is_some());\n        assert!(grid.get(8, 0).is_none());\n\n        if let Some(tile) = grid.get_mut(3, 3) {\n            tile.terrain = TerrainType::Water;\n        }\n        assert_eq!(grid.get(3, 3).unwrap().terrain, TerrainType::Water);\n    }\n\n    #[test]\n    fn test_grid_position_access() {\n        let grid = Grid::new(16, 16);\n        let pos = Position::new(5, 5);\n        assert!(grid.get_pos(\u0026pos).is_some());\n\n        let oob = Position::new(20, 20);\n        assert!(grid.get_pos(\u0026oob).is_none());\n    }\n\n    #[test]\n    fn test_tile_default() {\n        let tile = Tile::default();\n        assert_eq!(tile.terrain, TerrainType::Ground);\n        assert_eq!(tile.elevation, 0);\n        assert!(tile.agent_id.is_none());\n        assert!(tile.object_id.is_none());\n        assert!(tile.resource_id.is_none());\n    }\n\n    #[test]\n    fn test_terrain_from_u8() {\n        for i in 0..8u8 {\n            assert!(TerrainType::from_u8(i).is_some());\n        }\n        assert!(TerrainType::from_u8(8).is_none());\n    }\n\n    #[test]\n    fn test_grid_is_empty() {\n        // A 1x1 grid has one tile and is therefore not empty.\n        let grid = Grid::new(1, 1);\n        assert!(!grid.is_empty());\n        assert_eq!(grid.len(), 1);\n\n        // A 0x0 grid (zero dimensions) is empty.\n        let empty_grid = Grid::new(0, 0);\n        assert!(empty_grid.is_empty());\n        assert_eq!(empty_grid.len(), 0);\n    }\n\n    #[test]\n    fn test_terrain_movement_cost() {\n        // Walkable terrains have specific costs.\n        assert_eq!(TerrainType::Ground.movement_cost(), 65536); // 1.0x\n        assert_eq!(TerrainType::Ice.movement_cost(), 32768); // 0.5x\n        assert_eq!(TerrainType::Sand.movement_cost(), 98304); // 1.5x\n        assert_eq!(TerrainType::Forest.movement_cost(), 131072); // 2.0x\n\n        // Non-walkable terrains return i32::MAX.\n        assert_eq!(TerrainType::Water.movement_cost(), i32::MAX);\n        assert_eq!(TerrainType::Wall.movement_cost(), i32::MAX);\n        assert_eq!(TerrainType::Lava.movement_cost(), i32::MAX);\n        assert_eq!(TerrainType::Mountain.movement_cost(), i32::MAX);\n    }\n\n    #[test]\n    fn test_direction_from_index_all() {\n        // All four valid indices.\n        assert_eq!(Direction::from_index(0), Some(Direction::Up));\n        assert_eq!(Direction::from_index(1), Some(Direction::Down));\n        assert_eq!(Direction::from_index(2), Some(Direction::Left));\n        assert_eq!(Direction::from_index(3), Some(Direction::Right));\n\n        // Invalid index returns None.\n        assert_eq!(Direction::from_index(4), None);\n        assert_eq!(Direction::from_index(255), None);\n    }\n}\n","traces":[{"line":19,"address":[6244048],"length":1,"stats":{"Line":17}},{"line":24,"address":[1673888],"length":1,"stats":{"Line":5}},{"line":25,"address":[8166779,8166712],"length":1,"stats":{"Line":5}},{"line":26,"address":[6243942,6243980,6244009],"length":1,"stats":{"Line":15}},{"line":27,"address":[6244031,6243995],"length":1,"stats":{"Line":6}},{"line":31,"address":[8166966,8166896],"length":1,"stats":{"Line":6}},{"line":32,"address":[6394201],"length":1,"stats":{"Line":5}},{"line":33,"address":[8336365,8336474],"length":1,"stats":{"Line":15}},{"line":34,"address":[8605739,8605949],"length":1,"stats":{"Line":14}},{"line":35,"address":[6244206,6244500],"length":1,"stats":{"Line":10}},{"line":36,"address":[1674599,1674239],"length":1,"stats":{"Line":11}},{"line":37,"address":[8336460],"length":1,"stats":{"Line":5}},{"line":68,"address":[1674816],"length":1,"stats":{"Line":1}},{"line":69,"address":[1674821],"length":1,"stats":{"Line":1}},{"line":70,"address":[8606420],"length":1,"stats":{"Line":1}},{"line":71,"address":[1674859],"length":1,"stats":{"Line":0}},{"line":72,"address":[8337074],"length":1,"stats":{"Line":1}},{"line":73,"address":[8167689],"length":1,"stats":{"Line":0}},{"line":78,"address":[6244704],"length":1,"stats":{"Line":1}},{"line":79,"address":[8190919],"length":1,"stats":{"Line":1}},{"line":80,"address":[8336959],"length":1,"stats":{"Line":1}},{"line":81,"address":[1674758],"length":1,"stats":{"Line":1}},{"line":82,"address":[8190973],"length":1,"stats":{"Line":1}},{"line":83,"address":[8190980],"length":1,"stats":{"Line":1}},{"line":84,"address":[1674744],"length":1,"stats":{"Line":1}},{"line":114,"address":[6242752],"length":1,"stats":{"Line":9}},{"line":115,"address":[1672795],"length":1,"stats":{"Line":9}},{"line"  Tile};\npub use observation::{Observation, StepResult};\npub use resource::{CraftingRecipe, ItemType, RecipeBook, ResourceNode};\npub use task::{ActiveTask, Predicate, TaskComposition, TaskDefinition, TaskTier};\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-types","src","observation.rs"],"content":"//! Observation types for agent perception of the world.\n//!\n//! Observations are structured tensors designed for efficient GPU batching.\n//! The default mode is symbolic (compact numerical arrays), with optional\n//! pixel rendering for vision-based research.\n\nuse serde::{Deserialize, Serialize};\n\nuse crate::entity::CommToken;\nuse crate::grid::TerrainType;\n\n/// A single tile as observed by an agent.\n#[derive(Debug, Clone, Copy, Serialize, Deserialize)]\npub struct TileObservation {\n    /// Terrain type (encoded as u8).\n    pub terrain: u8,\n    /// Whether an agent is present.\n    pub has_agent: bool,\n    /// Whether an object is present.\n    pub has_object: bool,\n    /// Whether a resource is present.\n    pub has_resource: bool,\n    /// Elevation value.\n    pub elevation: u8,\n    /// Object type if present (encoded as u8), or 255 for none.\n    pub object_type: u8,\n    /// Resource type if present (encoded as u8), or 255 for none.\n    pub resource_type: u8,\n}\n\nimpl Default for TileObservation {\n    fn default() -\u003e Self {\n        Self {\n            terrain: TerrainType::Ground as u8,\n            elevation: 0,\n            has_agent: false,\n            has_object: false,\n            has_resource: false,\n            object_type: 255,\n            resource_type: 255,\n        }\n    }\n}\n\n/// Inventory observation — what the agent carries.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct InventoryObservation {\n    /// Per-slot: (item_type as u8, count). Empty slots use (255, 0).\n    pub slots: Vec\u003c(u8, u16)\u003e,\n}\n\n/// Complete observation for a single agent.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Observation {\n    /// Ego-centric grid view (partial, based on vision radius).\n    /// Flattened: size = (2*vision_radius+1)^2 tiles.\n    pub grid_view: Vec\u003cTileObservation\u003e,\n    /// Width of the observation grid (2*vision_radius+1).\n    pub view_width: u16,\n    /// Height of the observation grid (2*vision_radius+1).\n    pub view_height: u16,\n    /// Agent's inventory state.\n    pub inventory: InventoryObservation,\n    /// Current health (normalized 0.0-1.0).\n    pub health: f32,\n    /// Current stamina (normalized 0.0-1.0).\n    pub stamina: f32,\n    /// Agent's absolute position.\n    pub position: (u16, u16),\n    /// Recent communication messages received.\n    pub messages: Vec\u003cCommToken\u003e,\n    /// Current day phase (0=dawn, 1=day, 2=dusk, 3=night).\n    pub day_phase: u8,\n    /// Per-task-predicate completion progress (0.0-1.0 each).\n    pub task_progress: Vec\u003cf32\u003e,\n}\n\nimpl Observation {\n    /// Returns the total number of elements when flattened to a 1D array.\n    /// Useful for defining observation space dimensions.\n    pub fn flat_size(\n        vision_radius: u8,\n        carry_capacity: u8,\n        comm_buffer_size: u8,\n        num_predicates: u16,\n    ) -\u003e usize {\n        let view_side = 2 * vision_radius as usize + 1;\n        let grid_elements = view_side * view_side * 7; // 7 features per tile\n        let inventory_elements = carry_capacity as usize * 2; // (type, count) per slot\n        let scalar_elements = 4; // health, stamina, position.x, position.y\n        let comm_elements = comm_buffer_size as usize;\n        let day_elements = 1;\n        let task_elements = num_predicates as usize;\n\n        grid_elements\n            + inventory_elements\n            + scalar_elements\n            + comm_elements\n            + day_elements\n            + task_elements\n    }\n}\n\n/// The result of a single simulation step for one agent.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct StepResult {\n    /// Per-agent observations.\n    pub observations: Vec\u003cObservation\u003e,\n    /// Per-agent rewards.\n    pub rewards: Vec\u003cf32\u003e,\n    /// Whether the episode has terminated (natural end: goal reached or agent died).\n    pub terminated: bool,\n    /// Whether the episode was truncated (artificial end: max steps reached).\n    pub truncated: bool,\n    /// Additional diagnostic information.\n    pub info: StepInfo,\n}\n\n/// Diagnostic information from a simulation step.\n#[derive(Debug, Clone, Default, Serialize, Deserialize)]\npub struct StepInfo {\n    /// Current simulation tick.\n    pub tick: u64,\n    /// Per-agent: whether each agent is alive.\n    pub agents_alive: Vec\u003cbool\u003e,\n    /// Per-agent: tasks completed this step.\n    pub tasks_completed: Vec\u003cVec\u003cu16\u003e\u003e,\n    /// Total resources remaining in the world.\n    pub total_resources: u32,\n    /// Current day phase.\n    pub day_phase: u8,\n}\n\n/// Description of the observation space for API consumers.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ObservationSpace {\n    /// Shape of the flattened observation vector.\n    pub flat_shape: Vec\u003cusize\u003e,\n    /// Low bound for each element.\n    pub low: f32,\n    /// High bound for each element.\n    pub high: f32,\n    /// Grid view shape: (height, width, features).\n    pub grid_shape: (usize, usize, usize),\n    /// Number of inventory slots.\n    pub inventory_size: usize,\n    /// Communication buffer size.\n    pub comm_buffer_size: usize,\n}\n\n/// Description of the action space for API consumers.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ActionSpace {\n    /// Total number of discrete actions.\n    pub n: u32,\n    /// Human-readable action names indexed by action ID.\n    pub action_names: Vec\u003cString\u003e,\n}\n\nimpl ActionSpace {\n    /// Creates an action space with the given communication vocabulary size.\n    pub fn new(comm_vocab_size: u16) -\u003e Self {\n        let n = crate::action::Action::space_size(comm_vocab_size);\n        let mut names = vec![\n            \"Noop\".to_string(),\n            \"Move Up\".to_string(),\n            \"Move Down\".to_string(),\n            \"Move Left\".to_string(),\n            \"Move Right\".to_string(),\n            \"Pick Up\".to_string(),\n        ];\n        for i in 0..10 {\n            names.push(format!(\"Drop Slot {}\", i));\n        }\n        for i in 0..10 {\n            names.push(format!(\"Use Slot {}\", i));\n        }\n        for i in 0..9 {\n            names.push(format!(\"Craft Recipe {}\", i));\n        }\n        names.push(\"Push Up\".to_string());\n        names.push(\"Push Down\".to_string());\n        names.push(\"Push Left\".to_string());\n        names.push(\"Push Right\".to_string());\n        names.push(\"Interact\".to_string());\n        for i in 0..comm_vocab_size {\n            names.push(format!(\"Communicate {}\", i));\n        }\n        Self {\n            n,\n            action_names: names,\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_observation_flat_size() {\n        let size = Observation::flat_size(5, 10, 8, 4);\n        let view_side = 11; // 2*5+1\n        let expected = view_side * view_side * 7 + 10 * 2 + 4 + 8 + 1 + 4;\n        assert_eq!(size, expected);\n    }\n\n    #[test]\n    fn test_action_space_creation() {\n        let space = ActionSpace::new(16);\n        assert_eq!(space.n, 56); // 40 base + 16 comm\n        assert_eq!(space.action_names.len(), 56);\n        assert_eq!(space.action_names[0], \"Noop\");\n        assert_eq!(space.action_names[1], \"Move Up\");\n    }\n\n    #[test]\n    fn test_tile_observation_default() {\n        let tile = TileObservation::default();\n        assert_eq!(tile.terrain, 0); // Ground\n        assert!(!tile.has_agent);\n        assert_eq!(tile.object_type, 255);\n    }\n\n    #[test]\n    fn test_step_result_construction() {\n        let obs = Observation {\n            grid_view: vec![TileObservation::default()],\n            view_width: 1,\n            view_height: 1,\n            inventory: InventoryObservation {\n                slots: vec![(255, 0)],\n            },\n            health: 1.0,\n            stamina: 0.8,\n            position: (5, 10),\n            messages: vec![],\n            day_phase: 1,\n            task_progress: vec![0.5],\n        };\n\n        let step = StepResult {\n            observations: vec![obs],\n            rewards: vec![1.0],\n            terminated: false,\n            truncated: false,\n            info: StepInfo::default(),\n        };\n\n        assert_eq!(step.observations.len(), 1);\n        assert_eq!(step.rewards.len(), 1);\n        assert!(!step.terminated);\n        assert!(!step.truncated);\n        assert_eq!(step.rewards[0], 1.0);\n        assert_eq!(step.observations[0].position, (5, 10));\n        assert_eq!(step.observations[0].health, 1.0);\n        assert_eq!(step.observations[0].stamina, 0.8);\n    }\n\n    #[test]\n    fn test_step_info_defaults() {\n        let info = StepInfo::default();\n        assert_eq!(info.tick, 0);\n        assert!(info.agents_alive.is_empty());\n        assert!(info.tasks_completed.is_empty());\n        assert_eq!(info.total_resources, 0);\n        assert_eq!(info.day_phase, 0);\n    }\n\n    #[test]\n    fn test_inventory_observation() {\n        let inv_obs = InventoryObservation {\n            slots: vec![(0, 5), (1, 3), (255, 0)],\n        };\n        assert_eq!(inv_obs.slots.len(), 3);\n        // First slot: item type 0 (Wood) with count 5.\n        assert_eq!(inv_obs.slots[0], (0, 5));\n        // Second slot: item type 1 (Stone) with count 3.\n        assert_eq!(inv_obs.slots[1], (1, 3));\n        // Third slot: empty (sentinel 255, count 0).\n        assert_eq!(inv_obs.slots[2], (255, 0));\n    }\n}\n","traces":[{"line"
