ss":[2363182],"length":1,"stats":{"Line":2}},{"line":134,"address":[2362704],"length":1,"stats":{"Line":1}},{"line":136,"address":[2362730,2362765],"length":1,"stats":{"Line":2}},{"line":137,"address":[2362881,2362850,2362811],"length":1,"stats":{"Line":2}},{"line":138,"address":[2363036,2362868],"length":1,"stats":{"Line":2}},{"line":139,"address":[2362966,2362904],"length":1,"stats":{"Line":1}},{"line":140,"address":[2363045,2362942,2362988],"length":1,"stats":{"Line":2}},{"line":143,"address":[2362824],"length":1,"stats":{"Line":1}},{"line":147,"address":[2362448],"length":1,"stats":{"Line":2}},{"line":148,"address":[2362462],"length":1,"stats":{"Line":1}},{"line":149,"address":[2362499,2362621],"length":1,"stats":{"Line":1}},{"line":150,"address":[2362628,2362699,2362554],"length":1,"stats":{"Line":8}},{"line":151,"address":[2362687],"length":1,"stats":{"Line":3}},{"line":155,"address":[2362512],"length":1,"stats":{"Line":0}},{"line":156,"address":[2362526],"length":1,"stats":{"Line":0}}],"covered":59,"coverable":63},{"path":["/","home","user","FORGE","crates","forge-task","src","difficulty.rs"],"content":"//! Task difficulty estimation.\n//!\n//! Estimates how hard a task is based on its composition structure,\n//! assigning it to a difficulty tier (1-6).\n\nuse forge_types::task::{TaskComposition, TaskTier};\nuse tracing::{instrument, warn};\n\n/// Estimates the difficulty tier of a task composition.\n#[instrument(skip_all)]\npub fn estimate_difficulty(composition: \u0026TaskComposition) -\u003e TaskTier {\n    let score = difficulty_score(composition);\n    let tier = match score {\n        0..=1 =\u003e 1,\n        2..=3 =\u003e 2,\n        4..=6 =\u003e 3,\n        7..=10 =\u003e 4,\n        11..=15 =\u003e 5,\n        _ =\u003e 6,\n    };\n    TaskTier::new(tier)\n}\n\n/// Computes a raw difficulty score for a composition tree.\nfn difficulty_score(composition: \u0026TaskComposition) -\u003e u32 {\n    match composition {\n        TaskComposition::Atom(_) =\u003e 1,\n\n        TaskComposition::And(subtasks) =\u003e {\n            let sum: u32 = subtasks.iter().map(difficulty_score).sum();\n            sum + subtasks.len().saturating_sub(1) as u32\n        }\n\n        TaskComposition::Or(subtasks) =\u003e {\n            // Or is easier than And — take the minimum subtask difficulty\n            subtasks.iter().map(difficulty_score).min().unwrap_or(0)\n        }\n\n        TaskComposition::Sequence(subtasks) =\u003e {\n            let sum: u32 = subtasks.iter().map(difficulty_score).sum();\n            // Sequences are harder because ordering matters\n            sum + subtasks.len() as u32\n        }\n\n        TaskComposition::Before(subtask, _deadline) =\u003e {\n            // Deadline adds pressure\n            difficulty_score(subtask) + 2\n        }\n\n        TaskComposition::While(condition, goal) =\u003e {\n            // Maintaining a condition while achieving a goal is harder\n            difficulty_score(condition) + difficulty_score(goal) + 3\n        }\n\n        TaskComposition::Without(subtask, _forbidden) =\u003e {\n            // Constraints add difficulty\n            difficulty_score(subtask) + 1\n        }\n\n        _ =\u003e {\n            warn!(\"unknown TaskComposition variant in difficulty_score\");\n            1\n        }\n    }\n}\n\n/// Estimates the minimum number of actions an oracle agent would need.\n#[instrument(skip_all)]\npub fn estimate_min_steps(composition: \u0026TaskComposition) -\u003e u32 {\n    match composition {\n        TaskComposition::Atom(_) =\u003e 1,\n        TaskComposition::And(subtasks) =\u003e subtasks.iter().map(estimate_min_steps).sum(),\n        TaskComposition::Or(subtasks) =\u003e subtasks.iter().map(estimate_min_steps).min().unwrap_or(0),\n        TaskComposition::Sequence(subtasks) =\u003e subtasks.iter().map(estimate_min_steps).sum(),\n        TaskComposition::Before(subtask, _) =\u003e estimate_min_steps(subtask),\n        TaskComposition::While(_, goal) =\u003e estimate_min_steps(goal),\n        TaskComposition::Without(subtask, _) =\u003e estimate_min_steps(subtask),\n        _ =\u003e {\n            warn!(\"unknown TaskComposition variant in estimate_min_steps\");\n            1\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::grid::Position;\n    use forge_types::resource::ItemType;\n    use forge_types::task::Predicate;\n\n    #[test]\n    fn test_single_predicate_tier_1() {\n        let task = TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5)));\n        let tier = estimate_difficulty(\u0026task);\n        assert_eq!(tier.value(), 1);\n    }\n\n    #[test]\n    fn test_and_increases_difficulty() {\n        let task = TaskComposition::And(vec![\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Wood, 3)),\n        ]);\n        let tier = estimate_difficulty(\u0026task);\n        assert!(tier.value() \u003e= 2);\n    }\n\n    #[test]\n    fn test_sequence_harder_than_and() {\n        let subtasks = vec![\n            TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Wood, 3)),\n            TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Axe, 1)),\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n        ];\n        let and_task = TaskComposition::And(subtasks.clone());\n        let seq_task = TaskComposition::Sequence(subtasks);\n\n        let and_tier = estimate_difficulty(\u0026and_task);\n        let seq_tier = estimate_difficulty(\u0026seq_task);\n        assert!(seq_tier.value() \u003e= and_tier.value());\n    }\n\n    #[test]\n    fn test_or_reduces_difficulty() {\n        let task = TaskComposition::Or(vec![\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(0, 0))),\n        ]);\n        let tier = estimate_difficulty(\u0026task);\n        assert_eq!(tier.value(), 1); // easiest subtask\n    }\n\n    #[test]\n    fn test_deadline_increases_difficulty() {\n        let base = TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5)));\n        let with_deadline = TaskComposition::Before(Box::new(base.clone()), 100);\n        let base_tier = estimate_difficulty(\u0026base);\n        let deadline_tier = estimate_difficulty(\u0026with_deadline);\n        assert!(deadline_tier.value() \u003e= base_tier.value());\n    }\n\n    #[test]\n    fn test_estimate_min_steps() {\n        let task = TaskComposition::Sequence(vec![\n            TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Wood, 3)),\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n        ]);\n        let steps = estimate_min_steps(\u0026task);\n        assert_eq!(steps, 2); // at least 2 actions\n    }\n\n    #[test]\n    fn test_estimate_min_steps_or() {\n        let task = TaskComposition::Or(vec![\n            TaskComposition::Sequence(vec![\n                TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Wood, 1)),\n                TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Stone, 1)),\n                TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            ]),\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(0, 0))),\n        ]);\n        // Or takes the minimum path: single atom = 1\n        assert_eq!(estimate_min_steps(\u0026task), 1);\n    }\n\n    #[test]\n    fn test_estimate_min_steps_while() {\n        let goal = TaskComposition::Sequence(vec![\n            TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Wood, 3)),\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n        ]);\n        let cond = TaskComposition::Atom(Predicate::HealthAbove(0, 0.5));\n        let task = TaskComposition::While(Box::new(cond), Box::new(goal));\n        // While uses the goal's min steps\n        assert_eq!(estimate_min_steps(\u0026task), 2);\n    }\n\n    #[test]\n    fn test_estimate_min_steps_without() {\n        let base = TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5)));\n        let task = TaskComposition::Without(Box::new(base), 3);\n        // Without uses the subtask's min steps\n        assert_eq!(estimate_min_steps(\u0026task), 1);\n    }\n\n    #[test]\n    fn test_while_increases_difficulty() {\n        let goal = TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5)));\n        let cond = TaskComposition::Atom(Predicate::HealthAbove(0, 0.5));\n        let task = TaskComposition::While(Box::new(cond), Box::new(goal.clone()));\n        let base_tier = estimate_difficulty(\u0026goal);\n        let while_tier = estimate_difficulty(\u0026task);\n        assert!(\n            while_tier.value() \u003e base_tier.value(),\n            \"while should be harder than the goal alone\"\n        );\n    }\n\n    #[test]\n    fn test_without_increases_difficulty() {\n        let base = TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5)));\n        let constrained = TaskComposition::Without(Box::new(base.clone()), 7);\n        let base_tier = estimate_difficulty(\u0026base);\n        let constrained_tier = estimate_difficulty(\u0026constrained);\n        assert!(constrained_tier.value() \u003e= base_tier.value());\n    }\n}\n","traces":[{"line":11,"address":[4295914,4295920,4294864],"length":1,"stats":{"Line":1}},{"line":12,"address":[4423637,4424233],"length":1,"stats":{"Line":3}},{"line":14,"address":[4839545,4839520],"length":1,"stats":{"Line":2}},{"line":15,"address":[4400778,4400830],"length":1,"stats":{"Line":2}},{"line":16,"address":[4295631,4295680],"length":1,"stats":{"Line":2}},{"line":17,"address":[4424370,4424321],"length":1,"stats":{"Line":2}},{"line":18,"address":[4839679,4839635],"length":1,"stats":{"Line":3}},{"line":19,"address":[4839665],"length":1,"stats":{"Line":0}},{"line":21,"address":[4424412],"length":1,"stats":{"Line":2}},{"line":25,"address":[4396832,4396913],"length":1,"stats":{"Line":2}},{"line":26,"address":[4835601],"length":1,"stats":{"Line":2}},{"line":27,"address":[4420387],"length":1,"stats":{"Line":1}},{"line":29,"address":[4835685],"length":1,"stats":{"Line":1}},{"line":30,"address":[4291766],"length":1,"stats":{"Line":1}},{"line":31,"address":[4420929,4420935,4420480],"length":1,"stats":{"Line":2}},{"line":34,"address":[4835811],"length":1,"stats":{"Line":1}},{"line":36,"address":[4420543],"length":1,"stats":{"Line":1}},{"line":39,"address":[4420611],"length":1,"stats":{"Line":1}},{"line":40,"address":[2311098],"length":1,"stats":{"Line":1}},{"line":42,"address":[4835966,4836238,4836232],"length":1,"stats":{"Line":2}},{"line":45,"address":[2311189],"length":1,"stats":{"Line":1}},{"line":47,"address":[4397282,4397597,4397504],"length":1,"stats":{"Line":2}},{"line":50,"address":[4836067],"length":1,"stats":{"Line":1}},{"line":52,"address":[4420822,4421314,4421087],"length":1,"stats":{"Line":2}},{"line":55,"address":[2311320],"length":1,"stats":{"Line":1}},{"line":57,"address":[4397860,4397413,4397951],"length":1,"stats":{"Line":2}},{"line":69,"address":[4838759,4837596,4838753,4836720],"length":1,"stats":{"Line":1}},{"line":70,"address":[4836849],"length":1,"stats":{"Line":1}},{"line":71,"address":[4837598],"length":1,"stats":{"Line":1}},{"line":72,"address":[4422681,4422342],"length":1,"stats":{"Line":2}},{"line":73,"address":[4293736,4294146],"length":1,"stats":{"Line":2}},{"line":74,"address":[4422940,4422442],"length":1,"stats":{"Line":2}},{"line":75,"address":[4294385,4293836],"length":1,"stats":{"Line":2}},{"line":76,"address":[4423144,4422546],"length":1,"stats":{"Line":2}},{"line":77,"address":[4422600,4423247],"length":1,"stats":{"Line":2}}],"covered":34,"coverable":35},{"path":["/","home","user","FORGE","crates","forge-task","src","evaluator.rs"],"content":"//! Task completion evaluation and reward computation.\n//!\n//! Evaluates active tasks against the current world state,\n//! computes rewards, and detects completion/failure.\n\nuse forge_types::entity::Agent;\nuse forge_types::grid::Grid;\nuse forge_types::task::ActiveTask;\nuse forge_types::Object;\nuse tracing::{debug, instrument, trace};\n\nuse crate::composer::evaluate_composition;\nuse crate::predicate::EvalContext;\n\n/// Result of evaluating all active tasks for a single tick.\n#[derive(Debug, Clone)]\npub struct TaskEvalResult {\n    /// Per-agent reward for this tick.\n    pub rewards: Vec\u003cf32\u003e,\n    /// Indices of tasks that were completed this tick.\n    pub completed_tasks: Vec\u003cusize\u003e,\n    /// Indices of tasks that failed this tick.\n    pub failed_tasks: Vec\u003cusize\u003e,\n    /// Whether the episode should terminate (all tasks completed or failed).\n    pub should_terminate: bool,\n}\n\n/// Evaluates all active tasks and computes rewards.\n///\n/// `grid` and `objects` are optional for backwards compatibility. When\n/// provided, predicates like `AgentOnTerrain`, `ObjectAt`, and\n/// `ObjectInState` will be evaluated; otherwise they return unsatisfied.\n#[instrument(skip_all)]\npub fn evaluate_tasks(\n    tasks: \u0026mut [ActiveTask],\n    agents: \u0026[Agent],\n    tick: u64,\n    reward_scale: f32,\n    forbidden_actions: \u0026[u32],\n    grid: Option\u003c\u0026Grid\u003e,\n    objects: Option\u003c\u0026[Object]\u003e,\n) -\u003e TaskEvalResult {\n    let ctx = EvalContext {\n        agents,\n        tick,\n        grid,\n        objects,\n    };\n    let mut rewards = vec![0.0_f32; agents.len()];\n    let mut completed_tasks = Vec::new();\n    let failed_tasks = Vec::new();\n\n    for (task_idx, task) in tasks.iter_mut().enumerate() {\n        if task.completed || task.failed {\n            continue;\n        }\n\n        let result = evaluate_composition(\n            \u0026task.definition.goal,\n            \u0026ctx,\n            \u0026mut task.sequence_index,\n            forbidden_actions,\n        );\n\n        // Update progress\n        let old_progress: f32 =\n            task.progress.iter().sum::\u003cf32\u003e() / task.progress.len().max(1) as f32;\n        if !task.progress.is_empty() {\n            task.progress[0] = result.progress;\n        }\n\n        // Dense reward: reward for progress improvement\n        if !task.definition.dense_reward_weights.is_empty() {\n            let new_progress = result.progress;\n            let delta = new_progress - old_progress;\n            if delta \u003e 0.0 {\n                let dense_reward = delta * reward_scale;\n                // Distribute reward to all alive agents\n                for (i, agent) in agents.iter().enumerate() {\n                    if agent.alive {\n                        rewards[i] += dense_reward;\n                    }\n                }\n                trace!(task_idx, delta, dense_reward, \"dense reward for progress\");\n            }\n        }\n\n        if result.satisfied {\n            task.completed = true;\n            completed_tasks.push(task_idx);\n            // Completion reward\n            let completion_reward = task.definition.reward * reward_scale;\n            for (i, agent) in agents.iter().enumerate() {\n                if agent.alive {\n                    rewards[i] += completion_reward;\n                }\n            }\n            debug!(\n                task_idx,\n                task_id = task.definition.id,\n                completion_reward,\n                \"task completed\"\n            );\n        } else if result.progress == 0.0 \u0026\u0026 task.sequence_index == 0 {\n            // Task might have failed (deadline, condition violation, etc.)\n            // Check if the task could still be completed\n            // For now, only explicitly failed tasks (progress reset to 0) are marked\n        }\n    }\n\n    // Check episode termination: all tasks completed or all failed\n    let all_done = tasks.iter().all(|t| t.completed || t.failed);\n    let should_terminate = !tasks.is_empty() \u0026\u0026 all_done;\n\n    TaskEvalResult {\n        rewards,\n        completed_tasks,\n        failed_tasks,\n        should_terminate,\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::AgentConfig;\n    use forge_types::grid::Position;\n    use forge_types::task::{Predicate, TaskComposition, TaskDefinition, TaskTier};\n\n    fn make_agent(id: u32, x: u16, y: u16) -\u003e Agent {\n        Agent::new(id, Position::new(x, y), \u0026AgentConfig::default())\n    }\n\n    fn make_simple_task(id: u64, goal: TaskComposition, reward: f32) -\u003e ActiveTask {\n        ActiveTask {\n            definition: TaskDefinition {\n                id,\n                description: format!(\"Test task {}\", id),\n                goal,\n                tier: TaskTier::new(1),\n                estimated_steps: 10,\n                reward,\n                dense_reward_weights: vec![1.0],\n            },\n            progress: vec![0.0],\n            sequence_index: 0,\n            completed: false,\n            failed: false,\n        }\n    }\n\n    #[test]\n    fn test_task_completion_gives_reward() {\n        let agents = vec![make_agent(0, 5, 5)];\n        let mut tasks = vec![make_simple_task(\n            1,\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            10.0,\n        )];\n\n        let result = evaluate_tasks(\u0026mut tasks, \u0026agents, 0, 1.0, \u0026[], None, None);\n        assert!(result.rewards[0] \u003e 0.0);\n        assert_eq!(result.completed_tasks, vec![0]);\n        assert!(tasks[0].completed);\n    }\n\n    #[test]\n    fn test_incomplete_task_no_completion_reward() {\n        let agents = vec![make_agent(0, 0, 0)];\n        let mut tasks = vec![make_simple_task(\n            1,\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            10.0,\n        )];\n\n        let result = evaluate_tasks(\u0026mut tasks, \u0026agents, 0, 1.0, \u0026[], None, None);\n        assert!(!tasks[0].completed);\n        assert!(result.completed_tasks.is_empty());\n    }\n\n    #[test]\n    fn test_episode_termination_all_complete() {\n        let agents = vec![make_agent(0, 5, 5)];\n        let mut tasks = vec![make_simple_task(\n            1,\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            10.0,\n        )];\n\n        let result = evaluate_tasks(\u0026mut tasks, \u0026agents, 0, 1.0, \u0026[], None, None);\n        assert!(result.should_terminate);\n    }\n\n    #[test]\n    fn test_multi_agent_reward_distribution() {\n        let agents = vec![make_agent(0, 5, 5), make_agent(1, 0, 0)];\n        let mut tasks = vec![make_simple_task(\n            1,\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            10.0,\n        )];\n\n        let result = evaluate_tasks(\u0026mut tasks, \u0026agents, 0, 1.0, \u0026[], None, None);\n        // Both alive agents should get reward\n        assert!(result.rewards[0] \u003e 0.0);\n        assert!(result.rewards[1] \u003e 0.0);\n    }\n\n    #[test]\n    fn test_reward_scale() {\n        let agents = vec![make_agent(0, 5, 5)];\n        let mut tasks1 = vec![make_simple_task(\n            1,\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            10.0,\n        )];\n        let mut tasks2 = vec![make_simple_task(\n            1,\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            10.0,\n        )];\n\n        let r1 = evaluate_tasks(\u0026mut tasks1, \u0026agents, 0, 1.0, \u0026[], None, None);\n        let r2 = evaluate_tasks(\u0026mut tasks2, \u0026agents, 0, 2.0, \u0026[], None, None);\n        assert!((r2.rewards[0] / r1.rewards[0] - 2.0).abs() \u003c 0.1);\n    }\n\n    #[test]\n    fn test_evaluate_empty_tasks() {\n        let agents = vec![make_agent(0, 5, 5)];\n        let mut tasks: Vec\u003cActiveTask\u003e = vec![];\n        let result = evaluate_tasks(\u0026mut tasks, \u0026agents, 0, 1.0, \u0026[], None, None);\n        assert_eq!(result.rewards.len(), 1);\n        assert_eq!(result.rewards[0], 0.0);\n        assert!(result.completed_tasks.is_empty());\n        assert!(result.failed_tasks.is_empty());\n        // Empty task list should not terminate (there's nothing to complete)\n        assert!(!result.should_terminate);\n    }\n\n    #[test]\n    fn test_already_completed_task_skipped() {\n        let agents = vec![make_agent(0, 5, 5)];\n        let mut tasks = vec![make_simple_task(\n            1,\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            10.0,\n        )];\n        tasks[0].completed = true;\n\n        let result = evaluate_tasks(\u0026mut tasks, \u0026agents, 0, 1.0, \u0026[], None, None);\n        assert!(result.completed_tasks.is_empty()); // not re-completed\n        assert!(result.should_terminate); // still terminates\n    }\n}\n","traces":[{"line":34,"address":[2297378,2297406,2292592],"length":1,"stats":{"Line":2}},{"line":49,"address":[4411804],"length":1,"stats":{"Line":2}},{"line":50,"address":[4389034],"length":1,"stats":{"Line":2}},{"line":51,"address":[2293801],"length":1,"stats":{"Line":2}},{"line":53,"address":[4283989,4284073],"length":1,"stats":{"Line":4}},{"line":54,"address":[4412961,4413579],"length":1,"stats":{"Line":5}},{"line":59,"address":[4413616],"length":1,"stats":{"Line":3}},{"line":61,"address":[4828903],"length":1,"stats":{"Line":3}},{"line":66,"address":[4413725,4414001],"length":1,"stats":{"Line":6}},{"line":68,"address":[2295311,2295195],"length":1,"stats":{"Line":6}},{"line":69,"address":[4390594,4390675],"length":1,"stats":{"Line":6}},{"line":73,"address":[4285504,4285452],"length":1,"stats":{"Line":6}},{"line":74,"address":[4414184],"length":1,"stats":{"Line":4}},{"line":75,"address":[4829473],"length":1,"stats":{"Line":2}},{"line":76,"address":[4390734],"length":1,"stats":{"Line":4}},{"line":77,"address":[4829548],"length":1,"stats":{"Line":2}},{"line":79,"address":[4829570],"length":1,"stats":{"Line":4}},{"line":80,"address":[2296409,2295709],"length":1,"stats":{"Line":4}},{"line":81,"address":[4415210],"length":1,"stats":{"Line":4}},{"line":84,"address":[4829860],"length":1,"stats":{"Line":4}},{"line":88,"address":[4390758],"length":1,"stats":{"Line":2}},{"line":89,"address":[4391815],"length":1,"stats":{"Line":3}},{"line":90,"address":[2296434],"length":1,"stats":{"Line":2}},{"line":92,"address":[2296490],"length":1,"stats":{"Line":3}},{"line":93,"address":[4286716],"length":1,"stats":{"Line":2}},{"line":94,"address":[4830900,4831537],"length":1,"stats":{"Line":7}},{"line":95,"address":[4831484],"length":1,"stats":{"Line":2}},{"line":98,"address":[4286979],"length":1,"stats":{"Line":2}},{"line":104,"address":[4391802],"length":1,"stats":{"Line":2}},{"line":112,"address":[4412995],"length":1,"stats":{"Line":6}},{"line":113,"address":[4413112],"length":1,"stats":{"Line":2}}],"covered":31,"coverable":31},{"path":["/","home","user","FORGE","crates","forge-task","src","generator.rs"],"content":"//! Procedural task generation across tiers 1-6.\n//!\n//! Generates randomized tasks of calibrated difficulty using the task DSL.\n//! Each tier introduces more complex composition operators and predicates.\n\nuse rand::Rng;\nuse serde::{Deserialize, Serialize};\nuse tracing::{instrument, warn};\n\nuse forge_types::grid::Position;\nuse forge_types::resource::ItemType;\nuse forge_types::task::{ActiveTask, Predicate, TaskComposition, TaskDefinition};\n\nuse crate::difficulty::{estimate_difficulty, estimate_min_steps};\n\n/// Raw resource items suitable for task generation.\nconst RAW_ITEMS: [ItemType; 6] = [\n    ItemType::Wood,\n    ItemType::Stone,\n    ItemType::Ore,\n    ItemType::Fish,\n    ItemType::Fiber,\n    ItemType::Clay,\n];\n\n/// Configuration for procedural task generation.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct TaskGenConfig {\n    /// Maximum tier to generate (1-6).\n    pub max_tier: u8,\n    /// World width in tiles.\n    pub world_width: u16,\n    /// World height in tiles.\n    pub world_height: u16,\n    /// Number of agents in the simulation.\n    pub num_agents: u32,\n    /// Maximum number of predicates per task.\n    pub max_predicates: u16,\n    /// Base reward for tier 1 tasks (scales with tier).\n    pub base_reward: f32,\n}\n\nimpl Default for TaskGenConfig {\n    fn default() -\u003e Self {\n        Self {\n            max_tier: 6,\n            world_width: 64,\n            world_height: 64,\n            num_agents: 1,\n            max_predicates: 32,\n            base_reward: 1.0,\n        }\n    }\n}\n\n/// Generates a random position within the world bounds.\nfn random_position\u003cR: Rng\u003e(rng: \u0026mut R, config: \u0026TaskGenConfig) -\u003e Position {\n    let x = rng.gen_range(0..config.world_width);\n    let y = rng.gen_range(0..config.world_height);\n    Position::new(x, y)\n}\n\n/// Selects a random raw resource item type.\nfn random_raw_item\u003cR: Rng\u003e(rng: \u0026mut R) -\u003e ItemType {\n    RAW_ITEMS[rng.gen_range(0..RAW_ITEMS.len())]\n}\n\n/// Selects a random agent ID within the configured agent count.\nfn random_agent_id\u003cR: Rng\u003e(rng: \u0026mut R, config: \u0026TaskGenConfig) -\u003e u32 {\n    rng.gen_range(0..config.num_agents)\n}\n\n/// Generates a task definition of the given tier.\n///\n/// The tier determines the structural complexity of the generated task.\n/// Reward scales linearly with the tier.\n#[instrument(skip_all)]\npub fn generate_task\u003cR: Rng\u003e(\n    rng: \u0026mut R,\n    tier: u8,\n    config: \u0026TaskGenConfig,\n    task_id: u64,\n) -\u003e TaskDefinition {\n    let tier = tier.clamp(1, config.max_tier.clamp(1, 6));\n    let goal = match tier {\n        1 =\u003e generate_tier1(rng, config),\n        2 =\u003e generate_tier2(rng, config),\n        3 =\u003e generate_tier3(rng, config),\n        4 =\u003e generate_tier4(rng, config),\n        5 =\u003e generate_tier5(rng, config),\n        _ =\u003e generate_tier6(rng, config),\n    };\n\n    let estimated_tier = estimate_difficulty(\u0026goal);\n    let estimated_steps = estimate_min_steps(\u0026goal);\n    let reward = config.base_reward * tier as f32;\n    let description = describe_task(\u0026goal);\n\n    // Generate dense reward weights proportional to subtask count.\n    let weight_count = count_atoms(\u0026goal).max(1);\n    let dense_reward_weights = vec![1.0 / weight_count as f32; weight_count];\n\n    TaskDefinition {\n        id: task_id,\n        description,\n        goal,\n        tier: estimated_tier,\n        estimated_steps,\n        reward,\n        dense_reward_weights,\n    }\n}\n\n/// Generates an active task ready for evaluation.\n#[instrument(skip_all)]\npub fn generate_active_task\u003cR: Rng\u003e(\n    rng: \u0026mut R,\n    tier: u8,\n    config: \u0026TaskGenConfig,\n    task_id: u64,\n) -\u003e ActiveTask {\n    let definition = generate_task(rng, tier, config, task_id);\n    let progress_len = count_atoms(\u0026definition.goal).max(1);\n    ActiveTask {\n        definition,\n        progress: vec![0.0; progress_len],\n        sequence_index: 0,\n        completed: false,\n        failed: false,\n    }\n}\n\n// ---------------------------------------------------------------------------\n// Tier generators\n// ---------------------------------------------------------------------------\n\n/// Tier 1: single atomic predicate.\nfn generate_tier1\u003cR: Rng\u003e(rng: \u0026mut R, config: \u0026TaskGenConfig) -\u003e TaskComposition {\n    if rng.gen_bool(0.5) {\n        // Navigate to a random position\n        let pos = random_position(rng, config);\n        TaskComposition::Atom(Predicate::AgentAt(0, pos))\n    } else {\n        // Collect a resource\n        let item = random_raw_item(rng);\n        TaskComposition::Atom(Predicate::AgentHas(0, item, 1))\n    }\n}\n\n/// Tier 2: two predicates combined with AND.\nfn generate_tier2\u003cR: Rng\u003e(rng: \u0026mut R, config: \u0026TaskGenConfig) -\u003e TaskComposition {\n    if rng.gen_bool(0.5) {\n        // Navigate and collect\n        let pos = random_position(rng, config);\n        let item = random_raw_item(rng);\n        let count = rng.gen_range(1..=3);\n        TaskComposition::And(vec![\n            TaskComposition::Atom(Predicate::AgentAt(0, pos)),\n            TaskComposition::Atom(Predicate::AgentHas(0, item, count)),\n        ])\n    } else {\n        // Collect two different resources\n        let item1 = random_raw_item(rng);\n        let mut item2 = random_raw_item(rng);\n        while item2 == item1 {\n            item2 = random_raw_item(rng);\n        }\n        let count1 = rng.gen_range(1..=3);\n        let count2 = rng.gen_range(1..=3);\n        TaskComposition::And(vec![\n            TaskComposition::Atom(Predicate::AgentHas(0, item1, count1)),\n            TaskComposition::Atom(Predicate::AgentHas(0, item2, count2)),\n        ])\n    }\n}\n\n/// Tier 3: sequences, OR, or deadline constraints.\nfn generate_tier3\u003cR: Rng\u003e(rng: \u0026mut R, config: \u0026TaskGenConfig) -\u003e TaskComposition {\n    let variant = rng.gen_range(0..3);\n    match variant {\n        0 =\u003e {\n            // Sequence: collect then deliver\n            let item = random_raw_item(rng);\n            let count = rng.gen_range(1..=3);\n            let pos = random_position(rng, config);\n            TaskComposition::Sequence(vec![\n                TaskComposition::Atom(Predicate::AgentHas(0, item, count)),\n                TaskComposition::Atom(Predicate::AgentAt(0, pos)),\n            ])\n        }\n        1 =\u003e {\n            // OR: reach a position or collect a resource\n            let pos1 = random_position(rng, config);\n            TaskComposition::Or(vec![\n                TaskComposition::Atom(Predicate::AgentAt(0, pos1)),\n                TaskComposition::Atom(Predicate::AgentHas(0, random_raw_item(rng), 1)),\n            ])\n        }\n        _ =\u003e {\n            // Before: complete task within deadline\n            let inner = generate_tier1(rng, config);\n            let deadline = rng.gen_range(50..=500);\n            TaskComposition::Before(Box::new(inner), deadline)\n        }\n    }\n}\n\n/// Tier 4: complex compositions with conditions.\nfn generate_tier4\u003cR: Rng\u003e(rng: \u0026mut R, config: \u0026TaskGenConfig) -\u003e TaskComposition {\n    let variant = rng.gen_range(0..3);\n    match variant {\n        0 =\u003e {\n            // While: maintain health above threshold while completing task\n            let agent_id = random_agent_id(rng, config);\n            let threshold = rng.gen_range(3..=8) as f32 / 10.0;\n            let inner_task = generate_tier2(rng, config);\n            TaskComposition::While(\n                Box::new(TaskComposition::Atom(Predicate::HealthAbove(\n                    agent_id, threshold,\n                ))),\n                Box::new(inner_task),\n            )\n        }\n        1 =\u003e {\n            // Without: complete task without using Noop (action 0)\n            let inner_task = generate_tier2(rng, config);\n            TaskComposition::Without(Box::new(inner_task), 0)\n        }\n        _ =\u003e {\n            // Multi-step with deadline\n            let item = random_raw_item(rng);\n            let count = rng.gen_range(2..=5);\n            let pos = random_position(rng, config);\n            let deadline = rng.gen_range(200..=1000);\n            TaskComposition::Before(\n                Box::new(TaskComposition::Sequence(vec![\n                    TaskComposition::Atom(Predicate::AgentHas(0, item, count)),\n                    TaskComposition::Atom(Predicate::AgentAt(0, pos)),\n                ])),\n                deadline,\n            )\n        }\n    }\n}\n\n/// Tier 5: multi-agent tasks (requires num_agents \u003e= 2).\nfn generate_tier5\u003cR: Rng\u003e(rng: \u0026mut R, config: \u0026TaskGenConfig) -\u003e TaskComposition {\n    // Fall back to tier 4 if only one agent\n    if config.num_agents \u003c 2 {\n        return generate_tier4(rng, config);\n    }\n\n    let variant = rng.gen_range(0..2);\n    match variant {\n        0 =\u003e {\n            // Two agents must be near each other\n            let dist = rng.gen_range(1..=5);\n            let item = random_raw_item(rng);\n            let count = rng.gen_range(1..=3);\n            TaskComposition::And(vec![\n                TaskComposition::Atom(Predicate::AgentNear(0, 1, dist)),\n                TaskComposition::Atom(Predicate::AgentHas(0, item, count)),\n            ])\n        }\n        _ =\u003e {\n            // Both agents collect resources\n            let item1 = random_raw_item(rng);\n            let item2 = random_raw_item(rng);\n            let count1 = rng.gen_range(1..=3);\n            let count2 = rng.gen_range(1..=3);\n            TaskComposition::And(vec![\n                TaskComposition::Atom(Predicate::AgentHas(0, item1, count1)),\n                TaskComposition::Atom(Predicate::AgentHas(1, item2, count2)),\n            ])\n        }\n    }\n}\n\n/// Tier 6: maximum complexity with all operators combined.\nfn generate_tier6\u003cR: Rng\u003e(rng: \u0026mut R, config: \u0026TaskGenConfig) -\u003e TaskComposition {\n    let agent_id: u32 = 0;\n    let item1 = random_raw_item(rng);\n    let item2 = random_raw_item(rng);\n    let pos = random_position(rng, config);\n    let deadline = rng.gen_range(500..=2000);\n\n    // Build nested composition: While(health \u003e threshold, Before(deadline,\n    //   Sequence([collect item1, Without(collect item2, noop), go to pos])))\n    let threshold = rng.gen_range(3..=7) as f32 / 10.0;\n    let count1 = rng.gen_range(2..=5);\n    let count2 = rng.gen_range(1..=3);\n\n    let inner_sequence = TaskComposition::Sequence(vec![\n        TaskComposition::Atom(Predicate::AgentHas(agent_id, item1, count1)),\n        TaskComposition::Without(\n            Box::new(TaskComposition::Atom(Predicate::AgentHas(\n                agent_id, item2, count2,\n            ))),\n            0, // forbidden: Noop\n        ),\n        TaskComposition::Atom(Predicate::AgentAt(agent_id, pos)),\n    ]);\n\n    let with_deadline = TaskComposition::Before(Box::new(inner_sequence), deadline);\n\n    // Add multi-agent requirement if available\n    if config.num_agents \u003e= 2 {\n        let dist = rng.gen_range(1..=5);\n        TaskComposition::While(\n            Box::new(TaskComposition::Atom(Predicate::HealthAbove(\n                agent_id, threshold,\n            ))),\n            Box::new(TaskComposition::And(vec![\n                with_deadline,\n                TaskComposition::Atom(Predicate::AgentNear(0, 1, dist)),\n            ])),\n        )\n    } else {\n        TaskComposition::While(\n            Box::new(TaskComposition::Atom(Predicate::HealthAbove(\n                agent_id, threshold,\n            ))),\n            Box::new(with_deadline),\n        )\n    }\n}\n\n// ---------------------------------------------------------------------------\n// Description generation\n// ---------------------------------------------------------------------------\n\n/// Generates a human-readable description of a task composition.\n#[instrument(skip_all)]\npub fn describe_task(goal: \u0026TaskComposition) -\u003e String {\n    match goal {\n        TaskComposition::Atom(pred) =\u003e describe_predicate(pred),\n\n        TaskComposition::And(subtasks) =\u003e {\n            let parts: Vec\u003cString\u003e = subtasks.iter().map(describe_task).collect();\n            parts.join(\" AND \")\n        }\n\n        TaskComposition::Or(subtasks) =\u003e {\n            let parts: Vec\u003cString\u003e = subtasks.iter().map(describe_task).collect();\n            parts.join(\" OR \")\n        }\n\n        TaskComposition::Sequence(subtasks) =\u003e {\n            let parts: Vec\u003cString\u003e = subtasks\n                .iter()\n                .enumerate()\n                .map(|(i, t)| format!(\"{}. {}\", i + 1, describe_task(t)))\n                .collect();\n            format!(\"In order: {}\", parts.join(\", then \"))\n        }\n\n        TaskComposition::Before(subtask, deadline) =\u003e {\n            format!(\"{} before tick {}\", describe_task(subtask), deadline)\n        }\n\n        TaskComposition::While(condition, goal) =\u003e {\n            format!(\n                \"While {}, {}\",\n                describe_task(condition),\n                describe_task(goal)\n            )\n        }\n\n        TaskComposition::Without(subtask, action_id) =\u003e {\n            format!(\n                \"{} without using action {}\",\n                describe_task(subtask),\n                action_id\n            )\n        }\n\n        _ =\u003e {\n            warn!(\"unknown TaskComposition variant in describe_task\");\n            \"unknown task\".to_string()\n        }\n    }\n}\n\n/// Generates a human-readable description of a predicate.\nfn describe_predicate(pred: \u0026Predicate) -\u003e String {\n    match pred {\n        Predicate::AgentAt(id, pos) =\u003e {\n            format!(\"agent {} reaches ({}, {})\", id, pos.x, pos.y)\n        }\n        Predicate::AgentHas(id, item, count) =\u003e {\n            format!(\"agent {} collects {} {:?}\", id, count, item)\n        }\n        Predicate::AgentNear(a, b, dist) =\u003e {\n            format!(\"agent {} is within {} of agent {}\", a, dist, b)\n        }\n        Predicate::ObjectAt(id, pos) =\u003e {\n            format!(\"object {} is at ({}, {})\", id, pos.x, pos.y)\n        }\n        Predicate::ObjectInState(id, state) =\u003e {\n            format!(\"object {} is in state {}\", id, state)\n        }\n        Predicate::TimeElapsed(ticks) =\u003e {\n            format!(\"{} ticks have elapsed\", ticks)\n        }\n        Predicate::HealthAbove(id, threshold) =\u003e {\n            format!(\"agent {} health above {:.0}%\", id, threshold * 100.0)\n        }\n        Predicate::ResourceCount(id, item, count) =\u003e {\n            format!(\"agent {} has {} {:?}\", id, count, item)\n        }\n        Predicate::TeamAlive(team) =\u003e {\n            format!(\"team {} is alive\", team)\n        }\n        Predicate::AgentOnTerrain(id, terrain) =\u003e {\n            format!(\"agent {} is on terrain {}\", id, terrain)\n        }\n\n        _ =\u003e {\n            warn!(\"unknown Predicate variant in describe_predicate\");\n            \"unknown predicate\".to_string()\n        }\n    }\n}\n\n/// Counts the number of atomic predicates in a composition tree.\nfn count_atoms(composition: \u0026TaskComposition) -\u003e usize {\n    match composition {\n        TaskComposition::Atom(_) =\u003e 1,\n        TaskComposition::And(subtasks)\n        | TaskComposition::Or(subtasks)\n        | TaskComposition::Sequence(subtasks) =\u003e subtasks.iter().map(count_atoms).sum(),\n        TaskComposition::Before(subtask, _) =\u003e count_atoms(subtask),\n        TaskComposition::While(cond, goal) =\u003e count_atoms(cond) + count_atoms(goal),\n        TaskComposition::Without(subtask, _) =\u003e count_atoms(subtask),\n        _ =\u003e {\n            warn!(\"unknown TaskComposition variant in count_atoms\");\n            1\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use rand::SeedableRng;\n    use rand_pcg::Pcg64;\n\n    fn default_config() -\u003e TaskGenConfig {\n        TaskGenConfig {\n            max_tier: 6,\n            world_width: 64,\n            world_height: 64,\n            num_agents: 2,\n            max_predicates: 32,\n            base_reward: 1.0,\n        }\n    }\n\n    fn make_rng(seed: u64) -\u003e Pcg64 {\n        Pcg64::seed_from_u64(seed)\n    }\n\n    #[test]\n    fn test_generate_tier1() {\n        let config = default_config();\n        let mut rng = make_rng(42);\n        for i in 0..10 {\n            let task = generate_task(\u0026mut rng, 1, \u0026config, i);\n            assert!(task.tier.value() \u003c= 2, \"tier 1 task should be easy\");\n            assert!(!task.description.is_empty());\n        }\n    }\n\n    #[test]\n    fn test_generate_tier2() {\n        let config = default_config();\n        let mut rng = make_rng(123);\n        for i in 0..10 {\n            let task = generate_task(\u0026mut rng, 2, \u0026config, i);\n            assert!(task.tier.value() \u003e= 1);\n            assert!(!task.description.is_empty());\n        }\n    }\n\n    #[test]\n    fn test_generate_tier3() {\n        let config = default_config();\n        let mut rng = make_rng(456);\n        for i in 0..10 {\n            let task = generate_task(\u0026mut rng, 3, \u0026config, i);\n            assert!(!task.description.is_empty());\n        }\n    }\n\n    #[test]\n    fn test_generate_tier4() {\n        let config = default_config();\n        let mut rng = make_rng(789);\n        for i in 0..10 {\n            let task = generate_task(\u0026mut rng, 4, \u0026config, i);\n            assert!(!task.description.is_empty());\n        }\n    }\n\n    #[test]\n    fn test_generate_tier5_multi_agent() {\n        let config = TaskGenConfig {\n            num_agents: 2,\n            ..default_config()\n        };\n        let mut rng = make_rng(101);\n        for i in 0..10 {\n            let task = generate_task(\u0026mut rng, 5, \u0026config, i);\n            assert!(!task.description.is_empty());\n        }\n    }\n\n    #[test]\n    fn test_generate_tier5_single_agent_fallback() {\n        let config = TaskGenConfig {\n            num_agents: 1,\n            ..default_config()\n        };\n        let mut rng = make_rng(202);\n        let task = generate_task(\u0026mut rng, 5, \u0026config, 0);\n        // Should fall back to tier 4 complexity\n        assert!(!task.description.is_empty());\n    }\n\n    #[test]\n    fn test_generate_tier6() {\n        let config = default_config();\n        let mut rng = make_rng(303);\n        for i in 0..10 {\n            let task = generate_task(\u0026mut rng, 6, \u0026config, i);\n            assert!(!task.description.is_empty());\n            assert!(task.estimated_steps \u003e= 1);\n        }\n    }\n\n    #[test]\n    fn test_generate_active_task() {\n        let config = default_config();\n        let mut rng = make_rng(404);\n        let active = generate_active_task(\u0026mut rng, 3, \u0026config, 1);\n        assert!(!active.completed);\n        assert!(!active.failed);\n        assert_eq!(active.sequence_index, 0);\n        assert!(!active.progress.is_empty());\n        assert!(active.progress.iter().all(|\u0026p| p == 0.0));\n    }\n\n    #[test]\n    fn test_tier_clamping() {\n        let config = TaskGenConfig {\n            max_tier: 3,\n            ..default_config()\n        };\n        let mut rng = make_rng(505);\n        // Requesting tier 6 but max_tier is 3; should clamp to 3\n        let task = generate_task(\u0026mut rng, 6, \u0026config, 0);\n        assert!(!task.description.is_empty());\n    }\n\n    #[test]\n    fn test_generate_task_max_tier_zero() {\n        let config = TaskGenConfig {\n            max_tier: 0,\n            ..default_config()\n        };\n        let mut rng = make_rng(42);\n        // max_tier=0 means the tier clamp range is 1..min(0, 6) = 1..0,\n        // so clamp(1, 0) yields 0 which then goes to the default arm.\n        // The function should not panic; we just verify it produces a valid task.\n        let task = generate_task(\u0026mut rng, 1, \u0026config, 0);\n        assert!(!task.description.is_empty());\n        assert!(task.estimated_steps \u003e= 1);\n    }\n\n    #[test]\n    fn test_reward_scales_with_tier() {\n        let config = default_config();\n        let mut rng = make_rng(606);\n        let task1 = generate_task(\u0026mut rng, 1, \u0026config, 0);\n        let task3 = generate_task(\u0026mut rng, 3, \u0026config, 1);\n        let task6 = generate_task(\u0026mut rng, 6, \u0026config, 2);\n        assert!(task3.reward \u003e task1.reward);\n        assert!(task6.reward \u003e task3.reward);\n    }\n\n    #[test]\n    fn test_describe_task_atom() {\n        let task = TaskComposition::Atom(Predicate::AgentAt(0, Position::new(10, 20)));\n        let desc = describe_task(\u0026task);\n        assert!(desc.contains(\"agent 0\"));\n        assert!(desc.contains(\"10\"));\n        assert!(desc.contains(\"20\"));\n    }\n\n    #[test]\n    fn test_describe_task_and() {\n        let task = TaskComposition::And(vec![\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Wood, 3)),\n        ]);\n        let desc = describe_task(\u0026task);\n        assert!(desc.contains(\"AND\"));\n    }\n\n    #[test]\n    fn test_describe_task_sequence() {\n        let task = TaskComposition::Sequence(vec![\n            TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Stone, 2)),\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(0, 0))),\n        ]);\n        let desc = describe_task(\u0026task);\n        assert!(desc.contains(\"In order\"));\n    }\n\n    #[test]\n    fn test_describe_task_before() {\n        let task = TaskComposition::Before(\n            Box::new(TaskComposition::Atom(Predicate::AgentAt(\n                0,\n                Position::new(5, 5),\n            ))),\n            100,\n        );\n        let desc = describe_task(\u0026task);\n        assert!(desc.contains(\"before tick 100\"));\n    }\n\n    #[test]\n    fn test_random_position_in_bounds() {\n        let config = TaskGenConfig {\n            world_width: 16,\n            world_height: 16,\n            ..default_config()\n        };\n        let mut rng = make_rng(707);\n        for _ in 0..100 {\n            let pos = random_position(\u0026mut rng, \u0026config);\n            assert!(pos.x \u003c 16);\n            assert!(pos.y \u003c 16);\n        }\n    }\n\n    #[test]\n    fn test_deterministic_generation() {\n        let config = default_config();\n        let mut rng1 = make_rng(999);\n        let mut rng2 = make_rng(999);\n        let task1 = generate_task(\u0026mut rng1, 3, \u0026config, 0);\n        let task2 = generate_task(\u0026mut rng2, 3, \u0026config, 0);\n        assert_eq!(task1.description, task2.description);\n        assert_eq!(task1.goal, task2.goal);\n    }\n\n    #[test]\n    fn test_dense_reward_weights_sum() {\n        let config = default_config();\n        let mut rng = make_rng(808);\n        for tier in 1..=6 {\n            let task = generate_task(\u0026mut rng, tier, \u0026config, tier as u64);\n            let sum: f32 = task.dense_reward_weights.iter().sum();\n            assert!(\n                (sum - 1.0).abs() \u003c 0.01,\n                \"dense reward weights should sum to ~1.0 for tier {}, got {}\",\n                tier,\n                sum\n            );\n        }\n    }\n\n    #[test]\n    fn test_count_atoms() {\n        let task = TaskComposition::And(vec![\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(0, 0))),\n            TaskComposition::Sequence(vec![\n                TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Wood, 1)),\n                TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Stone, 1)),\n            ]),\n        ]);\n        assert_eq!(count_atoms(\u0026task), 3);\n    }\n}\n","traces":[{"line":44,"address":[4330208],"length":1,"stats":{"Line":0}},{"line":57,"address":[],"length":0,"stats":{"Line":1}},{"line":58,"address":[2439191],"length":1,"stats":{"Line":1}},{"line":59,"address":[],"length":0,"stats":{"Line":1}},{"line":60,"address":[2439250],"length":1,"stats":{"Line":1}},{"line":64,"address":[],"length":0,"stats":{"Line":1}},{"line":65,"address":[2439289,2439352],"length":1,"stats":{"Line":1}},{"line":69,"add gnment\n\npub mod composer;\npub mod curriculum;\npub mod difficulty;\npub mod evaluator;\npub mod generator;\npub mod predicate;\npub mod prelude;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-task","src","predicate.rs"],"content":"//! Predicate evaluation against world state.\n//!\n//! Atomic predicates are the building blocks of the task DSL.\n//! Each predicate evaluates to a boolean (satisfied or not) and\n//! optionally a progress value in [0.0, 1.0].\n\nuse forge_types::entity::{Agent, AgentId, ObjectState};\nuse forge_types::grid::{Grid, Position, TerrainType};\nuse forge_types::resource::ItemType;\nuse forge_types::task::Predicate;\nuse forge_types::Object;\nuse tracing::{instrument, trace, warn};\n\n/// Context for evaluating predicates against the current world state.\n///\n/// The `grid` and `objects` fields are optional for backwards compatibility:\n/// predicates that don't require spatial lookups (e.g. `AgentHas`, `TimeElapsed`)\n/// work without them. Predicates like `AgentOnTerrain`, `ObjectAt`, and\n/// `ObjectInState` return unsatisfied(0.0) when the required data is absent.\npub struct EvalContext\u003c'a\u003e {\n    /// All agents in the simulation.\n    pub agents: \u0026'a [Agent],\n    /// Current tick.\n    pub tick: u64,\n    /// The world grid (optional — required for terrain predicates).\n    pub grid: Option\u003c\u0026'a Grid\u003e,\n    /// All objects in the simulation (optional — required for object predicates).\n    pub objects: Option\u003c\u0026'a [Object]\u003e,\n}\n\n/// Result of evaluating a predicate.\n#[derive(Debug, Clone, Copy)]\npub struct PredicateResult {\n    /// Whether the predicate is satisfied.\n    pub satisfied: bool,\n    /// Progress toward satisfaction (0.0 = no progress, 1.0 = complete).\n    pub progress: f32,\n}\n\nimpl PredicateResult {\n    fn satisfied() -\u003e Self {\n        Self {\n            satisfied: true,\n            progress: 1.0,\n        }\n    }\n\n    fn unsatisfied(progress: f32) -\u003e Self {\n        Self {\n            satisfied: false,\n            progress: progress.clamp(0.0, 1.0),\n        }\n    }\n}\n\n/// Evaluates an atomic predicate against the current world state.\n#[instrument(skip_all)]\npub fn evaluate_predicate(predicate: \u0026Predicate, ctx: \u0026EvalContext) -\u003e PredicateResult {\n    match predicate {\n        Predicate::AgentAt(agent_id, target_pos) =\u003e eval_agent_at(ctx, *agent_id, target_pos),\n        Predicate::AgentHas(agent_id, item_type, count) =\u003e {\n            eval_agent_has(ctx, *agent_id, *item_type, *count)\n        }\n        Predicate::AgentNear(a_id, b_id, distance) =\u003e eval_agent_near(ctx, *a_id, *b_id, *distance),\n        Predicate::TimeElapsed(target_tick) =\u003e eval_time_elapsed(ctx, *target_tick),\n        Predicate::HealthAbove(agent_id, threshold) =\u003e {\n            eval_health_above(ctx, *agent_id, *threshold)\n        }\n        Predicate::ResourceCount(agent_id, item_type, count) =\u003e {\n            eval_agent_has(ctx, *agent_id, *item_type, *count)\n        }\n        Predicate::TeamAlive(team_id) =\u003e eval_team_alive(ctx, *team_id),\n        Predicate::AgentOnTerrain(agent_id, terrain_id) =\u003e {\n            eval_agent_on_terrain(ctx, *agent_id, *terrain_id)\n        }\n        Predicate::ObjectAt(obj_id, pos) =\u003e eval_object_at(ctx, *obj_id, pos),\n        Predicate::ObjectInState(obj_id, state_name) =\u003e {\n            eval_object_in_state(ctx, *obj_id, state_name)\n        }\n\n        _ =\u003e {\n            warn!(\"unknown predicate variant encountered — treating as unsatisfied\");\n            PredicateResult::unsatisfied(0.0)\n        }\n    }\n}\n\nfn find_agent(agents: \u0026[Agent], id: AgentId) -\u003e Option\u003c\u0026Agent\u003e {\n    agents.iter().find(|a| a.id == id)\n}\n\nfn eval_agent_at(ctx: \u0026EvalContext, agent_id: AgentId, target: \u0026Position) -\u003e PredicateResult {\n    if let Some(agent) = find_agent(ctx.agents, agent_id) {\n        if agent.position == *target {\n            trace!(agent_id, \"predicate AgentAt satisfied\");\n            PredicateResult::satisfied()\n        } else {\n            let distance = agent.position.manhattan_distance(target) as f32;\n            // Progress based on proximity (inverse of distance, capped)\n            let max_dist = 100.0_f32;\n            let progress = 1.0 - (distance / max_dist).min(1.0);\n            PredicateResult::unsatisfied(progress)\n        }\n    } else {\n        PredicateResult::unsatisfied(0.0)\n    }\n}\n\nfn eval_agent_has(\n    ctx: \u0026EvalContext,\n    agent_id: AgentId,\n    item_type: ItemType,\n    count: u16,\n) -\u003e PredicateResult {\n    if let Some(agent) = find_agent(ctx.agents, agent_id) {\n        let current = agent.inventory.count_item(item_type);\n        if current \u003e= count {\n            trace!(agent_id, ?item_type, count, \"predicate AgentHas satisfied\");\n            PredicateResult::satisfied()\n        } else {\n            let progress = if count \u003e 0 {\n                current as f32 / count as f32\n            } else {\n                1.0\n            };\n            PredicateResult::unsatisfied(progress)\n        }\n    } else {\n        PredicateResult::unsatisfied(0.0)\n    }\n}\n\nfn eval_agent_near(\n    ctx: \u0026EvalContext,\n    a_id: AgentId,\n    b_id: AgentId,\n    max_distance: u16,\n) -\u003e PredicateResult {\n    let a = find_agent(ctx.agents, a_id);\n    let b = find_agent(ctx.agents, b_id);\n\n    if let (Some(a), Some(b)) = (a, b) {\n        let dist = a.position.manhattan_distance(\u0026b.position);\n        if dist \u003c= max_distance as u32 {\n            PredicateResult::satisfied()\n        } else {\n            let progress = 1.0 - ((dist as f32 - max_distance as f32) / 50.0).min(1.0);\n            PredicateResult::unsatisfied(progress.max(0.0))\n        }\n    } else {\n        PredicateResult::unsatisfied(0.0)\n    }\n}\n\nfn eval_time_elapsed(ctx: \u0026EvalContext, target_tick: u64) -\u003e PredicateResult {\n    if ctx.tick \u003e= target_tick {\n        PredicateResult::satisfied()\n    } else if target_tick \u003e 0 {\n        let progress = ctx.tick as f32 / target_tick as f32;\n        PredicateResult::unsatisfied(progress)\n    } else {\n        PredicateResult::satisfied()\n    }\n}\n\nfn eval_health_above(ctx: \u0026EvalContext, agent_id: AgentId, threshold: f32) -\u003e PredicateResult {\n    if let Some(agent) = find_agent(ctx.agents, agent_id) {\n        // Health is stored as fixed-point i32. Threshold is normalized 0.0-1.0.\n        // max_health from constants = 655360 (10.0 in fixed-point)\n        let max_health = forge_types::constants::DEFAULT_MAX_HEALTH as f32;\n        let normalized = if max_health \u003e 0.0 {\n            agent.health as f32 / max_health\n        } else {\n            0.0\n        };\n        if normalized \u003e= threshold {\n            PredicateResult::satisfied()\n        } else {\n            let progress = if threshold \u003e 0.0 {\n                normalized / threshold\n            } else {\n                1.0\n            };\n            PredicateResult::unsatisfied(progress)\n        }\n    } else {\n        PredicateResult::unsatisfied(0.0)\n    }\n}\n\nfn eval_team_alive(ctx: \u0026EvalContext, team_id: u8) -\u003e PredicateResult {\n    let team_agents: Vec\u003c\u0026Agent\u003e = ctx.agents.iter().filter(|a| a.team == team_id).collect();\n    if team_agents.is_empty() {\n        return PredicateResult::unsatisfied(0.0);\n    }\n    let alive_count = team_agents.iter().filter(|a| a.alive).count();\n    if alive_count == team_agents.len() {\n        PredicateResult::satisfied()\n    } else {\n        let progress = alive_count as f32 / team_agents.len() as f32;\n        PredicateResult::unsatisfied(progress)\n    }\n}\n\n/// Checks if agent is standing on a specific terrain type.\nfn eval_agent_on_terrain(ctx: \u0026EvalContext, agent_id: AgentId, terrain_id: u8) -\u003e PredicateResult {\n    let grid = match ctx.grid {\n        Some(g) =\u003e g,\n        None =\u003e return PredicateResult::unsatisfied(0.0),\n    };\n    let agent = match find_agent(ctx.agents, agent_id) {\n        Some(a) =\u003e a,\n        None =\u003e return PredicateResult::unsatisfied(0.0),\n    };\n    let expected_terrain = match terrain_id {\n        0 =\u003e TerrainType::Ground,\n        1 =\u003e TerrainType::Water,\n        2 =\u003e TerrainType::Wall,\n        3 =\u003e TerrainType::Lava,\n        4 =\u003e TerrainType::Ice,\n        5 =\u003e TerrainType::Sand,\n        6 =\u003e TerrainType::Forest,\n        7 =\u003e TerrainType::Mountain,\n        _ =\u003e return PredicateResult::unsatisfied(0.0),\n    };\n    if let Some(tile) = grid.get(agent.position.x, agent.position.y) {\n        if tile.terrain == expected_terrain {\n            trace!(\n                agent_id,\n                ?expected_terrain,\n                \"predicate AgentOnTerrain satisfied\"\n            );\n            PredicateResult::satisfied()\n        } else {\n            PredicateResult::unsatisfied(0.0)\n        }\n    } else {\n        PredicateResult::unsatisfied(0.0)\n    }\n}\n\n/// Checks if an object is at a specific position.\nfn eval_object_at(ctx: \u0026EvalContext, obj_id: u32, target: \u0026Position) -\u003e PredicateResult {\n    let objects = match ctx.objects {\n        Some(o) =\u003e o,\n        None =\u003e return PredicateResult::unsatisfied(0.0),\n    };\n    if let Some(obj) = objects.iter().find(|o| o.id == obj_id) {\n        if obj.position == *target {\n            trace!(obj_id, \"predicate ObjectAt satisfied\");\n            PredicateResult::satisfied()\n        } else {\n            let distance = obj.position.manhattan_distance(target) as f32;\n            let max_dist = 100.0_f32;\n            let progress = 1.0 - (distance / max_dist).min(1.0);\n            PredicateResult::unsatisfied(progress)\n        }\n    } else {\n        PredicateResult::unsatisfied(0.0)\n    }\n}\n\n/// Checks if an object is in a specific state (by state name).\nfn eval_object_in_state(ctx: \u0026EvalContext, obj_id: u32, state_name: \u0026str) -\u003e PredicateResult {\n    let objects = match ctx.objects {\n        Some(o) =\u003e o,\n        None =\u003e return PredicateResult::unsatisfied(0.0),\n    };\n    let expected_state = match state_name {\n        \"Active\" | \"active\" =\u003e ObjectState::Active,\n        \"Inactive\" | \"inactive\" =\u003e ObjectState::Inactive,\n        \"Open\" | \"open\" =\u003e ObjectState::Open,\n        \"Closed\" | \"closed\" =\u003e ObjectState::Closed,\n        \"Destroyed\" | \"destroyed\" =\u003e ObjectState::Destroyed,\n        _ =\u003e return PredicateResult::unsatisfied(0.0),\n    };\n    if let Some(obj) = objects.iter().find(|o| o.id == obj_id) {\n        if obj.state == expected_state {\n            trace!(obj_id, ?expected_state, \"predicate ObjectInState satisfied\");\n            PredicateResult::satisfied()\n        } else {\n            PredicateResult::unsatisfied(0.0)\n        }\n    } else {\n        PredicateResult::unsatisfied(0.0)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::AgentConfig;\n\n    fn make_agent(id: u32, x: u16, y: u16) -\u003e Agent {\n        Agent::new(id, Position::new(x, y), \u0026AgentConfig::default())\n    }\n\n    fn make_ctx(agents: \u0026[Agent], tick: u64) -\u003e EvalContext\u003c'_\u003e {\n        EvalContext {\n            agents,\n            tick,\n            grid: None,\n            objects: None,\n        }\n    }\n\n    #[test]\n    fn test_agent_at_satisfied() {\n        let agents = vec![make_agent(0, 5, 5)];\n        let ctx = make_ctx(\u0026agents, 0);\n        let result = evaluate_predicate(\u0026Predicate::AgentAt(0, Position::new(5, 5)), \u0026ctx);\n        assert!(result.satisfied);\n        assert_eq!(result.progress, 1.0);\n    }\n\n    #[test]\n    fn test_agent_at_unsatisfied() {\n        let agents = vec![make_agent(0, 0, 0)];\n        let ctx = make_ctx(\u0026agents, 0);\n        let result = evaluate_predicate(\u0026Predicate::AgentAt(0, Position::new(5, 5)), \u0026ctx);\n        assert!(!result.satisfied);\n        assert!(result.progress \u003e 0.0); // some progress toward target\n    }\n\n    #[test]\n    fn test_agent_has_satisfied() {\n        let mut agents = vec![make_agent(0, 0, 0)];\n        agents[0].inventory.add_item(ItemType::Wood, 5);\n        let ctx = make_ctx(\u0026agents, 0);\n        let result = evaluate_predicate(\u0026Predicate::AgentHas(0, ItemType::Wood, 3), \u0026ctx);\n        assert!(result.satisfied);\n    }\n\n    #[test]\n    fn test_agent_has_partial_progress() {\n        let mut agents = vec![make_agent(0, 0, 0)];\n        agents[0].inventory.add_item(ItemType::Wood, 2);\n        let ctx = make_ctx(\u0026agents, 0);\n        let result = evaluate_predicate(\u0026Predicate::AgentHas(0, ItemType::Wood, 4), \u0026ctx);\n        assert!(!result.satisfied);\n        assert!((result.progress - 0.5).abs() \u003c 0.01);\n    }\n\n    #[test]\n    fn test_agent_near_satisfied() {\n        let agents = vec![make_agent(0, 5, 5), make_agent(1, 6, 5)];\n        let ctx = make_ctx(\u0026agents, 0);\n        let result = evaluate_predicate(\u0026Predicate::AgentNear(0, 1, 3), \u0026ctx);\n        assert!(result.satisfied);\n    }\n\n    #[test]\n    fn test_agent_near_unsatisfied() {\n        let agents = vec![make_agent(0, 0, 0), make_agent(1, 50, 50)];\n        let ctx = make_ctx(\u0026agents, 0);\n        let result = evaluate_predicate(\u0026Predicate::AgentNear(0, 1, 3), \u0026ctx);\n        assert!(!result.satisfied);\n    }\n\n    #[test]\n    fn test_time_elapsed() {\n        let agents = vec![];\n        let ctx = make_ctx(\u0026agents, 100);\n        let result = evaluate_predicate(\u0026Predicate::TimeElapsed(50), \u0026ctx);\n        assert!(result.satisfied);\n\n        let ctx2 = make_ctx(\u0026agents, 25);\n        let result2 = evaluate_predicate(\u0026Predicate::TimeElapsed(50), \u0026ctx2);\n        assert!(!result2.satisfied);\n        assert!((result2.progress - 0.5).abs() \u003c 0.01);\n    }\n\n    #[test]\n    fn test_health_above() {\n        let agents = vec![make_agent(0, 0, 0)]; // full health\n        let ctx = make_ctx(\u0026agents, 0);\n        let result = evaluate_predicate(\u0026Predicate::HealthAbove(0, 0.5), \u0026ctx);\n        assert!(result.satisfied);\n    }\n\n    #[test]\n    fn test_team_alive() {\n        let mut agents = vec![make_agent(0, 0, 0), make_agent(1, 5, 5)];\n        agents[0].team = 1;\n        agents[1].team = 1;\n        let ctx = make_ctx(\u0026agents, 0);\n        let result = evaluate_predicate(\u0026Predicate::TeamAlive(1), \u0026ctx);\n        assert!(result.satisfied);\n\n        // Kill one agent\n        let mut agents2 = agents.clone();\n        agents2[0].alive = false;\n        let ctx2 = make_ctx(\u0026agents2, 0);\n        let result2 = evaluate_predicate(\u0026Predicate::TeamAlive(1), \u0026ctx2);\n        assert!(!result2.satisfied);\n        assert!((result2.progress - 0.5).abs() \u003c 0.01);\n    }\n\n    #[test]\n    fn test_unknown_agent() {\n        let agents = vec![make_agent(0, 0, 0)];\n        let ctx = make_ctx(\u0026agents, 0);\n        let result = evaluate_predicate(\u0026Predicate::AgentAt(99, Position::new(0, 0)), \u0026ctx);\n        assert!(!result.satisfied);\n        assert_eq!(result.progress, 0.0);\n    }\n\n    // ---- AgentOnTerrain tests ----\n\n    #[test]\n    fn test_agent_on_terrain_satisfied() {\n        let agents = vec![make_agent(0, 3, 3)];\n        let mut grid = Grid::new(16, 16);\n        grid.get_mut(3, 3).unwrap().terrain = TerrainType::Forest;\n        let ctx = EvalContext {\n            agents: \u0026agents,\n            tick: 0,\n            grid: Some(\u0026grid),\n            objects: None,\n        };\n        // Forest = terrain_id 6\n        let result = evaluate_predicate(\u0026Predicate::AgentOnTerrain(0, 6), \u0026ctx);\n        assert!(result.satisfied);\n    }\n\n    #[test]\n    fn test_agent_on_terrain_unsatisfied() {\n        let agents = vec![make_agent(0, 3, 3)];\n        let grid = Grid::new(16, 16); // all Ground = 0\n        let ctx = EvalContext {\n            agents: \u0026agents,\n            tick: 0,\n            grid: Some(\u0026grid),\n            objects: None,\n        };\n        // Forest = terrain_id 6, but agent is on Ground\n        let result = evaluate_predicate(\u0026Predicate::AgentOnTerrain(0, 6), \u0026ctx);\n        assert!(!result.satisfied);\n    }\n\n    #[test]\n    fn test_agent_on_terrain_no_grid() {\n        let agents = vec![make_agent(0, 3, 3)];\n        let ctx = make_ctx(\u0026agents, 0); // grid is None\n        let result = evaluate_predicate(\u0026Predicate::AgentOnTerrain(0, 0), \u0026ctx);\n        assert!(!result.satisfied);\n        assert_eq!(result.progress, 0.0);\n    }\n\n    // ---- ObjectAt tests ----\n\n    #[test]\n    fn test_object_at_satisfied() {\n        use forge_types::entity::ObjectType;\n        let agents = vec![];\n        let objects = vec![Object {\n            id: 0,\n            position: Position::new(5, 5),\n            object_type: ObjectType::Boulder,\n            mass: 65536,\n            durability: 655360,\n            state: ObjectState::Active,\n        }];\n        let ctx = EvalContext {\n            agents: \u0026agents,\n            tick: 0,\n            grid: None,\n            objects: Some(\u0026objects),\n        };\n        let result = evaluate_predicate(\u0026Predicate::ObjectAt(0, Position::new(5, 5)), \u0026ctx);\n        assert!(result.satisfied);\n    }\n\n    #[test]\n    fn test_object_at_unsatisfied() {\n        use forge_types::entity::ObjectType;\n        let agents = vec![];\n        let objects = vec![Object {\n            id: 0,\n            position: Position::new(1, 1),\n            object_type: ObjectType::Boulder,\n            mass: 65536,\n            durability: 655360,\n            state: ObjectState::Active,\n        }];\n        let ctx = EvalContext {\n            agents: \u0026agents,\n            tick: 0,\n            grid: None,\n            objects: Some(\u0026objects),\n        };\n        let result = evaluate_predicate(\u0026Predicate::ObjectAt(0, Position::new(5, 5)), \u0026ctx);\n        assert!(!result.satisfied);\n        assert!(result.progress \u003e 0.0); // partial progress from proximity\n    }\n\n    #[test]\n    fn test_object_at_no_objects() {\n        let agents = vec![];\n        let ctx = make_ctx(\u0026agents, 0); // objects is None\n        let result = evaluate_predicate(\u0026Predicate::ObjectAt(0, Position::new(5, 5)), \u0026ctx);\n        assert!(!result.satisfied);\n        assert_eq!(result.progress, 0.0);\n    }\n\n    // ---- ObjectInState tests ----\n\n    #[test]\n    fn test_object_in_state_satisfied() {\n        use forge_types::entity::ObjectType;\n        let agents = vec![];\n        let objects = vec![Object {\n            id: 0,\n            position: Position::new(0, 0),\n            object_type: ObjectType::Door,\n            mass: 65536,\n            durability: 655360,\n            state: ObjectState::Open,\n        }];\n        let ctx = EvalContext {\n            agents: \u0026agents,\n            tick: 0,\n            grid: None,\n            objects: Some(\u0026objects),\n        };\n        let result = evaluate_predicate(\u0026Predicate::ObjectInState(0, \"Open\".to_string()), \u0026ctx);\n        assert!(result.satisfied);\n    }\n\n    #[test]\n    fn test_object_in_state_unsatisfied() {\n        use forge_types::entity::ObjectType;\n        let agents = vec![];\n        let objects = vec![Object {\n            id: 0,\n            position: Position::new(0, 0),\n            object_type: ObjectType::Door,\n            mass: 65536,\n            durability: 65 \n//! ```\n\npub use crate::composer::evaluate_composition;\npub use crate::curriculum::CurriculumController;\npub use crate::evaluator::evaluate_tasks;\npub use crate::generator::{generate_task, TaskGenConfig};\npub use crate::predicate::evaluate_predicate;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-types","src","action.rs"],"content":"//! Action types and action space definitions for the FORGE simulation.\n//!\n//! Actions are the interface through which agents interact with the world.\n//! The discrete action space is designed for efficient GPU batching.\n\nuse serde::{Deserialize, Serialize};\n\nuse crate::entity::CommToken;\nuse crate::grid::Direction;\n\n/// An action that an agent can take in a single tick.\n#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[non_exhaustive]\npub enum Action {\n    /// Do nothing this tick.\n    Noop,\n    /// Move one tile in the given direction.\n    Move(Direction),\n    /// Pick up an item or object at the current position.\n    PickUp,\n    /// Drop an item from the given inventory slot.\n    Drop(u8),\n    /// Use an item from the given inventory slot.\n    Use(u8),\n    /// Craft an item using the given recipe index.\n    Craft(u16),\n    /// Push an object in the given direction.\n    Push(Direction),\n    /// Emit a communication token.\n    Communicate(CommToken),\n    /// Context-sensitive interaction with adjacent tile.\n    Interact,\n}\n\nimpl Action {\n    /// Converts a flat integer action index to an Action.\n    ///\n    /// The encoding is:\n    ///   0: Noop\n    ///   1-4: Move (Up, Down, Left, Right)\n    ///   5: PickUp\n    ///   6-15: Drop(slot 0-9)\n    ///   16-25: Use(slot 0-9)\n    ///   26-34: Craft(recipe 0-8)\n    ///   35-38: Push (Up, Down, Left, Right)\n    ///   39: Interact\n    ///   40+: Communication tokens\n    pub fn from_discrete(action_id: u32, comm_vocab_size: u16) -\u003e Option\u003cAction\u003e {\n        match action_id {\n            0 =\u003e Some(Action::Noop),\n            1 =\u003e Some(Action::Move(Direction::Up)),\n            2 =\u003e Some(Action::Move(Direction::Down)),\n            3 =\u003e Some(Action::Move(Direction::Left)),\n            4 =\u003e Some(Action::Move(Direction::Right)),\n            5 =\u003e Some(Action::PickUp),\n            6..=15 =\u003e Some(Action::Drop((action_id - 6) as u8)),\n            16..=25 =\u003e Some(Action::Use((action_id - 16) as u8)),\n            26..=34 =\u003e Some(Action::Craft((action_id - 26) as u16)),\n            35 =\u003e Some(Action::Push(Direction::Up)),\n            36 =\u003e Some(Action::Push(Direction::Down)),\n            37 =\u003e Some(Action::Push(Direction::Left)),\n            38 =\u003e Some(Action::Push(Direction::Right)),\n            39 =\u003e Some(Action::Interact),\n            n if n \u003e= 40 \u0026\u0026 (n - 40) \u003c comm_vocab_size as u32 =\u003e {\n                Some(Action::Communicate((n - 40) as CommToken))\n            }\n            _ =\u003e None,\n        }\n    }\n\n    /// Converts an Action to its discrete integer representation.\n    pub fn to_discrete(\u0026self) -\u003e u32 {\n        match self {\n            Action::Noop =\u003e 0,\n            Action::Move(Direction::Up) =\u003e 1,\n            Action::Move(Direction::Down) =\u003e 2,\n            Action::Move(Direction::Left) =\u003e 3,\n            Action::Move(Direction::Right) =\u003e 4,\n            Action::PickUp =\u003e 5,\n            Action::Drop(slot) =\u003e 6 + *slot as u32,\n            Action::Use(slot) =\u003e 16 + *slot as u32,\n            Action::Craft(recipe) =\u003e 26 + *recipe as u32,\n            Action::Push(Direction::Up) =\u003e 35,\n            Action::Push(Direction::Down) =\u003e 36,\n            Action::Push(Direction::Left) =\u003e 37,\n            Action::Push(Direction::Right) =\u003e 38,\n            Action::Interact =\u003e 39,\n            Action::Communicate(token) =\u003e 40 + *token as u32,\n        }\n    }\n\n    /// Returns the total size of the discrete action space.\n    pub fn space_size(comm_vocab_size: u16) -\u003e u32 {\n        40 + comm_vocab_size as u32\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_action_discrete_roundtrip() {\n        let vocab_size = 16;\n        let actions = vec![\n            Action::Noop,\n            Action::Move(Direction::Up),\n            Action::Move(Direction::Down),\n            Action::Move(Direction::Left),\n            Action::Move(Direction::Right),\n            Action::PickUp,\n            Action::Drop(0),\n            Action::Drop(5),\n            Action::Use(0),\n            Action::Use(9),\n            Action::Craft(0),\n            Action::Craft(4),\n            Action::Craft(8),\n            Action::Push(Direction::Up),\n            Action::Push(Direction::Right),\n            Action::Interact,\n            Action::Communicate(0),\n            Action::Communicate(15),\n        ];\n\n        for action in actions {\n            let discrete = action.to_discrete();\n            let recovered = Action::from_discrete(discrete, vocab_size).unwrap();\n            assert_eq!(action, recovered, \"roundtrip failed for {:?}\", action);\n        }\n    }\n\n    #[test]\n    fn test_action_space_size() {\n        assert_eq!(Action::space_size(0), 40);\n        assert_eq!(Action::space_size(16), 56);\n        assert_eq!(Action::space_size(256), 296);\n    }\n\n    #[test]\n    fn test_invalid_discrete_action() {\n        assert!(Action::from_discrete(1000, 16).is_none());\n    }\n\n    #[test]\n    fn test_noop_is_zero() {\n        assert_eq!(Action::Noop.to_discrete(), 0);\n    }\n}\n","traces":[{"line":48,"address":[1626480],"length":1,"stats":{"Line":3}},{"line":49,"address":[8164821],"length":1,"stats":{"Line":3}},{"line":50,"address":[8588269],"length":1,"stats":{"Line":3}},{"line":51,"address":[1626575],"length":1,"stats":{"Line":3}},{"line":52,"address":[81415
