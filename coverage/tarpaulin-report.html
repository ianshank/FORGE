le":87},{"path":["/","home","user","FORGE","crates","forge-core","src","visibility.rs"],"content":"//! Visibility system: fog-of-war and line-of-sight.\n//!\n//! Updates tile visibility states based on agent positions and vision radii,\n//! using Bresenham-based ray casting for line-of-sight checks.\n\nuse forge_types::entity::Agent;\nuse forge_types::grid::{Grid, VisibilityState};\nuse tracing::{instrument, trace};\n\nuse crate::day_night;\n\n/// Updates visibility state for all tiles based on agent positions and vision radii.\n///\n/// Process:\n/// 1. Mark all currently Visible tiles as Explored (they were seen before)\n/// 2. For each alive agent, compute effective vision radius (base * day/night modifier)\n/// 3. Cast rays to all tiles within the effective radius\n/// 4. If the ray reaches the tile without hitting vision-blocking terrain, mark it Visible\n///\n/// Vision is blocked by tiles where `terrain.blocks_vision()` returns true.\n/// The `day_phase` parameter controls vision range: day = full, dawn/dusk = 75%, night = 50%.\n#[instrument(skip_all)]\npub fn update_visibility(agents: \u0026[Agent], grid: \u0026mut Grid, day_phase: u8) {\n    // Step 1: Demote all Visible tiles to Explored\n    for tile in grid.tiles.iter_mut() {\n        if tile.visibility == VisibilityState::Visible {\n            tile.visibility = VisibilityState::Explored;\n        }\n    }\n\n    // Step 2: For each alive agent, reveal tiles within effective vision radius with line-of-sight\n    let modifier = day_night::vision_modifier(day_phase);\n\n    for agent in agents {\n        if !agent.alive {\n            continue;\n        }\n\n        let ax = agent.position.x as i32;\n        let ay = agent.position.y as i32;\n        // Apply day/night vision modifier to base vision radius\n        let effective_radius = (agent.vision_radius as f32 * modifier).round() as i32;\n        let vr = effective_radius.max(0);\n\n        trace!(\n            agent_id = agent.id,\n            x = ax,\n            y = ay,\n            base_radius = agent.vision_radius,\n            effective_radius = vr,\n            day_phase = day_phase,\n            \"updating visibility\"\n        );\n\n        for dy in -vr..=vr {\n            for dx in -vr..=vr {\n                let tx = ax + dx;\n                let ty = ay + dy;\n\n                // Check within vision radius (Chebyshev / square area — we use\n                // the radius as a bounding box, but also check Euclidean distance\n                // squared to get a circular field of view)\n                if dx * dx + dy * dy \u003e vr * vr {\n                    continue;\n                }\n\n                // Check bounds\n                if tx \u003c 0 || ty \u003c 0 || tx \u003e= grid.width as i32 || ty \u003e= grid.height as i32 {\n                    continue;\n                }\n\n                // Check line of sight from agent to target tile\n                if has_line_of_sight(grid, ax, ay, tx, ty) {\n                    let tile = grid.get_mut(tx as u16, ty as u16).unwrap();\n                    tile.visibility = VisibilityState::Visible;\n                }\n            }\n        }\n    }\n}\n\n/// Checks line of sight between two positions using Bresenham's line algorithm.\n///\n/// Only intermediate tiles are checked for vision blockers — the start and end\n/// tiles themselves are not considered blocking. This means an agent can always\n/// see its own tile, and can see a wall tile (but not through it).\nfn has_line_of_sight(grid: \u0026Grid, x0: i32, y0: i32, x1: i32, y1: i32) -\u003e bool {\n    // Same tile — always visible\n    if x0 == x1 \u0026\u0026 y0 == y1 {\n        return true;\n    }\n\n    let dx = (x1 - x0).abs();\n    let dy = (y1 - y0).abs();\n    let sx = if x0 \u003c x1 { 1 } else { -1 };\n    let sy = if y0 \u003c y1 { 1 } else { -1 };\n    let mut err = dx - dy;\n\n    let mut cx = x0;\n    let mut cy = y0;\n\n    loop {\n        let e2 = 2 * err;\n        if e2 \u003e -dy {\n            err -= dy;\n            cx += sx;\n        }\n        if e2 \u003c dx {\n            err += dx;\n            cy += sy;\n        }\n\n        // If we've reached the target, line of sight is clear\n        if cx == x1 \u0026\u0026 cy == y1 {\n            return true;\n        }\n\n        // Check if intermediate tile blocks vision\n        if cx \u003e= 0 \u0026\u0026 cy \u003e= 0 \u0026\u0026 cx \u003c grid.width as i32 \u0026\u0026 cy \u003c grid.height as i32 {\n            if let Some(tile) = grid.get(cx as u16, cy as u16) {\n                if tile.terrain.blocks_vision() {\n                    return false;\n                }\n            }\n        } else {\n            // Out of bounds — treat as blocked\n            return false;\n        }\n    }\n}\n\n/// Generates an ego-centric visibility mask for an agent.\n///\n/// Returns a flat `Vec\u003cbool\u003e` of `(2*radius+1)^2` elements, row-major.\n/// Each element is `true` if the corresponding tile is currently Visible,\n/// `false` otherwise (Hidden, Explored, or out of bounds).\n#[instrument(skip_all)]\npub fn visibility_mask(agent: \u0026Agent, grid: \u0026Grid) -\u003e Vec\u003cbool\u003e {\n    let vr = agent.vision_radius as i32;\n    let side = (2 * vr + 1) as usize;\n    let mut mask = vec![false; side * side];\n\n    let ax = agent.position.x as i32;\n    let ay = agent.position.y as i32;\n\n    for dy in -vr..=vr {\n        for dx in -vr..=vr {\n            let wx = ax + dx;\n            let wy = ay + dy;\n\n            let idx = ((dy + vr) as usize) * side + (dx + vr) as usize;\n\n            if wx \u003e= 0 \u0026\u0026 wy \u003e= 0 \u0026\u0026 wx \u003c grid.width as i32 \u0026\u0026 wy \u003c grid.height as i32 {\n                if let Some(tile) = grid.get(wx as u16, wy as u16) {\n                    mask[idx] = tile.visibility == VisibilityState::Visible;\n                }\n            }\n        }\n    }\n\n    mask\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::AgentConfig;\n    use forge_types::constants::{DAY_PHASE_DAWN, DAY_PHASE_DAY, DAY_PHASE_NIGHT};\n    use forge_types::entity::Agent;\n    use forge_types::grid::{Grid, Position, TerrainType, VisibilityState};\n\n    fn make_agent(id: u32, x: u16, y: u16) -\u003e Agent {\n        let config = AgentConfig::default();\n        Agent::new(id, Position::new(x, y), \u0026config)\n    }\n\n    fn make_grid(width: u16, height: u16) -\u003e Grid {\n        Grid::new(width, height)\n    }\n\n    #[test]\n    fn test_agent_sees_own_tile() {\n        let mut grid = make_grid(16, 16);\n        let agent = make_agent(0, 5, 5);\n\n        update_visibility(\u0026[agent], \u0026mut grid, DAY_PHASE_DAY);\n\n        let tile = grid.get(5, 5).unwrap();\n        assert_eq!(tile.visibility, VisibilityState::Visible);\n    }\n\n    #[test]\n    fn test_vision_radius_limit() {\n        let mut grid = make_grid(32, 32);\n        let mut agent = make_agent(0, 15, 15);\n        agent.vision_radius = 3;\n\n        update_visibility(\u0026[agent], \u0026mut grid, DAY_PHASE_DAY);\n\n        // Tile within radius should be visible\n        assert_eq!(\n            grid.get(16, 15).unwrap().visibility,\n            VisibilityState::Visible\n        );\n\n        // Tile well beyond radius should be hidden\n        assert_eq!(\n            grid.get(25, 25).unwrap().visibility,\n            VisibilityState::Hidden\n        );\n    }\n\n    #[test]\n    fn test_wall_blocks_vision() {\n        let mut grid = make_grid(16, 16);\n        // Place a wall between agent and target\n        grid.get_mut(7, 5).unwrap().terrain = TerrainType::Wall;\n\n        let mut agent = make_agent(0, 5, 5);\n        agent.vision_radius = 5;\n\n        update_visibility(\u0026[agent], \u0026mut grid, DAY_PHASE_DAY);\n\n        // The wall tile itself should be visible (we can see walls)\n        assert_eq!(grid.get(7, 5).unwrap().visibility, VisibilityState::Visible);\n\n        // Tile behind the wall should remain hidden (blocked line of sight)\n        assert_eq!(grid.get(9, 5).unwrap().visibility, VisibilityState::Hidden);\n    }\n\n    #[test]\n    fn test_explored_tiles_remain() {\n        let mut grid = make_grid(16, 16);\n        let mut agent = make_agent(0, 5, 5);\n        agent.vision_radius = 2;\n\n        // First pass: agent at (5,5) reveals nearby tiles\n        update_visibility(\u0026[agent.clone()], \u0026mut grid, DAY_PHASE_DAY);\n        assert_eq!(grid.get(5, 5).unwrap().visibility, VisibilityState::Visible);\n\n        // Move agent away\n        agent.position = Position::new(12, 12);\n\n        // Second pass: old tiles should become Explored, not Hidden\n        update_visibility(\u0026[agent], \u0026mut grid, DAY_PHASE_DAY);\n\n        assert_eq!(\n            grid.get(5, 5).unwrap().visibility,\n            VisibilityState::Explored\n        );\n        assert_eq!(\n            grid.get(12, 12).unwrap().visibility,\n            VisibilityState::Visible\n        );\n    }\n\n    #[test]\n    fn test_hidden_tiles_default() {\n        let grid = make_grid(8, 8);\n        for tile in \u0026grid.tiles {\n            assert_eq!(tile.visibility, VisibilityState::Hidden);\n        }\n    }\n\n    #[test]\n    fn test_multiple_agents_visibility() {\n        let mut grid = make_grid(32, 32);\n        let mut a1 = make_agent(0, 5, 5);\n        a1.vision_radius = 2;\n        let mut a2 = make_agent(1, 20, 20);\n        a2.vision_radius = 2;\n\n        update_visibility(\u0026[a1, a2], \u0026mut grid, DAY_PHASE_DAY);\n\n        // Both agents' own tiles should be visible\n        assert_eq!(grid.get(5, 5).unwrap().visibility, VisibilityState::Visible);\n        assert_eq!(\n            grid.get(20, 20).unwrap().visibility,\n            VisibilityState::Visible\n        );\n\n        // A tile far from both should remain hidden\n        assert_eq!(\n            grid.get(15, 15).unwrap().visibility,\n            VisibilityState::Hidden\n        );\n    }\n\n    #[test]\n    fn test_dead_agent_no_vision() {\n        let mut grid = make_grid(16, 16);\n        let mut agent = make_agent(0, 5, 5);\n        agent.alive = false;\n\n        update_visibility(\u0026[agent], \u0026mut grid, DAY_PHASE_DAY);\n\n        // Dead agent should not reveal any tiles\n        assert_eq!(grid.get(5, 5).unwrap().visibility, VisibilityState::Hidden);\n    }\n\n    #[test]\n    fn test_visibility_mask_shape() {\n        let mut grid = make_grid(32, 32);\n        let mut agent = make_agent(0, 15, 15);\n        agent.vision_radius = 3;\n\n        update_visibility(\u0026[agent.clone()], \u0026mut grid, DAY_PHASE_DAY);\n\n        let mask = visibility_mask(\u0026agent, \u0026grid);\n        let side = 2 * 3 + 1;\n        assert_eq!(mask.len(), side * side);\n\n        // Center of mask (agent's tile) should be true\n        let center = 3 * side + 3;\n        assert!(mask[center]);\n    }\n\n    #[test]\n    fn test_line_of_sight_clear() {\n        let grid = make_grid(16, 16);\n        // All ground tiles — should have clear line of sight\n        assert!(has_line_of_sight(\u0026grid, 5, 5, 8, 7));\n    }\n\n    #[test]\n    fn test_line_of_sight_blocked() {\n        let mut grid = make_grid(16, 16);\n        grid.get_mut(7, 5).unwrap().terrain = TerrainType::Wall;\n\n        // Line from (5,5) to (9,5) passes through the wall at (7,5)\n        assert!(!has_line_of_sight(\u0026grid, 5, 5, 9, 5));\n    }\n\n    // ---- Edge case tests ----\n\n    #[test]\n    fn test_vision_radius_zero() {\n        let mut grid = make_grid(16, 16);\n        let mut agent = make_agent(0, 5, 5);\n        agent.vision_radius = 0;\n\n        update_visibility(\u0026[agent.clone()], \u0026mut grid, DAY_PHASE_DAY);\n\n        // Agent should see only its own tile\n        assert_eq!(grid.get(5, 5).unwrap().visibility, VisibilityState::Visible);\n\n        // Adjacent tiles should remain hidden\n        assert_eq!(grid.get(5, 4).unwrap().visibility, VisibilityState::Hidden);\n        assert_eq!(grid.get(5, 6).unwrap().visibility, VisibilityState::Hidden);\n        assert_eq!(grid.get(4, 5).unwrap().visibility, VisibilityState::Hidden);\n        assert_eq!(grid.get(6, 5).unwrap().visibility, VisibilityState::Hidden);\n\n        // Visibility mask for radius 0 should be a single element\n        let mask = visibility_mask(\u0026agent, \u0026grid);\n        assert_eq!(mask.len(), 1);\n        assert!(mask[0]);\n    }\n\n    #[test]\n    fn test_agent_at_origin_visibility() {\n        let mut grid = make_grid(16, 16);\n        let mut agent = make_agent(0, 0, 0);\n        agent.vision_radius = 3;\n\n        update_visibility(\u0026[agent.clone()], \u0026mut grid, DAY_PHASE_DAY);\n\n        // Own tile should be visible\n        assert_eq!(grid.get(0, 0).unwrap().visibility, VisibilityState::Visible);\n\n        // Some tiles within radius that are in bounds should be visible\n        assert_eq!(grid.get(1, 0).unwrap().visibility, VisibilityState::Visible);\n        assert_eq!(grid.get(0, 1).unwrap().visibility, VisibilityState::Visible);\n        assert_eq!(grid.get(2, 2).unwrap().visibility, VisibilityState::Visible);\n\n        // Tiles far away should be hidden\n        assert_eq!(\n            grid.get(10, 10).unwrap().visibility,\n            VisibilityState::Hidden\n        );\n\n        // Mask should still be correct shape\n        let mask = visibility_mask(\u0026agent, \u0026grid);\n        let side = (2 * 3 + 1) as usize;\n        assert_eq!(mask.len(), side * side);\n        // Center of mask (which represents agent pos) should be visible\n        let center = 3 * side + 3;\n        assert!(mask[center]);\n    }\n\n    #[test]\n    fn test_diagonal_line_of_sight() {\n        let grid = make_grid(16, 16);\n\n        // Diagonal line of sight across open terrain should be clear\n        assert!(has_line_of_sight(\u0026grid, 3, 3, 7, 7));\n        assert!(has_line_of_sight(\u0026grid, 7, 7, 3, 3));\n        assert!(has_line_of_sight(\u0026grid, 3, 7, 7, 3));\n        assert!(has_line_of_sight(\u0026grid, 7, 3, 3, 7));\n    }\n\n    #[test]\n    fn test_diagonal_line_of_sight_blocked() {\n        let mut grid = make_grid(16, 16);\n        // Place a wall on the diagonal path from (3,3) to (7,7)\n        grid.get_mut(5, 5).unwrap().terrain = TerrainType::Wall;\n\n        assert!(!has_line_of_sight(\u0026grid, 3, 3, 7, 7));\n    }\n\n    #[test]\n    fn test_line_of_sight_same_tile() {\n        let grid = make_grid(16, 16);\n        // Same tile should always be visible\n        assert!(has_line_of_sight(\u0026grid, 5, 5, 5, 5));\n    }\n\n    #[test]\n    fn test_line_of_sight_adjacent() {\n        let grid = make_grid(16, 16);\n        // Adjacent tiles should have clear LOS on open terrain\n        assert!(has_line_of_sight(\u0026grid, 5, 5, 5, 6));\n        assert!(has_line_of_sight(\u0026grid, 5, 5, 5, 4));\n        assert!(has_line_of_sight(\u0026grid, 5, 5, 6, 5));\n        assert!(has_line_of_sight(\u0026grid, 5, 5, 4, 5));\n    }\n\n    #[test]\n    fn test_visibility_uses_euclidean_radius() {\n        let mut grid = make_grid(32, 32);\n        let mut agent = make_agent(0, 15, 15);\n        agent.vision_radius = 3;\n\n        update_visibility(\u0026[agent], \u0026mut grid, DAY_PHASE_DAY);\n\n        // (15 + 3, 15 + 3) =\u003e dx=3, dy=3 =\u003e dist^2 = 18 \u003e 9 = radius^2\n        // So corners of the bounding box should NOT be visible\n        assert_eq!(\n            grid.get(18, 18).unwrap().visibility,\n            VisibilityState::Hidden,\n            \"corner of bounding box should be outside Euclidean radius\"\n        );\n\n        // (15 + 3, 15) =\u003e dx=3, dy=0 =\u003e dist^2 = 9 \u003c= 9 =\u003e visible\n        assert_eq!(\n            grid.get(18, 15).unwrap().visibility,\n            VisibilityState::Visible,\n            \"tile at exact radius along axis should be visible\"\n        );\n    }\n\n    #[test]\n    fn test_visibility_mask_at_corner() {\n        let mut grid = make_grid(16, 16);\n        let mut agent = make_agent(0, 0, 0);\n        agent.vision_radius = 2;\n\n        update_visibility(\u0026[agent.clone()], \u0026mut grid, DAY_PHASE_DAY);\n\n        let mask = visibility_mask(\u0026agent, \u0026grid);\n        let side = (2 * 2 + 1) as usize; // 5\n        assert_eq!(mask.len(), side * side);\n\n        // Center (agent's own tile) should be true\n        let center = 2 * side + 2;\n        assert!(mask[center]);\n\n        // Top-left corner of mask (offset -2,-2 from agent at 0,0 =\u003e world (-2,-2)) is OOB\n        assert!(!mask[0], \"out-of-bounds tile should be false in mask\");\n    }\n\n    #[test]\n    fn test_mountain_blocks_vision() {\n        let mut grid = make_grid(16, 16);\n        grid.get_mut(7, 5).unwrap().terrain = TerrainType::Mountain;\n\n        let mut agent = make_agent(0, 5, 5);\n        agent.vision_radius = 5;\n\n        update_visibility(\u0026[agent], \u0026mut grid, DAY_PHASE_DAY);\n\n        // Mountain itself should be visible\n        assert_eq!(grid.get(7, 5).unwrap().visibility, VisibilityState::Visible);\n\n        // Tile behind the mountain should be hidden\n        assert_eq!(grid.get(9, 5).unwrap().visibility, VisibilityState::Hidden);\n    }\n\n    // ---- Day/night vision modifier tests ----\n\n    #[test]\n    fn test_night_reduces_vision_radius() {\n        let mut grid = make_grid(32, 32);\n        let mut agent = make_agent(0, 15, 15);\n        agent.vision_radius = 6; // night modifier 0.5 → effective radius 3\n\n        update_visibility(\u0026[agent], \u0026mut grid, DAY_PHASE_NIGHT);\n\n        // Tile at distance 3 along axis should be visible (effective radius = 3)\n        assert_eq!(\n            grid.get(18, 15).unwrap().visibility,\n            VisibilityState::Visible,\n            \"tile at effective night radius should be visible\"\n        );\n\n        // Tile at distance 5 along axis should be hidden (beyond effective radius)\n        assert_eq!(\n            grid.get(20, 15).unwrap().visibility,\n            VisibilityState::Hidden,\n            \"tile beyond effective night radius should be hidden\"\n        );\n    }\n\n    #[test]\n    fn test_dawn_reduces_vision_radius() {\n        let mut grid = make_grid(32, 32);\n        let mut agent = make_agent(0, 15, 15);\n        agent.vision_radius = 4; // dawn modifier 0.75 → effective radius 3\n\n        update_visibility(\u0026[agent], \u0026mut grid, DAY_PHASE_DAWN);\n\n        // Tile at distance 3 along axis should be visible\n        assert_eq!(\n            grid.get(18, 15).unwrap().visibility,\n            VisibilityState::Visible,\n            \"tile at effective dawn radius should be visible\"\n        );\n\n        // Tile at distance 4 along axis should be hidden\n        assert_eq!(\n            grid.get(19, 15).unwrap().visibility,\n            VisibilityState::Hidden,\n            \"tile beyond effective dawn radius should be hidden\"\n        );\n    }\n\n    #[test]\n    fn test_day_full_vision_radius() {\n        let mut grid = make_grid(32, 32);\n        let mut agent = make_agent(0, 15, 15);\n        agent.vision_radius = 4;\n\n        update_visibility(\u0026[agent], \u0026mut grid, DAY_PHASE_DAY);\n\n        // Tile at full radius should be visible during day\n        assert_eq!(\n            grid.get(19, 15).unwrap().visibility,\n            VisibilityState::Visible,\n            \"tile at full day radius should be visible\"\n        );\n    }\n\n    #[test]\n    fn test_night_vision_radius_zero_still_sees_own_tile() {\n        let mut grid = make_grid(16, 16);\n        let mut agent = make_agent(0, 5, 5);\n        agent.vision_radius = 1; // night modifier 0.5 → rounds to 1, still sees adjacent\n\n        update_visibility(\u0026[agent.clone()], \u0026mut grid, DAY_PHASE_NIGHT);\n\n        // Agent should always see own tile regardless of phase\n        assert_eq!(\n            grid.get(5, 5).unwrap().visibility,\n            VisibilityState::Visible,\n            \"agent should always see own tile at night\"\n        );\n    }\n\n    #[test]\n    fn test_fog_of_war_persists_with_day_night_transition() {\n        let mut grid = make_grid(32, 32);\n        let mut agent = make_agent(0, 15, 15);\n        agent.vision_radius = 6;\n\n        // Day pass: full radius 6, tiles up to distance 6 are visible\n        update_visibility(\u0026[agent.clone()], \u0026mut grid, DAY_PHASE_DAY);\n        assert_eq!(\n            grid.get(21, 15).unwrap().visibility,\n            VisibilityState::Visible\n        );\n\n        // Night pass: effective radius 3, far tiles become Explored\n        update_visibility(\u0026[agent], \u0026mut grid, DAY_PHASE_NIGHT);\n        assert_eq!(\n            grid.get(21, 15).unwrap().visibility,\n            VisibilityState::Explored,\n            \"tiles beyond night radius should become Explored, not Hidden\"\n        );\n    }\n}\n","traces":[{"line":23,"address":[3574016,3577265,3577271],"length":1,"stats":{"Line":7}},{"line":25,"address":[3574906,3574186],"length":1,"stats":{"Line":12}},{"line":26,"address":[3600630,3598498,3600609],"length":1,"stats":{"Line":19}},{"line":27,"address":[3577234],"length":1,"stats":{"Line":5}},{"line":32,"address":[3598526],"length":1,"stats":{"Line":7}},{"line":34,"address":[3598588],"length":1,"stats":{"Line":6}},{"line":35,"address":[3575353],"length":1,"stats":{"Line":6}},{"line":39,"address":[3575500],"length":1,"stats":{"Line":7}},{"line":40,"address":[3575511],"length":1,"stats":{"Line":7}},{"line":42,"address":[4014274],"length":1,"stats":{"Line":7}},{"line":43,"address":[4014349],"length":1,"stats":{"Line":6}},{"line":45,"address":[3575629,3575932],"length":1,"stats":{"Line":9}},{"line":55,"address":[3060778,3061184],"length":1,"stats":{"Line":13}},{"line":56,"address":[3576509],"length":1,"stats":{"Line":8}},{"line":57,"address":[3600157,3600108],"length":1,"stats":{"Line":7}},{"line":58,"address":[4015546,4015567,4015499],"length":1,"stats":{"Line":14}},{"line":63,"address":[4015592,4015553],"length":1,"stats":{"Line":14}},{"line":68,"address":[3061851],"length":1,"stats":{"Line":8}},{"line":73,"address":[4015957,4015846],"length":1,"stats":{"Line":14}},{"line":74,"address":[3577148],"length":1,"stats":{"Line":9}},{"line":75,"address":[4015953],"length":1,"stats":{"Line":6}},{"line":87,"address":[3596624],"length":1,"stats":{"Line":11}},{"line":89,"address":[3573286,3573319],"length":1,"stats":{"Line":16}},{"line":90,"address":[4012075],"length":1,"stats":{"Line":10}},{"line":93,"address":[3596768,3596690,3596729],"length":1,"stats":{"Line":15}},{"line":94,"address":[3596817,3596755,3596785],"length":1,"stats":{"Line":15}},{"line":95,"address":[3596811,3596830],"length":1,"stats":{"Line":13}},{"line":96,"address":[4012216],"length":1,"stats":{"Line":7}},{"line":97,"address":[3596886,3596923],"length":1,"stats":{"Line":8}},{"line":99,"address":[3596913],"length":1,"stats":{"Line":7}},{"line":100,"address":[4012277],"length":1,"stats":{"Line":6}},{"line":102,"address":[3058425],"length":1,"stats":{"Line":8}},{"line":103,"address":[3596979,3596936],"length":1,"stats":{"Line":9}},{"line":104,"address":[3597104,3597000,3596970],"length":1,"stats":{"Line":22}},{"line":105,"address":[3597083,3597041],"length":1,"stats":{"Line":8}},{"line":106,"address":[3573672,3573714,3573708],"length":1,"stats":{"Line":13}},{"line":108,"address":[3573804,3573639],"length":1,"stats":{"Line":12}},{"line":109,"address":[4012495,4012535],"length":1,"stats":{"Line":7}},{"line":110,"address":[3597156,3597192,3597198],"length":1,"stats":{"Line":16}},{"line":114,"address":[4012483,4012584],"length":1,"stats":{"Line":15}},{"line":115,"address":[4012590],"length":1,"stats":{"Line":6}},{"line":119,"address":[3058715,3058748],"length":1,"stats":{"Line":14}},{"line":120,"address":[4012650,4012724],"length":1,"stats":{"Line":15}},{"line":121,"address":[3597377],"length":1,"stats":{"Line":7}},{"line":122,"address":[3574004],"length":1,"stats":{"Line":1}},{"line":127,"address":[4012597],"length":1,"stats":{"Line":0}},{"line":138,"address":[3596591,3596563,3594320],"length":1,"stats":{"Line":1}},{"line":139,"address":[3594481],"length":1,"stats":{"Line":1}},{"line":140,"address":[3571817,3571107,3571888],"length":1,"stats":{"Line":2}},{"line":141,"address":[3595303,3595262],"length":1,"stats":{"Line":3}},{"line":143,"address":[3571965],"length":1,"stats":{"Line":3}},{"line":144,"address":[3595372],"length":1,"stats":{"Line":3}},{"line":146,"address":[3056919,3057033],"length":1,"stats":{"Line":4}},{"line":147,"address":[3595831,3595635],"length":1,"stats":{"Line":4}},{"line":148,"address":[3572630,3572673],"length":1,"stats":{"Line":1}},{"line":149,"address":[3596052,3596101,3596121],"length":1,"stats":{"Line":4}},{"line":151,"address":[3572759,3572920,3572716],"length":1,"stats":{"Line":4}},{"line":153,"address":[3572910,3572945],"length":1,"stats":{"Line":4}},{"line":154,"address":[4011918,4011770],"length":1,"stats":{"Line":6}},{"line":155,"address":[3596486],"length":1,"stats":{"Line":1}},{"line":161,"address":[3595659],"length":1,"stats":{"Line":1}}],"covered":60,"coverable":61},{"path":["/","home","user","FORGE","crates","forge-core","src","world.rs"],"content":"//! World state and the main simulation entry point.\n//!\n//! `WorldState` holds all simulation data and provides the `step()` and\n//! `reset()` methods that form the core API.\n\nuse std::sync::Arc;\n\nuse forge_types::config::ForgeConfig;\nuse forge_types::constants::{OBS_EMPTY_SLOT_ITEM, OBS_NO_OBJECT, OBS_NO_RESOURCE};\nuse forge_types::entity::{Agent, Object};\nuse forge_types::grid::{Grid, Position};\nuse forge_types::observation::{\n    InventoryObservation, Observation, StepInfo, StepResult, TileObservation,\n};\nuse forge_types::resource::{RecipeBook, ResourceNode};\nuse forge_types::task::ActiveTask;\nuse forge_types::Action;\nuse forge_worldgen::WorldGenerator;\nuse rand::SeedableRng;\nuse rand_pcg::Pcg64Mcg;\nuse serde::Serialize;\nuse tracing::{info, instrument, trace};\n\nuse crate::rng::ForgeRng;\nuse crate::systems;\n\n/// The complete state of a FORGE simulation instance.\n#[derive(Debug, Clone)]\npub struct WorldState {\n    /// Current simulation tick.\n    pub tick: u64,\n    /// The 2D tile grid.\n    pub grid: Grid,\n    /// All agents in the simulation.\n    pub agents: Vec\u003cAgent\u003e,\n    /// All interactive objects.\n    pub objects: Vec\u003cObject\u003e,\n    /// All resource nodes.\n    pub resources: Vec\u003cResourceNode\u003e,\n    /// Active tasks being tracked.\n    pub tasks: Vec\u003cActiveTask\u003e,\n    /// The recipe book for crafting.\n    pub recipe_book: RecipeBook,\n    /// Day/night cycle phase (0-3: dawn, day, dusk, night).\n    pub day_phase: u8,\n    /// Deterministic RNG.\n    pub rng: ForgeRng,\n    /// Shared immutable configuration.\n    pub config: Arc\u003cForgeConfig\u003e,\n    /// Whether the simulation has terminated.\n    pub terminated: bool,\n    /// Whether the simulation was truncated (max steps).\n    pub truncated: bool,\n    /// Rewards computed by the task evaluator for the most recent step.\n    /// Consumed by `make_step_result()` and reset each tick.\n    pub last_task_rewards: Option\u003cVec\u003cf32\u003e\u003e,\n}\n\nimpl WorldState {\n    /// Creates a new world state from configuration.\n    ///\n    /// Validates the config and initializes the grid, spawns agents at\n    /// default positions, and sets up the RNG.\n    ///\n    /// Returns [`ForgeError::Config`] if the configuration is invalid.\n    ///\n    /// # Breaking Change (v0.2.0)\n    ///\n    /// This method now returns `ForgeResult\u003cWorldState\u003e` instead of `WorldState`.\n    /// Callers must handle the `Result` (e.g., `.unwrap()` or `?`).\n    #[instrument(skip_all)]\n    pub fn new(config: ForgeConfig) -\u003e forge_types::ForgeResult\u003cSelf\u003e {\n        forge_types::validation::validate_config(\u0026config)?;\n        let config = Arc::new(config);\n        let mut rng = ForgeRng::new(config.world.seed);\n\n        // Use WorldGenerator for terrain, resources, and objects\n        let generator = WorldGenerator::new(\u0026config.world);\n        let mut gen_rng = Pcg64Mcg::seed_from_u64(config.world.seed);\n        let (grid, resources, objects, spawn_points) = generator.generate(\u0026mut gen_rng);\n\n        // Spawn agents at generated spawn points or deterministic fallback positions\n        let mut agents = Vec::with_capacity(config.agents.num_agents as usize);\n        for i in 0..config.agents.num_agents {\n            let pos = if (i as usize) \u003c spawn_points.len() {\n                spawn_points[i as usize]\n            } else {\n                let x = rng.next_range(config.world.width as u32) as u16;\n                let y = rng.next_range(config.world.height as u32) as u16;\n                Position::new(x, y)\n            };\n            let agent = Agent::new(i, pos, \u0026config.agents);\n            agents.push(agent);\n        }\n\n        let mut state = Self {\n            tick: 0,\n            grid,\n            agents,\n            objects,\n            resources,\n            tasks: Vec::new(),\n            recipe_book: RecipeBook::default(),\n            day_phase: 0,\n            rng,\n            config,\n            terminated: false,\n            truncated: false,\n            last_task_rewards: None,\n        };\n\n        // Place agents on the grid\n        state.sync_agents_to_grid();\n\n        info!(\n            seed = state.config.world.seed,\n            width = state.config.world.width,\n            height = state.config.world.height,\n            num_agents = state.config.agents.num_agents,\n            resources = state.resources.len(),\n            objects = state.objects.len(),\n            \"world created\"\n        );\n\n        Ok(state)\n    }\n\n    /// Advances the simulation by one tick with the given actions.\n    ///\n    /// Returns a StepResult containing observations, rewards, and termination info.\n    #[instrument(skip_all)]\n    pub fn step(\u0026mut self, actions: \u0026[Action]) -\u003e StepResult {\n        if self.terminated || self.truncated {\n            return self.make_terminal_result();\n        }\n\n        trace!(tick = self.tick, num_actions = actions.len(), \"step\");\n\n        // Pad or truncate actions to match agent count\n        let mut padded_actions = actions.to_vec();\n        padded_actions.resize(self.agents.len(), Action::Noop);\n\n        // Run all systems\n        systems::run_systems(self, \u0026padded_actions);\n\n        // Check truncation (max episode length)\n        if self.config.task.max_episode_length \u003e 0\n            \u0026\u0026 self.tick \u003e= self.config.task.max_episode_length\n        {\n            self.truncated = true;\n        }\n\n        // Check termination (all agents dead)\n        if self.agents.iter().all(|a| !a.alive) {\n            self.terminated = true;\n        }\n\n        // Generate observations and result\n        self.make_step_result()\n    }\n\n    /// Resets the simulation to initial state with a new seed.\n    #[instrument(skip_all)]\n    pub fn reset(\u0026mut self, seed: Option\u003cu64\u003e) -\u003e StepResult {\n        let new_seed = seed.unwrap_or_else(|| self.rng.next_u64());\n\n        info!(seed = new_seed, \"resetting world\");\n\n        let mut new_config = (*self.config).clone();\n        new_config.world.seed = new_seed;\n\n        let new_state = WorldState::new(new_config).expect(\"validated config must be valid\");\n\n        self.tick = new_state.tick;\n        self.grid = new_state.grid;\n        self.agents = new_state.agents;\n        self.objects = new_state.objects;\n        self.resources = new_state.resources;\n        self.tasks = new_state.tasks;\n        self.recipe_book = new_state.recipe_book;\n        self.day_phase = new_state.day_phase;\n        self.rng = new_state.rng;\n        self.config = new_state.config;\n        self.terminated = false;\n        self.truncated = false;\n        self.last_task_rewards = None;\n\n        self.make_step_result()\n    }\n\n    /// Synchronizes agent positions to the grid tiles.\n    fn sync_agents_to_grid(\u0026mut self) {\n        // Clear all agent references from grid\n        for tile in self.grid.tiles.iter_mut() {\n            tile.agent_id = None;\n        }\n        // Set agent positions\n        for agent in \u0026self.agents {\n            if agent.alive {\n                if let Some(tile) = self.grid.get_mut(agent.position.x, agent.position.y) {\n                    tile.agent_id = Some(agent.id);\n                }\n            }\n        }\n    }\n\n    /// Generates an observation for a single agent.\n    fn generate_observation(\u0026self, agent: \u0026Agent) -\u003e Observation {\n        let vr = agent.vision_radius as i32;\n        let view_side = (2 * vr + 1) as u16;\n        let mut grid_view = Vec::with_capacity((view_side as usize) * (view_side as usize));\n\n        for dy in -vr..=vr {\n            for dx in -vr..=vr {\n                let wx = agent.position.x as i32 + dx;\n                let wy = agent.position.y as i32 + dy;\n\n                if wx \u003e= 0 \u0026\u0026 wx \u003c self.grid.width as i32 \u0026\u0026 wy \u003e= 0 \u0026\u0026 wy \u003c self.grid.height as i32\n                {\n                    let tile = self.grid.get(wx as u16, wy as u16).unwrap();\n                    grid_view.push(TileObservation {\n                        terrain: tile.terrain as u8,\n                        elevation: tile.elevation,\n                        has_agent: tile.agent_id.is_some(),\n                        has_object: tile.object_id.is_some(),\n                        has_resource: tile.resource_id.is_some(),\n                        object_type: tile.object_id.map_or(OBS_NO_OBJECT, |_| 0),\n                        resource_type: tile.resource_id.map_or(OBS_NO_RESOURCE, |_| 0),\n                    });\n                } else {\n                    // Out of bounds — show as wall\n                    grid_view.push(TileObservation {\n                        terrain: forge_types::TerrainType::Wall as u8,\n                        elevation: 0,\n                        has_agent: false,\n                        has_object: false,\n                        has_resource: false,\n                        object_type: OBS_NO_OBJECT,\n                        resource_type: OBS_NO_RESOURCE,\n                    });\n                }\n            }\n        }\n\n        let inventory = InventoryObservation {\n            slots: agent\n                .inventory\n                .slots\n                .iter()\n                .map(|slot| match slot {\n                    Some(stack) =\u003e (stack.item_type as u8, stack.count),\n                    None =\u003e (OBS_EMPTY_SLOT_ITEM, 0),\n                })\n                .collect(),\n        };\n\n        let max_health = self.config.agents.max_health as f32;\n        let max_stamina = self.config.agents.max_stamina as f32;\n\n        Observation {\n            grid_view,\n            view_width: view_side,\n            view_height: view_side,\n            inventory,\n            health: if max_health \u003e 0.0 {\n                agent.health as f32 / max_health\n            } else {\n                0.0\n            },\n            stamina: if max_stamina \u003e 0.0 {\n                agent.stamina as f32 / max_stamina\n            } else {\n                0.0\n            },\n            position: (agent.position.x, agent.position.y),\n            messages: agent.comm_buffer.to_vec(),\n            day_phase: self.day_phase,\n            task_progress: self\n                .tasks\n                .iter()\n                .map(|t| {\n                    if t.progress.is_empty() {\n                        0.0\n                    } else {\n                        t.progress[0]\n                    }\n                })\n                .collect(),\n        }\n    }\n\n    /// Generates the StepResult for the current state.\n    fn make_step_result(\u0026mut self) -\u003e StepResult {\n        let observations: Vec\u003cObservation\u003e = self\n            .agents\n            .iter()\n            .map(|agent| self.generate_observation(agent))\n            .collect();\n\n        let rewards = self\n            .last_task_rewards\n            .take()\n            .unwrap_or_else(|| vec![0.0; self.agents.len()]);\n\n        let info = StepInfo {\n            tick: self.tick,\n            agents_alive: self.agents.iter().map(|a| a.alive).collect(),\n            tasks_completed: vec![Vec::new(); self.agents.len()],\n            total_resources: self.resources.iter().map(|r| r.quantity as u32).sum(),\n            day_phase: self.day_phase,\n        };\n\n        StepResult {\n            observations,\n            rewards,\n            terminated: self.terminated,\n            truncated: self.truncated,\n            info,\n        }\n    }\n\n    /// Generates a terminal StepResult.\n    fn make_terminal_result(\u0026mut self) -\u003e StepResult {\n        self.make_step_result()\n    }\n\n    /// Returns an ASCII debug representation of the world.\n    #[instrument(skip_all)]\n    pub fn to_debug_grid(\u0026self) -\u003e String {\n        let mut result =\n            String::with_capacity((self.grid.width as usize + 1) * self.grid.height as usize);\n\n        for y in 0..self.grid.height {\n            for x in 0..self.grid.width {\n                let tile = self.grid.get(x, y).unwrap();\n                let ch = if tile.agent_id.is_some() {\n                    'A'\n                } else if tile.object_id.is_some() {\n                    'O'\n                } else if tile.resource_id.is_some() {\n                    'R'\n                } else {\n                    match tile.terrain {\n                        forge_types::TerrainType::Ground =\u003e '.',\n                        forge_types::TerrainType::Water =\u003e '~',\n                        forge_types::TerrainType::Wall =\u003e '#',\n                        forge_types::TerrainType::Lava =\u003e 'L',\n                        forge_types::TerrainType::Ice =\u003e 'I',\n                        forge_types::TerrainType::Sand =\u003e 'S',\n                        forge_types::TerrainType::Forest =\u003e 'T',\n                        forge_types::TerrainType::Mountain =\u003e 'M',\n                        _ =\u003e '?',\n                    }\n                };\n                result.push(ch);\n            }\n            result.push('\\n');\n        }\n\n        result\n    }\n\n    /// Serializes the world state to bytes for MCTS state snapshots.\n    #[instrument(skip_all)]\n    pub fn to_bytes(\u0026self) -\u003e Vec\u003cu8\u003e {\n        // Serialize the essential state (excluding config which is shared)\n        let serializable = SerializableWorldState {\n            tick: self.tick,\n            grid: \u0026self.grid,\n            agents: \u0026self.agents,\n            objects: \u0026self.objects,\n            resources: \u0026self.resources,\n            day_phase: self.day_phase,\n            rng_state: self.rng.save_state(),\n            terminated: self.terminated,\n            truncated: self.truncated,\n        };\n        bincode::serialize(\u0026serializable).unwrap_or_default()\n    }\n}\n\n/// Serializable subset of WorldState (excludes Arc\u003cConfig\u003e).\n#[derive(Serialize)]\nstruct SerializableWorldState\u003c'a\u003e {\n    tick: u64,\n    grid: \u0026'a Grid,\n    agents: \u0026'a [Agent],\n    objects: \u0026'a [Object],\n    resources: \u0026'a [ResourceNode],\n    day_phase: u8,\n    rng_state: crate::rng::RngState,\n    terminated: bool,\n    truncated: bool,\n}\n\n/// Owned version for deserialization from bytes/JSON.\n#[derive(serde::Deserialize)]\nstruct DeserializableWorldState {\n    tick: u64,\n    grid: Grid,\n    agents: Vec\u003cAgent\u003e,\n    objects: Vec\u003cObject\u003e,\n    resources: Vec\u003cResourceNode\u003e,\n    day_phase: u8,\n    rng_state: crate::rng::RngState,\n    terminated: bool,\n    truncated: bool,\n}\n\nimpl WorldState {\n    /// Deserializes a world state from bytes (bincode format).\n    ///\n    /// The config must be the same one used when the state was serialized.\n    /// The RNG is reconstructed from the saved state to preserve determinism.\n    #[instrument(skip_all)]\n    pub fn from_bytes(bytes: \u0026[u8], config: Arc\u003cForgeConfig\u003e) -\u003e forge_types::ForgeResult\u003cSelf\u003e {\n        let deserialized: DeserializableWorldState = bincode::deserialize(bytes)\n            .map_err(|e| forge_types::ForgeError::Serialization(format!(\"bincode: {e}\")))?;\n\n        Ok(WorldState {\n            tick: deserialized.tick,\n            grid: deserialized.grid,\n            agents: deserialized.agents,\n            objects: deserialized.objects,\n            resources: deserialized.resources,\n            tasks: Vec::new(),\n            recipe_book: RecipeBook::default(),\n            day_phase: deserialized.day_phase,\n            rng: ForgeRng::from_state(\u0026deserialized.rng_state),\n            config,\n            terminated: deserialized.terminated,\n            truncated: deserialized.truncated,\n            last_task_rewards: None,\n        })\n    }\n\n    /// Serializes the world state to JSON for human-readable saves.\n    #[instrument(skip_all)]\n    pub fn to_json(\u0026self) -\u003e forge_types::ForgeResult\u003cString\u003e {\n        let serializable = SerializableWorldState {\n            tick: self.tick,\n            grid: \u0026self.grid,\n            agents: \u0026self.agents,\n            objects: \u0026self.objects,\n            resources: \u0026self.resources,\n            day_phase: self.day_phase,\n            rng_state: self.rng.save_state(),\n            terminated: self.terminated,\n            truncated: self.truncated,\n        };\n        serde_json::to_string(\u0026serializable)\n            .map_err(|e| forge_types::ForgeError::Serialization(format!(\"json: {e}\")))\n    }\n\n    /// Deserializes a world state from JSON.\n    ///\n    /// The config must match what was used when the state was serialized.\n    #[instrument(skip_all)]\n    pub fn from_json(json: \u0026str, config: Arc\u003cForgeConfig\u003e) -\u003e forge_types::ForgeResult\u003cSelf\u003e {\n        let deserialized: DeserializableWorldState = serde_json::from_str(json)\n            .map_err(|e| forge_types::ForgeError::Serialization(format!(\"json: {e}\")))?;\n\n        Ok(WorldState {\n            tick: deserialized.tick,\n            grid: deserialized.grid,\n            agents: deserialized.agents,\n            objects: deserialized.objects,\n            resources: deserialized.resources,\n            tasks: Vec::new(),\n            recipe_book: RecipeBook::default(),\n            day_phase: deserialized.day_phase,\n            rng: ForgeRng::from_state(\u0026deserialized.rng_state),\n            config,\n            terminated: deserialized.terminated,\n            truncated: deserialized.truncated,\n            last_task_rewards: None,\n        })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::ForgeConfig;\n    use forge_types::grid::Direction;\n\n    fn make_test_world() -\u003e WorldState {\n        let mut config = ForgeConfig::default();\n        config.world.width = 16;\n        config.world.height = 16;\n        config.world.seed = 42;\n        config.agents.num_agents = 1;\n        config.task.max_episode_length = 1000;\n        WorldState::new(config).unwrap()\n    }\n\n    #[test]\n    fn test_world_creation() {\n        let world = make_test_world();\n        assert_eq!(world.tick, 0);\n        assert_eq!(world.agents.len(), 1);\n        assert_eq!(world.grid.width, 16);\n        assert_eq!(world.grid.height, 16);\n        assert!(!world.terminated);\n        assert!(!world.truncated);\n    }\n\n    #[test]\n    fn test_world_step() {\n        let mut world = make_test_world();\n        let start_pos = world.agents[0].position;\n\n        let result = world.step(\u0026[Action::Move(Direction::Right)]);\n\n        assert_eq!(world.tick, 1);\n        assert_eq!(result.observations.len(), 1);\n        assert_eq!(result.rewards.len(), 1);\n        assert!(!result.terminated);\n        assert!(!result.truncated);\n\n        // Agent should have moved (unless at boundary)\n        if start_pos.x + 1 \u003c world.grid.width {\n            assert_eq!(\n                world.agents[0].position,\n                Position::new(start_pos.x + 1, start_pos.y)\n            );\n        }\n    }\n\n    #[test]\n    fn test_world_reset() {\n        let mut world = make_test_world();\n        world.step(\u0026[Action::Move(Direction::Right)]);\n        world.step(\u0026[Action::Move(Direction::Right)]);\n        assert_eq!(world.tick, 2);\n\n        let result = world.reset(Some(99));\n        assert_eq!(world.tick, 0);\n        assert!(!world.terminated);\n        assert!(!world.truncated);\n        assert_eq!(result.observations.len(), 1);\n    }\n\n    #[test]\n    fn test_world_truncation() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 8;\n        config.world.height = 8;\n        config.agents.default_vision_radius = 3;\n        config.agents.num_agents = 1;\n        config.task.max_episode_length = 5;\n        let mut world = WorldState::new(config).unwrap();\n\n        for _ in 0..5 {\n            let result = world.step(\u0026[Action::Noop]);\n            if result.truncated {\n                break;\n            }\n        }\n\n        assert!(world.truncated);\n    }\n\n    #[test]\n    fn test_determinism() {\n        let config1 = {\n            let mut c = ForgeConfig::default();\n            c.world.width = 16;\n            c.world.height = 16;\n            c.world.seed = 42;\n            c.agents.num_agents = 2;\n            c\n        };\n        let config2 = config1.clone();\n\n        let mut world1 = WorldState::new(config1).unwrap();\n        let mut world2 = WorldState::new(config2).unwrap();\n\n        // Same actions should produce identical states\n        let action_sequence = vec![\n            vec![\n                Action::Move(Direction::Right),\n                Action::Move(Direction::Down),\n            ],\n            vec![Action::Move(Direction::Up), Action::Move(Direction::Left)],\n            vec![Action::Noop, Action::Move(Direction::Right)],\n            vec![Action::Move(Direction::Down), Action::Move(Direction::Down)],\n        ];\n\n        for actions in \u0026action_sequence {\n            let r1 = world1.step(actions);\n            let r2 = world2.step(actions);\n\n            assert_eq!(world1.tick, world2.tick);\n            for (a1, a2) in world1.agents.iter().zip(world2.agents.iter()) {\n                assert_eq!(a1.position, a2.position);\n                assert_eq!(a1.health, a2.health);\n                assert_eq!(a1.stamina, a2.stamina);\n            }\n            assert_eq!(r1.terminated, r2.terminated);\n            assert_eq!(r1.truncated, r2.truncated);\n        }\n    }\n\n    #[test]\n    fn test_observation_shape() {\n        let world = make_test_world();\n        let obs = world.generate_observation(\u0026world.agents[0]);\n\n        let vr = world.agents[0].vision_radius as u16;\n        let expected_side = 2 * vr + 1;\n        assert_eq!(obs.view_width, expected_side);\n        assert_eq!(obs.view_height, expected_side);\n        assert_eq!(\n            obs.grid_view.len(),\n            (expected_side as usize) * (expected_side as usize)\n        );\n    }\n\n    #[test]\n    fn test_debug_grid() {\n        let world = make_test_world();\n        let debug = world.to_debug_grid();\n        assert!(!debug.is_empty());\n        assert!(debug.contains('A')); // At least one agent\n        assert!(debug.contains('.')); // At least some ground\n    }\n\n    #[test]\n    fn test_serialization() {\n        let world = make_test_world();\n        let bytes = world.to_bytes();\n        assert!(!bytes.is_empty());\n        // Verify size is reasonable (should be well under 64KB for a 16x16 world)\n        assert!(\n            bytes.len() \u003c 65536,\n            \"state too large: {} bytes\",\n            bytes.len()\n        );\n    }\n\n    #[test]\n    fn test_step_with_wrong_action_count() {\n        let mut world = make_test_world();\n        // Too few actions — should be padded with Noop\n        let result = world.step(\u0026[]);\n        assert!(!result.terminated);\n\n        // Too many actions — extra should be ignored\n        let result = world.step(\u0026[Action::Noop, Action::Noop, Action::Noop]);\n        assert!(!result.terminated);\n    }\n\n    #[test]\n    fn test_multi_agent_world() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 32;\n        config.world.height = 32;\n        config.world.seed = 42;\n        config.agents.num_agents = 4;\n        let world = WorldState::new(config).unwrap();\n\n        assert_eq!(world.agents.len(), 4);\n        // All agents should be alive\n        assert!(world.agents.iter().all(|a| a.alive));\n    }\n\n    // ---- Edge case tests ----\n\n    #[test]\n    fn test_grid_with_min_dimension() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 8;\n        config.world.height = 8;\n        config.agents.default_vision_radius = 3;\n        config.world.seed = 42;\n        config.agents.num_agents = 1;\n        let world = WorldState::new(config).unwrap();\n\n        assert_eq!(world.grid.width, 8);\n        assert_eq!(world.grid.height, 8);\n        assert_eq!(world.agents.len(), 1);\n        assert!(world.agents[0].alive);\n        // Agent should be within bounds\n        assert!(world.agents[0].position.x \u003c 8);\n        assert!(world.agents[0].position.y \u003c 8);\n    }\n\n    #[test]\n    fn test_observation_agent_at_corner_origin() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 16;\n        config.world.height = 16;\n        config.world.seed = 42;\n        config.agents.num_agents = 1;\n        let mut world = WorldState::new(config).unwrap();\n\n        // Move agent to (0,0)\n        let old_pos = world.agents[0].position;\n        if let Some(tile) = world.grid.get_mut(old_pos.x, old_pos.y) {\n            tile.agent_id = None;\n        }\n        world.agents[0].position = Position::new(0, 0);\n        world.grid.get_mut(0, 0).unwrap().agent_id = Some(0);\n\n        let obs = world.generate_observation(\u0026world.agents[0]);\n\n        // Observation should still have the correct shape\n        let vr = world.agents[0].vision_radius as u16;\n        let expected_side = 2 * vr + 1;\n        assert_eq!(obs.view_width, expected_side);\n        assert_eq!(obs.view_height, expected_side);\n        assert_eq!(\n            obs.grid_view.len(),\n            (expected_side as usize) * (expected_side as usize)\n        );\n\n        // Tiles beyond the boundary should show as walls\n        // The top-left corner of the view (at offset -vr, -vr from agent at (0,0))\n        // should be out of bounds (wall)\n        let first_tile = \u0026obs.grid_view[0];\n        assert_eq!(first_tile.terrain, forge_types::TerrainType::Wall as u8);\n    }\n\n    #[test]\n    fn test_reset_with_none_seed() {\n        let mut world = make_test_world();\n        let initial_seed = world.config.world.seed;\n\n        // Step a few times to advance the RNG\n        world.step(\u0026[Action::Noop]);\n        world.step(\u0026[Action::Noop]);\n\n        // Reset with None — should derive a new seed from the RNG\n        let result = world.reset(None);\n        assert_eq!(world.tick, 0);\n        assert!(!world.terminated);\n        assert!(!world.truncated);\n        assert_eq!(result.observations.len(), 1);\n\n        // The seed should have changed (overwhelmingly likely)\n        assert_ne!(\n            world.config.world.seed, initial_seed,\n            \"reset(None) should use a derived seed\"\n        );\n    }\n\n    #[test]\n    fn test_multiple_resets_produce_different_states() {\n        let mut world = make_test_world();\n\n        // First reset with a specific seed\n        world.reset(Some(100));\n        let pos_after_first = world.agents[0].position;\n\n        // Second reset with a different seed\n        world.reset(Some(200));\n        let pos_after_second = world.agents[0].position;\n\n        // Third reset with another seed\n        world.reset(Some(300));\n        let pos_after_third = world.agents[0].position;\n\n        // At least two of the three positions should differ\n        // (technically all could coincide, but with a 16x16 grid that is very unlikely)\n        let all_same = pos_after_first == pos_after_second \u0026\u0026 pos_after_second == pos_after_third;\n        assert!(\n            !all_same,\n            \"multiple resets with different seeds should produce different states\"\n        );\n    }\n\n    #[test]\n    fn test_to_debug_grid_with_empty_world() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 8;\n        config.world.height = 8;\n        config.agents.default_vision_radius = 3;\n        config.world.seed = 42;\n        config.agents.num_agents = 0;\n        config.task.enabled = false;\n        let world = WorldState::new(config).unwrap();\n\n        let debug = world.to_debug_grid();\n        assert!(!debug.is_empty());\n        // With no agents, should be all ground tiles\n        assert!(!debug.contains('A'));\n        // Should have 8 rows (each 8 chars + newline)\n        let lines: Vec\u003c\u0026str\u003e = debug.lines().collect();\n        assert_eq!(lines.len(), 8);\n        for line in \u0026lines {\n            assert_eq!(line.len(), 8);\n        }\n    }\n\n    #[test]\n    fn test_to_bytes_round_trip_consistency() {\n        let world = make_test_world();\n        let bytes1 = world.to_bytes();\n        let bytes2 = world.to_bytes();\n\n        assert!(!bytes1.is_empty());\n        assert_eq!(bytes1, bytes2, \"serialization should be deterministic\");\n    }\n\n    #[test]\n    fn test_to_bytes_changes_after_step() {\n        let mut world = make_test_world();\n        let bytes_before = world.to_bytes();\n\n        world.step(\u0026[Action::Move(Direction::Right)]);\n        let bytes_after = world.to_bytes();\n\n        assert_ne!(\n            bytes_before, bytes_after,\n            \"state bytes should change after stepping\"\n        );\n    }\n\n    #[test]\n    fn test_step_after_termination_returns_terminal_result() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 16;\n        config.world.height = 16;\n        config.world.seed = 42;\n        config.agents.num_agents = 1;\n        let mut world = WorldState::new(config).unwrap();\n\n        // Kill the agent to trigger termination\n        world.agents[0].alive = false;\n        let result = world.step(\u0026[Action::Noop]);\n        assert!(result.terminated);\n\n        // Subsequent step should still return terminal result\n        let result2 = world.step(\u0026[Action::Noop]);\n        assert!(result2.terminated);\n    }\n\n    #[test]\n    fn test_world_min_dimension_width() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 8;\n        config.world.height = 16;\n        config.world.seed = 42;\n        config.agents.num_agents = 1;\n        config.agents.default_vision_radius = 3;\n        let mut world = WorldState::new(config).unwrap();\n\n        // Should still work with min width\n        let result = world.step(\u0026[Action::Noop]);\n        assert!(!result.terminated);\n        assert_eq!(world.grid.width, 8);\n    }\n\n    #[test]\n    fn test_world_min_dimension_height() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 16;\n        config.world.height = 8;\n        config.agents.default_vision_radius = 3;\n        config.world.seed = 42;\n        config.agents.num_agents = 1;\n        let mut world = WorldState::new(config).unwrap();\n\n        let result = world.step(\u0026[Action::Noop]);\n        assert!(!result.terminated);\n        assert_eq!(world.grid.height, 8);\n    }\n\n    #[test]\n    fn test_observation_position_field() {\n        let world = make_test_world();\n        let obs = world.generate_observation(\u0026world.agents[0]);\n\n        assert_eq!(obs.position.0, world.agents[0].position.x);\n        assert_eq!(obs.position.1, world.agents[0].position.y);\n    }\n\n    #[test]\n    fn test_observation_health_and_stamina_normalized() {\n        let world = make_test_world();\n        let obs = world.generate_observation(\u0026world.agents[0]);\n\n        // Health and stamina should be between 0.0 and 1.0\n        assert!(obs.health \u003e= 0.0 \u0026\u0026 obs.health \u003c= 1.0);\n        assert!(obs.stamina \u003e= 0.0 \u0026\u0026 obs.stamina \u003c= 1.0);\n    }\n\n    // ---- from_bytes / from_json roundtrip tests ----\n\n    #[test]\n    fn test_from_bytes_roundtrip() {\n        let mut world = make_test_world();\n        world.step(\u0026[Action::Noop]);\n        world.step(\u0026[Action::Move(Direction::Right)]);\n\n        let bytes = world.to_bytes();\n        let restored = WorldState::from_bytes(\u0026bytes, world.config.clone()).unwrap();\n\n        assert_eq!(restored.tick, world.tick);\n        assert_eq!(restored.day_phase, world.day_phase);\n        assert_eq!(restored.agents.len(), world.agents.len());\n        assert_eq!(restored.agents[0].position, world.agents[0].position);\n        assert_eq!(restored.agents[0].health, world.agents[0].health);\n        assert_eq!(restored.terminated, world.terminated);\n        assert_eq!(restored.truncated, world.truncated);\n    }\n\n    #[test]\n    fn test_from_bytes_rng_preserves_sequence() {\n        let mut world = make_test_world();\n        for _ in 0..5 {\n            world.step(\u0026[Action::Noop]);\n        }\n\n        let bytes = world.to_bytes();\n        let mut restored = WorldState::from_bytes(\u0026bytes, world.config.clone()).unwrap();\n\n        // After restoration, stepping both should produce the same results\n        let result_original = world.step(\u0026[Action::Noop]);\n        let result_restored = restored.step(\u0026[Action::Noop]);\n        assert_eq!(\n            result_original.observations[0].position,\n            result_restored.observations[0].position,\n        );\n    }\n\n    #[test]\n    fn test_from_bytes_invalid_data() {\n        let config = Arc::new(ForgeConfig::default());\n        let result = WorldState::from_bytes(\u0026[0, 1, 2, 3], config);\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn test_to_json_roundtrip() {\n        let mut world = make_test_world();\n        world.step(\u0026[Action::Noop]);\n\n        let json = world.to_json().unwrap();\n        assert!(!json.is_empty());\n\n        let restored = WorldState::from_json(\u0026json, world.config.clone()).unwrap();\n        assert_eq!(restored.tick, world.tick);\n        assert_eq!(restored.agents[0].position, world.agents[0].position);\n        assert_eq!(restored.day_phase, world.day_phase);\n    }\n\n    #[test]\n    fn test_from_json_invalid_data() {\n        let config = Arc::new(ForgeConfig::default());\n        let result = WorldState::from_json(\"not valid json\", config);\n        assert!(result.is_err());\n    }\n}\n","traces":[{"line":72,"address":[3354210,3353397,3349376],"length":1,"stats":{"Line":15}},{"line":73,"address":[3214921,3214209],"length":1,"stats":{"Line":27}},{"line":74,"address":[3215230],"length":1,"stats":{"Line":10}},{"line":75,"address":[3327243,3327319],"length":1,"stats":{" ,"forge-python","src","config.rs"],"content":"//! Configuration conversion from Python dicts to Rust ForgeConfig.\n//!\n//! Uses serde_json as an intermediate format: Python dict -\u003e JSON string -\u003e ForgeConfig.\n\nuse forge_types::config::ForgeConfig;\nuse pyo3::prelude::*;\nuse pyo3::types::PyDict;\n\n/// Converts a Python dictionary to a ForgeConfig by serializing through JSON.\npub fn config_from_dict(py: Python\u003c'_\u003e, dict: \u0026Bound\u003c'_, PyDict\u003e) -\u003e PyResult\u003cForgeConfig\u003e {\n    // Convert Python dict -\u003e JSON string -\u003e ForgeConfig\n    let json_module = py.import_bound(\"json\")?;\n    let json_str: String = json_module.call_method1(\"dumps\", (dict,))?.extract()?;\n    let config: ForgeConfig = serde_json::from_str(\u0026json_str).map_err(|e| {\n        PyErr::new::\u003cpyo3::exceptions::PyValueError, _\u003e(format!(\"Invalid config: {e}\"))\n    })?;\n    Ok(config)\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-python","src","env.rs"],"content":"//! Main ForgeEnv pyclass — Gymnasium-compatible environment wrapper.\n//!\n//! Wraps the Rust WorldState to provide a Python-friendly interface\n//! with numpy array observations and standard Gymnasium step/reset API.\n\n// PyO3 proc-macro generates .into() calls that trigger this lint\n#![allow(clippy::useless_conversion)]\n\nuse forge_core::WorldState;\nuse forge_types::config::ForgeConfig;\nuse forge_types::observation::{Observation, StepInfo};\nuse forge_types::Action;\nuse numpy::ndarray::{Array2, Array3};\nuse numpy::{PyArray2, PyArray3};\nuse pyo3::prelude::*;\nuse pyo3::types::{PyDict, PyList};\n\n/// The main FORGE environment, compatible with the Gymnasium API.\n///\n/// Wraps the Rust simulation engine and provides observations as\n/// numpy arrays for efficient integration with Python ML frameworks.\n#[pyclass]\npub struct ForgeEnv {\n    state: WorldState,\n    config: ForgeConfig,\n}\n\n#[pymethods]\nimpl ForgeEnv {\n    /// Creates a new ForgeEnv.\n    ///\n    /// Args:\n    ///     config: Optional Python dict with configuration overrides.\n    ///             If None, uses default configuration.\n    #[new]\n    #[pyo3(signature = (config=None))]\n    fn new(py: Python\u003c'_\u003e, config: Option\u003c\u0026Bound\u003c'_, PyDict\u003e\u003e) -\u003e PyResult\u003cSelf\u003e {\n        let forge_config = match config {\n            Some(dict) =\u003e crate::config::config_from_dict(py, dict)?,\n            None =\u003e ForgeConfig::default(),\n        };\n        let state = WorldState::new(forge_config.clone())\n            .map_err(|e| pyo3::exceptions::PyValueError::new_err(e.to_string()))?;\n        Ok(Self {\n            state,\n            config: forge_config,\n        })\n    }\n\n    /// Resets the environment to an initial state.\n    ///\n    /// Args:\n    ///     seed: Optional random seed for deterministic reset.\n    ///     options: Optional dict of reset options (currently unused).\n    ///\n    /// Returns:\n    ///     Tuple of (observation_dict, info_dict)\n    #[pyo3(signature = (seed=None, options=None))]\n    fn reset(\n        \u0026mut self,\n        py: Python\u003c'_\u003e,\n        seed: Option\u003cu64\u003e,\n        options: Option\u003c\u0026Bound\u003c'_, PyDict\u003e\u003e,\n    ) -\u003e PyResult\u003cPyObject\u003e {\n        let _ = options;\n        let result = self.state.reset(seed);\n        let obs = self.obs_to_dict(py, \u0026result.observations[0])?;\n        let info = self.info_to_dict(py, \u0026result.info)?;\n        Ok((obs, info).to_object(py))\n    }\n\n    /// Advances the environment by one step with the given action.\n    ///\n    /// Args:\n    ///     action: Discrete action index (u32).\n    ///\n    /// Returns:\n    ///     Tuple of (observation_dict, reward, terminated, truncated, info_dict)\n    fn step(\u0026mut self, py: Python\u003c'_\u003e, action: u32) -\u003e PyResult\u003cPyObject\u003e {\n        let comm_vocab_size = self.config.agents.comm_vocab_size;\n        let action = Action::from_discrete(action, comm_vocab_size).ok_or_else(|| {\n            PyErr::new::\u003cpyo3::exceptions::PyValueError, _\u003e(format!(\"Invalid action: {action}\"))\n        })?;\n\n        // Release GIL during computation\n        let result = py.allow_threads(|| self.state.step(\u0026[action]));\n\n        let obs = self.obs_to_dict(py, \u0026result.observations[0])?;\n        let reward = result.rewards[0];\n        let info = self.info_to_dict(py, \u0026result.info)?;\n\n        Ok((obs, reward, result.terminated, result.truncated, info).to_object(py))\n    }\n\n    /// Returns a description of the observation space.\n    #[getter]\n    fn observation_space(\u0026self, py: Python\u003c'_\u003e) -\u003e PyResult\u003cPyObject\u003e {\n        crate::spaces::observation_space(py, \u0026self.config)\n    }\n\n    /// Returns a description of the action space.\n    #[getter]\n    fn action_space(\u0026self, py: Python\u003c'_\u003e) -\u003e PyResult\u003cPyObject\u003e {\n        crate::spaces::action_space(py, \u0026self.config)\n    }\n\n    /// Returns an ASCII rendering of the current world state.\n    fn render(\u0026self) -\u003e String {\n        self.state.to_debug_grid()\n    }\n\n    /// Closes the environment. No-op for this implementation.\n    fn close(\u0026self) -\u003e PyResult\u003c()\u003e {\n        Ok(())\n    }\n\n    /// Returns the unwrapped environment (self, since there is no wrapper).\n    #[getter]\n    fn unwrapped(\u0026self) -\u003e PyResult\u003c()\u003e {\n        Ok(())\n    }\n}\n\nimpl ForgeEnv {\n    /// Converts an Observation to a Python dict with numpy arrays.\n    ///\n    /// The dict contains:\n    /// - \"grid_view\": numpy array shape (view_height, view_width, 7) with tile features\n    /// - \"inventory\": numpy array shape (capacity, 2) with (item_type, count)\n    /// - \"health\": float\n    /// - \"stamina\": float\n    /// - \"position\": tuple (x, y)\n    /// - \"messages\": list of ints\n    /// - \"day_phase\": int\n    fn obs_to_dict\u003c'py\u003e(\u0026self, py: Python\u003c'py\u003e, obs: \u0026Observation) -\u003e PyResult\u003cBound\u003c'py, PyDict\u003e\u003e {\n        let dict = PyDict::new_bound(py);\n\n        // Grid view: (view_height, view_width, 7) as u8\n        let h = obs.view_height as usize;\n        let w = obs.view_width as usize;\n        let mut grid_data = Vec::with_capacity(h * w * 7);\n        for tile in \u0026obs.grid_view {\n            grid_data.push(tile.terrain);\n            grid_data.push(tile.has_agent as u8);\n            grid_data.push(tile.has_object as u8);\n            grid_data.push(tile.has_resource as u8);\n            grid_data.push(tile.elevation);\n            grid_data.push(tile.object_type);\n            grid_data.push(tile.resource_type);\n        }\n        let grid_array = Array3::from_shape_vec((h, w, 7), grid_data).map_err(|e| {\n            PyErr::new::\u003cpyo3::exceptions::PyValueError, _\u003e(format!(\n                \"Failed to create grid array: {e}\"\n            ))\n        })?;\n        let py_grid = PyArray3::from_owned_array_bound(py, grid_array);\n        dict.set_item(\"grid_view\", py_grid)?;\n\n        // Inventory: (capacity, 2) as u16\n        let capacity = obs.inventory.slots.len();\n        let mut inv_data = Vec::with_capacity(capacity * 2);\n        for \u0026(item_type, count) in \u0026obs.inventory.slots {\n            inv_data.push(item_type as u16);\n            inv_data.push(count);\n        }\n        let inv_array = Array2::from_shape_vec((capacity, 2), inv_data).map_err(|e| {\n            PyErr::new::\u003cpyo3::exceptions::PyValueError, _\u003e(format!(\n                \"Failed to create inventory array: {e}\"\n            ))\n        })?;\n        let py_inv = PyArray2::from_owned_array_bound(py, inv_array);\n        dict.set_item(\"inventory\", py_inv)?;\n\n        // Scalar values\n        dict.set_item(\"health\", obs.health)?;\n        dict.set_item(\"stamina\", obs.stamina)?;\n        dict.set_item(\"position\", (obs.position.0, obs.position.1))?;\n\n        // Messages: list of ints\n        let msg_vec: Vec\u003ci64\u003e = obs.messages.iter().map(|\u0026m| m as i64).collect();\n        let messages = PyList::new_bound(py, \u0026msg_vec);\n        dict.set_item(\"messages\", messages)?;\n\n        // Day phase\n        dict.set_item(\"day_phase\", obs.day_phase)?;\n\n        Ok(dict)\n    }\n\n    /// Converts StepInfo to a Python dict.\n    fn info_to_dict\u003c'py\u003e(\u0026self, py: Python\u003c'py\u003e, info: \u0026StepInfo) -\u003e PyResult\u003cBound\u003c'py, PyDict\u003e\u003e {\n        let dict = PyDict::new_bound(py);\n        dict.set_item(\"tick\", info.tick)?;\n        dict.set_item(\"agents_alive\", \u0026info.agents_alive)?;\n        dict.set_item(\"total_resources\", info.total_resources)?;\n        dict.set_item(\"day_phase\", info.day_phase)?;\n\n        let task_lists: Vec\u003cVec\u003ci64\u003e\u003e = info\n            .tasks_completed\n            .iter()\n            .map(|tasks| tasks.iter().map(|\u0026t| t as i64).collect())\n            .collect();\n        let tasks_completed = PyList::new_bound(py, \u0026task_lists);\n        dict.set_item(\"tasks_completed\", tasks_completed)?;\n\n        Ok(dict)\n    }\n}\n","traces":[{"line":135,"address":[],"length":0,"stats":{"Line":0}},{"line":136,"address":[],"length":0,"stats":{"Line":0}},{"line":139,"address":[],"length":0,"stats":{"Line":0}},{"line":140,"address":[],"length":0,"stats":{"Line":0}},{"line":141,"address":[],"length":0,"stats":{"Line":0}},{"line":142,"address":[],"length":0,"stats":{"Line":0}},{"line":143,"address":[],"length":0,"stats":{"Line":0}},{"line":144,"address":[],"length":0,"stats":{"Line":0}},{"line":145,"address":[],"length":0,"stats":{"Line":0}},{"line":146,"address":[],"length":0,"stats":{"Line":0}},{"line":147,"address":[],"length":0,"stats
