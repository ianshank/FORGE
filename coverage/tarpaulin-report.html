mediate material).\n    Plank = 14,\n    /// Crafted bridge (terrain crossing).\n    Bridge = 15,\n    /// Crafted rope (utility).\n    Rope = 16,\n    /// Crafted brick (construction material).\n    Brick = 17,\n    /// Crafted key (unlocking).\n    Key = 18,\n    /// Crafted torch (illumination).\n    Torch = 19,\n\n    /// Cooked fish food item.\n    CookedFish = 30,\n    /// Bread food item.\n    Bread = 31,\n}\n\nimpl ItemType {\n    /// Whether this is a raw (harvestable) resource.\n    pub fn is_raw_resource(\u0026self) -\u003e bool {\n        (*self as u8) \u003c 10\n    }\n\n    /// Whether this is a crafted item.\n    pub fn is_crafted(\u0026self) -\u003e bool {\n        let val = *self as u8;\n        (10..30).contains(\u0026val)\n    }\n\n    /// Whether this item is a tool (provides capabilities).\n    pub fn is_tool(\u0026self) -\u003e bool {\n        matches!(\n            self,\n            ItemType::Axe | ItemType::Pickaxe | ItemType::Sword | ItemType::Shield\n        )\n    }\n\n    /// Converts from u8.\n    pub fn from_u8(val: u8) -\u003e Option\u003cItemType\u003e {\n        match val {\n            0 =\u003e Some(ItemType::Wood),\n            1 =\u003e Some(ItemType::Stone),\n            2 =\u003e Some(ItemType::Ore),\n            3 =\u003e Some(ItemType::Fish),\n            4 =\u003e Some(ItemType::Fiber),\n            5 =\u003e Some(ItemType::Clay),\n            10 =\u003e Some(ItemType::Axe),\n            11 =\u003e Some(ItemType::Pickaxe),\n            12 =\u003e Some(ItemType::Sword),\n            13 =\u003e Some(ItemType::Shield),\n            14 =\u003e Some(ItemType::Plank),\n            15 =\u003e Some(ItemType::Bridge),\n            16 =\u003e Some(ItemType::Rope),\n            17 =\u003e Some(ItemType::Brick),\n            18 =\u003e Some(ItemType::Key),\n            19 =\u003e Some(ItemType::Torch),\n            30 =\u003e Some(ItemType::CookedFish),\n            31 =\u003e Some(ItemType::Bread),\n            _ =\u003e None,\n        }\n    }\n}\n\n/// Resource type mapped to terrain.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Hash, Serialize, Deserialize)]\npub struct ResourceType {\n    /// The item that is harvested from this resource.\n    pub yields: ItemType,\n    /// The terrain this resource naturally appears on.\n    pub terrain_affinity: TerrainType,\n}\n\n/// A resource node in the world.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ResourceNode {\n    /// Unique resource node identifier.\n    pub id: u32,\n    /// Grid position.\n    pub position: Position,\n    /// What this resource yields when harvested.\n    pub resource_type: ItemType,\n    /// Remaining quantity available.\n    pub quantity: u16,\n    /// Maximum quantity (for respawn calculation).\n    pub max_quantity: u16,\n    /// Ticks remaining until next respawn increment. 0 = can respawn.\n    pub respawn_timer: u32,\n    /// Ticks between respawn increments.\n    pub respawn_rate: u32,\n    /// Whether this resource requires a tool to harvest.\n    pub requires_tool: Option\u003cItemType\u003e,\n}\n\nimpl ResourceNode {\n    /// Whether this resource can currently be harvested.\n    pub fn can_harvest(\u0026self) -\u003e bool {\n        self.quantity \u003e 0\n    }\n\n    /// Whether this resource is depleted.\n    pub fn is_depleted(\u0026self) -\u003e bool {\n        self.quantity == 0\n    }\n}\n\n/// A crafting recipe defining how to combine items.\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]\npub struct CraftingRecipe {\n    /// Unique recipe identifier.\n    pub id: u16,\n    /// Required input items and their quantities.\n    pub inputs: Vec\u003c(ItemType, u16)\u003e,\n    /// Output item and quantity produced.\n    pub output: (ItemType, u16),\n    /// Whether this recipe requires a crafting station.\n    pub requires_station: bool,\n    /// Minimum crafting level required.\n    pub min_crafting_level: u8,\n    /// Display name for the recipe.\n    pub name: String,\n}\n\n/// The set of all available crafting recipes.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct RecipeBook {\n    /// All available recipes.\n    pub recipes: Vec\u003cCraftingRecipe\u003e,\n}\n\nimpl RecipeBook {\n    /// Creates an empty recipe book.\n    pub fn new() -\u003e Self {\n        Self {\n            recipes: Vec::new(),\n        }\n    }\n\n    /// Creates the default recipe book with standard recipes.\n    pub fn default_recipes() -\u003e Self {\n        let recipes = vec![\n            CraftingRecipe {\n                id: 0,\n                name: \"Axe\".to_string(),\n                inputs: vec![(ItemType::Wood, 2), (ItemType::Stone, 1)],\n                output: (ItemType::Axe, 1),\n                requires_station: false,\n                min_crafting_level: 1,\n            },\n            CraftingRecipe {\n                id: 1,\n                name: \"Pickaxe\".to_string(),\n                inputs: vec![(ItemType::Wood, 2), (ItemType::Stone, 2)],\n                output: (ItemType::Pickaxe, 1),\n                requires_station: false,\n                min_crafting_level: 1,\n            },\n            CraftingRecipe {\n                id: 2,\n                name: \"Plank\".to_string(),\n                inputs: vec![(ItemType::Wood, 2)],\n                output: (ItemType::Plank, 2),\n                requires_station: false,\n                min_crafting_level: 1,\n            },\n            CraftingRecipe {\n                id: 3,\n                name: \"Bridge\".to_string(),\n                inputs: vec![(ItemType::Plank, 4)],\n                output: (ItemType::Bridge, 1),\n                requires_station: false,\n                min_crafting_level: 2,\n            },\n            CraftingRecipe {\n                id: 4,\n                name: \"Sword\".to_string(),\n                inputs: vec![(ItemType::Wood, 1), (ItemType::Ore, 2)],\n                output: (ItemType::Sword, 1),\n                requires_station: true,\n                min_crafting_level: 2,\n            },\n            CraftingRecipe {\n                id: 5,\n                name: \"Rope\".to_string(),\n                inputs: vec![(ItemType::Fiber, 3)],\n                output: (ItemType::Rope, 1),\n                requires_station: false,\n                min_crafting_level: 1,\n            },\n            CraftingRecipe {\n                id: 6,\n                name: \"Brick\".to_string(),\n                inputs: vec![(ItemType::Clay, 2)],\n                output: (ItemType::Brick, 1),\n                requires_station: true,\n                min_crafting_level: 1,\n            },\n            CraftingRecipe {\n                id: 7,\n                name: \"Torch\".to_string(),\n                inputs: vec![(ItemType::Wood, 1), (ItemType::Fiber, 1)],\n                output: (ItemType::Torch, 1),\n                requires_station: false,\n                min_crafting_level: 1,\n            },\n            CraftingRecipe {\n                id: 8,\n                name: \"Shield\".to_string(),\n                inputs: vec![(ItemType::Plank, 2), (ItemType::Ore, 1)],\n                output: (ItemType::Shield, 1),\n                requires_station: true,\n                min_crafting_level: 2,\n            },\n        ];\n        Self { recipes }\n    }\n\n    /// Looks up a recipe by ID.\n    pub fn get(\u0026self, id: u16) -\u003e Option\u003c\u0026CraftingRecipe\u003e {\n        self.recipes.iter().find(|r| r.id == id)\n    }\n\n    /// Returns the number of recipes.\n    pub fn len(\u0026self) -\u003e usize {\n        self.recipes.len()\n    }\n\n    /// Whether the recipe book is empty.\n    pub fn is_empty(\u0026self) -\u003e bool {\n        self.recipes.is_empty()\n    }\n}\n\nimpl Default for RecipeBook {\n    fn default() -\u003e Self {\n        Self::default_recipes()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_item_type_classification() {\n        assert!(ItemType::Wood.is_raw_resource());\n        assert!(ItemType::Stone.is_raw_resource());\n        assert!(!ItemType::Axe.is_raw_resource());\n\n        assert!(ItemType::Axe.is_crafted());\n        assert!(ItemType::Bridge.is_crafted());\n        assert!(!ItemType::Wood.is_crafted());\n\n        assert!(ItemType::Axe.is_tool());\n        assert!(ItemType::Sword.is_tool());\n        assert!(!ItemType::Wood.is_tool());\n    }\n\n    #[test]\n    fn test_resource_node_harvest() {\n        let node = ResourceNode {\n            id: 0,\n            position: Position::new(5, 5),\n            resource_type: ItemType::Wood,\n            quantity: 3,\n            max_quantity: 5,\n            respawn_timer: 0,\n            respawn_rate: 100,\n            requires_tool: None,\n        };\n        assert!(node.can_harvest());\n        assert!(!node.is_depleted());\n    }\n\n    #[test]\n    fn test_resource_node_depleted() {\n        let node = ResourceNode {\n            id: 0,\n            position: Position::new(0, 0),\n            resource_type: ItemType::Stone,\n            quantity: 0,\n            max_quantity: 5,\n            respawn_timer: 50,\n            respawn_rate: 100,\n            requires_tool: Some(ItemType::Pickaxe),\n        };\n        assert!(!node.can_harvest());\n        assert!(node.is_depleted());\n    }\n\n    #[test]\n    fn test_default_recipe_book() {\n        let book = RecipeBook::default_recipes();\n        assert!(!book.is_empty());\n        assert!(book.get(0).is_some()); // Axe recipe exists\n\n        // Verify axe recipe\n        let axe = book.get(0).unwrap();\n        assert_eq!(axe.output.0, ItemType::Axe);\n        assert_eq!(axe.inputs.len(), 2);\n    }\n\n    #[test]\n    fn test_recipe_book_lookup() {\n        let book = RecipeBook::default_recipes();\n        assert!(book.get(0).is_some());\n        assert!(book.get(999).is_none());\n    }\n\n    #[test]\n    fn test_item_type_from_u8() {\n        assert_eq!(ItemType::from_u8(0), Some(ItemType::Wood));\n        assert_eq!(ItemType::from_u8(10), Some(ItemType::Axe));\n        assert_eq!(ItemType::from_u8(255), None);\n    }\n\n    #[test]\n    fn test_recipe_book_empty() {\n        let book = RecipeBook::new();\n        assert!(book.is_empty());\n        assert_eq!(book.len(), 0);\n        assert!(book.get(0).is_none());\n    }\n\n    #[test]\n    fn test_item_type_from_u8_all_valid() {\n        // Raw resources: 0-5\n        assert_eq!(ItemType::from_u8(0), Some(ItemType::Wood));\n        assert_eq!(ItemType::from_u8(1), Some(ItemType::Stone));\n        assert_eq!(ItemType::from_u8(2), Some(ItemType::Ore));\n        assert_eq!(ItemType::from_u8(3), Some(ItemType::Fish));\n        assert_eq!(ItemType::from_u8(4), Some(ItemType::Fiber));\n        assert_eq!(ItemType::from_u8(5), Some(ItemType::Clay));\n\n        // Crafted items: 10-19\n        assert_eq!(ItemType::from_u8(10), Some(ItemType::Axe));\n        assert_eq!(ItemType::from_u8(11), Some(ItemType::Pickaxe));\n        assert_eq!(ItemType::from_u8(12), Some(ItemType::Sword));\n        assert_eq!(ItemType::from_u8(13), Some(ItemType::Shield));\n        assert_eq!(ItemType::from_u8(14), Some(ItemType::Plank));\n        assert_eq!(ItemType::from_u8(15), Some(ItemType::Bridge));\n        assert_eq!(ItemType::from_u8(16), Some(ItemType::Rope));\n        assert_eq!(ItemType::from_u8(17), Some(ItemType::Brick));\n        assert_eq!(ItemType::from_u8(18), Some(ItemType::Key));\n        assert_eq!(ItemType::from_u8(19), Some(ItemType::Torch));\n\n        // Food: 30-31\n        assert_eq!(ItemType::from_u8(30), Some(ItemType::CookedFish));\n        assert_eq!(ItemType::from_u8(31), Some(ItemType::Bread));\n\n        // Invalid values in the gaps should return None.\n        assert_eq!(ItemType::from_u8(6), None);\n        assert_eq!(ItemType::from_u8(9), None);\n        assert_eq!(ItemType::from_u8(20), None);\n        assert_eq!(ItemType::from_u8(29), None);\n        assert_eq!(ItemType::from_u8(32), None);\n    }\n\n    #[test]\n    fn test_item_type_food_classification() {\n        // CookedFish and Bread are food items (value \u003e= 30).\n        assert!(!ItemType::CookedFish.is_raw_resource());\n        assert!(!ItemType::CookedFish.is_crafted()); // value 30 is not in 10..30\n        assert!(!ItemType::CookedFish.is_tool());\n\n        assert!(!ItemType::Bread.is_raw_resource());\n        assert!(!ItemType::Bread.is_crafted()); // value 31 is not in 10..30\n        assert!(!ItemType::Bread.is_tool());\n\n        // Verify that actual crafted items are classified correctly.\n        assert!(ItemType::Axe.is_crafted());\n        assert!(ItemType::Torch.is_crafted());\n    }\n}\n","traces":[{"line":57,"address":[1842624],"length":1,"stats":{"Line":1}},{"line":58,"address":[6184021],"length":1,"stats":{"Line":1}},{"line":62,"address":[8533104],"length":1,"stats":{"Line":1}},{"line":63,"address":[8533113],"length":1,"stats":{"Line":1}},{"line":64,"address":[8117759],"length":1,"stats":{"Line":1}},{"line":68,"address":[6184208],"length":1,"stats":{"Line":1}},{"line":69,"address":[6184215],"length":1,"stats":{"Line":1}},{"line":70,"address":[8117989],"length":1,"stats":{"Line":1}},{"line":76,"address":[8101296],"length":1,"stats":{"Line":1}},{"line":77,"address":[8101303],"length":1,"stats":{"Line":1}},{"line":78,"address":[8117855],"length":1,"stats":{"Line":1}},{"line":79,"address":[8101350],"length":1,"stats":{"Line":1}},{"line":80,"address":[8533229],"length":1,"stats":{"Line":1}},{"line":81,"address":[6334180],"length":1,"stats":{"Line":1}},{"line":82,"address":[1842715],"length":1,"stats":{"Line":1}},{"line":83,"address":[1842722],"length":1,"stats":{"Line":1}},{"line":84,"address":[8263897],"length":1,"stats":{"Line":1}},{"line":85,"address":[6334208],"length":1,"stats":{"Line":1}},{"line":86,"address":[8263911],"length":1,"stats":{"Line":1}},{"line":87,"address":[8117918],"length":1,"stats":{"Line":1}},{"line":88,"address":[8263925],"length":1,"stats": #[non_exhaustive]\npub enum Predicate {\n    /// Agent is at a specific position.\n    AgentAt(AgentId, Position),\n    /// Agent has at least N of an item type.\n    AgentHas(AgentId, ItemType, u16),\n    /// Two agents are within a given Manhattan distance.\n    AgentNear(AgentId, AgentId, u16),\n    /// An object is at a specific position.\n    ObjectAt(ObjectId, Position),\n    /// An object is in a specific state.\n    ObjectInState(ObjectId, String),\n    /// A certain number of ticks have elapsed.\n    TimeElapsed(u64),\n    /// Agent's health is above a threshold (normalized 0.0-1.0).\n    HealthAbove(AgentId, f32),\n    /// Agent has at least N of a resource type.\n    ResourceCount(AgentId, ItemType, u16),\n    /// All agents of a team are alive.\n    TeamAlive(u8),\n    /// Agent is on a specific terrain type.\n    AgentOnTerrain(AgentId, u8),\n}\n\n/// Composition operators for building complex tasks from predicates.\n#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]\n#[non_exhaustive]\npub enum TaskComposition {\n    /// A single atomic predicate.\n    Atom(Predicate),\n    /// All sub-tasks must be satisfied simultaneously.\n    And(Vec\u003cTaskComposition\u003e),\n    /// At least one sub-task must be satisfied.\n    Or(Vec\u003cTaskComposition\u003e),\n    /// Sub-tasks must be achieved in order (each locks in when achieved).\n    Sequence(Vec\u003cTaskComposition\u003e),\n    /// Sub-task must be achieved before the deadline tick.\n    Before(Box\u003cTaskComposition\u003e, u64),\n    /// First sub-task must remain true while achieving the second.\n    While(Box\u003cTaskComposition\u003e, Box\u003cTaskComposition\u003e),\n    /// Sub-task must be achieved without performing a specific action type.\n    Without(Box\u003cTaskComposition\u003e, u32),\n}\n\n/// Task difficulty tiers (1-6).\n#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Serialize, Deserialize)]\npub struct TaskTier(pub u8);\n\nimpl TaskTier {\n    /// Creates a new task tier, clamped to valid range [1, 6].\n    pub fn new(tier: u8) -\u003e Self {\n        Self(tier.clamp(1, 6))\n    }\n\n    /// Returns the tier number.\n    pub fn value(\u0026self) -\u003e u8 {\n        self.0\n    }\n}\n\n/// A fully specified task with metadata.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct TaskDefinition {\n    /// Unique task identifier.\n    pub id: u64,\n    /// Human-readable task description.\n    pub description: String,\n    /// The task composition tree defining success conditions.\n    pub goal: TaskComposition,\n    /// Estimated difficulty tier.\n    pub tier: TaskTier,\n    /// Estimated minimum solution length (oracle actions).\n    pub estimated_steps: u32,\n    /// Reward for completing the task.\n    pub reward: f32,\n    /// Optional partial rewards for intermediate progress.\n    pub dense_reward_weights: Vec\u003cf32\u003e,\n}\n\n/// Runtime state of an active task being tracked.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct ActiveTask {\n    /// The task definition.\n    pub definition: TaskDefinition,\n    /// Current progress for each predicate in the task tree (0.0-1.0).\n    pub progress: Vec\u003cf32\u003e,\n    /// Index of the current sequence step (for Sequence compositions).\n    pub sequence_index: usize,\n    /// Whether this task has been completed.\n    pub completed: bool,\n    /// Whether this task has failed (deadline passed, forbidden action taken).\n    pub failed: bool,\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_task_tier_clamping() {\n        assert_eq!(TaskTier::new(0).value(), 1);\n        assert_eq!(TaskTier::new(3).value(), 3);\n        assert_eq!(TaskTier::new(10).value(), 6);\n    }\n\n    #[test]\n    fn test_predicate_serialization() {\n        let pred = Predicate::AgentAt(0, Position::new(5, 5));\n        let json = serde_json::to_string(\u0026pred).unwrap();\n        let recovered: Predicate = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(pred, recovered);\n    }\n\n    #[test]\n    fn test_composition_nesting() {\n        let task = TaskComposition::And(vec![\n            TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Wood, 3)),\n            TaskComposition::Or(vec![\n                TaskComposition::Atom(Predicate::AgentAt(0, Position::new(0, 0))),\n                TaskComposition::Atom(Predicate::AgentAt(0, Position::new(10, 10))),\n            ]),\n        ]);\n        // Verify serialization roundtrip\n        let json = serde_json::to_string(\u0026task).unwrap();\n        let recovered: TaskComposition = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(task, recovered);\n    }\n\n    #[test]\n    fn test_sequence_composition() {\n        let task = TaskComposition::Sequence(vec![\n            TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Wood, 2)),\n            TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Axe, 1)),\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n        ]);\n        let json = serde_json::to_string(\u0026task).unwrap();\n        let _: TaskComposition = serde_json::from_str(\u0026json).unwrap();\n    }\n\n    #[test]\n    fn test_task_definition() {\n        let task = TaskDefinition {\n            id: 1,\n            description: \"Collect 3 wood and deliver to base\".to_string(),\n            goal: TaskComposition::Sequence(vec![\n                TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Wood, 3)),\n                TaskComposition::Atom(Predicate::AgentAt(0, Position::new(0, 0))),\n            ]),\n            tier: TaskTier::new(2),\n            estimated_steps: 50,\n            reward: 1.0,\n            dense_reward_weights: vec![0.5, 0.5],\n        };\n        assert_eq!(task.tier.value(), 2);\n    }\n\n    #[test]\n    fn test_active_task_defaults() {\n        let definition = TaskDefinition {\n            id: 42,\n            description: \"Test task\".to_string(),\n            goal: TaskComposition::Atom(Predicate::AgentAt(0, Position::new(1, 1))),\n            tier: TaskTier::new(1),\n            estimated_steps: 10,\n            reward: 1.0,\n            dense_reward_weights: vec![1.0],\n        };\n        let active = ActiveTask {\n            definition,\n            progress: vec![0.0],\n            sequence_index: 0,\n            completed: false,\n            failed: false,\n        };\n        assert_eq!(active.definition.id, 42);\n        assert_eq!(active.sequence_index, 0);\n        assert!(!active.completed);\n        assert!(!active.failed);\n        assert_eq!(active.progress.len(), 1);\n        assert_eq!(active.progress[0], 0.0);\n    }\n\n    #[test]\n    fn test_task_composition_while() {\n        let condition = TaskComposition::Atom(Predicate::HealthAbove(0, 0.5));\n        let goal = TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Wood, 3));\n        let while_task = TaskComposition::While(Box::new(condition), Box::new(goal));\n\n        // Verify structure via serialization roundtrip.\n        let json = serde_json::to_string(\u0026while_task).unwrap();\n        let recovered: TaskComposition = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(while_task, recovered);\n\n        // Verify it matches the While variant.\n        match \u0026while_task {\n            TaskComposition::While(cond, g) =\u003e {\n                match cond.as_ref() {\n                    TaskComposition::Atom(Predicate::HealthAbove(id, t)) =\u003e {\n                        assert_eq!(*id, 0);\n                        assert_eq!(*t, 0.5);\n                    }\n                    _ =\u003e panic!(\"expected HealthAbove predicate\"),\n                }\n                match g.as_ref() {\n                    TaskComposition::Atom(Predicate::AgentHas(id, item, count)) =\u003e {\n                        assert_eq!(*id, 0);\n                        assert_eq!(*item, ItemType::Wood);\n                        assert_eq!(*count, 3);\n                    }\n                    _ =\u003e panic!(\"expected AgentHas predicate\"),\n                }\n            }\n            _ =\u003e panic!(\"expected While variant\"),\n        }\n    }\n\n    #[test]\n    fn test_task_composition_before() {\n        let subtask = TaskComposition::Atom(Predicate::AgentAt(0, Position::new(10, 10)));\n        let before_task = TaskComposition::Before(Box::new(subtask), 500);\n\n        let json = serde_json::to_string(\u0026before_task).unwrap();\n        let recovered: TaskComposition = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(before_task, recovered);\n\n        match \u0026before_task {\n            TaskComposition::Before(sub, deadline) =\u003e {\n                assert_eq!(*deadline, 500);\n                match sub.as_ref() {\n                    TaskComposition::Atom(Predicate::AgentAt(id, pos)) =\u003e {\n                        assert_eq!(*id, 0);\n                        assert_eq!(*pos, Position::new(10, 10));\n                    }\n                    _ =\u003e panic!(\"expected AgentAt predicate\"),\n                }\n            }\n            _ =\u003e panic!(\"expected Before variant\"),\n        }\n    }\n\n    #[test]\n    fn test_task_composition_without() {\n        let subtask = TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Stone, 5));\n        let without_task = TaskComposition::Without(Box::new(subtask), 0); // forbidden: Noop\n\n        let json = serde_json::to_string(\u0026without_task).unwrap();\n        let recovered: TaskComposition = serde_json::from_str(\u0026json).unwrap();\n        assert_eq!(without_task, recovered);\n\n        match \u0026without_task {\n            TaskComposition::Without(sub, forbidden_action) =\u003e {\n                assert_eq!(*forbidden_action, 0);\n                match sub.as_ref() {\n                    TaskComposition::Atom(Predicate::AgentHas(id, item, count)) =\u003e {\n                        assert_eq!(*id, 0);\n                        assert_eq!(*item, ItemType::Stone);\n                        assert_eq!(*count, 5);\n                    }\n                    _ =\u003e panic!(\"expected AgentHas predicate\"),\n                }\n            }\n            _ =\u003e panic!(\"expected Without variant\"),\n        }\n    }\n}\n","traces":[{"line":64,"address":[1605072],"length":1,"stats":{"Line":5}},{"line":65,"address":[8083976],"length":1,"stats":{"Line":6}},{"line":69,"address":[8098688],"length":1,"stats":{"Line":3}},{"line":70,"address":[8098693],"length":1,"stats":{"Line":4}}],"covered":4,"coverable":4},{"path":["/","home","user","FORGE","crates","forge-types","src","validation.rs"],"content":"//! Configuration validation for the FORGE simulation.\n//!\n//! Validates all config fields against their valid ranges before\n//! constructing a [`WorldState`]. All validation logic is centralized\n//! here to keep the config module focused on type definitions.\n\nuse crate::config::ForgeConfig;\nuse crate::error::{ConfigError, ForgeError, ForgeResult};\n\n/// Validates a [`ForgeConfig`] against all known constraints.\n///\n/// Returns `Ok(())` if the config is valid, or a [`ForgeError::Config`]\n/// with details about the first invalid field found.\n///\n/// Called automatically by `WorldState::new()`. Can also be called\n/// directly to check a config before constructing a world.\npub fn validate_config(config: \u0026ForgeConfig) -\u003e ForgeResult\u003c()\u003e {\n    // World dimensions within [min_dimension, max_dimension]\n    if config.world.width \u003c config.world.min_dimension\n        || config.world.width \u003e config.world.max_dimension\n    {\n        return Err(ForgeError::Config(ConfigError::OutOfRange {\n            field: \"world.width\".to_string(),\n            value: config.world.width.to_string(),\n            min: config.world.min_dimension.to_string(),\n            max: config.world.max_dimension.to_string(),\n        }));\n    }\n\n    if config.world.height \u003c config.world.min_dimension\n        || config.world.height \u003e config.world.max_dimension\n    {\n        return Err(ForgeError::Config(ConfigError::OutOfRange {\n            field: \"world.height\".to_string(),\n            value: config.world.height.to_string(),\n            min: config.world.min_dimension.to_string(),\n            max: config.world.max_dimension.to_string(),\n        }));\n    }\n\n    // Resource density in [0.0, 1.0]\n    if !(0.0..=1.0).contains(\u0026config.world.resource_density) {\n        return Err(ForgeError::Config(ConfigError::OutOfRange {\n            field: \"world.resource_density\".to_string(),\n            value: config.world.resource_density.to_string(),\n            min: \"0.0\".to_string(),\n            max: \"1.0\".to_string(),\n        }));\n    }\n\n    // num_agents \u003e= 1 when tasks are enabled (0 agents is valid for worldgen-only use)\n    if config.task.enabled \u0026\u0026 config.agents.num_agents == 0 {\n        return Err(ForgeError::Config(ConfigError::OutOfRange {\n            field: \"agents.num_agents\".to_string(),\n            value: \"0 (tasks require at least 1 agent)\".to_string(),\n            min: \"1\".to_string(),\n            max: u32::MAX.to_string(),\n        }));\n    }\n\n    // reward_scale \u003e 0.0\n    if config.task.reward_scale \u003c= 0.0 {\n        return Err(ForgeError::Config(ConfigError::OutOfRange {\n            field: \"task.reward_scale\".to_string(),\n            value: config.task.reward_scale.to_string(),\n            min: \"0.0 (exclusive)\".to_string(),\n            max: \"inf\".to_string(),\n        }));\n    }\n\n    // Note: comm_vocab_size == 0 with comm_radius \u003e 0 is valid — it means\n    // communication is disabled. No validation needed for this combination.\n\n    // Vision radius fits within grid\n    let vision_span = 2 * config.agents.default_vision_radius as u16 + 1;\n    let min_side = config.world.width.min(config.world.height);\n    if vision_span \u003e min_side {\n        return Err(ForgeError::Config(ConfigError::OutOfRange {\n            field: \"agents.default_vision_radius\".to_string(),\n            value: config.agents.default_vision_radius.to_string(),\n            min: \"0\".to_string(),\n            max: ((min_side - 1) / 2).to_string(),\n        }));\n    }\n\n    // max_health \u003e 0\n    if config.agents.max_health \u003c= 0 {\n        return Err(ForgeError::Config(ConfigError::OutOfRange {\n            field: \"agents.max_health\".to_string(),\n            value: config.agents.max_health.to_string(),\n            min: \"1\".to_string(),\n            max: i32::MAX.to_string(),\n        }));\n    }\n\n    // max_stamina \u003e 0\n    if config.agents.max_stamina \u003c= 0 {\n        return Err(ForgeError::Config(ConfigError::OutOfRange {\n            field: \"agents.max_stamina\".to_string(),\n            value: config.agents.max_stamina.to_string(),\n            min: \"1\".to_string(),\n            max: i32::MAX.to_string(),\n        }));\n    }\n\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_default_config_validates() {\n        assert!(validate_config(\u0026ForgeConfig::default()).is_ok());\n    }\n\n    #[test]\n    fn test_invalid_width_too_small() {\n        let mut config = ForgeConfig::default();\n        config.world.width = 0;\n        let result = validate_config(\u0026config);\n        assert!(result.is_err());\n        let err_msg = result.unwrap_err().to_string();\n        assert!(err_msg.contains(\"world.width\"));\n    }\n\n    #[test]\n    fn test_invalid_width_too_large() {\n        let mut config = ForgeConfig::default();\n        config.world.width = config.world.max_dimension + 1;\n        let result = validate_config(\u0026config);\n        assert!(result.is_err());\n    }\n\n    #[test]\n    fn test_invalid_height() {\n        let mut config = ForgeConfig::default();\n        config.world.height = 0;\n        assert!(validate_config(\u0026config).is_err());\n    }\n\n    #[test]\n    fn test_invalid_resource_density_negative() {\n        let mut config = ForgeConfig::default();\n        config.world.resource_density = -0.1;\n        assert!(validate_config(\u0026config).is_err());\n    }\n\n    #[test]\n    fn test_invalid_resource_density_over_one() {\n        let mut config = ForgeConfig::default();\n        config.world.resource_density = 1.1;\n        assert!(validate_config(\u0026config).is_err());\n    }\n\n    #[test]\n    fn test_zero_agents_with_tasks() {\n        let mut config = ForgeConfig::default();\n        config.agents.num_agents = 0;\n        config.task.enabled = true;\n        assert!(validate_config(\u0026config).is_err());\n    }\n\n    #[test]\n    fn test_zero_agents_without_tasks() {\n        let mut config = ForgeConfig::default();\n        config.agents.num_agents = 0;\n        config.task.enabled = false;\n        assert!(validate_config(\u0026config).is_ok());\n    }\n\n    #[test]\n    fn test_invalid_reward_scale_zero() {\n        let mut config = ForgeConfig::default();\n        config.task.reward_scale = 0.0;\n        assert!(validate_config(\u0026config).is_err());\n    }\n\n    #[test]\n    fn test_invalid_reward_scale_negative() {\n        let mut config = ForgeConfig::default();\n        config.task.reward_scale = -1.0;\n        assert!(validate_config(\u0026config).is_err());\n    }\n\n    #[test]\n    fn test_comm_radius_without_vocab_is_ok() {\n        let mut config = ForgeConfig::default();\n        config.agents.comm_radius = 5;\n        config.agents.comm_vocab_size = 0;\n        // comm_vocab_size == 0 means communication disabled, which is valid\n        assert!(validate_config(\u0026config).is_ok());\n    }\n\n    #[test]\n    fn test_vision_radius_too_large() {\n        let mut config = ForgeConfig::default();\n        config.world.min_dimension = 4;\n        config.world.width = 5;\n        config.world.height = 5;\n        config.agents.default_vision_radius = 3; // 2*3+1 = 7 \u003e 5\n        assert!(validate_config(\u0026config).is_err());\n    }\n\n    #[test]\n    fn test_vision_radius_fits() {\n        let mut config = ForgeConfig::default();\n        config.world.min_dimension = 4;\n        config.world.width = 5;\n        config.world.height = 5;\n        config.agents.default_vision_radius = 2; // 2*2+1 = 5 = 5, ok\n        assert!(validate_config(\u0026config).is_ok());\n    }\n\n    #[test]\n    fn test_boundary_resource_density_zero() {\n        let mut config = ForgeConfig::default();\n        config.world.resource_density = 0.0;\n        assert!(validate_config(\u0026config).is_ok());\n    }\n\n    #[test]\n    fn test_boundary_resource_density_one() {\n        let mut config = ForgeConfig::default();\n        config.world.resource_density = 1.0;\n        assert!(validate_config(\u0026config).is_ok());\n    }\n}\n","traces":[{"line":17,"address":[8305054,8304304,8305060],"length":1,"stats":{"Line":16}},{"line":19,"address":[1828190],"length":1,"stats":{"Line":17}},{"line":20,"address":[8134957],"length":1,"stats":{"Line":17}},{"line":22,"address":[8585817],"length":1,"stats":{"Line":3}},{"line":23,"address":[8158359],"length":1,"stats":{"Line":2}},{"line":24,"address":[1828245],"length":1,"stats":{"Line":3}},{"line":25,"address":[8162292],"length":1,"stats":{"Line":3}},{"line":26,"address":[8162361],"length":1,"stats":{"Line":3}},{"line":30,"address":[1828272],"length":1,"stats":{"Line":17}},{"line":31,"address":[8135047],"length":1,"stats":{"Line":15}},{"line":33,"address":[8161997],"length":1,"stats":{"Line":1}},{"line":34,"address":[1828297],"length":1,"stats":{"Line":1}},{"line":35,"address":[8304483],"length":1,"stats":{"Line":1}},{"line":36,"address":[8585256],"length":1,"stats":{"Line":1}},{"line":37,"address":[8585325],"length":1,"stats":{"Line":1}},{"line":42,"address":[8135122],"length":1,"stats":{"Line":17}},{"line":43,"address":[18286 ne":98,"address":[8159784],"length":1,"stats":{"Line":0}},{"line":99,"address":[8582936],"length":1,"stats":{"Line":0}},{"line":100,"address":[1829361],"length":1,"stats":{"Line":0}},{"line":101,"address":[8305645],"length":1,"stats":{"Line":0}},{"line":102,"address":[8159717],"length":1,"stats":{"Line":0}},{"line":106,"address":[8159526],"length":1,"stats":{"Line":16}}],"covered":44,"coverable":54},{"path":["/","home","user","FORGE","crates","forge-wasm","src","lib.rs"],"content":"#![deny(missing_docs)]\n#![deny(clippy::all)]\n\n//! # forge-wasm\n//!\n//! WebAssembly visualization module for the FORGE simulation platform.\n//!\n//! This crate provides a JavaScript-friendly API via `wasm-bindgen` that\n//! wraps the core simulation engine. All inputs and outputs are JSON strings,\n//! making it easy to integrate with browser-based visualizations.\n\nuse forge_core::WorldState;\nuse forge_types::config::ForgeConfig;\nuse forge_types::observation::{ActionSpace, ObservationSpace};\nuse forge_types::Action;\nuse serde::Serialize;\nuse tracing::instrument;\nuse wasm_bindgen::prelude::*;\n\n/// Response payload for a single simulation step, serialized to JSON.\n#[derive(Debug, Serialize)]\nstruct StepResponse {\n    /// Per-agent observations.\n    observations: Vec\u003cforge_types::observation::Observation\u003e,\n    /// Per-agent scalar rewards.\n    rewards: Vec\u003cf32\u003e,\n    /// Whether the episode terminated naturally (goal reached or agent died).\n    terminated: bool,\n    /// Whether the episode was truncated (max steps reached).\n    truncated: bool,\n    /// Diagnostic info about the current tick.\n    info: forge_types::observation::StepInfo,\n}\n\n/// A FORGE simulation environment exposed to WebAssembly.\n///\n/// All public methods accept and return JSON strings so they can be called\n/// directly from JavaScript without additional marshalling.\n#[wasm_bindgen]\npub struct ForgeWasmEnv {\n    /// The underlying simulation state.\n    world: WorldState,\n    /// Cached configuration for space queries.\n    config: ForgeConfig,\n}\n\n#[wasm_bindgen]\nimpl ForgeWasmEnv {\n    /// Creates a new FORGE environment from a JSON configuration string.\n    ///\n    /// # Arguments\n    ///\n    /// * `config_json` - A JSON string that deserializes into a `ForgeConfig`.\n    ///   Pass an empty string or `\"null\"` to use all default values.\n    ///\n    /// # Panics\n    ///\n    /// Panics if `config_json` contains invalid JSON or fields that cannot be\n    /// parsed into a `ForgeConfig`.\n    #[instrument(skip_all)]\n    #[wasm_bindgen(constructor)]\n    pub fn new(config_json: \u0026str) -\u003e Self {\n        let trimmed = config_json.trim();\n        let config: ForgeConfig = if trimmed.is_empty() || trimmed == \"null\" {\n            ForgeConfig::default()\n        } else {\n            serde_json::from_str(config_json).expect(\"failed to parse ForgeConfig JSON\")\n        };\n        let world = WorldState::new(config.clone()).expect(\"invalid config\");\n        Self { world, config }\n    }\n\n    /// Resets the simulation and returns the initial observation as a JSON string.\n    ///\n    /// # Arguments\n    ///\n    /// * `seed` - Optional RNG seed for the new episode. When `None`, a seed is\n    ///   derived from the internal RNG.\n    ///\n    /// # Returns\n    ///\n    /// A JSON-encoded [`StepResponse`] containing the initial observations,\n    /// zero rewards, and `terminated = false`.\n    #[instrument(skip_all)]\n    pub fn reset(\u0026mut self, seed: Option\u003cu64\u003e) -\u003e String {\n        let result = self.world.reset(seed);\n        let response = StepResponse {\n            observations: result.observations,\n            rewards: result.rewards,\n            terminated: result.terminated,\n            truncated: result.truncated,\n            info: result.info,\n        };\n        serde_json::to_string(\u0026response).expect(\"failed to serialize reset result\")\n    }\n\n    /// Advances the simulation by one tick with the given discrete action.\n    ///\n    /// The action is decoded from a flat integer using the standard FORGE\n    /// action encoding (see [`Action::from_discrete`]).\n    ///\n    /// # Arguments\n    ///\n    /// * `action` - A discrete action index for the first agent. Out-of-range\n    ///   values are mapped to `Noop`.\n    ///\n    /// # Returns\n    ///\n    /// A JSON-encoded [`StepResponse`] with observations, rewards,\n    /// termination flags, and diagnostic info.\n    #[instrument(skip_all)]\n    pub fn step(\u0026mut self, action: u32) -\u003e String {\n        let comm_vocab = self.config.agents.comm_vocab_size;\n        let decoded = Action::from_discrete(action, comm_vocab).unwrap_or(Action::Noop);\n        let result = self.world.step(\u0026[decoded]);\n        let response = StepResponse {\n            observations: result.observations,\n            rewards: result.rewards,\n            terminated: result.terminated,\n            truncated: result.truncated,\n            info: result.info,\n        };\n        serde_json::to_string(\u0026response).expect(\"failed to serialize step result\")\n    }\n\n    /// Returns an ASCII-art rendering of the current world grid.\n    ///\n    /// Useful for quick text-based visualization and debugging.\n    /// Characters: `A` = agent, `O` = object, `R` = resource, `.` = ground,\n    /// `~` = water, `#` = wall, `L` = lava, `I` = ice, `S` = sand,\n    /// `T` = forest, `M` = mountain.\n    pub fn render_ascii(\u0026self) -\u003e String {\n        self.world.to_debug_grid()\n    }\n\n    /// Serializes the full simulation state to a JSON string.\n    ///\n    /// This includes tick count, grid dimensions, agent positions and stats,\n    /// object and resource data, day phase, and termination flags. Intended\n    /// for save/load, replay recording, or detailed inspection.\n    pub fn get_state_json(\u0026self) -\u003e String {\n        let state = SerializableState {\n            tick: self.world.tick,\n            grid_width: self.world.grid.width,\n            grid_height: self.world.grid.height,\n            num_agents: self.world.agents.len(),\n            agents_alive: self.world.agents.iter().map(|a| a.alive).collect(),\n            agent_positions: self\n                .world\n                .agents\n                .iter()\n                .map(|a| (a.position.x, a.position.y))\n                .collect(),\n            day_phase: self.world.day_phase,\n            terminated: self.world.terminated,\n            truncated: self.world.truncated,\n            num_objects: self.world.objects.len(),\n            num_resources: self.world.resources.len(),\n        };\n        serde_json::to_string(\u0026state).expect(\"failed to serialize world state\")\n    }\n\n    /// Returns a JSON description of the observation space.\n    ///\n    /// The response includes the flattened shape, value bounds, grid view\n    /// dimensions, inventory size, and communication buffer size.\n    pub fn observation_space_json(\u0026self) -\u003e String {\n        let vr = self.config.agents.default_vision_radius;\n        let view_side = 2 * vr as usize + 1;\n        let features_per_tile = forge_types::constants::OBS_FEATURES_PER_TILE;\n\n        let flat_size = forge_types::observation::Observation::flat_size(\n            vr,\n            self.config.agents.default_carry_capacity,\n            self.config.agents.comm_buffer_size,\n            self.config.task.max_predicates,\n        );\n\n        let space = ObservationSpace {\n            flat_shape: vec![flat_size],\n            low: 0.0,\n            high: 255.0,\n            grid_shape: (view_side, view_side, features_per_tile),\n            inventory_size: self.config.agents.default_carry_capacity as usize,\n            comm_buffer_size: self.config.agents.comm_buffer_size as usize,\n        };\n        serde_json::to_string(\u0026space).expect(\"failed to serialize observation space\")\n    }\n\n    /// Returns a JSON description of the action space.\n    ///\n    /// The response includes the total number of discrete actions and a list\n    /// of human-readable action names indexed by action ID.\n    pub fn action_space_json(\u0026self) -\u003e String {\n        let space = ActionSpace::new(self.config.agents.comm_vocab_size);\n        serde_json::to_string(\u0026space).expect(\"failed to serialize action space\")\n    }\n}\n\n/// A simplified view of the world state for JSON serialization.\n#[derive(Debug, Serialize)]\nstruct SerializableState {\n    /// Current simulation tick.\n    tick: u64,\n    /// Grid width in tiles.\n    grid_width: u16,\n    /// Grid height in tiles.\n    grid_height: u16,\n    /// Total number of agents.\n    num_agents: usize,\n    /// Per-agent alive status.\n    agents_alive: Vec\u003cbool\u003e,\n    /// Per-agent (x, y) positions.\n    agent_positions: Vec\u003c(u16, u16)\u003e,\n    /// Current day/night phase.\n    day_phase: u8,\n    /// Whether the episode has terminated.\n    terminated: bool,\n    /// Whether the episode was truncated.\n    truncated: bool,\n    /// Number of objects in the world.\n    num_objects: usize,\n    /// Number of resource nodes in the world.\n    num_resources: usize,\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    /// Returns a JSON string for a default `ForgeConfig`.\n    fn default_config_json() -\u003e String {\n        serde_json::to_string(\u0026ForgeConfig::default()).unwrap()\n    }\n\n    #[test]\n    fn test_new_default_config() {\n        let env = ForgeWasmEnv::new(\u0026default_config_json());\n        assert!(!env.world.terminated);\n    }\n\n    #[test]\n    fn test_new_with_empty_string_uses_defaults() {\n        let env = ForgeWasmEnv::new(\"\");\n        assert!(!env.world.terminated);\n    }\n\n    #[test]\n    fn test_new_with_null_uses_defaults() {\n        let env = ForgeWasmEnv::new(\"null\");\n        assert!(!env.world.terminated);\n    }\n\n    #[test]\n    fn test_reset_returns_valid_json() {\n        let mut env = ForgeWasmEnv::new(\u0026default_config_json());\n        let json = env.reset(Some(42));\n        let value: serde_json::Value = serde_json::from_str(\u0026json).unwrap();\n        assert!(value.get(\"observations\").is_some());\n        assert!(value.get(\"rewards\").is_some());\n        assert!(value.get(\"terminated\").is_some());\n        assert!(value.get(\"truncated\").is_some());\n    }\n\n    #[test]\n    fn test_step_returns_valid_json() {\n        let mut env = ForgeWasmEnv::new(\u0026default_config_json());\n        let json = env.step(0); // Noop\n        let value: serde_json::Value = serde_json::from_str(\u0026json).unwrap();\n        assert!(value.get(\"observations\").is_some());\n        assert!(value.get(\"rewards\").is_some());\n    }\n\n    #[test]\n    fn test_render_ascii_nonempty() {\n        let env = ForgeWasmEnv::new(\u0026default_config_json());\n        let grid = env.render_ascii();\n        assert!(!grid.is_empty());\n        assert!(grid.contains('A')); // At least one agent\n    }\n\n    #[test]\n    fn test_get_state_json() {\n        let env = ForgeWasmEnv::new(\u0026default_config_json());\n        let json = env.get_state_json();\n        let value: serde_json::Value = serde_json::from_str(\u0026json).unwrap();\n        assert!(value.get(\"tick\").is_some());\n        assert!(value.get(\"grid_width\").is_some());\n        assert!(value.get(\"num_agents\").is_some());\n    }\n\n    #[test]\n    fn test_observation_space_json() {\n        let env = ForgeWasmEnv::new(\u0026default_config_json());\n        let json = env.observation_space_json();\n        let value: serde_json::Value = serde_json::from_str(\u0026json).unwrap();\n        assert!(value.get(\"flat_shape\").is_some());\n        assert!(value.get(\"grid_shape\").is_some());\n    }\n\n    #[test]\n    fn test_action_space_json() {\n        let env = ForgeWasmEnv::new(\u0026default_config_json());\n        let json = env.action_space_json();\n        let value: serde_json::Value = serde_json::from_str(\u0026json).unwrap();\n        assert!(value.get(\"n\").is_some());\n        assert!(value.get(\"action_names\").is_some());\n    }\n\n    #[test]\n    fn test_partial_config_json() {\n        // Provide JSON with only some fields; the rest should use defaults\n        let partial_json = r#\"{\"world\": {\"width\": 16, \"height\": 16, \"seed\": 42}}\"#;\n        let env = ForgeWasmEnv::new(partial_json);\n        assert_eq!(env.world.grid.width, 16);\n        assert_eq!(env.world.grid.height, 16);\n        assert!(!env.world.terminated);\n        // Agents should still be created using defaults\n        assert!(!env.world.agents.is_empty());\n    }\n\n    #[test]\n    fn test_multi_step_episode() {\n        let mut env = ForgeWasmEnv::new(\u0026default_config_json());\n        let reset_json = env.reset(Some(123));\n        let reset_val: serde_json::Value = serde_json::from_str(\u0026reset_json).unwrap();\n        assert_eq!(reset_val[\"terminated\"].as_bool(), Some(false));\n\n        // Run 100 steps\n        for i in 0..100 {\n            let action = i % 5; // cycle through Noop, Up, Down, Left, Right\n            let step_json = env.step(action);\n            let step_val: serde_json::Value = serde_json::from_str(\u0026step_json).unwrap();\n            assert!(step_val.get(\"observations\").is_some());\n            assert!(step_val.get(\"rewards\").is_some());\n            // If terminated or truncated, stop early\n            if step_val[\"terminated\"].as_bool() == Some(true)\n                || step_val[\"truncated\"].as_bool() == Some(true)\n            {\n                break;\n            }\n        }\n\n        // Verify the state advanced from tick 0\n        let state_json = env.get_state_json();\n        let state_val: serde_json::Value = serde_json::from_str(\u0026state_json).unwrap();\n        let tick = state_val[\"tick\"].as_u64().unwrap();\n        assert!(tick \u003e 0, \"tick should have advanced after stepping\");\n    }\n\n    #[test]\n    fn test_step_with_invalid_action_falls_back_to_noop() {\n        let mut env = ForgeWasmEnv::new(\u0026default_config_json());\n        // Very large action index should fall back to Noop\n        let json = env.step(99999);\n        let value: serde_json::Value = serde_json::from_str(\u0026json).unwrap();\n        assert!(value.get(\"observations\").is_some());\n    }\n}\n","traces":[{"line":62,"address":[3049824,3051088,3051094],"length":1,"stats":{"Line":4}},{"line":63,"address":[3050592,3049978],"length":1,"stats":{"Line":8}},{"line":64,"address":[3050694,3050608],"length":1,"stats":{"Line":8}},{"line":65,"address":[3050792,3050683],"length":1,"stats":{"Line":2}},{"line":67,"address":[3050718],"length":1,"stats":{"Line":4}},{"line":69,"address":[3050785,3050794],"length":1,"stats":{"Line":8}},{"line":85,"address":[3056081,3054768,3056056],"length":1,"stats":{"Line":1}},{"line":86,"address":[3054931],"length":1,"stats":{"Line":1}},{"line":88,"address":[3055535],"length":1,"stats":{"Line":1}},{"line":89,"address":[3055567],"length":1,"stats":{"Line":1}},{"line":90,"address":[3055599],"length":1,"stats":{"Line":1}},{"line":91,"address":[3055606],"length":1,"stats":{"Line":1}},{"line":92,"address":[3055613],"length":1,"stats":{"Line":1}},{"line":94,"address":[3055835,3055887],"length":1,"stats":{"Line":2}},{"line":112,"address":[3053636,3053661,3052192],"length":1,"stats":{"Line":1}},{"line":113,"address":[3052340],"length":1,"stats":{"Line":1}},{"line":114,"address":[3052351,3052334,3052957],"length":1,"stats":{"Line":3}},{"line":115,"address":[3053069],"length":1,"stats":{"Line":1}},{"line":117,"address":[3053115],"length":1,"stats":{"Line":2}},{"line":118,"address":[3053147],"length":1,"stats":{"Line":1}},{"line":119,"address":[3053179],"length":1,"stats":{"Line":2}},{"line":120,"address":[3053186],"length":1,"stats":{"Line":1}},{"line":121,"address":[3053193], ],"length":1,"stats":{"Line":2}}],"covered":53,"coverable":53},{"path":["/","home","user","FORGE","crates","forge-worldgen","src","biome.rs"],"content":"//! Biome classification rules for mapping elevation and moisture to terrain types.\n//!\n//! The [`BiomeClassifier`] converts continuous elevation and moisture values\n//! (both in \\[0.0, 1.0\\]) into discrete [`TerrainType`] variants using\n//! configurable thresholds derived from [`WorldConfig`].\n\nuse forge_types::config::WorldConfig;\nuse forge_types::grid::TerrainType;\nuse tracing::instrument;\n\n/// Configurable thresholds that drive biome classification.\n///\n/// All thresholds are in the normalised \\[0.0, 1.0\\] range.\n#[derive(Debug, Clone)]\npub struct BiomeThresholds {\n    /// Elevation at or below which the tile is Water.\n    pub water_level: f64,\n    /// Elevation at or above which the tile is Mountain.\n    pub mountain_level: f64,\n    /// Elevation threshold for Sand (beach strip just above water).\n    pub sand_level: f64,\n    /// Moisture threshold above which a low-mid elevation tile becomes Forest.\n    pub forest_moisture: f64,\n    /// Moisture threshold below which a tile at mid elevation becomes Sand\n    /// (desert-like areas).\n    pub desert_moisture: f64,\n}\n\nimpl BiomeThresholds {\n    /// Derives thresholds from the [`WorldConfig`].\n    ///\n    /// The `biome_scale` field is repurposed as a general biome-intensity\n    /// knob.  A higher `biome_scale` pushes the water level down and the\n    /// mountain level higher, producing more varied terrain.\n    #[instrument(skip_all)]\n    pub fn from_config(config: \u0026WorldConfig) -\u003e Self {\n        let scale = config.biome_scale as f64;\n\n        // Sensible defaults that respond to biome_scale.\n        // biome_scale of 0.1 (default) gives water=0.35, mountain=0.72\n        let water_level = (0.35 - scale * 0.3).clamp(0.10, 0.50);\n        let mountain_level = (0.72 + scale * 0.3).clamp(0.60, 0.90);\n        let sand_level = water_level + 0.05;\n        let forest_moisture = 0.45;\n        let desert_moisture = 0.25;\n\n        Self {\n            water_level,\n            mountain_level,\n            sand_level,\n            forest_moisture,\n            desert_moisture,\n        }\n    }\n}\n\n/// Classifies (elevation, moisture) pairs into terrain types.\n#[derive(Debug, Clone)]\npub struct BiomeClassifier {\n    /// The thresholds driving classification.\n    pub thresholds: BiomeThresholds,\n}\n\nimpl BiomeClassifier {\n    /// Creates a new classifier from a [`WorldConfig`].\n    pub fn new(config: \u0026WorldConfig) -\u003e Self {\n        let thresholds = BiomeThresholds::from_config(config);\n        tracing::trace!(?thresholds, \"created BiomeClassifier\");\n        Self { thresholds }\n    }\n\n    /// Creates a classifier with explicit thresholds.\n    pub fn with_thresholds(thresholds: BiomeThresholds) -\u003e Self {\n        Self { thresholds }\n    }\n\n    /// Maps an (elevation, moisture) pair to a [`TerrainType`].\n    ///\n    /// Both `elevation` and `moisture` are expected to be in \\[0.0, 1.0\\].\n    #[instrument(skip_all)]\n    pub fn classify(\u0026self, elevation: f64, moisture: f64) -\u003e TerrainType {\n        let t = \u0026self.thresholds;\n\n        if elevation \u003c= t.water_level {\n            TerrainType::Water\n        } else if elevation \u003c= t.sand_level {\n            TerrainType::Sand\n        } else if elevation \u003e= t.mountain_level {\n            TerrainType::Mountain\n        } else if moisture \u003e= t.forest_moisture {\n            TerrainType::Forest\n        } else if moisture \u003c= t.desert_moisture {\n            TerrainType::Sand\n        } else {\n            TerrainType::Ground\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    fn default_classifier() -\u003e BiomeClassifier {\n        BiomeClassifier::new(\u0026WorldConfig::default())\n    }\n\n    #[test]\n    fn test_deep_water() {\n        let c = default_classifier();\n        assert_eq!(c.classify(0.0, 0.5), TerrainType::Water);\n        assert_eq!(c.classify(0.1, 0.5), TerrainType::Water);\n    }\n\n    #[test]\n    fn test_mountain() {\n        let c = default_classifier();\n        assert_eq!(c.classify(1.0, 0.5), TerrainType::Mountain);\n        assert_eq!(c.classify(0.95, 0.5), TerrainType::Mountain);\n    }\n\n    #[test]\n    fn test_sand_beach() {\n        let c = default_classifier();\n        // Just above water level should be sand\n        let elev = c.thresholds.water_level + 0.01;\n        assert_eq!(c.classify(elev, 0.5), TerrainType::Sand);\n    }\n\n    #[test]\n    fn test_forest_high_moisture() {\n        let c = default_classifier();\n        // Mid elevation, high moisture =\u003e Forest\n        let elev = (c.thresholds.sand_level + c.thresholds.mountain_level) / 2.0;\n        assert_eq!(c.classify(elev, 0.9), TerrainType::Forest);\n    }\n\n    #[test]\n    fn test_ground_mid_moisture() {\n        let c = default_classifier();\n        let elev = (c.thresholds.sand_level + c.thresholds.mountain_level) / 2.0;\n        assert_eq!(c.classify(elev, 0.35), TerrainType::Ground);\n    }\n\n    #[test]\n    fn test_desert_low_moisture() {\n        let c = default_classifier();\n        let elev = (c.thresholds.sand_level + c.thresholds.mountain_level) / 2.0;\n        assert_eq!(c.classify(elev, 0.1), TerrainType::Sand);\n    }\n\n    #[test]\n    fn test_custom_thresholds() {\n        let thresholds = BiomeThresholds {\n            water_level: 0.2,\n            mountain_level: 0.8,\n            sand_level: 0.25,\n            forest_moisture: 0.5,\n            desert_moisture: 0.2,\n        };\n        let c = BiomeClassifier::with_thresholds(thresholds);\n        assert_eq!(c.classify(0.1, 0.5), TerrainType::Water);\n        assert_eq!(c.classify(0.9, 0.5), TerrainType::Mountain);\n        assert_eq!(c.classify(0.5, 0.7), TerrainType::Forest);\n    }\n\n    #[test]\n    fn test_biome_extreme_elevation() {\n        let c = default_classifier();\n        // Elevation 0.0 should be deep water\n        let at_zero = c.classify(0.0, 0.5);\n        assert_eq!(at_zero, TerrainType::Water, \"elevation 0.0 should be Water\");\n\n        // Elevation 1.0 should be mountain\n        let at_one = c.classify(1.0, 0.5);\n        assert_eq!(\n            at_one,\n            TerrainType::Mountain,\n            \"elevation 1.0 should be Mountain\"\n        );\n\n        // Test with extreme moisture values at the extremes\n        assert_eq!(c.classify(0.0, 0.0), TerrainType::Water);\n        assert_eq!(c.classify(0.0, 1.0), TerrainType::Water);\n        assert_eq!(c.classify(1.0, 0.0), TerrainType::Mountain);\n        assert_eq!(c.classify(1.0, 1.0), TerrainType::Mountain);\n    }\n\n    #[test]\n    fn test_boundary_water_sand() {\n        let c = default_classifier();\n        // Exactly at water_level should be Water (\u003c=)\n        assert_eq!(\n            c.classify(c.thresholds.water_level, 0.5),\n            TerrainType::Water\n        );\n        // Just above should be Sand\n        assert_eq!(\n            c.classify(c.thresholds.water_level + 0.001, 0.5),\n            TerrainType::Sand\n        );\n    }\n\n    #[test]\n    fn test_from_config_default_scale() {\n        let config = WorldConfig::default();\n        let thresholds = BiomeThresholds::from_config(\u0026config);\n        // Default biome_scale is 0.1\n        assert!(thresholds.water_level \u003e= 0.10);\n        assert!(thresholds.water_level \u003c= 0.50);\n        assert!(thresholds.mountain_level \u003e= 0.60);\n        assert!(thresholds.mountain_level \u003c= 0.90);\n        assert!(thresholds.sand_level \u003e thresholds.water_level);\n    }\n\n    #[test]\n    fn test_from_config_high_scale() {\n        let config = WorldConfig {\n            biome_scale: 1.0,\n            ..WorldConfig::default()\n        };\n        let thresholds = BiomeThresholds::from_config(\u0026config);\n        // High scale pushes water_level down and mountain_level up\n        assert!(thresholds.water_level \u003c= 0.15);\n        assert!(thresholds.mountain_level \u003e= 0.85);\n    }\n\n    #[test]\n    fn test_from_config_zero_scale() {\n        let config = WorldConfig {\n            biome_scale: 0.0,\n            ..WorldConfig::default()\n        };\n        let thresholds = BiomeThresholds::from_config(\u0026config);\n        // Zero scale gives base values\n        assert!((thresholds.water_level - 0.35).abs() \u003c 0.01);\n        assert!((thresholds.mountain_level - 0.72).abs() \u003c 0.01);\n    }\n}\n","traces":[{"line":36,"address":[2313417,2312272,2313423],"length":1,"stats":{"Line":14}},{"line":37,"address":[4500508],"length":1,"stats":{"Line":9}},{"line":41,"address":[4500540,4501187],"length":1,"stats":{"Line":22}},{"line":42,"address":[4501204],"length":1,"stats":{"Line":8}},{"line":43,"address":[4916635],"length":1,"stats":{"Line":10}},{"line":44,"address":[4476987],"length":1,"stats":{"Line":9}},{"line":45,"address":[4915757],"length":1,"stats":{"Line":14}},{"line":66,"address":[4498880],"length":1,"stats":{"Line":15}},{"line":67,"address":[4644905],"length":1,"stats":{"Line":10}},{"line":68,"address":[4475698,4475524],"length":1,"stats":{"Line":9}},{"line":73,"address":[4475456],"length":1,"stats":{"Line":1}},{"line":81,"address":[2311264,2312259,2312230],"length":1,"stats":{"Line":13}},{"line":82,"address":[4645481],"length":1,"stats":{"Line":13}},{"line":84,"address":[4476097,4476721],"length":1,"stats":{"Line":20}},{"line":85,"address":[4915468],"length":1,"stats":{"Line":7}},{"line":86,"address":[2312031,2312076],"length":1,"stats":{"Line":26}},{"line":87,"address":[4915495],"length":1,"stats":{"Line":12}},{"line":88,"address":[4646167,4646126],"length":1,"stats":{"Line":19}},{"line":89,"address":[4915522],"length":1,"stats":{"Line":7}},{"line":90,"address":[4500153,4500198],"length":1,"stats":{"Line":27}},{"line":91,"address":[4915553],"length":1,"stats":{"Line":12}},{"line":92,"address":[4646180,4646205],"length":1,"stats":{"Line":27}},{"line":93,"address":[4500207],"length":1,"stats":{"Line":9}},{"line":95,"address":[4500200],"length":1,"stats":{"Line":12}}],"covered":24,"coverable":24},{"path":["/","home","user","FORGE","crates","forge-worldgen","src","entities.rs"],"content":"//! Entity/agent spawn point selection.\n//!\n//! [`SpawnPlacer`] finds valid spawn locations on walkable tiles that are not\n//! already occupied by resources or objects.  Spawn points are spread out to\n//! avoid clustering.\n\nuse forge_types::grid::{Grid, Position};\nuse rand::seq::SliceRandom;\nuse rand_pcg::Pcg64Mcg;\nuse tracing::instrument;\n\n/// Minimum Manhattan distance between spawn points.\n///\n/// This prevents agents from spawning on top of each other and gives them\n/// some room to manoeuvre at the start of an episode.\nconst MIN_SPAWN_DISTANCE: u32 = 3;\n\n/// Finds valid spawn locations for agents on the grid.\n#[derive(Debug)]\npub struct SpawnPlacer;\n\nimpl SpawnPlacer {\n    /// Finds `num_agents` spawn points on walkable, unoccupied tiles.\n    ///\n    /// The algorithm:\n    /// 1. Collect all walkable tiles that have no resource or object.\n    /// 2. Shuffle them deterministically with `rng`.\n    /// 3. Greedily pick tiles that are at least [`MIN_SPAWN_DISTANCE`] apart.\n    /// 4. If not enough spread-out tiles exist, relax the distance constraint\n    ///    and pick from the remaining candidates.\n    ///\n    /// Returns up to `num_agents` positions.  If fewer walkable tiles exist\n    /// than requested agents, as many as possible are returned.\n    #[instrument(skip_all)]\n    pub fn find_spawn_points(grid: \u0026Grid, num_agents: u32, rng: \u0026mut Pcg64Mcg) -\u003e Vec\u003cPosition\u003e {\n        let num = num_agents as usize;\n        tracing::trace!(num_agents, \"finding spawn points\");\n\n        // Collect candidate tiles\n        let mut candidates: Vec\u003cPosition\u003e = Vec::new();\n        for y in 0..grid.height {\n            for x in 0..grid.width {\n                if let Some(tile) = grid.get(x, y) {\n                    if tile.terrain.is_walkable()\n                        \u0026\u0026 tile.resource_id.is_none()\n                        \u0026\u0026 tile.object_id.is_none()\n                        \u0026\u0026 tile.agent_id.is_none()\n                    {\n                        candidates.push(Position::new(x, y));\n                    }\n                }\n            }\n        }\n\n        tracing::trace!(candidates = candidates.len(), \"walkable candidates found\");\n\n        // Shuffle for randomness\n        candidates.shuffle(rng);\n\n        // Greedy selection with distance constraint\n        let mut selected: Vec\u003cPosition\u003e = Vec::with_capacity(num);\n        let mut remaining: Vec\u003cPosition\u003e = Vec::new();\n\n        for pos in candidates {\n            if selected.len() \u003e= num {\n                break;\n            }\n\n            let far_enough = selected\n                .iter()\n                .all(|s| pos.manhattan_distance(s) \u003e= MIN_SPAWN_DISTANCE);\n\n            if far_enough {\n                selected.push(pos);\n            } else {\n                remaining.push(pos);\n            }\n        }\n\n        // If we still need more, relax the distance constraint\n        if selected.len() \u003c num {\n            for pos in remaining {\n                if selected.len() \u003e= num {\n                    break;\n                }\n                selected.push(pos);\n            }\n        }\n\n        tracing::trace!(count = selected.len(), \"spawn points selected\");\n        selected\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::terrain::TerrainGenerator;\n    use forge_types::config::WorldConfig;\n    use rand::SeedableRng;\n\n    fn make_grid(seed: u64) -\u003e (Grid, WorldConfig) {\n        let config = WorldConfig {\n            width: 32,\n            height: 32,\n            seed,\n            ..WorldConfig::default()\n        };\n        let gen = TerrainGenerator::new(\u0026config, seed);\n        let mut grid = Grid::new(config.width, config.height);\n        gen.generate(\u0026mut grid);\n        (grid, config)\n    }\n\n    #[test]\n    fn test_find_spawn_points() {\n        let (grid, _config) = make_grid(42);\n        let mut rng = Pcg64Mcg::seed_from_u64(42);\n        let spawns = SpawnPlacer::find_spawn_points(\u0026grid, 4, \u0026mut rng);\n        assert_eq!(spawns.len(), 4, \"Should find 4 spawn points\");\n    }\n\n    #[test]\n    fn test_spawns_on_walkable_tiles() {\n        let (grid, _config) = make_grid(55);\n        let mut rng = Pcg64Mcg::seed_from_u64(55);\n        let spawns = SpawnPlacer::find_spawn_points(\u0026grid, 8, \u0026mut rng);\n\n        for pos in \u0026spawns {\n            let tile = grid.get_pos(pos).unwrap();\n            assert!(\n                tile.terrain.is_walkable(),\n                \"Spawn at ({}, {}) is on non-walkable {:?}\",\n                pos.x,\n                pos.y,\n                tile.terrain\n            );\n        }\n    }\n\n    #[test]\n    fn test_determinism() {\n        let (grid, _config) = make_grid(99);\n\n        let mut rng1 = Pcg64Mcg::seed_from_u64(99);\n        let spawns1 = SpawnPlacer::find_spawn_points(\u0026grid, 4, \u0026mut rng1);\n\n        let mut rng2 = Pcg64Mcg::seed_from_u64(99);\n        let spawns2 = SpawnPlacer::find_spawn_points(\u0026grid, 4, \u0026mut rng2);\n\n        assert_eq!(spawns1, spawns2);\n    }\n\n    #[test]\n    fn test_spread_out() {\n        let (grid, _config) = make_grid(77);\n        let mut rng = Pcg64Mcg::seed_from_u64(77);\n        let spawns = SpawnPlacer::find_spawn_points(\u0026grid, 4, \u0026mut rng);\n\n        // At least the first few should respect minimum distance\n        // (unless the grid is very small / mostly non-walkable)\n        if spawns.len() \u003e= 2 {\n            let mut some_distant = false;\n            for i in 0..spawns.len() {\n                for j in (i + 1)..spawns.len() {\n                    if spawns[i].manhattan_distance(\u0026spawns[j]) \u003e= MIN_SPAWN_DISTANCE {\n                        some_distant = true;\n                    }\n                }\n            }\n            assert!(some_distant, \"Spawn points should be spread apart\");\n        }\n    }\n\n    #[test]\n    fn test_handles_more_agents_than_tiles() {\n        // Tiny grid\n        let config = WorldConfig {\n            width: 8,\n            height: 8,\n            seed: 42,\n            ..WorldConfig::default()\n        };\n        let gen = TerrainGenerator::new(\u0026config, config.seed);\n        let mut grid = Grid::new(config.width, config.height);\n        gen.generate(\u0026mut grid);\n\n        let mut rng = Pcg64Mcg::seed_from_u64(42);\n        // Request way more agents than tiles\n        let spawns = SpawnPlacer::find_spawn_points(\u0026grid, 1000, \u0026mut rng);\n        // Should return as many as possible without panicking\n        assert!(spawns.len() \u003c= 64);\n    }\n\n    #[test]\n    fn test_spawn_more_agents_than_tiles() {\n        // Create the smallest possible grid (2x2 = 4 tiles)\n        let config = WorldConfig {\n            width: 2,\n            height: 2,\n            seed: 42,\n            ..WorldConfig::default()\n        };\n        let gen = TerrainGenerator::new(\u0026config, config.seed);\n        let mut grid = Grid::new(config.width, config.height);\n        gen.generate(\u0026mut grid);\n\n        let mut rng = Pcg64Mcg::seed_from_u64(42);\n        // Request far more agents than total tiles\n        let spawns = SpawnPlacer::find_spawn_points(\u0026grid, 100, \u0026mut rng);\n\n        // Should not panic and should return at most the number of walkable tiles\n        let walkable_count = (0..grid.height)\n            .flat_map(|y| (0..grid.width).map(move |x| (x, y)))\n            .filter(|\u0026(x, y)| {\n                grid.get(x, y)\n                    .map(|t| {\n                        t.terrain.is_walkable()\n                            \u0026\u0026 t.resource_id.is_none()\n                            \u0026\u0026 t.object_id.is_none()\n                            \u0026\u0026 t.agent_id.is_none()\n                    })\n                    .unwrap_or(false)\n            })\n            .count();\n        assert!(\n            spawns.len() \u003c= walkable_count,\n            \"spawn count {} should not exceed walkable tiles {}\",\n            spawns.len(),\n            walkable_count\n        );\n        // Also verify all positions are unique\n        let unique: std::collections::HashSet\u003c(u16, u16)\u003e =\n            spawns.iter().map(|p| (p.x, p.y)).collect();\n        assert_eq!(\n            unique.len(),\n            spawns.len(),\n            \"spawn positions should be unique\"\n        );\n    }\n\n    #[test]\n    fn test_unique_positions() {\n        let (grid, _config) = make_grid(88);\n        let mut rng = Pcg64Mcg::seed_from_u64(88);\n        let spawns = SpawnPlacer::find_spawn_points(\u0026grid, 8, \u0026mut rng);\n\n        let unique: std::collections::HashSet\u003c(u16, u16)\u003e =\n            spawns.iter().map(|p| (p.x, p.y)).collect();\n        assert_eq!(\n            unique.len(),\n            spawns.len(),\n            \"All spawn positions should be unique\"\n        );\n    }\n}\n","traces":[{"line":35,"address":[2318882,2314016,2318368],"length":1,"stats":{"Line":8}},{"line":36,"address":[4469976],"length":1,"stats":{"Line":9}},{"line":37,"address":[4469999,4470707,4470994],"length":1,"stats":{"Line":19}},{"line":40,"address":[4886332],"length":1,"stats":{"Line":9}},{"line":41,"address":[2315591,2315493],"length":1,"stats":{"Line":19}},{"line":42,"address":[2315722,2318426],"length":1,"stats":{"Line":20}},{"line":43,"address":[4889801],"length":1,"stats":{"Line":11}},{"line":44,"address":[
