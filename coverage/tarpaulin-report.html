/! let generator = WorldGenerator::new(\u0026config);\n//!\n//! use rand::SeedableRng;\n//! use rand_pcg::Pcg64Mcg;\n//! let mut rng = Pcg64Mcg::seed_from_u64(config.seed);\n//! let (grid, resources, objects, spawn_points) = generator.generate(\u0026mut rng);\n//! ```\n\npub mod biome;\npub mod entities;\npub mod noise;\npub mod objects;\npub mod resources;\npub mod terrain;\n\nuse forge_types::config::WorldConfig;\nuse forge_types::entity::Object;\nuse forge_types::grid::{Grid, Position};\nuse forge_types::resource::ResourceNode;\nuse rand_pcg::Pcg64Mcg;\nuse tracing::instrument;\n\nuse crate::entities::SpawnPlacer;\nuse crate::objects::ObjectPlacer;\nuse crate::resources::ResourcePlacer;\nuse crate::terrain::TerrainGenerator;\n\n/// Top-level world generator that orchestrates terrain, resource, object,\n/// and spawn-point generation.\n///\n/// All generation is deterministic: given the same [`WorldConfig`] (which\n/// contains the seed), the output is identical across runs.\n#[derive(Debug, Clone)]\npub struct WorldGenerator {\n    /// World configuration.\n    config: WorldConfig,\n    /// Random seed (copied from config for convenience).\n    seed: u64,\n}\n\nimpl WorldGenerator {\n    /// Creates a new world generator from the given configuration.\n    ///\n    /// The seed is taken from `config.seed`.\n    #[instrument(skip_all)]\n    pub fn new(config: \u0026WorldConfig) -\u003e Self {\n        tracing::trace!(\n            seed = config.seed,\n            width = config.width,\n            height = config.height,\n            \"created WorldGenerator\"\n        );\n        Self {\n            config: config.clone(),\n            seed: config.seed,\n        }\n    }\n\n    /// Generates a complete world: terrain grid, resource nodes, objects,\n    /// and agent spawn points.\n    ///\n    /// * `rng` -- a seeded `Pcg64Mcg` RNG.  The caller is responsible for\n    ///   creating this from a deterministic seed if reproducibility is desired.\n    ///\n    /// Returns `(grid, resources, objects, spawn_points)`.\n    #[instrument(skip_all)]\n    pub fn generate(\n        \u0026self,\n        rng: \u0026mut Pcg64Mcg,\n    ) -\u003e (Grid, Vec\u003cResourceNode\u003e, Vec\u003cObject\u003e, Vec\u003cPosition\u003e) {\n        tracing::trace!(seed = self.seed, \"WorldGenerator::generate starting\");\n\n        // 1. Generate terrain\n        let terrain_gen = TerrainGenerator::new(\u0026self.config, self.seed);\n        let mut grid = Grid::new(self.config.width, self.config.height);\n        terrain_gen.generate(\u0026mut grid);\n\n        // 2. Place resources\n        let resources = ResourcePlacer::place_resources(\u0026grid, \u0026self.config, rng);\n\n        // Register resource IDs on grid tiles\n        for node in \u0026resources {\n            if let Some(tile) = grid.get_mut(node.position.x, node.position.y) {\n                tile.resource_id = Some(node.id);\n            }\n        }\n\n        // 3. Place objects\n        let objects = ObjectPlacer::place_objects(\u0026grid, \u0026self.config, rng);\n\n        // Register object IDs on grid tiles\n        for obj in \u0026objects {\n            if let Some(tile) = grid.get_mut(obj.position.x, obj.position.y) {\n                tile.object_id = Some(obj.id);\n            }\n        }\n\n        // 4. Find spawn points (needs the grid with resources/objects registered\n        //    so we avoid spawning on occupied tiles)\n        let num_agents = 1u32; // default; callers can request more via find_spawn_points directly\n        let spawn_points = SpawnPlacer::find_spawn_points(\u0026grid, num_agents, rng);\n\n        tracing::trace!(\n            terrain_tiles = grid.len(),\n            resources = resources.len(),\n            objects = objects.len(),\n            spawns = spawn_points.len(),\n            \"WorldGenerator::generate complete\"\n        );\n\n        (grid, resources, objects, spawn_points)\n    }\n\n    /// Returns the seed used for this generator.\n    pub fn seed(\u0026self) -\u003e u64 {\n        self.seed\n    }\n\n    /// Returns a reference to the configuration.\n    pub fn config(\u0026self) -\u003e \u0026WorldConfig {\n        \u0026self.config\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use rand::SeedableRng;\n\n    #[test]\n    fn test_world_generator_basic() {\n        let config = WorldConfig {\n            width: 32,\n            height: 32,\n            ..WorldConfig::default()\n        };\n        let gen = WorldGenerator::new(\u0026config);\n        let mut rng = Pcg64Mcg::seed_from_u64(config.seed);\n        let (grid, resources, objects, spawns) = gen.generate(\u0026mut rng);\n\n        assert_eq!(grid.width, 32);\n        assert_eq!(grid.height, 32);\n        assert_eq!(grid.len(), 32 * 32);\n        assert!(!resources.is_empty());\n        // Objects may or may not be placed depending on density + terrain\n        let _ = objects;\n        assert!(!spawns.is_empty());\n    }\n\n    #[test]\n    fn test_full_determinism() {\n        let config = WorldConfig {\n            width: 32,\n            height: 32,\n            seed: 12345,\n            ..WorldConfig::default()\n        };\n\n        // First generation\n        let gen1 = WorldGenerator::new(\u0026config);\n        let mut rng1 = Pcg64Mcg::seed_from_u64(config.seed);\n        let (grid1, resources1, objects1, spawns1) = gen1.generate(\u0026mut rng1);\n\n        // Second generation with same seed\n        let gen2 = WorldGenerator::new(\u0026config);\n        let mut rng2 = Pcg64Mcg::seed_from_u64(config.seed);\n        let (grid2, resources2, objects2, spawns2) = gen2.generate(\u0026mut rng2);\n\n        // Grids must be identical\n        assert_eq!(grid1.width, grid2.width);\n        assert_eq!(grid1.height, grid2.height);\n        for i in 0..grid1.tiles.len() {\n            assert_eq!(\n                grid1.tiles[i].terrain, grid2.tiles[i].terrain,\n                \"terrain mismatch at tile {i}\"\n            );\n            assert_eq!(\n                grid1.tiles[i].elevation, grid2.tiles[i].elevation,\n                \"elevation mismatch at tile {i}\"\n            );\n            assert_eq!(\n                grid1.tiles[i].resource_id, grid2.tiles[i].resource_id,\n                \"resource_id mismatch at tile {i}\"\n            );\n            assert_eq!(\n                grid1.tiles[i].object_id, grid2.tiles[i].object_id,\n                \"object_id mismatch at tile {i}\"\n            );\n        }\n\n        // Resources must be identical\n        assert_eq!(resources1.len(), resources2.len());\n        for (a, b) in resources1.iter().zip(resources2.iter()) {\n            assert_eq!(a.id, b.id);\n            assert_eq!(a.position, b.position);\n            assert_eq!(a.resource_type, b.resource_type);\n            assert_eq!(a.quantity, b.quantity);\n            assert_eq!(a.max_quantity, b.max_quantity);\n        }\n\n        // Objects must be identical\n        assert_eq!(objects1.len(), objects2.len());\n        for (a, b) in objects1.iter().zip(objects2.iter()) {\n            assert_eq!(a.id, b.id);\n            assert_eq!(a.position, b.position);\n            assert_eq!(a.object_type, b.object_type);\n            assert_eq!(a.state, b.state);\n        }\n\n        // Spawn points must be identical\n        assert_eq!(spawns1, spawns2);\n    }\n\n    #[test]\n    fn test_different_seeds_differ() {\n        let config1 = WorldConfig {\n            width: 32,\n            height: 32,\n            seed: 1,\n            ..WorldConfig::default()\n        };\n        let config2 = WorldConfig {\n            width: 32,\n            height: 32,\n            seed: 2,\n            ..WorldConfig::default()\n        };\n\n        let gen1 = WorldGenerator::new(\u0026config1);\n        let mut rng1 = Pcg64Mcg::seed_from_u64(config1.seed);\n        let (grid1, _, _, _) = gen1.generate(\u0026mut rng1);\n\n        let gen2 = WorldGenerator::new(\u0026config2);\n        let mut rng2 = Pcg64Mcg::seed_from_u64(config2.seed);\n        let (grid2, _, _, _) = gen2.generate(\u0026mut rng2);\n\n        let mut differences = 0u32;\n        for i in 0..grid1.tiles.len() {\n            if grid1.tiles[i].terrain != grid2.tiles[i].terrain {\n                differences += 1;\n            }\n        }\n        assert!(\n            differences \u003e 0,\n            \"Different seeds should produce different worlds\"\n        );\n    }\n\n    #[test]\n    fn test_resources_registered_on_grid() {\n        let config = WorldConfig {\n            width: 32,\n            height: 32,\n            seed: 42,\n            ..WorldConfig::default()\n        };\n        let gen = WorldGenerator::new(\u0026config);\n        let mut rng = Pcg64Mcg::seed_from_u64(config.seed);\n        let (grid, resources, _, _) = gen.generate(\u0026mut rng);\n\n        for node in \u0026resources {\n            let tile = grid.get_pos(\u0026node.position).unwrap();\n            assert_eq!(\n                tile.resource_id,\n                Some(node.id),\n                \"Resource {} at ({}, {}) not registered on grid\",\n                node.id,\n                node.position.x,\n                node.position.y\n            );\n        }\n    }\n\n    #[test]\n    fn test_objects_registered_on_grid() {\n        let config = WorldConfig {\n            width: 32,\n            height: 32,\n            seed: 42,\n            ..WorldConfig::default()\n        };\n        let gen = WorldGenerator::new(\u0026config);\n        let mut rng = Pcg64Mcg::seed_from_u64(config.seed);\n        let (grid, _, objects, _) = gen.generate(\u0026mut rng);\n\n        for obj in \u0026objects {\n            let tile = grid.get_pos(\u0026obj.position).unwrap();\n            assert_eq!(\n                tile.object_id,\n                Some(obj.id),\n                \"Object {} at ({}, {}) not registered on grid\",\n                obj.id,\n                obj.position.x,\n                obj.position.y\n            );\n        }\n    }\n\n    #[test]\n    fn test_seed_accessor() {\n        let config = WorldConfig {\n            seed: 999,\n            ..WorldConfig::default()\n        };\n        let gen = WorldGenerator::new(\u0026config);\n        assert_eq!(gen.seed(), 999);\n    }\n}\n","traces":[{"line":62,"address":[2321376,2322922,2322928],"length":1,"stats":{"Line":16}},{"line":63,"address":[4478953,4479601,4479850],"length":1,"stats":{"Line":33}},{"line":70,"address":[4479840],"length":1,"stats":{"Line":16}},{"line":71,"address":[4480166],"length":1,"stats":{"Line":18}},{"line":83,"address":[4895792,4899212,4899418],"length":1,"stats":{"Line":16}},{"line":87,"address":[4457912,4458211,4457204],"length":1,"stats":{"Line":35}},{"line":90,"address":[4896937],"length":1,"stats":{"Line":17}},{"line":91,"address":[4481886],"length":1,"stats":{"Line":12}},{"line":92,"address":[4627912],"length":1,"stats":{"Line":16}},{"line":95,"address":[4458607],"length":1,"stats":{"Line":12}},{"line":98,"address":[4458634,4458729],"length":1,"stats":{"Line":20}},{"line":99,"address":[2326531,2324771,2326452],"length":1,"stats":{"Line":32}},{"line":100,"address":[4630019],"length":1,"stats":{"Line":9}},{"line":105,"address":[4458892],"length":1,"stats":{"Line":9}},{"line":108,"address":[4897671,4897766],"length":1,"stats":{"Line":21}},{"line":109,"address":[2326363,2326439,2325037],"length":1,"stats":{"Line":27}},{"line":110,"address":[4899287],"length":1,"stats":{"Line":7}},{"line":116,"address":[4626487],"length":1,"stats":{"Line":18}},{"line":117,"address":[4897915],"length":1,"stats":{"Line":11}},{"line":119,"address":[4483467],"length":1,"stats":{"Line":4}},{"line":127,"address":[4898247],"length":1,"stats":{"Line":13}},{"line":131,"address":[4626400],"length":1,"stats":{"Line":1}},{"line":132,"address":[4480405],"length":1,"stats":{"Line":1}},{"line":136,"address":[4480416],"length":1,"stats":{"Line":0}}],"covered":23,"coverable":24},{"path":["/","home","user","FORGE","crates","forge-worldgen","src","noise.rs"],"content":"//! Deterministic Perlin noise implementation for terrain generation.\n//!\n//! Provides 2D Perlin noise with multi-octave fractal brownian motion.\n//! No external noise crate dependency -- fully self-contained and deterministic\n//! for any given seed.\n\nuse tracing::instrument;\n\n/// A deterministic 2D Perlin noise generator.\n///\n/// Given the same seed, `sample_2d` and `octave_noise_2d` will always\n/// return identical results for the same coordinates.\n#[derive(Debug, Clone)]\npub struct PerlinNoise {\n    /// Permutation table (doubled to avoid index wrapping).\n    perm: [u8; 512],\n}\n\nimpl PerlinNoise {\n    /// Creates a new Perlin noise generator with the given seed.\n    ///\n    /// The seed deterministically initialises the internal permutation table\n    /// via a Fisher-Yates shuffle driven by a simple splitmix64 PRNG.\n    #[instrument(skip_all)]\n    pub fn new(seed: u64) -\u003e Self {\n        let mut perm_base: [u8; 256] = [0; 256];\n        for i in 0..256u16 {\n            perm_base[i as usize] = i as u8;\n        }\n\n        // Fisher-Yates shuffle with splitmix64\n        let mut state = seed;\n        for i in (1..256usize).rev() {\n            state = splitmix64(state);\n            let j = (state \u003e\u003e 32) as usize % (i + 1);\n            perm_base.swap(i, j);\n        }\n\n        let mut perm = [0u8; 512];\n        for i in 0..512 {\n            perm[i] = perm_base[i \u0026 255];\n        }\n\n        tracing::trace!(seed, \"created PerlinNoise generator\");\n        Self { perm }\n    }\n\n    /// Samples 2D Perlin noise at the given coordinates.\n    ///\n    /// Returns a value in the range \\[-1.0, 1.0\\].\n    pub fn sample_2d(\u0026self, x: f64, y: f64) -\u003e f64 {\n        // Determine grid cell coordinates\n        let xi = fast_floor(x);\n        let yi = fast_floor(y);\n\n        // Relative position within the cell [0, 1)\n        let xf = x - xi as f64;\n        let yf = y - yi as f64;\n\n        // Wrap grid coordinates to 0..255\n        let xi = (xi \u0026 255) as usize;\n        let yi = (yi \u0026 255) as usize;\n\n        // Fade curves for interpolation\n        let u = fade(xf);\n        let v = fade(yf);\n\n        // Hash corners\n        let aa = self.perm[self.perm[xi] as usize + yi] as usize;\n        let ab = self.perm[self.perm[xi] as usize + yi + 1] as usize;\n        let ba = self.perm[self.perm[xi + 1] as usize + yi] as usize;\n        let bb = self.perm[self.perm[xi + 1] as usize + yi + 1] as usize;\n\n        // Gradient dot products at each corner\n        let g_aa = grad2d(aa, xf, yf);\n        let g_ba = grad2d(ba, xf - 1.0, yf);\n        let g_ab = grad2d(ab, xf, yf - 1.0);\n        let g_bb = grad2d(bb, xf - 1.0, yf - 1.0);\n\n        // Bilinear interpolation\n        let x1 = lerp(u, g_aa, g_ba);\n        let x2 = lerp(u, g_ab, g_bb);\n        lerp(v, x1, x2)\n    }\n\n    /// Computes multi-octave (fractal Brownian motion) 2D Perlin noise.\n    ///\n    /// Each successive octave doubles the frequency and reduces amplitude\n    /// by the `persistence` factor.  The result is normalised so that it\n    /// stays approximately within \\[-1.0, 1.0\\].\n    ///\n    /// * `octaves` -- number of noise layers (typically 1..8).\n    /// * `persistence` -- amplitude decay per octave (typically 0.4..0.7).\n    #[instrument(skip_all)]\n    pub fn octave_noise_2d(\u0026self, x: f64, y: f64, octaves: u32, persistence: f64) -\u003e f64 {\n        let mut total = 0.0_f64;\n        let mut frequency = 1.0_f64;\n        let mut amplitude = 1.0_f64;\n        let mut max_value = 0.0_f64;\n\n        for _ in 0..octaves {\n            total += self.sample_2d(x * frequency, y * frequency) * amplitude;\n            max_value += amplitude;\n            amplitude *= persistence;\n            frequency *= 2.0;\n        }\n\n        if max_value \u003e 0.0 {\n            total / max_value\n        } else {\n            0.0\n        }\n    }\n}\n\n// ---------------------------------------------------------------------------\n// Internal helpers\n// ---------------------------------------------------------------------------\n\n/// Splitmix64 PRNG -- produces a deterministic sequence from a state.\nfn splitmix64(mut state: u64) -\u003e u64 {\n    state = state.wrapping_add(0x9E37_79B9_7F4A_7C15);\n    let mut z = state;\n    z = (z ^ (z \u003e\u003e 30)).wrapping_mul(0xBF58_476D_1CE4_E5B9);\n    z = (z ^ (z \u003e\u003e 27)).wrapping_mul(0x94D0_49BB_1331_11EB);\n    z ^ (z \u003e\u003e 31)\n}\n\n/// Fast floor that handles negative values correctly.\n///\n/// For values outside `i32` range the result is clamped to `i32::MIN` / `i32::MAX`.\n#[inline]\nfn fast_floor(x: f64) -\u003e i32 {\n    let floored = x.floor();\n    // Clamp to i32 range to prevent overflow on extreme inputs.\n    if floored \u003c= i32::MIN as f64 {\n        i32::MIN\n    } else if floored \u003e= i32::MAX as f64 {\n        i32::MAX\n    } else {\n        floored as i32\n    }\n}\n\n/// Fade curve (6t^5 - 15t^4 + 10t^3) for smooth interpolation.\n#[inline]\nfn fade(t: f64) -\u003e f64 {\n    t * t * t * (t * (t * 6.0 - 15.0) + 10.0)\n}\n\n/// Linear interpolation.\n#[inline]\nfn lerp(t: f64, a: f64, b: f64) -\u003e f64 {\n    a + t * (b - a)\n}\n\n/// 2D gradient function -- picks one of 4 gradient directions based on hash.\n#[inline]\nfn grad2d(hash: usize, x: f64, y: f64) -\u003e f64 {\n    match hash \u0026 3 {\n        0 =\u003e x + y,\n        1 =\u003e -x + y,\n        2 =\u003e x - y,\n        3 =\u003e -x - y,\n        _ =\u003e unreachable!(),\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_determinism() {\n        let n1 = PerlinNoise::new(42);\n        let n2 = PerlinNoise::new(42);\n\n        for i in 0..50 {\n            let x = i as f64 * 0.37;\n            let y = i as f64 * 0.53;\n            assert_eq!(\n                n1.sample_2d(x, y),\n                n2.sample_2d(x, y),\n                \"Mismatch at ({x}, {y})\"\n            );\n        }\n    }\n\n    #[test]\n    fn test_different_seeds_differ() {\n        let n1 = PerlinNoise::new(1);\n        let n2 = PerlinNoise::new(2);\n        // It is *theoretically* possible for two seeds to agree on a single\n        // sample, but astronomically unlikely over many samples.\n        let mut any_different = false;\n        for i in 0..100 {\n            let x = i as f64 * 0.1;\n            let y = i as f64 * 0.2;\n            if (n1.sample_2d(x, y) - n2.sample_2d(x, y)).abs() \u003e 1e-10 {\n                any_different = true;\n                break;\n            }\n        }\n        assert!(\n            any_different,\n            \"Two different seeds should produce different noise\"\n        );\n    }\n\n    #[test]\n    fn test_range() {\n        let noise = PerlinNoise::new(123);\n        for i in 0..1000 {\n            let x = (i as f64) * 0.13 - 25.0;\n            let y = (i as f64) * 0.17 - 30.0;\n            let v = noise.sample_2d(x, y);\n            assert!(\n                (-1.5..=1.5).contains(\u0026v),\n                \"Noise value {v} at ({x}, {y}) out of expected range\"\n            );\n        }\n    }\n\n    #[test]\n    fn test_octave_noise_determinism() {\n        let n1 = PerlinNoise::new(99);\n        let n2 = PerlinNoise::new(99);\n\n        for i in 0..50 {\n            let x = i as f64 * 0.23;\n            let y = i as f64 * 0.41;\n            assert_eq!(\n                n1.octave_noise_2d(x, y, 4, 0.5),\n                n2.octave_noise_2d(x, y, 4, 0.5),\n            );\n        }\n    }\n\n    #[test]\n    fn test_octave_noise_range() {\n        let noise = PerlinNoise::new(77);\n        for i in 0..500 {\n            let x = (i as f64) * 0.07 - 10.0;\n            let y = (i as f64) * 0.11 - 15.0;\n            let v = noise.octave_noise_2d(x, y, 6, 0.5);\n            assert!(\n                (-1.5..=1.5).contains(\u0026v),\n                \"Octave noise value {v} at ({x}, {y}) out of expected range\"\n            );\n        }\n    }\n\n    #[test]\n    fn test_single_octave_equals_sample() {\n        let noise = PerlinNoise::new(55);\n        let x = std::f64::consts::PI;\n        let y = std::f64::consts::E;\n        let single = noise.octave_noise_2d(x, y, 1, 0.5);\n        let direct = noise.sample_2d(x, y);\n        assert!(\n            (single - direct).abs() \u003c 1e-12,\n            \"Single octave should equal direct sample\"\n        );\n    }\n\n    #[test]\n    fn test_perlin_large_coordinates() {\n        let noise = PerlinNoise::new(42);\n        // Large coordinates within the safe i32 range (the internal fast_floor\n        // casts to i32, so coordinates must stay within ~2.1e9).\n        // Test with large but valid coordinates to ensure no panics or NaN.\n        let coords = [1e3, -1e3, 1e5, -1e5, 5e5, -5e5, 1e6, -1e6];\n        for \u0026x in \u0026coords {\n            for \u0026y in \u0026coords {\n                let v = noise.sample_2d(x, y);\n                assert!(\n                    v.is_finite(),\n                    \"sample_2d({x}, {y}) produced non-finite: {v}\"\n                );\n            }\n        }\n        // Also test octave_noise_2d at large coordinates\n        for \u0026x in \u0026coords {\n            let v = noise.octave_noise_2d(x, x, 4, 0.5);\n            assert!(\n                v.is_finite(),\n                \"octave_noise_2d({x}, {x}) produced non-finite: {v}\"\n            );\n        }\n    }\n\n    #[test]\n    fn test_negative_coordinates() {\n        let noise = PerlinNoise::new(10);\n        // Should not panic or produce NaN\n        let v = noise.sample_2d(-5.5, -3.3);\n        assert!(v.is_finite());\n    }\n}\n","traces":[{"line":25,"address":[4642584,4642578,4639856],"length":1,"stats":{"Line":17}},{"line":26,"address":[4470597],"length":1,"stats":{"Line":14}},{"line":27,"address":[4494128,4496517,4494858] ,"address":[4644224],"length":1,"stats":{"Line":11}},{"line":160,"address":[4474864],"length":1,"stats":{"Line":11}},{"line":161,"address":[],"length":0,"stats":{"Line":13}},{"line":162,"address":[4498352],"length":1,"stats":{"Line":12}},{"line":163,"address":[4498398],"length":1,"stats":{"Line":12}},{"line":164,"address":[4498421],"length":1,"stats":{"Line":12}}],"covered":66,"coverable":69},{"path":["/","home","user","FORGE","crates","forge-worldgen","src","objects.rs"],"content":"//! Object placement for interactive world objects.\n//!\n//! [`ObjectPlacer`] distributes interactive objects (boulders, doors, switches,\n//! crafting stations, etc.) across the generated grid.  Placement is governed\n//! by terrain compatibility and the configured entity budget.\n\nuse forge_types::config::WorldConfig;\nuse forge_types::entity::{Object, ObjectState, ObjectType};\nuse forge_types::grid::{Grid, Position, TerrainType};\nuse rand::Rng;\nuse rand_pcg::Pcg64Mcg;\nuse tracing::instrument;\n\n/// Fixed-point 1.0 representation (16 fractional bits).\nconst FP_ONE: i32 = 65536;\n\n/// Describes a single object placement rule.\n#[derive(Debug, Clone)]\nstruct ObjectRule {\n    /// The type of object to place.\n    object_type: ObjectType,\n    /// Terrain types where this object is allowed.\n    allowed_terrain: \u0026'static [TerrainType],\n    /// Base probability of placing this object on an eligible tile.\n    base_probability: f64,\n    /// Mass in fixed-point (65536 = 1.0).\n    mass: i32,\n    /// Durability in fixed-point.\n    durability: i32,\n    /// Initial state.\n    initial_state: ObjectState,\n}\n\n/// Placement rules for all object types.\nconst OBJECT_RULES: \u0026[ObjectRule] = \u0026[\n    ObjectRule {\n        object_type: ObjectType::Boulder,\n        allowed_terrain: \u0026[TerrainType::Ground, TerrainType::Mountain],\n        base_probability: 0.01,\n        mass: FP_ONE * 10,\n        durability: FP_ONE * 20,\n        initial_state: ObjectState::Active,\n    },\n    ObjectRule {\n        object_type: ObjectType::CraftingStation,\n        allowed_terrain: \u0026[TerrainType::Ground],\n        base_probability: 0.003,\n        mass: FP_ONE * 5,\n        durability: FP_ONE * 50,\n        initial_state: ObjectState::Active,\n    },\n    ObjectRule {\n        object_type: ObjectType::Container,\n        allowed_terrain: \u0026[TerrainType::Ground, TerrainType::Sand],\n        base_probability: 0.005,\n        mass: FP_ONE * 2,\n        durability: FP_ONE * 10,\n        initial_state: ObjectState::Closed,\n    },\n    ObjectRule {\n        object_type: ObjectType::Torch,\n        allowed_terrain: \u0026[TerrainType::Ground, TerrainType::Forest],\n        base_probability: 0.004,\n        mass: FP_ONE,\n        durability: FP_ONE * 5,\n        initial_state: ObjectState::Active,\n    },\n];\n\n/// Places interactive objects on the world grid.\n#[derive(Debug)]\npub struct ObjectPlacer;\n\nimpl ObjectPlacer {\n    /// Places objects throughout the grid.\n    ///\n    /// * `grid` -- the generated terrain grid (read-only).\n    /// * `config` -- world configuration (provides entity budget via `max_entities`).\n    /// * `rng` -- seeded RNG for deterministic placement.\n    ///\n    /// Returns a vector of [`Object`]s.  The number of placed objects is\n    /// capped at `config.max_entities / 2` so that there is room for agents\n    /// and other dynamic entities.\n    #[instrument(skip_all)]\n    pub fn place_objects(grid: \u0026Grid, config: \u0026WorldConfig, rng: \u0026mut Pcg64Mcg) -\u003e Vec\u003cObject\u003e {\n        // Reserve at most half the entity budget for objects.\n        let max_objects = (config.max_entities / 2) as usize;\n        let density_factor = config.resource_density as f64;\n        let mut objects: Vec\u003cObject\u003e = Vec::new();\n\n        tracing::trace!(max_objects, density_factor, \"placing objects\");\n\n        for y in 0..grid.height {\n            for x in 0..grid.width {\n                if objects.len() \u003e= max_objects {\n                    break;\n                }\n\n                let tile = match grid.get(x, y) {\n                    Some(t) =\u003e t,\n                    None =\u003e continue,\n                };\n\n                // Skip tiles already occupied by a resource\n                if tile.resource_id.is_some() {\n                    continue;\n                }\n\n                for rule in OBJECT_RULES {\n                    if !rule.allowed_terrain.contains(\u0026tile.terrain) {\n                        continue;\n                    }\n\n                    let probability = rule.base_probability * density_factor;\n                    let roll: f64 = rng.gen();\n                    if roll \u003e= probability {\n                        continue;\n                    }\n\n                    let id = objects.len() as u32;\n                    objects.push(Object {\n                        id,\n                        position: Position::new(x, y),\n                        object_type: rule.object_type,\n                        mass: rule.mass,\n                        durability: rule.durability,\n                        state: rule.initial_state,\n                    });\n\n                    // Only one object per tile\n                    break;\n                }\n            }\n\n            if objects.len() \u003e= max_objects {\n                break;\n            }\n        }\n\n        tracing::trace!(count = objects.len(), \"object placement complete\");\n        objects\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::terrain::TerrainGenerator;\n    use rand::SeedableRng;\n\n    fn make_grid_and_config(seed: u64) -\u003e (Grid, WorldConfig) {\n        let config = WorldConfig {\n            width: 32,\n            height: 32,\n            seed,\n            resource_density: 0.8,\n            ..WorldConfig::default()\n        };\n        let gen = TerrainGenerator::new(\u0026config, seed);\n        let mut grid = Grid::new(config.width, config.height);\n        gen.generate(\u0026mut grid);\n        (grid, config)\n    }\n\n    #[test]\n    fn test_objects_placed() {\n        let config = WorldConfig {\n            width: 64,\n            height: 64,\n            seed: 42,\n            resource_density: 1.0,\n            ..WorldConfig::default()\n        };\n        let gen = TerrainGenerator::new(\u0026config, config.seed);\n        let mut grid = Grid::new(config.width, config.height);\n        gen.generate(\u0026mut grid);\n\n        let mut rng = Pcg64Mcg::seed_from_u64(42);\n        let objects = ObjectPlacer::place_objects(\u0026grid, \u0026config, \u0026mut rng);\n        // With full density on a 64x64 grid, we expect some objects\n        assert!(!objects.is_empty(), \"Should place at least some objects\");\n    }\n\n    #[test]\n    fn test_determinism() {\n        let (grid, config) = make_grid_and_config(99);\n\n        let mut rng1 = Pcg64Mcg::seed_from_u64(99);\n        let objects1 = ObjectPlacer::place_objects(\u0026grid, \u0026config, \u0026mut rng1);\n\n        let mut rng2 = Pcg64Mcg::seed_from_u64(99);\n        let objects2 = ObjectPlacer::place_objects(\u0026grid, \u0026config, \u0026mut rng2);\n\n        assert_eq!(objects1.len(), objects2.len());\n        for (a, b) in objects1.iter().zip(objects2.iter()) {\n            assert_eq!(a.position, b.position);\n            assert_eq!(a.object_type, b.object_type);\n            assert_eq!(a.state, b.state);\n        }\n    }\n\n    #[test]\n    fn test_terrain_compatibility() {\n        let (grid, config) = make_grid_and_config(55);\n        let mut rng = Pcg64Mcg::seed_from_u64(55);\n        let objects = ObjectPlacer::place_objects(\u0026grid, \u0026config, \u0026mut rng);\n\n        for obj in \u0026objects {\n            let tile = grid.get_pos(\u0026obj.position).unwrap();\n            let matching_rule = OBJECT_RULES\n                .iter()\n                .find(|r| r.object_type == obj.object_type)\n                .expect(\"object type should have a rule\");\n            assert!(\n                matching_rule.allowed_terrain.contains(\u0026tile.terrain),\n                \"Object {:?} placed on {:?}, expected one of {:?}\",\n                obj.object_type,\n                tile.terrain,\n                matching_rule.allowed_terrain,\n            );\n        }\n    }\n\n    #[test]\n    fn test_respects_entity_budget() {\n        let mut config = WorldConfig {\n            width: 64,\n            height: 64,\n            max_entities: 10,\n            resource_density: 1.0,\n            ..WorldConfig::default()\n        };\n        config.seed = 42;\n        let gen = TerrainGenerator::new(\u0026config, config.seed);\n        let mut grid = Grid::new(config.width, config.height);\n        gen.generate(\u0026mut grid);\n\n        let mut rng = Pcg64Mcg::seed_from_u64(42);\n        let objects = ObjectPlacer::place_objects(\u0026grid, \u0026config, \u0026mut rng);\n\n        let max_allowed = (config.max_entities / 2) as usize;\n        assert!(\n            objects.len() \u003c= max_allowed,\n            \"Objects ({}) should not exceed budget ({max_allowed})\",\n            objects.len()\n        );\n    }\n\n    #[test]\n    fn test_unique_ids() {\n        let (grid, config) = make_grid_and_config(88);\n        let mut rng = Pcg64Mcg::seed_from_u64(88);\n        let objects = ObjectPlacer::place_objects(\u0026grid, \u0026config, \u0026mut rng);\n\n        let ids: std::collections::HashSet\u003cu32\u003e = objects.iter().map(|o| o.id).collect();\n        assert_eq!(ids.len(), objects.len(), \"All object IDs should be unique\");\n    }\n}\n","traces":[{"line":85,"address":[2218182,2214784,2218157],"length":1,"stats":{"Line":10}},{"line":87,"address":[4508916,4508209],"length":1,"stats":{"Line":16}},{"line":88,"address":[4485537],"length":1,"stats":{"Line":8}},{"line":89,"address":[4508947],"length":1,"stats":{"Line":9}},{"line":91,"address":[4509041,4509350,4508966],"length":1,"stats":{"Line":16}},{"line":93,"address":[4655668,4655314],"length":1,"stats":{"Line":17}},{"line":94,"address":[4509874,4509799],"length":1,"stats":{"Line":17}},{"line":95,"address":[4656062,4655997],"length":1,"stats":{"Line":17}},{"line":99,"address":[4510096],"length":1,"stats":{"Line":8}},{"line":100,"address":[4510168],"length":1,"stats":{"Line":11}},{"line":105,"address":[2216928],"length":1,"stats":{"Line":7}},{"line":109,"address":[4510231],"length":1,"stats":{"Line":9}},{"line":110,"address":[2217127],"length":1,"stats":{"Line":8}},{"line":114,"address":[4487063],"length":1,"stats":{"Line":10}},{"line":115,"address":[4487096],"length":1,"stats":{"Line":7}},{"line":116,"address":[4656526],"length":1,"stats":{"Line":10}},{"line":120,"address":[4925896],"length":1,"stats":{"Line":5}},{"line":121,"address":[4487261],"length":1,"stats":{"Line":5}},{"line":123,"address":[4510592],"length":1,"stats":{"Line":6}},{"line":124,"address":[2217352],"length":1,"stats":{"Line":4}},{"line":125,"address":[2217356],"length":1,"stats":{"Line":6}},{"line":126,"address":[4487255],"length":1,"stats":{"Line":4}},{"line":127,"address":[4926010],"length":1,"stats":{"Line":5}},{"line":135,"address":[4656747,4656024],"length":1,"stats":{"Line":16}},{"line":140,"address":[4510773,4511058,4509831],"length":1,"stats":{"Line":13}},{"line":141,"address":[4511004],"length":1,"stats":{"Line":6}}],"covered":26,"coverable":26},{"path":["/","home","user","FORGE","crates","forge-worldgen","src","resources.rs"],"content":"//! Resource node placement based on terrain type and configuration.\n//!\n//! [`ResourcePlacer`] distributes harvestable resource nodes across the world\n//! according to terrain affinity rules.  Forest tiles yield Wood, Mountain\n//! tiles yield Stone/Ore, Water tiles yield Fish, and so on.  Placement\n//! density and resource properties are controlled through [`WorldConfig`].\n\nuse forge_types::config::WorldConfig;\nuse forge_types::grid::{Grid, Position, TerrainType};\nuse forge_types::resource::{ItemType, ResourceNode};\nuse rand::Rng;\nuse rand_pcg::Pcg64Mcg;\nuse tracing::instrument;\n\n/// Default respawn rate for resources (ticks between respawn increments).\nconst DEFAULT_RESPAWN_RATE: u32 = 100;\n/// Default maximum quantity per resource node.\nconst DEFAULT_MAX_QUANTITY: u16 = 5;\n\n/// Describes a resource-to-terrain mapping rule.\n#[derive(Debug, Clone)]\nstruct ResourceRule {\n    /// The item this rule produces.\n    item: ItemType,\n    /// Terrain types where this resource can spawn.\n    terrains: \u0026'static [TerrainType],\n    /// Relative weight (higher = more common among eligible tiles).\n    weight: f64,\n    /// Whether harvesting requires a specific tool.\n    requires_tool: Option\u003cItemType\u003e,\n}\n\n/// All resource placement rules.\nconst RESOURCE_RULES: \u0026[ResourceRule] = \u0026[\n    ResourceRule {\n        item: ItemType::Wood,\n        terrains: \u0026[TerrainType::Forest],\n        weight: 1.0,\n        requires_tool: None,\n    },\n    ResourceRule {\n        item: ItemType::Stone,\n        terrains: \u0026[TerrainType::Mountain],\n        weight: 0.7,\n        requires_tool: Some(ItemType::Pickaxe),\n    },\n    ResourceRule {\n        item: ItemType::Ore,\n        terrains: \u0026[TerrainType::Mountain],\n        weight: 0.3,\n        requires_tool: Some(ItemType::Pickaxe),\n    },\n    ResourceRule {\n        item: ItemType::Fish,\n        terrains: \u0026[TerrainType::Water],\n        weight: 0.6,\n        requires_tool: None,\n    },\n    ResourceRule {\n        item: ItemType::Fiber,\n        terrains: \u0026[TerrainType::Ground, TerrainType::Forest],\n        weight: 0.4,\n        requires_tool: None,\n    },\n    ResourceRule {\n        item: ItemType::Clay,\n        terrains: \u0026[TerrainType::Sand],\n        weight: 0.5,\n        requires_tool: None,\n    },\n];\n\n/// Places resource nodes on the grid based on terrain and configuration.\n#[derive(Debug)]\npub struct ResourcePlacer;\n\nimpl ResourcePlacer {\n    /// Places resources throughout the grid according to terrain affinity and density.\n    ///\n    /// * `grid` -- the generated terrain grid (read-only for terrain queries).\n    /// * `config` -- world configuration (provides `resource_density`).\n    /// * `rng` -- seeded RNG for deterministic placement.\n    ///\n    /// Returns a list of [`ResourceNode`]s.  Each node is also registered\n    /// on the grid tile via `resource_id` (index into the returned vector).\n    #[instrument(skip_all)]\n    pub fn place_resources(\n        grid: \u0026Grid,\n        config: \u0026WorldConfig,\n        rng: \u0026mut Pcg64Mcg,\n    ) -\u003e Vec\u003cResourceNode\u003e {\n        let density = config.resource_density as f64;\n        let mut nodes: Vec\u003cResourceNode\u003e = Vec::new();\n\n        tracing::trace!(\n            density,\n            width = grid.width,\n            height = grid.height,\n            \"placing resources\"\n        );\n\n        for y in 0..grid.height {\n            for x in 0..grid.width {\n                let tile = match grid.get(x, y) {\n                    Some(t) =\u003e t,\n                    None =\u003e continue,\n                };\n\n                // Find all applicable rules for this terrain\n                for rule in RESOURCE_RULES {\n                    if !rule.terrains.contains(\u0026tile.terrain) {\n                        continue;\n                    }\n\n                    // Probability of placing this resource = density * weight\n                    let probability = density * rule.weight;\n                    let roll: f64 = rng.gen();\n                    if roll \u003e= probability {\n                        continue;\n                    }\n\n                    let id = nodes.len() as u32;\n                    let max_quantity = DEFAULT_MAX_QUANTITY;\n                    let quantity = rng.gen_range(1..=max_quantity);\n\n                    nodes.push(ResourceNode {\n                        id,\n                        position: Position::new(x, y),\n                        resource_type: rule.item,\n                        quantity,\n                        max_quantity,\n                        respawn_timer: 0,\n                        respawn_rate: DEFAULT_RESPAWN_RATE,\n                        requires_tool: rule.requires_tool,\n                    });\n\n                    // Only one resource per tile\n                    break;\n                }\n            }\n        }\n\n        tracing::trace!(count = nodes.len(), \"resource placement complete\");\n        nodes\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::terrain::TerrainGenerator;\n    use rand::SeedableRng;\n\n    fn make_grid_and_config(seed: u64) -\u003e (Grid, WorldConfig) {\n        let config = WorldConfig {\n            width: 32,\n            height: 32,\n            seed,\n            ..WorldConfig::default()\n        };\n        let gen = TerrainGenerator::new(\u0026config, seed);\n        let mut grid = Grid::new(config.width, config.height);\n        gen.generate(\u0026mut grid);\n        (grid, config)\n    }\n\n    #[test]\n    fn test_resources_placed() {\n        let (grid, config) = make_grid_and_config(42);\n        let mut rng = Pcg64Mcg::seed_from_u64(42);\n        let nodes = ResourcePlacer::place_resources(\u0026grid, \u0026config, \u0026mut rng);\n        assert!(!nodes.is_empty(), \"Should place at least some resources\");\n    }\n\n    #[test]\n    fn test_determinism() {\n        let (grid, config) = make_grid_and_config(99);\n\n        let mut rng1 = Pcg64Mcg::seed_from_u64(99);\n        let nodes1 = ResourcePlacer::place_resources(\u0026grid, \u0026config, \u0026mut rng1);\n\n        let mut rng2 = Pcg64Mcg::seed_from_u64(99);\n        let nodes2 = ResourcePlacer::place_resources(\u0026grid, \u0026config, \u0026mut rng2);\n\n        assert_eq!(nodes1.len(), nodes2.len());\n        for (a, b) in nodes1.iter().zip(nodes2.iter()) {\n            assert_eq!(a.position, b.position);\n            assert_eq!(a.resource_type, b.resource_type);\n            assert_eq!(a.quantity, b.quantity);\n        }\n    }\n\n    #[test]\n    fn test_terrain_affinity() {\n        let (grid, config) = make_grid_and_config(55);\n        let mut rng = Pcg64Mcg::seed_from_u64(55);\n        let nodes = ResourcePlacer::place_resources(\u0026grid, \u0026config, \u0026mut rng);\n\n        for node in \u0026nodes {\n            let tile = grid.get_pos(\u0026node.position).unwrap();\n            let matching_rule = RESOURCE_RULES\n                .iter()\n                .find(|r| r.item == node.resource_type)\n                .expect(\"resource type should have a rule\");\n            assert!(\n                matching_rule.terrains.contains(\u0026tile.terrain),\n                \"Resource {:?} placed on {:?}, expected one of {:?}\",\n                node.resource_type,\n                tile.terrain,\n                matching_rule.terrains,\n            );\n        }\n    }\n\n    #[test]\n    fn test_zero_density_no_resources() {\n        let config = WorldConfig {\n            resource_density: 0.0,\n            width: 32,\n            height: 32,\n            ..Default::default()\n        };\n        let gen = TerrainGenerator::new(\u0026config, 42);\n        let mut grid = Grid::new(config.width, config.height);\n        gen.generate(\u0026mut grid);\n\n        let mut rng = Pcg64Mcg::seed_from_u64(42);\n        let nodes = ResourcePlacer::place_resources(\u0026grid, \u0026config, \u0026mut rng);\n        assert!(nodes.is_empty(), \"Zero density should produce no resources\");\n    }\n\n    #[test]\n    fn test_resource_quantities_valid() {\n        let (grid, config) = make_grid_and_config(77);\n        let mut rng = Pcg64Mcg::seed_from_u64(77);\n        let nodes = ResourcePlacer::place_resources(\u0026grid, \u0026config, \u0026mut rng);\n\n        for node in \u0026nodes {\n            assert!(node.quantity \u003e 0);\n            assert!(node.quantity \u003c= node.max_quantity);\n            assert!(node.max_quantity \u003e 0);\n        }\n    }\n\n    #[test]\n    fn test_unique_ids() {\n        let (grid, config) = make_grid_and_config(88);\n        let mut rng = Pcg64Mcg::seed_from_u64(88);\n        let nodes = ResourcePlacer::place_resources(\u0026grid, \u0026config, \u0026mut rng);\n\n        let ids: std::collections::HashSet\u003cu32\u003e = nodes.iter().map(|n| n.id).collect();\n        assert_eq!(ids.len(), nodes.len(), \"All resource IDs should be unique\");\n    }\n}\n","traces":[{"line":87,"address":[4922042,4922014,4918512],"length":1,"stats":{"Line":7}},{"line":92,"address":[4503329],"length":1,"stats":{"Line":9}},{"line":93,"address":[4503347],"length":1,"stats":{"Line":11}},{"line":95,"address":[4481035,4480651,4480726],"length":1,"stats":{"Line":20}},{"line":102,"address":[4504391,4504772],"length":1,"stats":{"Line":21}},{"line":103,"address":[4481511,4482354],"length":1,"stats":{"Line":21}},{"line":104,"address":[4921234],"length":1,"stats":{"Line":13}},{"line":105,"address":[4505940],"length":1,"stats":{"Line":12}},{"line":110,"address":[2340109],"length":1,"stats":{"Line":9}},{"line":111,"address":[4921478],"length":1,"stats":{"Line":10}},{"line":116,"address":[4482778],"length":1,"stats":{"Line":10}},{"line":117,"address":[4652203],"length":1,"stats":{"Line":10}},{"line":118,"address":[4506241],"length":1,"stats":{"Line":9}},{"line":122,"address":[4652251],"length":1,"stats":{"Line":12}},{"line":123,"address":[4482899],"length":1,"stats":{"Line":9}},{"line":124,"address":[4482909],"length":1,"stats":{"Line":11}},{"line":126,"address":[4506544],"length":1,"stats":{"Line":6}},{"line":128,"address":[4506486],"length":1,"stats":{"Line":10}},{"line":129,"address":[4652541],"length":1,"stats":{"Line":13}},{"line":134,"address":[4652538],"length":1,"stats":{"Line":5}},{"line":143,"address":[4504938,4505296],"length":1,"stats":{"Line":11}},{"line":144,"address":[4505242],"length":1,"stats":{"Line":10}}],"covered":22,"coverable":22},{"path":["/","home","user","FORGE","crates","forge-worldgen","src","terrain.rs"],"content":"//! Terrain generation combining Perlin noise with biome classification.\n//!\n//! [`TerrainGenerator`] produces a fully populated [`Grid`] by sampling\n//! two independent noise layers (elevation and moisture), normalising them\n//! to \\[0, 1\\], and feeding the results through a [`BiomeClassifier`].\n\nuse forge_types::config::WorldConfig;\nuse forge_types::grid::Grid;\nuse tracing::instrument;\n\nuse crate::biome::BiomeClassifier;\nuse crate::noise::PerlinNoise;\n\n/// Offset applied to the moisture noise seed so that the elevation and\n/// moisture layers are statistically independent.\nconst MOISTURE_SEED_OFFSET: u64 = 0xDEAD_BEEF_CAFE_BABE;\n\n/// Generates terrain on a [`Grid`] using Perlin noise and biome rules.\n#[derive(Debug, Clone)]\npub struct TerrainGenerator {\n    /// Perlin noise for the elevation layer.\n    elevation_noise: PerlinNoise,\n    /// Perlin noise for the moisture layer.\n    moisture_noise: PerlinNoise,\n    /// Biome classifier that maps (elevation, moisture) to terrain.\n    classifier: BiomeClassifier,\n    /// Scale factor controlling terrain feature size.\n    biome_scale: f64,\n    /// Number of octaves for fractal noise.\n    octaves: u32,\n    /// Persistence (amplitude decay per octave).\n    persistence: f64,\n}\n\nimpl TerrainGenerator {\n    /// Creates a new terrain generator from a config and seed.\n    ///\n    /// The `biome_scale` field from `config` controls feature frequency:\n    /// lower values produce larger biome patches, higher values produce\n    /// smaller, more detailed features.\n    #[instrument(skip_all)]\n    pub fn new(config: \u0026WorldConfig, seed: u64) -\u003e Self {\n        let elevation_noise = PerlinNoise::new(seed);\n        let moisture_noise = PerlinNoise::new(seed.wrapping_add(MOISTURE_SEED_OFFSET));\n        let classifier = BiomeClassifier::new(config);\n        let biome_scale = config.biome_scale as f64;\n\n        // Derive octave count and persistence from biome_scale.\n        // A scale of 0.1 (default) yields 4 octaves, 0.5 persistence.\n        let octaves = ((biome_scale * 40.0).clamp(2.0, 8.0)) as u32;\n        let persistence = 0.5_f64;\n\n        tracing::trace!(\n            seed,\n            biome_scale,\n            octaves,\n            persistence,\n            \"created TerrainGenerator\"\n        );\n\n        Self {\n            elevation_noise,\n            moisture_noise,\n            classifier,\n            biome_scale,\n            octaves,\n            persistence,\n        }\n    }\n\n    /// Fills the given grid with terrain types derived from noise + biomes.\n    ///\n    /// Every tile's `terrain` and `elevation` fields are set.\n    #[instrument(skip_all)]\n    pub fn generate(\u0026self, grid: \u0026mut Grid) {\n        let width = grid.width;\n        let height = grid.height;\n\n        tracing::trace!(width, height, \"generating terrain\");\n\n        for y in 0..height {\n            for x in 0..width {\n                let nx = x as f64 * self.biome_scale;\n                let ny = y as f64 * self.biome_scale;\n\n                // Sample noise and normalise from [-1, 1] to [0, 1]\n                let raw_elev =\n                    self.elevation_noise\n                        .octave_noise_2d(nx, ny, self.octaves, self.persistence);\n                let raw_moist =\n                    self.moisture_noise\n                        .octave_noise_2d(nx, ny, self.octaves, self.persistence);\n\n                let elevation = ((raw_elev + 1.0) / 2.0).clamp(0.0, 1.0);\n                let moisture = ((raw_moist + 1.0) / 2.0).clamp(0.0, 1.0);\n\n                let terrain = self.classifier.classify(elevation, moisture);\n\n                if let Some(tile) = grid.get_mut(x, y) {\n                    tile.terrain = terrain;\n                    // Store elevation as u8 (0-255)\n                    tile.elevation = (elevation * 255.0) as u8;\n                }\n            }\n        }\n\n        tracing::trace!(\"terrain generation complete\");\n    }\n\n    /// Returns the raw elevation value at the given tile coordinate.\n    ///\n    /// Useful for downstream systems that need the continuous value.\n    #[instrument(skip_all)]\n    pub fn elevation_at(\u0026self, x: u16, y: u16) -\u003e f64 {\n        let nx = x as f64 * self.biome_scale;\n        let ny = y as f64 * self.biome_scale;\n        let raw = self\n            .elevation_noise\n            .octave_noise_2d(nx, ny, self.octaves, self.persistence);\n        ((raw + 1.0) / 2.0).clamp(0.0, 1.0)\n    }\n\n    /// Returns the raw moisture value at the given tile coordinate.\n    #[instrument(skip_all)]\n    pub fn moisture_at(\u0026self, x: u16, y: u16) -\u003e f64 {\n        let nx = x as f64 * self.biome_scale;\n        let ny = y as f64 * self.biome_scale;\n        let raw = self\n            .moisture_noise\n            .octave_noise_2d(nx, ny, self.octaves, self.persistence);\n        ((raw + 1.0) / 2.0).clamp(0.0, 1.0)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::grid::TerrainType;\n\n    fn default_config() -\u003e WorldConfig {\n        WorldConfig::default()\n    }\n\n    #[test]\n    fn test_generate_fills_grid() {\n        let config = default_config();\n        let gen = TerrainGenerator::new(\u0026config, 42);\n        let mut grid = Grid::new(config.width, config.height);\n        gen.generate(\u0026mut grid);\n\n        // Every tile should have been touched -- at least some non-Ground terrain\n        let mut terrain_counts = std::collections::HashMap::new();\n        for tile in \u0026grid.tiles {\n            *terrain_counts.entry(tile.terrain).or_insert(0u32) += 1;\n        }\n        // We expect at least 2 different terrain types in any reasonable world\n        assert!(\n            terrain_counts.len() \u003e= 2,\n            \"Expected multiple terrain types, got {terrain_counts:?}\"\n        );\n    }\n\n    #[test]\n    fn test_determinism() {\n        let config = default_config();\n        let seed = 12345;\n\n        let gen1 = TerrainGenerator::new(\u0026config, seed);\n        let mut grid1 = Grid::new(config.width, config.height);\n        gen1.generate(\u0026mut grid1);\n\n        let gen2 = TerrainGenerator::new(\u0026config, seed);\n        let mut grid2 = Grid::new(config.width, config.height);\n        gen2.generate(\u0026mut grid2);\n\n        for i in 0..grid1.tiles.len() {\n            assert_eq!(\n                grid1.tiles[i].terrain, grid2.tiles[i].terrain,\n                \"Terrain mismatch at tile {i}\"\n            );\n            assert_eq!(\n                grid1.tiles[i].elevation, grid2.tiles[i].elevation,\n                \"Elevation mismatch at tile {i}\"\n            );\n        }\n    }\n\n    #[test]\n    fn test_different_seeds_differ() {\n        let config = default_config();\n\n        let gen1 = TerrainGenerator::new(\u0026config, 1);\n        let mut grid1 = Grid::new(config.width, config.height);\n        gen1.generate(\u0026mut grid1);\n\n        let gen2 = TerrainGenerator::new(\u0026config, 2);\n        let mut grid2 = Grid::new(config.width, config.height);\n        gen2.generate(\u0026mut grid2);\n\n        let mut differences = 0u32;\n        for i in 0..grid1.tiles.len() {\n            if grid1.tiles[i].terrain != grid2.tiles[i].terrain {\n                differences += 1;\n            }\n        }\n        assert!(\n            differences \u003e 0,\n            \"Different seeds should produce different terrain\"\n        );\n    }\n\n    #[test]\n    fn test_elevation_at_consistency() {\n        let config = default_config();\n        let gen = TerrainGenerator::new(\u0026config, 99);\n        let mut grid = Grid::new(config.width, config.height);\n        gen.generate(\u0026mut grid);\n\n        // elevation_at should match the stored tile elevation (within u8 quantisation)\n        for y in 0..config.height.min(10) {\n            for x in 0..config.width.min(10) {\n                let continuous = gen.elevation_at(x, y);\n                let stored = grid.get(x, y).unwrap().elevation;\n                let expected = (continuous * 255.0) as u8;\n                assert_eq!(stored, expected, \"Elevation mismatch at ({x}, {y})\");\n            }\n        }\n    }\n\n    #[test]\n    fn test_all_tiles_have_valid_terrain() {\n        let config = default_config();\n        let gen = TerrainGenerator::new(\u0026config, 777);\n        let mut grid = Grid::new(config.width, config.height);\n        gen.generate(\u0026mut grid);\n\n        let valid = [\n            TerrainType::Ground,\n            TerrainType::Water,\n            TerrainType::Sand,\n            TerrainType::Forest,\n            TerrainType::Mountain,\n        ];\n        for (i, tile) in grid.tiles.iter().enumerate() {\n            assert!(\n                valid.contains(\u0026tile.terrain),\n                \"Unexpected terrain {:?} at tile {i}\",\n                tile.terrain\n            );\n        }\n    }\n}\n","traces":[{"line":42,"address":[4488596,4486688,4488590],"length":1,"stats":{"Line":16}},{"line":43,"address":[4632833],"length":1,"stats":{"Line":14}},{"line":44,"address":[2226281],"length":1,"stats":{"Line":16}},{"line":45,"address":[4464171],"length":1,"stats":{"Line":12}},{"line":46,"address":[2226362],"length":1,"stats":{"Line":10}},{"line":50,"address":[4464216],"length":1,"stats":{"Line":12}},{"line":51,"address":[4464313],"length":1,"stats":{"Line":8}},{"line":53,"address":[4488127,4487713],"length":1,"stats":{"Line":14}},{"line":75,"address":[4906969,4906975,4904000],"length":1,"stats":{"Line":7}},{"line":76,"address":[4904145],"length":1,"stats":{"Line":10}},{"line":77,"address":[2227565],"length":1,"stats":{"L  tests for the FORGE simulation pipeline.\n//!\n//! These tests exercise the full simulation stack — from configuration through\n//! world generation, stepping, combat, resource gathering, crafting,\n//! communication, and day/night cycling.\n//!\n//! To run: `cargo test --test integration_tests`\n\nuse std::sync::Arc;\n\nuse forge_core::WorldState;\nuse forge_types::config::ForgeConfig;\nuse forge_types::grid::{Direction, Position};\nuse forge_types::resource::{ItemType, RecipeBook, ResourceNode};\nuse forge_types::task::{ActiveTask, Predicate, TaskComposition, TaskDefinition, TaskTier};\nuse forge_types::validation::validate_config;\nuse forge_types::Action;\n\n// ---------------------------------------------------------------------------\n// Helpers\n// ---------------------------------------------------------------------------\n\n/// Creates a small, fast-to-test world with the given number of agents.\nfn make_config(num_agents: u32, seed: u64) -\u003e ForgeConfig {\n    let mut config = ForgeConfig::default();\n    config.world.width = 32;\n    config.world.height = 32;\n    config.world.seed = seed;\n    config.agents.num_agents = num_agents;\n    config.task.max_episode_length = 10000;\n    config.world.day_night_cycle_length = 100;\n    config\n}\n\n// ---------------------------------------------------------------------------\n// 1. Full episode\n// ---------------------------------------------------------------------------\n\n/// Create a WorldState with default config, reset, step 100 times with Noop\n/// actions, and verify state consistency throughout the episode.\n#[test]\nfn test_full_episode() {\n    let config = make_config(1, 42);\n    let mut state = WorldState::new(config).unwrap();\n\n    // Reset with explicit seed\n    let reset_result = state.reset(Some(42));\n    assert_eq!(reset_result.observations.len(), 1);\n    assert!(!reset_result.terminated);\n    assert!(!reset_result.truncated);\n\n    // Step 100 times with Noop\n    for tick in 0..100 {\n        let result = state.step(\u0026[Action::Noop]);\n\n        // Observation count must match agent count\n        assert_eq!(\n            result.observations.len(),\n            1,\n            \"observation count mismatch at tick {}\",\n            tick\n        );\n\n        // Reward vector must match agent count\n        assert_eq!(\n            result.rewards.len(),\n            1,\n            \"reward count mismatch at tick {}\",\n            tick\n        );\n\n        // Tick should be advancing\n        assert_eq!(state.tick, (tick + 1) as u64);\n\n        // Agent should still be alive (Noop only)\n        assert!(\n            state.agents[0].alive,\n            \"agent died unexpectedly at tick {}\",\n            tick\n        );\n\n        // Info diagnostics should be consistent\n        assert_eq!(result.info.agents_alive.len(), 1);\n        assert!(result.info.agents_alive[0]);\n    }\n\n    // After 100 Noop steps the episode should not have ended\n    assert!(!state.terminated);\n    assert!(!state.truncated);\n}\n\n// ---------------------------------------------------------------------------\n// 2. Deterministic replay\n// ---------------------------------------------------------------------------\n\n/// Run the same seed twice with the same action sequence and verify\n/// that the resulting world states are identical.\n#[test]\nfn test_deterministic_replay() {\n    let seed = 12345u64;\n\n    // A non-trivial action sequence mixing movement and Noop.\n    let action_sequence: Vec\u003cVec\u003cAction\u003e\u003e = vec![\n        vec![\n            Action::Move(Direction::Right),\n            Action::Move(Direction::Down),\n        ],\n        vec![Action::Noop, Action::Move(Direction::Left)],\n        vec![Action::Move(Direction::Up), Action::Move(Direction::Right)],\n        vec![Action::Move(Direction::Down), Action::Move(Direction::Down)],\n        vec![Action::Noop, Action::Noop],\n    ];\n\n    // --- first run ---\n    let config1 = make_config(2, seed);\n    let mut state1 = WorldState::new(config1).unwrap();\n    state1.reset(Some(seed));\n\n    let mut results1 = Vec::new();\n    for actions in \u0026action_sequence {\n        results1.push(state1.step(actions));\n    }\n\n    // --- second run ---\n    let config2 = make_config(2, seed);\n    let mut state2 = WorldState::new(config2).unwrap();\n    state2.reset(Some(seed));\n\n    let mut results2 = Vec::new();\n    for actions in \u0026action_sequence {\n        results2.push(state2.step(actions));\n    }\n\n    // --- compare ---\n    assert_eq!(state1.tick, state2.tick, \"tick mismatch\");\n    for (i, (a1, a2)) in state1.agents.iter().zip(state2.agents.iter()).enumerate() {\n        assert_eq!(\n            a1.position, a2.position,\n            \"position mismatch for agent {}\",\n            i\n        );\n        assert_eq!(a1.health, a2.health, \"health mismatch for agent {}\", i);\n        assert_eq!(a1.stamina, a2.stamina, \"stamina mismatch for agent {}\", i);\n        assert_eq!(a1.alive, a2.alive, \"alive mismatch for agent {}\", i);\n    }\n\n    for (step_idx, (r1, r2)) in results1.iter().zip(results2.iter()).enumerate() {\n        assert_eq!(\n            r1.terminated, r2.terminated,\n            \"terminated mismatch at step {}\",\n            step_idx\n        );\n        assert_eq!(\n            r1.truncated, r2.truncated,\n            \"truncated mismatch at step {}\",\n            step_idx\n        );\n    }\n}\n\n// ---------------------------------------------------------------------------\n// 3. Multi-agent episode\n// ---------------------------------------------------------------------------\n\n/// Create a 3-agent world, step with per-agent actions, and verify\n/// each agent receives its own observation.\n#[test]\nfn test_multi_agent_episode() {\n    let config = make_config(3, 99);\n    let mut state = WorldState::new(config).unwrap();\n    state.reset(Some(99));\n\n    assert_eq!(state.agents.len(), 3, \"expected 3 agents\");\n\n    // Each agent takes a different action\n    let actions = vec![\n        Action::Move(Direction::Up),\n        Action::Move(Direction::Down),\n        Action::Move(Direction::Left),\n    ];\n\n    let result = state.step(\u0026actions);\n\n    // Observations: one per agent\n    assert_eq!(result.observations.len(), 3);\n    // Rewards: one per agent\n    assert_eq!(result.rewards.len(), 3);\n    // Info alive flags: one per agent\n    assert_eq!(result.info.agents_alive.len(), 3);\n\n    // Each observation must have a grid view with the expected dimensions\n    for (i, obs) in result.observations.iter().enumerate() {\n        let expected_side = 2 * state.agents[i].vision_radius as u16 + 1;\n        assert_eq!(\n            obs.view_width, expected_side,\n            \"view_width mismatch for agent {}\",\n            i\n        );\n        assert_eq!(\n            obs.view_height, expected_side,\n            \"view_height mismatch for agent {}\",\n            i\n        );\n        assert_eq!(\n            obs.grid_view.len(),\n            (expected_side as usize) * (expected_side as usize),\n            \"grid_view length mismatch for agent {}\",\n            i\n        );\n    }\n}\n\n// ---------------------------------------------------------------------------\n// 4. Worldgen to step\n// ---------------------------------------------------------------------------\n\n/// Generate a world with forge-worldgen, transplant the generated grid and\n/// resources into a WorldState, and step it.\n#[test]\nfn test_worldgen_to_step() {\n    use forge_worldgen::WorldGenerator;\n    use rand::SeedableRng;\n    use rand_pcg::Pcg64Mcg;\n\n    let seed = 7777u64;\n    let mut config = ForgeConfig::default();\n    config.world.width = 32;\n    config.world.height = 32;\n    config.world.seed = seed;\n    config.agents.num_agents = 1;\n\n    // Generate the world through the worldgen pipeline\n    let gen = WorldGenerator::new(\u0026config.world);\n    let mut rng = Pcg64Mcg::seed_from_u64(seed);\n    let (grid, resources, objects, _spawn_points) = gen.generate(\u0026mut rng);\n\n    // Build a WorldState and inject the generated world\n    let mut state = WorldState::new(config).unwrap();\n    state.grid = grid;\n    state.resources = resources;\n    state.objects = objects;\n\n    // Place the agent on a walkable tile within the generated world\n    let agent_pos = state.agents[0].position;\n    assert!(\n        state.grid.in_bounds(agent_pos.x, agent_pos.y),\n        \"agent spawned out of bounds\"\n    );\n\n    // Step the simulation — it should not panic\n    let result = state.step(\u0026[Action::Noop]);\n    assert_eq!(result.observations.len(), 1);\n    assert!(!result.terminated);\n}\n\n// ---------------------------------------------------------------------------\n// 5. Task evaluation in episode\n// ---------------------------------------------------------------------------\n\n/// Create a task, run steps, and verify that the task evaluation pipeline\n/// runs automatically within `step()` — rewards flow through StepResult\n/// and task progress is tracked in observations.\n#[test]\nfn test_task_evaluation_in_episode() {\n    let config = make_config(1, 42);\n    let mut state = WorldState::new(config).unwrap();\n    state.reset(Some(42));\n\n    // Create a TimeElapsed task that is satisfied after 5 ticks\n    let task = ActiveTask {\n        definition: TaskDefinition {\n            id: 1,\n            description: \"Wait 5 ticks\".to_string(),\n            goal: TaskComposition::Atom(Predicate::TimeElapsed(5)),\n            tier: TaskTier::new(1),\n            estimated_steps: 5,\n            reward: 10.0,\n            dense_reward_weights: vec![1.0],\n        },\n        progress: vec![0.0],\n        sequence_index: 0,\n        completed: false,\n        failed: false,\n    };\n    state.tasks.push(task);\n\n    // Step 4 times — task should NOT be completed yet\n    let mut total_reward = 0.0_f32;\n    for tick in 0..4 {\n        let result = state.step(\u0026[Action::Noop]);\n        total_reward += result.rewards[0];\n        assert!(\n            !state.tasks[0].completed,\n            \"task should not be completed at tick {}\",\n            tick + 1\n        );\n        // Observations should contain task progress\n        assert!(\n            !result.observations[0].task_progress.is_empty(),\n            \"observation should include task progress at tick {}\",\n            tick + 1\n        );\n    }\n\n    // Dense rewards should have been accruing from progress\n    assert!(\n        total_reward \u003e 0.0,\n        \"dense rewards should accrue before task completion\"\n    );\n\n    // Step until the task completes (tick \u003e= 5)\n    let mut completion_reward = 0.0_f32;\n    for _ in 0..4 {\n        let result = state.step(\u0026[Action::Noop]);\n        completion_reward += result.rewards[0];\n        if state.tasks[0].completed {\n            break;\n        }\n    }\n\n    assert!(\n        state.tasks[0].completed,\n        \"task should be completed at tick {}\",\n        state.tick\n    );\n    assert!(\n        completion_reward \u003e 0.0,\n        \"agent should receive a reward for completing the task\"\n    );\n}\n\n// ---------------------------------------------------------------------------\n// 6. Combat between agents\n// ---------------------------------------------------------------------------\n\n/// Place two agents adjacent to each other, have the attacker use a\n/// sword, and verify the target's health decreases.\n#[test]\nfn test_combat_between_agents() {\n    let mut config = make_config(2, 42);\n    config.world.width = 16;\n    config.world.height = 16;\n    let mut state = WorldState::new(config).unwrap();\n\n    // Manually place agents adjacent to each other\n    state.agents[0].position = Position::new(5, 5);\n    state.agents[1].position = Position::new(5, 4); // directly above agent 0\n\n    // Update the grid to reflect positions\n    for tile in state.grid.tiles.iter_mut() {\n        tile.agent_id = None;\n    }\n    state.grid.get_mut(5, 5).unwrap().agent_id = Some(state.agents[0].id);\n    state.grid.get_mut(5, 4).unwrap().agent_id = Some(state.agents[1].id);\n\n    // Give agent 0 a sword in slot 0\n    state.agents[0].inventory.add_item(ItemType::Sword, 1);\n\n    let initial_health = state.agents[1].health;\n\n    // Agent 0 uses slot 0 (sword attack), agent 1 does nothing\n    let result = state.step(\u0026[Action::Use(0), Action::Noop]);\n\n    assert!(\n        state.agents[1].health \u003c initial_health,\n        \"target health should decrease after sword attack: before={}, after={}\",\n        initial_health,\n        state.agents[1].health\n    );\n\n    // Observations should still be produced for both agents\n    assert_eq!(result.observations.len(), 2);\n}\n\n// ---------------------------------------------------------------------------\n// 7. Resource gathering\n// ---------------------------------------------------------------------------\n\n/// Agent moves to a resource tile and gathers a resource. Verify the\n/// agent's inventory is updated and the resource quantity decreases.\n#[test]\nfn test_resource_gathering() {\n    let mut config = make_config(1, 42);\n    config.world.width = 16;\n    config.world.height = 16;\n    let mut state = WorldState::new(config).unwrap();\n\n    // Place agent at (3, 3)\n    state.agents[0].position = Position::new(3, 3);\n    for tile in state.grid.tiles.iter_mut() {\n        tile.agent_id = None;\n    }\n    state.grid.get_mut(3, 3).unwrap().agent_id = Some(state.agents[0].id);\n\n    // Place a wood resource at (3, 3).\n    // respawn_rate = 0 disables respawn so the quantity stays reduced after harvest.\n    let resource = ResourceNode {\n        id: 0,\n        position: Position::new(3, 3),\n        resource_type: ItemType::Wood,\n        quantity: 5,\n        max_quantity: 5,\n        respawn_timer: 0,\n        respawn_rate: 0,\n        requires_tool: None,\n    };\n    state.resources.push(resource);\n    state.grid.get_mut(3, 3).unwrap().resource_id = Some(0);\n\n    // Verify inventory is initially empty for wood\n    assert_eq!(state.agents[0].inventory.count_item(ItemType::Wood), 0);\n\n    // PickUp action\n    state.step(\u0026[Action::PickUp]);\n\n    assert_eq!(\n        state.agents[0].inventory.count_item(ItemType::Wood),\n        1,\n        \"agent should have 1 wood after picking up\"\n    );\n    assert_eq!(\n        state.resources[0].quantity, 4,\n        \"resource quantity should decrease by 1\"\n    );\n}\n\n// ---------------------------------------------------------------------------\n// 8. Crafting pipeline\n// ---------------------------------------------------------------------------\n\n/// Gather materials (directly placed in inventory) then craft, and verify\n/// the crafted item appears in inventory.\n#[test]\nfn test_crafting_pipeline() {\n    let mut config = make_config(1, 42);\n    config.world.width = 16;\n    config.world.height = 16;\n    config.crafting.enabled = true;\n    let mut state = WorldState::new(config).unwrap();\n\n    // Set up recipe book with a simple recipe (Axe: 2 Wood + 1 Stone)\n    state.recipe_book = RecipeBook::default();\n\n    // Give agent the materials for an Axe (recipe id 0)\n    state.agents[0].inventory.add_item(ItemType::Wood, 5);\n    state.agents[0].inventory.add_item(ItemType::Stone, 3);\n\n    let wood_before = state.agents[0].inventory.count_item(ItemType::Wood);\n    let stone_before = state.agents[0].inventory.count_item(ItemType::Stone);\n\n    // Craft recipe 0 (Axe: requires 2 Wood + 1 Stone, no station needed)\n    state.step(\u0026[Action::Craft(0)]);\n\n    let wood_after = state.agents[0].inventory.count_item(ItemType::Wood);\n    let stone_after = state.agents[0].inventory.count_item(ItemType::Stone);\n    let axe_count = state.agents[0].inventory.count_item(ItemType::Axe);\n\n    assert_eq!(axe_count, 1, \"agent should have crafted 1 axe\");\n    assert_eq!(\n        wood_before - wood_after,\n        2,\n        \"crafting should consume 2 wood\"\n    );\n    assert_eq!(\n        stone_before - stone_after,\n        1,\n        \"crafting should consume 1 stone\"\n    );\n}\n\n// ---------------------------------------------------------------------------\n// 9. Communication in episode\n// ---------------------------------------------------------------------------\n\n/// Two agents: one sends a communication token, the other should receive\n/// it in their communication buffer on the next observation.\n#[test]\nfn test_communication_in_episode() {\n    let mut config = make_config(2, 42);\n    config.world.width = 16;\n    config.world.height = 16;\n    config.agents.comm_vocab_size = 16;\n    config.agents.comm_radius = 0; // global broadcast\n    let mut state = WorldState::new(config).unwrap();\n\n    // Place agents within comm radius (global means always in range)\n    state.agents[0].position = Position::new(5, 5);\n    state.agents[1].position = Position::new(6, 5);\n    for tile in state.grid.tiles.iter_mut() {\n        tile.agent_id = None;\n    }\n    state.grid.get_mut(5, 5).unwrap().agent_id = Some(state.agents[0].id);\n    state.grid.get_mut(6, 5).unwrap().agent_id = Some(state.agents[1].id);\n\n    // Agent 0 sends token 7, agent 1 does Noop\n    let result = state.step(\u0026[Action::Communicate(7), Action::Noop]);\n\n    // After the step, agent 1 should have the message in its comm buffer\n    assert!(\n        !state.agents[1].comm_buffer.is_empty(),\n        \"agent 1 should have received a message\"\n    );\n    assert_eq!(\n        state.agents[1].comm_buffer[0], 7,\n        \"agent 1 should have received token 7\"\n    );\n\n    // Agent 0 (the sender) should NOT have its own message\n    let sender_has_own_msg = state.agents[0].comm_buffer.contains(\u00267);\n    assert!(\n        !sender_has_own_msg,\n        \"sender should not receive their own message\"\n    );\n\n    // The observation for agent 1 should include the message\n    assert!(\n        !result.observations[1].messages.is_empty(),\n        \"agent 1's observation should contain the received message\"\n    );\n}\n\n// ---------------------------------------------------------------------------\n// 10. Day/night cycle progression\n// ---------------------------------------------------------------------------\n\n/// Run enough ticks to cycle through all 4 day phases (dawn, day, dusk,\n/// night) and verify each phase is observed.\n#[test]\nfn test_day_night_cycle_progression() {\n    let mut config = make_config(1, 42);\n    // Cycle length of 100: each quarter is 25 ticks\n    config.world.day_night_cycle_length = 100;\n    let mut state = WorldState::new(config).unwrap();\n    state.reset(Some(42));\n\n    let mut phases_seen = [false; 4];\n\n    // Step through a full cycle (100 ticks)\n    for _ in 0..100 {\n        let result = state.step(\u0026[Action::Noop]);\n        let phase = result.info.day_phase;\n        assert!(phase \u003c= 3, \"day_phase should be 0-3, got {}\", phase);\n        phases_seen[phase as usize] = true;\n    }\n\n    // All four phases should have been observed\n    assert!(\n        phases_seen[0],\n        \"dawn phase (0) was never observed during a full cycle\"\n    );\n    assert!(\n        phases_seen[1],\n        \"day phase (1) was never observed during a full cycle\"\n    );\n    assert!(\n        phases_seen[2],\n        \"dusk phase (2) was never observed during a full cycle\"\n    );\n    assert!(\n        phases_seen[3],\n        \"night phase (3) was never observed during a full cycle\"\n    );\n}\n\n// ---------------------------------------------------------------------------\n// 11. Config validation integration\n// ---------------------------------------------------------------------------\n\n/// Verify that invalid configs are rejected at WorldState::new().\n#[test]\nfn test_invalid_config_rejected() {\n    let mut config = ForgeConfig::default();\n    config.world.width = 2; // below min_dimension (8)\n\n    let result = WorldState::new(config);\n    assert!(\n        result.is_err(),\n        \"WorldState::new should reject invalid config\"\n    );\n    let err_msg = result.unwrap_err().to_string();\n    assert!(\n        err_msg.contains(\"width\"),\n        \"error should mention 'width': {}\",\n        err_msg\n    );\n}\n\n/// Verify that validate_config accepts the default config.\n#[test]\nfn test_default_config_passes_validation() {\n    let config = ForgeConfig::default();\n    assert!(\n        validate_config(\u0026config).is_ok(),\n        \"default config should be valid\"\n    );\n}\n\n// ---------------------------------------------------------------------------\n// 12. State serialization integration\n// ---------------------------------------------------------------------------\n\n/// Serialize a WorldState to bytes, deserialize, and verify state matches.\n#[test]\nfn test_state_serialization_roundtrip() {\n    let config = make_config(2, 42);\n    let mut state = WorldState::new(config).unwrap();\n    state.reset(Some(42));\n\n    // Step a few times to build up interesting state\n    for _ in 0..10 {\n        state.step(\u0026[\n            Action::Move(Direction::Right),\n            Action::Move(Direction::Left),\n        ]);\n    }\n\n    let bytes = state.to_bytes();\n    let config_arc = Arc::new(state.config.as_ref().clone());\n    let restored = WorldState::from_bytes(\u0026bytes, config_arc);\n    assert!(\n        restored.is_ok(),\n        \"from_bytes should succeed for valid bytes\"\n    );\n    let restored = restored.unwrap();\n\n    assert_eq!(restored.tick, state.tick, \"tick mismatch after roundtrip\");\n    assert_eq!(\n        restored.agents.len(),\n        state.agents.len(),\n        \"agent count mismatch\"\n    );\n    for (i, (a1, a2)) in state.agents.iter().zip(restored.agents.iter()).enumerate() {\n        assert_eq!(\n            a1.position, a2.position,\n            \"position mismatch for agent {} after roundtrip\",\n            i\n        );\n    }\n}\n\n/// JSON roundtrip for human-readable serialization.\n#[test]\nfn test_state_json_roundtrip() {\n    let config = make_config(1, 99);\n    let mut state = WorldState::new(config).unwrap();\n    state.reset(Some(99));\n    state.step(\u0026[Action::Noop]);\n\n    let json = state.to_json();\n    assert!(json.is_ok(), \"to_json should succeed\");\n    let json_str = json.unwrap();\n    assert!(\n        json_str.contains(\"\\\"tick\\\"\"),\n        \"JSON should contain tick field\"\n    );\n\n    let config_arc = Arc::new(state.config.as_ref().clone());\n    let restored = WorldState::from_json(\u0026json_str, config_arc);\n    assert!(restored.is_ok(), \"from_json should succeed\");\n    assert_eq!(restored.unwrap().tick, state.tick);\n}\n\n// ---------------------------------------------------------------------------\n// 13. Vision modifier integration\n// ---------------------------------------------------------------------------\n\n/// Verify that night phase reduces the effective observation grid compared\n/// to daytime (reflecting the day/night vision modifier).\n#[test]\nfn test_night_vision_reduces_observation() {\n    let mut config = make_config(1, 42);\n    // Very short cycle: 4 ticks per phase\n    config.world.day_night_cycle_length = 16;\n    let mut state = WorldState::new(config).unwrap();\n    state.reset(Some(42));\n\n    // The day_phase changes over ticks; step through and collect phases\n    let mut seen_day = false;\n    let mut seen_night = false;\n    for _ in 0..16 {\n        let result = state.step(\u0026[Action::Noop]);\n        let phase = result.info.day_phase;\n        if phase == 1 {\n            seen_day = true;\n        }\n        if phase == 3 {\n            seen_night = true;\n        }\n    }\n\n    // Both phases should have been observed during a full cycle\n    assert!(seen_day, \"day phase should appear during a 16-tick cycle\");\n    assert!(\n        seen_night,\n        \"night phase should appear during a 16-tick cycle\"\n    );\n}\n\n// ---------------------------------------------------------------------------\n// 14. Reset determinism\n// ---------------------------------------------------------------------------\n\n/// Verify that calling reset() with the same seed produces identical state.\n#[test]\nfn test_reset_determinism() {\n    let config = make_config(1, 42);\n    let mut state = WorldState::new(config).unwrap();\n\n    // First reset\n    state.reset(Some(123));\n    let pos1 = state.agents[0].position;\n    let health1 = state.agents[0].health;\n\n    // Step to advance state\n    for _ in 0..5 {\n        state.step(\u0026[Action::Move(Direction::Down)]);\n    }\n    assert_ne!(\n        state.agents[0].position, pos1,\n        \"position should change after moves\"\n    );\n\n    // Reset with same seed\n    state.reset(Some(123));\n    assert_eq!(\n        state.agents[0].position, pos1,\n        \"reset with same seed should restore position\"\n    );\n    assert_eq!(\n        state.agents[0].health, health1,\n        \"reset with same seed should restore health\"\n    );\n    assert_eq!(state.tick, 0, \"tick should be 0 after reset\");\n}\n\n// ---------------------------------------------------------------------------\n// 15. Episode truncation\n// ---------------------------------------------------------------------------\n\n/// Verify that episodes are truncated after max_episode_length steps.\n#[test]\nfn test_episode_truncation() {\n    let mut config = make_config(1, 42);\n    config.task.max_episode_length = 10;\n    let mut state = WorldState::new(config).unwrap();\n    state.reset(Some(42));\n\n    let mut truncated = false;\n    for _ in 0..20 {\n        let result = state.step(\u0026[Action::Noop]);\n        if result.truncated {\n            truncated = true;\n            break;\n
