bservation_space(py: Python\u003c'_\u003e, config: \u0026ForgeConfig) -\u003e PyResult\u003cPyObject\u003e {\n    let dict = PyDict::new_bound(py);\n\n    let vr = config.agents.default_vision_radius as usize;\n    let view_side = 2 * vr + 1;\n\n    // Grid view space\n    let grid_dict = PyDict::new_bound(py);\n    grid_dict.set_item(\n        \"shape\",\n        (\n            view_side,\n            view_side,\n            forge_types::constants::OBS_FEATURES_PER_TILE,\n        ),\n    )?;\n    grid_dict.set_item(\"low\", 0u8)?;\n    grid_dict.set_item(\"high\", 255u8)?;\n    grid_dict.set_item(\"dtype\", \"uint8\")?;\n    dict.set_item(\"grid_view\", grid_dict)?;\n\n    // Inventory space\n    let inv_dict = PyDict::new_bound(py);\n    let capacity = config.agents.default_carry_capacity as usize;\n    inv_dict.set_item(\"shape\", (capacity, 2))?;\n    inv_dict.set_item(\"low\", 0u16)?;\n    inv_dict.set_item(\"high\", 65535u16)?;\n    inv_dict.set_item(\"dtype\", \"uint16\")?;\n    dict.set_item(\"inventory\", inv_dict)?;\n\n    // Health space\n    let health_dict = PyDict::new_bound(py);\n    health_dict.set_item(\"low\", 0.0f32)?;\n    health_dict.set_item(\"high\", 1.0f32)?;\n    health_dict.set_item(\"dtype\", \"float32\")?;\n    dict.set_item(\"health\", health_dict)?;\n\n    // Stamina space\n    let stamina_dict = PyDict::new_bound(py);\n    stamina_dict.set_item(\"low\", 0.0f32)?;\n    stamina_dict.set_item(\"high\", 1.0f32)?;\n    stamina_dict.set_item(\"dtype\", \"float32\")?;\n    dict.set_item(\"stamina\", stamina_dict)?;\n\n    // Position space\n    let pos_dict = PyDict::new_bound(py);\n    pos_dict.set_item(\"shape\", (2,))?;\n    pos_dict.set_item(\"low\", 0u16)?;\n    pos_dict.set_item(\"high\", 65535u16)?;\n    pos_dict.set_item(\"dtype\", \"uint16\")?;\n    dict.set_item(\"position\", pos_dict)?;\n\n    // Messages space\n    let msg_dict = PyDict::new_bound(py);\n    let buffer_size = config.agents.comm_buffer_size as usize;\n    msg_dict.set_item(\"shape\", (buffer_size,))?;\n    msg_dict.set_item(\"low\", 0u16)?;\n    msg_dict.set_item(\"high\", config.agents.comm_vocab_size)?;\n    msg_dict.set_item(\"dtype\", \"uint16\")?;\n    dict.set_item(\"messages\", msg_dict)?;\n\n    // Day phase space\n    let day_dict = PyDict::new_bound(py);\n    day_dict.set_item(\"low\", 0u8)?;\n    day_dict.set_item(\"high\", forge_types::constants::NUM_DAY_PHASES - 1)?;\n    day_dict.set_item(\"dtype\", \"uint8\")?;\n    dict.set_item(\"day_phase\", day_dict)?;\n\n    // Flat dimension values for Python wrapper convenience\n    dict.set_item(\"grid_view_height\", view_side)?;\n    dict.set_item(\"grid_view_width\", view_side)?;\n    dict.set_item(\n        \"grid_view_channels\",\n        forge_types::constants::OBS_FEATURES_PER_TILE,\n    )?;\n    dict.set_item(\"inventory_capacity\", capacity)?;\n\n    Ok(dict.unbind().into())\n}\n\n/// Returns a Python dict describing the discrete action space for Gymnasium compatibility.\n///\n/// The dict contains:\n/// - \"type\": \"Discrete\"\n/// - \"n\": total number of actions\npub fn action_space(py: Python\u003c'_\u003e, config: \u0026ForgeConfig) -\u003e PyResult\u003cPyObject\u003e {\n    let dict = PyDict::new_bound(py);\n    let n = forge_types::Action::space_size(config.agents.comm_vocab_size);\n    dict.set_item(\"type\", \"Discrete\")?;\n    dict.set_item(\"n\", n)?;\n    Ok(dict.unbind().into())\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-task","src","composer.rs"],"content":"//! Task composition evaluation.\n//!\n//! Evaluates composite tasks built from atomic predicates using\n//! logical operators (AND, OR, SEQUENCE, BEFORE, WHILE, WITHOUT).\n\nuse forge_types::task::TaskComposition;\nuse tracing::{instrument, trace, warn};\n\nuse crate::predicate::{evaluate_predicate, EvalContext, PredicateResult};\n\n/// Evaluates a composite task against the current world state.\n///\n/// Returns the overall satisfaction and progress of the task tree.\n#[instrument(skip_all)]\npub fn evaluate_composition(\n    composition: \u0026TaskComposition,\n    ctx: \u0026EvalContext,\n    sequence_index: \u0026mut usize,\n    forbidden_actions: \u0026[u32],\n) -\u003e PredicateResult {\n    match composition {\n        TaskComposition::Atom(predicate) =\u003e evaluate_predicate(predicate, ctx),\n\n        TaskComposition::And(subtasks) =\u003e {\n            if subtasks.is_empty() {\n                return PredicateResult {\n                    satisfied: true,\n                    progress: 1.0,\n                };\n            }\n            let results: Vec\u003cPredicateResult\u003e = subtasks\n                .iter()\n                .map(|t| evaluate_composition(t, ctx, sequence_index, forbidden_actions))\n                .collect();\n            let all_satisfied = results.iter().all(|r| r.satisfied);\n            let avg_progress =\n                results.iter().map(|r| r.progress).sum::\u003cf32\u003e() / results.len() as f32;\n            PredicateResult {\n                satisfied: all_satisfied,\n                progress: avg_progress,\n            }\n        }\n\n        TaskComposition::Or(subtasks) =\u003e {\n            if subtasks.is_empty() {\n                return PredicateResult {\n                    satisfied: false,\n                    progress: 0.0,\n                };\n            }\n            let results: Vec\u003cPredicateResult\u003e = subtasks\n                .iter()\n                .map(|t| evaluate_composition(t, ctx, sequence_index, forbidden_actions))\n                .collect();\n            let any_satisfied = results.iter().any(|r| r.satisfied);\n            let max_progress = results.iter().map(|r| r.progress).fold(0.0_f32, f32::max);\n            PredicateResult {\n                satisfied: any_satisfied,\n                progress: max_progress,\n            }\n        }\n\n        TaskComposition::Sequence(subtasks) =\u003e {\n            if subtasks.is_empty() {\n                return PredicateResult {\n                    satisfied: true,\n                    progress: 1.0,\n                };\n            }\n\n            let current_idx = *sequence_index;\n            if current_idx \u003e= subtasks.len() {\n                return PredicateResult {\n                    satisfied: true,\n                    progress: 1.0,\n                };\n            }\n\n            let current_result = evaluate_composition(\n                \u0026subtasks[current_idx],\n                ctx,\n                sequence_index,\n                forbidden_actions,\n            );\n\n            if current_result.satisfied {\n                trace!(step = current_idx, \"sequence step completed\");\n                *sequence_index = current_idx + 1;\n                if *sequence_index \u003e= subtasks.len() {\n                    return PredicateResult {\n                        satisfied: true,\n                        progress: 1.0,\n                    };\n                }\n            }\n\n            let completed_steps = *sequence_index;\n            let total_steps = subtasks.len();\n            let step_progress = current_result.progress;\n            let overall_progress = (completed_steps as f32 + step_progress) / total_steps as f32;\n\n            PredicateResult {\n                satisfied: false,\n                progress: overall_progress,\n            }\n        }\n\n        TaskComposition::Before(subtask, deadline) =\u003e {\n            if ctx.tick \u003e *deadline {\n                // Deadline passed — task failed\n                PredicateResult {\n                    satisfied: false,\n                    progress: 0.0,\n                }\n            } else {\n                evaluate_composition(subtask, ctx, sequence_index, forbidden_actions)\n            }\n        }\n\n        TaskComposition::While(condition, goal) =\u003e {\n            let cond_result =\n                evaluate_composition(condition, ctx, sequence_index, forbidden_actions);\n            if !cond_result.satisfied {\n                // Condition violated — task failed\n                PredicateResult {\n                    satisfied: false,\n                    progress: 0.0,\n                }\n            } else {\n                evaluate_composition(goal, ctx, sequence_index, forbidden_actions)\n            }\n        }\n\n        TaskComposition::Without(subtask, forbidden_action_id) =\u003e {\n            if forbidden_actions.contains(forbidden_action_id) {\n                // Forbidden action was taken — task failed\n                PredicateResult {\n                    satisfied: false,\n                    progress: 0.0,\n                }\n            } else {\n                evaluate_composition(subtask, ctx, sequence_index, forbidden_actions)\n            }\n        }\n\n        other =\u003e {\n            warn!(\n                ?other,\n                \"unhandled TaskComposition variant in evaluate_composition\"\n            );\n            PredicateResult {\n                satisfied: false,\n                progress: 0.0,\n            }\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::AgentConfig;\n    use forge_types::entity::Agent;\n    use forge_types::grid::Position;\n    use forge_types::resource::ItemType;\n    use forge_types::task::Predicate;\n\n    fn make_agent(id: u32, x: u16, y: u16) -\u003e Agent {\n        Agent::new(id, Position::new(x, y), \u0026AgentConfig::default())\n    }\n\n    fn make_ctx(agents: \u0026[Agent], tick: u64) -\u003e EvalContext\u003c'_\u003e {\n        EvalContext {\n            agents,\n            tick,\n            grid: None,\n            objects: None,\n        }\n    }\n\n    #[test]\n    fn test_and_all_satisfied() {\n        let agents = vec![make_agent(0, 5, 5)];\n        let ctx = make_ctx(\u0026agents, 100);\n        let task = TaskComposition::And(vec![\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            TaskComposition::Atom(Predicate::TimeElapsed(50)),\n        ]);\n        let mut seq_idx = 0;\n        let result = evaluate_composition(\u0026task, \u0026ctx, \u0026mut seq_idx, \u0026[]);\n        assert!(result.satisfied);\n    }\n\n    #[test]\n    fn test_and_partial() {\n        let agents = vec![make_agent(0, 0, 0)];\n        let ctx = make_ctx(\u0026agents, 100);\n        let task = TaskComposition::And(vec![\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))), // NOT satisfied\n            TaskComposition::Atom(Predicate::TimeElapsed(50)),                 // satisfied\n        ]);\n        let mut seq_idx = 0;\n        let result = evaluate_composition(\u0026task, \u0026ctx, \u0026mut seq_idx, \u0026[]);\n        assert!(!result.satisfied);\n        assert!(result.progress \u003e 0.0);\n    }\n\n    #[test]\n    fn test_or_one_satisfied() {\n        let agents = vec![make_agent(0, 5, 5)];\n        let ctx = make_ctx(\u0026agents, 0);\n        let task = TaskComposition::Or(vec![\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(0, 0))),\n        ]);\n        let mut seq_idx = 0;\n        let result = evaluate_composition(\u0026task, \u0026ctx, \u0026mut seq_idx, \u0026[]);\n        assert!(result.satisfied);\n    }\n\n    #[test]\n    fn test_sequence_progression() {\n        let mut agents = vec![make_agent(0, 0, 0)];\n        agents[0].inventory.add_item(ItemType::Wood, 3);\n\n        let ctx = make_ctx(\u0026agents, 0);\n        let task = TaskComposition::Sequence(vec![\n            TaskComposition::Atom(Predicate::AgentHas(0, ItemType::Wood, 3)), // satisfied\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))), // not satisfied\n        ]);\n\n        let mut seq_idx = 0;\n        let result = evaluate_composition(\u0026task, \u0026ctx, \u0026mut seq_idx, \u0026[]);\n        // First step should be completed, second not yet\n        assert!(!result.satisfied);\n        assert_eq!(seq_idx, 1); // advanced to step 1\n        assert!(result.progress \u003e 0.4); // at least half done\n    }\n\n    #[test]\n    fn test_before_deadline_passed() {\n        let agents = vec![make_agent(0, 0, 0)];\n        let ctx = make_ctx(\u0026agents, 200);\n        let task = TaskComposition::Before(\n            Box::new(TaskComposition::Atom(Predicate::AgentAt(\n                0,\n                Position::new(5, 5),\n            ))),\n            100, // deadline at tick 100\n        );\n        let mut seq_idx = 0;\n        let result = evaluate_composition(\u0026task, \u0026ctx, \u0026mut seq_idx, \u0026[]);\n        assert!(!result.satisfied);\n        assert_eq!(result.progress, 0.0); // failed\n    }\n\n    #[test]\n    fn test_without_forbidden_action() {\n        let agents = vec![make_agent(0, 5, 5)];\n        let ctx = make_ctx(\u0026agents, 0);\n        let task = TaskComposition::Without(\n            Box::new(TaskComposition::Atom(Predicate::AgentAt(\n                0,\n                Position::new(5, 5),\n            ))),\n            42, // forbidden action ID\n        );\n\n        // Without the forbidden action, should succeed\n        let mut seq_idx = 0;\n        let result = evaluate_composition(\u0026task, \u0026ctx, \u0026mut seq_idx, \u0026[]);\n        assert!(result.satisfied);\n\n        // With the forbidden action, should fail\n        let result2 = evaluate_composition(\u0026task, \u0026ctx, \u0026mut seq_idx, \u0026[42]);\n        assert!(!result2.satisfied);\n    }\n\n    #[test]\n    fn test_while_condition_maintained() {\n        let agents = vec![make_agent(0, 5, 5)]; // full health\n        let ctx = make_ctx(\u0026agents, 100);\n        let task = TaskComposition::While(\n            Box::new(TaskComposition::Atom(Predicate::HealthAbove(0, 0.5))),\n            Box::new(TaskComposition::Atom(Predicate::TimeElapsed(50))),\n        );\n        let mut seq_idx = 0;\n        let result = evaluate_composition(\u0026task, \u0026ctx, \u0026mut seq_idx, \u0026[]);\n        assert!(result.satisfied);\n    }\n\n    #[test]\n    fn test_empty_and() {\n        let agents = vec![];\n        let ctx = make_ctx(\u0026agents, 0);\n        let task = TaskComposition::And(vec![]);\n        let mut seq_idx = 0;\n        let result = evaluate_composition(\u0026task, \u0026ctx, \u0026mut seq_idx, \u0026[]);\n        assert!(result.satisfied); // vacuous truth\n    }\n\n    #[test]\n    fn test_empty_or() {\n        let agents = vec![];\n        let ctx = make_ctx(\u0026agents, 0);\n        let task = TaskComposition::Or(vec![]);\n        let mut seq_idx = 0;\n        let result = evaluate_composition(\u0026task, \u0026ctx, \u0026mut seq_idx, \u0026[]);\n        assert!(!result.satisfied);\n    }\n\n    #[test]\n    fn test_composer_deeply_nested() {\n        // Build deeply nested AND/OR/SEQUENCE composition:\n        // AND(\n        //   OR(\n        //     AgentAt(0, (5,5)),\n        //     SEQUENCE(\n        //       AgentAt(0, (0,0)),\n        //       AND(\n        //         TimeElapsed(10),\n        //         OR(\n        //           AgentAt(0, (5,5)),\n        //           TimeElapsed(5)\n        //         )\n        //       )\n        //     )\n        //   ),\n        //   TimeElapsed(1)\n        // )\n        let agents = vec![make_agent(0, 5, 5)];\n        let ctx = make_ctx(\u0026agents, 100);\n\n        let deep_or = TaskComposition::Or(vec![\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            TaskComposition::Atom(Predicate::TimeElapsed(5)),\n        ]);\n        let deep_and = TaskComposition::And(vec![\n            TaskComposition::Atom(Predicate::TimeElapsed(10)),\n            deep_or,\n        ]);\n        let sequence = TaskComposition::Sequence(vec![\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(0, 0))),\n            deep_and,\n        ]);\n        let top_or = TaskComposition::Or(vec![\n            TaskComposition::Atom(Predicate::AgentAt(0, Position::new(5, 5))),\n            sequence,\n        ]);\n        let top_and = TaskComposition::And(vec![\n            top_or,\n            TaskComposition::Atom(Predicate::TimeElapsed(1)),\n        ]);\n\n        let mut seq_idx = 0;\n        let result = evaluate_composition(\u0026top_and, \u0026ctx, \u0026mut seq_idx, \u0026[]);\n        // The top AND requires both: OR (satisfied via AgentAt(0,(5,5))) AND TimeElapsed(1) (satisfied at tick 100)\n        assert!(\n            result.satisfied,\n            \"deeply nested composition should be satisfied\"\n        );\n        assert!((result.progress - 1.0).abs() \u003c 0.01);\n    }\n}\n","traces":[{"line":15,"address":[4297916,4296976,4299192,4302162],"length":1,"stats":{"Line":5}},{"line":21,"address":[4402353],"length":1,"stats":{"Line":5}},{"line":22,"address":[2354734,2355145],"length":1,"stats":{"Line":6}},{"line":24,"address":[4297980],"length":1,"stats":{"Line":3}},{"line":25,"address":[2354796,2355189],"length":1,"stats":{"Line":6}},{"line":26,"address":[4427026],"length":1,"stats":{"Line":1}},{"line":31,"address":[4426999],"length":1,"stats":{"Line":3}},{"line":33,"address":[2355343],"length":1,"stats":{"Line":7}},{"line":35,"address":[4270170,4270160],"length":1,"stats":{"Line":8}},{"line":36,"address":[2355867,2355609],"length":1,"stats":{"Line":8}},{"line":44,"address":[2354821],"length":1,"stats":{"Line":1}},{"line":45,"address":[2355948,2354841],"length":1,"stats":{"Line":3}},{"line":46,"address":[2355985],"length":1,"stats":{"Line":1}},{"line":51,"address":[4404422],"length":1,"stats":{"Line":1}},{"line":53,"address":[4398569,4398544],"length":1,"stats":{"Line":6}},{"line":55,"address":[2377594,2377584],"length":1,"stats":{"Line":4}},{"line":56,"address":[4814080,4814090],"length":1,"stats":{"Line":3}},{"lin n//! the distribution over task tiers to maintain a target success rate.\n\nuse forge_types::config::CurriculumConfig;\nuse rand::Rng;\nuse tracing::instrument;\n\n/// Number of difficulty tiers.\nconst NUM_TIERS: usize = 6;\n\n/// Curriculum controller that adapts task difficulty based on agent performance.\npub struct CurriculumController {\n    config: CurriculumConfig,\n    /// Rolling window of episode outcomes (true = success).\n    outcomes: Vec\u003cbool\u003e,\n    /// Probability distribution over tiers 1-6.\n    tier_weights: [f32; NUM_TIERS],\n    /// Total number of episodes recorded.\n    total_episodes: u64,\n}\n\nimpl CurriculumController {\n    /// Creates a new curriculum controller with uniform initial distribution.\n    #[instrument(skip_all)]\n    pub fn new(config: CurriculumConfig) -\u003e Self {\n        let uniform = 1.0 / NUM_TIERS as f32;\n        Self {\n            config,\n            outcomes: Vec::new(),\n            tier_weights: [uniform; NUM_TIERS],\n            total_episodes: 0,\n        }\n    }\n\n    /// Records the outcome of an episode and adjusts difficulty if appropriate.\n    #[instrument(skip_all)]\n    pub fn record_outcome(\u0026mut self, success: bool) {\n        self.outcomes.push(success);\n        self.total_episodes += 1;\n\n        // Trim window to configured size\n        let window = self.config.window_size as usize;\n        if self.outcomes.len() \u003e window {\n            let excess = self.outcomes.len() - window;\n            self.outcomes.drain(..excess);\n        }\n\n        // Only adjust after warmup\n        if self.total_episodes \u003e= self.config.warmup_episodes as u64 \u0026\u0026 self.config.enabled {\n            self.adjust_difficulty();\n        }\n    }\n\n    /// Returns the success rate over the rolling window.\n    pub fn success_rate(\u0026self) -\u003e f32 {\n        if self.outcomes.is_empty() {\n            return 0.0;\n        }\n        let successes = self.outcomes.iter().filter(|\u0026\u0026o| o).count();\n        successes as f32 / self.outcomes.len() as f32\n    }\n\n    /// Samples a tier (1-6) from the current weight distribution.\n    ///\n    /// The returned tier is clamped to `[1, max_tier]`.\n    #[instrument(skip_all)]\n    pub fn sample_tier\u003cR: Rng\u003e(\u0026self, rng: \u0026mut R, max_tier: u8) -\u003e u8 {\n        let max_tier = max_tier.clamp(1, NUM_TIERS as u8);\n        let effective_weights: Vec\u003cf32\u003e = self.tier_weights[..max_tier as usize].to_vec();\n        let total: f32 = effective_weights.iter().sum();\n\n        if total \u003c= 0.0 {\n            return 1;\n        }\n\n        let mut r = rng.gen_range(0.0..total);\n        for (i, \u0026w) in effective_weights.iter().enumerate() {\n            r -= w;\n            if r \u003c= 0.0 {\n                return (i + 1) as u8;\n            }\n        }\n\n        // Fallback: return the highest available tier\n        max_tier\n    }\n\n    /// Returns the current tier weight distribution.\n    pub fn tier_weights(\u0026self) -\u003e \u0026[f32; NUM_TIERS] {\n        \u0026self.tier_weights\n    }\n\n    /// Returns the total number of episodes recorded.\n    pub fn total_episodes(\u0026self) -\u003e u64 {\n        self.total_episodes\n    }\n\n    /// Adjusts the tier weight distribution based on current success rate.\n    ///\n    /// If the success rate is above target: shift weight toward harder tiers.\n    /// If the success rate is below target: shift weight toward easier tiers.\n    #[instrument(skip_all)]\n    fn adjust_difficulty(\u0026mut self) {\n        let rate = self.success_rate();\n        let target = self.config.target_success_rate;\n        let lr = self.config.adjustment_rate;\n\n        if rate \u003e target + 0.05 {\n            // Too easy: shift toward harder tiers\n            self.shift_weights_harder(lr);\n        } else if rate \u003c target - 0.05 {\n            // Too hard: shift toward easier tiers\n            self.shift_weights_easier(lr);\n        }\n        // Within deadband: no adjustment\n    }\n\n    /// Shifts weight from easier tiers to harder tiers.\n    fn shift_weights_harder(\u0026mut self, rate: f32) {\n        // Transfer weight from lower tiers to upper tiers\n        for i in 0..NUM_TIERS {\n            let shift = self.tier_weights[i] * rate;\n            if i + 1 \u003c NUM_TIERS {\n                self.tier_weights[i] -= shift;\n                self.tier_weights[i + 1] += shift;\n            }\n        }\n        self.normalize_weights();\n    }\n\n    /// Shifts weight from harder tiers to easier tiers.\n    fn shift_weights_easier(\u0026mut self, rate: f32) {\n        // Transfer weight from upper tiers to lower tiers\n        for i in (0..NUM_TIERS).rev() {\n            let shift = self.tier_weights[i] * rate;\n            if i \u003e 0 {\n                self.tier_weights[i] -= shift;\n                self.tier_weights[i - 1] += shift;\n            }\n        }\n        self.normalize_weights();\n    }\n\n    /// Normalizes the tier weights so they sum to 1.0.\n    fn normalize_weights(\u0026mut self) {\n        let sum: f32 = self.tier_weights.iter().sum();\n        if sum \u003e 0.0 {\n            for w in \u0026mut self.tier_weights {\n                *w /= sum;\n            }\n        } else {\n            // Reset to uniform if all weights collapsed to zero\n            let uniform = 1.0 / NUM_TIERS as f32;\n            self.tier_weights = [uniform; NUM_TIERS];\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use rand::SeedableRng;\n    use rand_pcg::Pcg64;\n\n    fn default_config() -\u003e CurriculumConfig {\n        CurriculumConfig {\n            enabled: true,\n            target_success_rate: 0.5,\n            window_size: 100,\n            warmup_episodes: 10,\n            adjustment_rate: 0.1,\n        }\n    }\n\n    fn make_rng(seed: u64) -\u003e Pcg64 {\n        Pcg64::seed_from_u64(seed)\n    }\n\n    #[test]\n    fn test_initial_uniform_distribution() {\n        let ctrl = CurriculumController::new(default_config());\n        let weights = ctrl.tier_weights();\n        let expected = 1.0 / 6.0;\n        for \u0026w in weights.iter() {\n            assert!(\n                (w - expected).abs() \u003c 1e-6,\n                \"expected uniform weight {}, got {}\",\n                expected,\n                w\n            );\n        }\n    }\n\n    #[test]\n    fn test_success_rate_computation() {\n        let mut ctrl = CurriculumController::new(CurriculumConfig {\n            enabled: false,\n            ..default_config()\n        });\n        // No outcomes yet\n        assert_eq!(ctrl.success_rate(), 0.0);\n\n        // Record 7 successes and 3 failures\n        for _ in 0..7 {\n            ctrl.record_outcome(true);\n        }\n        for _ in 0..3 {\n            ctrl.record_outcome(false);\n        }\n        let rate = ctrl.success_rate();\n        assert!((rate - 0.7).abs() \u003c 1e-6, \"expected 0.7, got {}\", rate);\n    }\n\n    #[test]\n    fn test_warmup_period() {\n        let config = CurriculumConfig {\n            warmup_episodes: 10,\n            ..default_config()\n        };\n        let mut ctrl = CurriculumController::new(config);\n        let initial_weights = *ctrl.tier_weights();\n\n        // Record 9 successes (below warmup threshold of 10)\n        for _ in 0..9 {\n            ctrl.record_outcome(true);\n        }\n\n        // Weights should not have changed during warmup\n        assert_eq!(\n            ctrl.tier_weights(),\n            \u0026initial_weights,\n            \"weights should not change during warmup\"\n        );\n    }\n\n    #[test]\n    fn test_difficulty_increases_on_high_success() {\n        let config = CurriculumConfig {\n            warmup_episodes: 5,\n            window_size: 20,\n            target_success_rate: 0.5,\n            adjustment_rate: 0.1,\n            enabled: true,\n        };\n        let mut ctrl = CurriculumController::new(config);\n        let initial_lower_weight: f32 = ctrl.tier_weights()[0..3].iter().sum();\n\n        // Record many successes to push success rate well above target\n        for _ in 0..20 {\n            ctrl.record_outcome(true);\n        }\n\n        let final_lower_weight: f32 = ctrl.tier_weights()[0..3].iter().sum();\n        assert!(\n            final_lower_weight \u003c initial_lower_weight,\n            \"lower tier weights should decrease when success rate is high: initial={}, final={}\",\n            initial_lower_weight,\n            final_lower_weight\n        );\n    }\n\n    #[test]\n    fn test_difficulty_decreases_on_low_success() {\n        let config = CurriculumConfig {\n            warmup_episodes: 5,\n            window_size: 20,\n            target_success_rate: 0.5,\n            adjustment_rate: 0.1,\n            enabled: true,\n        };\n        let mut ctrl = CurriculumController::new(config);\n        let initial_lower_weight: f32 = ctrl.tier_weights()[0..3].iter().sum();\n\n        // Record many failures to push success rate below target\n        for _ in 0..20 {\n            ctrl.record_outcome(false);\n        }\n\n        let final_lower_weight: f32 = ctrl.tier_weights()[0..3].iter().sum();\n        assert!(\n            final_lower_weight \u003e initial_lower_weight,\n            \"lower tier weights should increase when success rate is low: initial={}, final={}\",\n            initial_lower_weight,\n            final_lower_weight\n        );\n    }\n\n    #[test]\n    fn test_sample_tier_distribution() {\n        let ctrl = CurriculumController::new(default_config());\n        let mut rng = make_rng(42);\n        let mut counts = [0u32; NUM_TIERS];\n        let n = 6000;\n\n        for _ in 0..n {\n            let tier = ctrl.sample_tier(\u0026mut rng, 6);\n            assert!((1..=6).contains(\u0026tier), \"tier {} out of range\", tier);\n            counts[(tier - 1) as usize] += 1;\n        }\n\n        // With uniform weights, each tier should get roughly 1/6 of samples\n        let expected = n as f32 / NUM_TIERS as f32;\n        for (i, \u0026count) in counts.iter().enumerate() {\n            let ratio = count as f32 / expected;\n            assert!(\n                (0.7..=1.3).contains(\u0026ratio),\n                \"tier {} has {} samples (expected ~{}), ratio={}\",\n                i + 1,\n                count,\n                expected,\n                ratio\n            );\n        }\n    }\n\n    #[test]\n    fn test_window_size_limits() {\n        let config = CurriculumConfig {\n            window_size: 5,\n            warmup_episodes: 0,\n            enabled: false,\n            ..default_config()\n        };\n        let mut ctrl = CurriculumController::new(config);\n\n        // Record 10 outcomes, only last 5 should be retained\n        for _ in 0..5 {\n            ctrl.record_outcome(true);\n        }\n        for _ in 0..5 {\n            ctrl.record_outcome(false);\n        }\n\n        // The window should only contain the last 5 (all false)\n        assert_eq!(ctrl.outcomes.len(), 5);\n        assert!(\n            (ctrl.success_rate() - 0.0).abs() \u003c 1e-6,\n            \"only failures should be in window, got rate {}\",\n            ctrl.success_rate()\n        );\n    }\n\n    #[test]\n    fn test_total_episodes_counter() {\n        let config = CurriculumConfig {\n            enabled: false,\n            ..default_config()\n        };\n        let mut ctrl = CurriculumController::new(config);\n        assert_eq!(ctrl.total_episodes(), 0);\n\n        ctrl.record_outcome(true);\n        ctrl.record_outcome(false);\n        ctrl.record_outcome(true);\n        assert_eq!(ctrl.total_episodes(), 3);\n    }\n\n    #[test]\n    fn test_sample_tier_respects_max_tier() {\n        let ctrl = CurriculumController::new(default_config());\n        let mut rng = make_rng(100);\n        for _ in 0..100 {\n            let tier = ctrl.sample_tier(\u0026mut rng, 3);\n            assert!((1..=3).contains(\u0026tier), \"tier {} exceeds max_tier=3\", tier);\n        }\n    }\n\n    #[test]\n    fn test_curriculum_extreme_adjustment_rate() {\n        // Test with adjustment_rate = 0.0 (no adjustment should happen)\n        let config_zero = CurriculumConfig {\n            warmup_episodes: 0,\n            window_size: 10,\n            adjustment_rate: 0.0,\n            target_success_rate: 0.5,\n            enabled: true,\n        };\n        let mut ctrl_zero = CurriculumController::new(config_zero);\n        let initial_weights = *ctrl_zero.tier_weights();\n\n        for _ in 0..20 {\n            ctrl_zero.record_outcome(true);\n        }\n        // With rate 0.0, weights should not change\n        for (i, (\u0026initial, \u0026final_w)) in initial_weights\n            .iter()\n            .zip(ctrl_zero.tier_weights().iter())\n            .enumerate()\n        {\n            assert!(\n                (initial - final_w).abs() \u003c 1e-6,\n                \"tier {} weight changed with rate 0.0: {} -\u003e {}\",\n                i + 1,\n                initial,\n                final_w\n            );\n        }\n\n        // Test with adjustment_rate = 1.0 (aggressive adjustment)\n        let config_one = CurriculumConfig {\n            warmup_episodes: 0,\n            window_size: 10,\n            adjustment_rate: 1.0,\n            target_success_rate: 0.5,\n            enabled: true,\n        };\n        let mut ctrl_one = CurriculumController::new(config_one);\n\n        for _ in 0..20 {\n            ctrl_one.record_outcome(true);\n        }\n        // With rate 1.0, weights should still sum to 1.0 and be valid\n        let sum: f32 = ctrl_one.tier_weights().iter().sum();\n        assert!(\n            (sum - 1.0).abs() \u003c 1e-4,\n            \"weights should sum to 1.0, got {}\",\n            sum\n        );\n        // Higher tiers should have gained weight\n        let higher_weight: f32 = ctrl_one.tier_weights()[3..6].iter().sum();\n        assert!(\n            higher_weight \u003e 0.5,\n            \"higher tiers should dominate with rate 1.0 and all successes, got {}\",\n            higher_weight\n        );\n    }\n\n    #[test]\n    fn test_weights_remain_normalized() {\n        let config = CurriculumConfig {\n            warmup_episodes: 0,\n            window_size: 10,\n            ..default_config()\n        };\n        let mut ctrl = CurriculumController::new(config);\n\n        for i in 0..50 {\n            ctrl.record_outcome(i % 3 == 0);\n            let sum: f32 = ctrl.tier_weights().iter().sum();\n            assert!(\n                (sum - 1.0).abs() \u003c 1e-4,\n                \"weights should sum to 1.0, got {} at episode {}\",\n                sum,\n                i\n            );\n        }\n    }\n}\n","traces":[{"line":27,"address":[2364538,2363472],"length":1,"stats":{"Line":1}},{"line":28,"address":[2363595],"length":1,"stats":{"Line":1}},{"line":31,"address":[2363614],"length":1,"stats":{"Line":1}},{"line":32,"address":[2364208],"length":1,"stats":{"Line":1}},{"line":39,"address":[2360176,2361354,2361360],"length":1,"stats":{"Line":2}},{"line":40,"address":[2360331],"length":1,"stats":{"Line":2}},{"line":41,"address":[2361005,2360939],"length":1,"stats":{"Line":2}},{"line":44,"address":[2360977],"length":1,"stats":{"Line":2}},{"line":45,"address":[2361035,2360993],"length":1,"stats":{"Line":4}},{"line":46,"address":[2361074,2361148],"length":1,"stats":{"Line":1}},{"line":47,"address":[2361141,2361177],"length":1,"stats":{"Line":2}},{"line":51,"address":[2361207,2361048],"length":1,"stats":{"Line":4}},{"line":52,"address":[2361221],"length":1,"stats":{"Line":2}},{"line":57,"address":[2359904],"length":1,"stats":{"Line":3}},{"line":58,"address":[2359918],"length":1,"stats":{"Line":3}},{"line":59,"address":[2360139],"length":1,"stats":{"Line":1}},{"line":61,"address":[4866528,4866538],"length":1,"stats":{"Line":9}},{"line":62,"address":[23601
