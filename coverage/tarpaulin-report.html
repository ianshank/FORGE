near a crafting station (if required)\n/// - Removes input items from the agent's inventory\n/// - Adds the output item to the agent's inventory\n///\n/// The `near_station` slice provides a per-agent boolean indicating whether\n/// the agent is adjacent to or on a crafting station tile.\n#[instrument(skip_all)]\npub fn process_crafting(\n    agents: \u0026mut [Agent],\n    actions: \u0026[Action],\n    recipes: \u0026RecipeBook,\n    near_station: \u0026[bool],\n) {\n    for (i, action) in actions.iter().enumerate() {\n        let recipe_id = match action {\n            Action::Craft(id) =\u003e *id,\n            _ =\u003e continue,\n        };\n\n        if i \u003e= agents.len() {\n            continue;\n        }\n\n        let agent = \u0026agents[i];\n        if !agent.alive {\n            continue;\n        }\n\n        // Look up the recipe\n        let recipe = match recipes.get(recipe_id) {\n            Some(r) =\u003e r,\n            None =\u003e {\n                trace!(\n                    agent_id = agent.id,\n                    recipe_id = recipe_id,\n                    \"craft failed: recipe not found\"\n                );\n                continue;\n            }\n        };\n\n        // Check crafting level\n        if agent.capabilities.crafting_level \u003c recipe.min_crafting_level {\n            trace!(\n                agent_id = agent.id,\n                recipe_id = recipe_id,\n                agent_level = agent.capabilities.crafting_level,\n                required_level = recipe.min_crafting_level,\n                \"craft failed: insufficient crafting level\"\n            );\n            continue;\n        }\n\n        // Check station requirement\n        if recipe.requires_station {\n            let is_near = near_station.get(i).copied().unwrap_or(false);\n            if !is_near {\n                trace!(\n                    agent_id = agent.id,\n                    recipe_id = recipe_id,\n                    \"craft failed: not near crafting station\"\n                );\n                continue;\n            }\n        }\n\n        // Check all required inputs are available\n        let has_all_inputs = recipe\n            .inputs\n            .iter()\n            .all(|(item_type, count)| agents[i].inventory.has_item(*item_type, *count));\n\n        if !has_all_inputs {\n            trace!(\n                agent_id = agent.id,\n                recipe_id = recipe_id,\n                \"craft failed: missing ingredients\"\n            );\n            continue;\n        }\n\n        // Remove inputs from inventory\n        let mut all_removed = true;\n        for (item_type, count) in \u0026recipe.inputs {\n            if !agents[i].inventory.remove_item(*item_type, *count) {\n                all_removed = false;\n                break;\n            }\n        }\n\n        if !all_removed {\n            // This shouldn't happen since we checked above, but be safe\n            trace!(\n                agent_id = agents[i].id,\n                recipe_id = recipe_id,\n                \"craft failed: could not remove inputs\"\n            );\n            continue;\n        }\n\n        // Add output to inventory\n        let (output_type, output_count) = recipe.output;\n        if !agents[i].inventory.add_item(output_type, output_count) {\n            // Output doesn't fit -- we already consumed inputs, this is a problem.\n            // In a real game we might want to roll back. For determinism, we log and continue.\n            trace!(\n                agent_id = agents[i].id,\n                recipe_id = recipe_id,\n                \"craft partially failed: inputs consumed but output does not fit in inventory\"\n            );\n            continue;\n        }\n\n        trace!(\n            agent_id = agents[i].id,\n            recipe_id = recipe_id,\n            output = ?output_type,\n            output_count = output_count,\n            \"crafting successful\"\n        );\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::AgentConfig;\n    use forge_types::grid::Position;\n    use forge_types::resource::{CraftingRecipe, ItemType};\n\n    fn make_test_agent(id: u32, x: u16, y: u16) -\u003e Agent {\n        let config = AgentConfig::default();\n        Agent::new(id, Position::new(x, y), \u0026config)\n    }\n\n    fn make_test_recipe_book() -\u003e RecipeBook {\n        RecipeBook {\n            recipes: vec![\n                CraftingRecipe {\n                    id: 0,\n                    name: \"Axe\".to_string(),\n                    inputs: vec![(ItemType::Wood, 2), (ItemType::Stone, 1)],\n                    output: (ItemType::Axe, 1),\n                    requires_station: false,\n                    min_crafting_level: 1,\n                },\n                CraftingRecipe {\n                    id: 1,\n                    name: \"Sword\".to_string(),\n                    inputs: vec![(ItemType::Wood, 1), (ItemType::Ore, 2)],\n                    output: (ItemType::Sword, 1),\n                    requires_station: true,\n                    min_crafting_level: 2,\n                },\n            ],\n        }\n    }\n\n    #[test]\n    fn test_craft_success() {\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        agents[0].inventory.add_item(ItemType::Wood, 5);\n        agents[0].inventory.add_item(ItemType::Stone, 3);\n\n        let recipes = make_test_recipe_book();\n        let actions = vec![Action::Craft(0)]; // craft Axe\n        let near_station = vec![false];\n\n        process_crafting(\u0026mut agents, \u0026actions, \u0026recipes, \u0026near_station);\n\n        // Should have consumed 2 wood + 1 stone, produced 1 axe\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 3);\n        assert_eq!(agents[0].inventory.count_item(ItemType::Stone), 2);\n        assert_eq!(agents[0].inventory.count_item(ItemType::Axe), 1);\n    }\n\n    #[test]\n    fn test_craft_missing_ingredients() {\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        agents[0].inventory.add_item(ItemType::Wood, 1); // need 2\n\n        let recipes = make_test_recipe_book();\n        let actions = vec![Action::Craft(0)]; // craft Axe\n        let near_station = vec![false];\n\n        process_crafting(\u0026mut agents, \u0026actions, \u0026recipes, \u0026near_station);\n\n        // Nothing should have changed\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 1);\n        assert_eq!(agents[0].inventory.count_item(ItemType::Axe), 0);\n    }\n\n    #[test]\n    fn test_craft_missing_station() {\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        agents[0].capabilities.crafting_level = 2;\n        agents[0].inventory.add_item(ItemType::Wood, 5);\n        agents[0].inventory.add_item(ItemType::Ore, 5);\n\n        let recipes = make_test_recipe_book();\n        let actions = vec![Action::Craft(1)]; // craft Sword (requires station)\n        let near_station = vec![false]; // NOT near station\n\n        process_crafting(\u0026mut agents, \u0026actions, \u0026recipes, \u0026near_station);\n\n        // Nothing consumed\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 5);\n        assert_eq!(agents[0].inventory.count_item(ItemType::Ore), 5);\n        assert_eq!(agents[0].inventory.count_item(ItemType::Sword), 0);\n    }\n\n    #[test]\n    fn test_craft_with_station() {\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        agents[0].capabilities.crafting_level = 2;\n        agents[0].inventory.add_item(ItemType::Wood, 5);\n        agents[0].inventory.add_item(ItemType::Ore, 5);\n\n        let recipes = make_test_recipe_book();\n        let actions = vec![Action::Craft(1)]; // craft Sword (requires station)\n        let near_station = vec![true]; // IS near station\n\n        process_crafting(\u0026mut agents, \u0026actions, \u0026recipes, \u0026near_station);\n\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 4);\n        assert_eq!(agents[0].inventory.count_item(ItemType::Ore), 3);\n        assert_eq!(agents[0].inventory.count_item(ItemType::Sword), 1);\n    }\n\n    #[test]\n    fn test_craft_insufficient_crafting_level() {\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        // Default crafting_level is 1, sword requires level 2\n        agents[0].inventory.add_item(ItemType::Wood, 5);\n        agents[0].inventory.add_item(ItemType::Ore, 5);\n\n        let recipes = make_test_recipe_book();\n        let actions = vec![Action::Craft(1)]; // craft Sword\n        let near_station = vec![true];\n\n        process_crafting(\u0026mut agents, \u0026actions, \u0026recipes, \u0026near_station);\n\n        // Nothing consumed -- level too low\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 5);\n        assert_eq!(agents[0].inventory.count_item(ItemType::Ore), 5);\n        assert_eq!(agents[0].inventory.count_item(ItemType::Sword), 0);\n    }\n\n    #[test]\n    fn test_craft_invalid_recipe() {\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        agents[0].inventory.add_item(ItemType::Wood, 5);\n\n        let recipes = make_test_recipe_book();\n        let actions = vec![Action::Craft(999)]; // nonexistent recipe\n        let near_station = vec![false];\n\n        process_crafting(\u0026mut agents, \u0026actions, \u0026recipes, \u0026near_station);\n\n        // Nothing consumed\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 5);\n    }\n\n    #[test]\n    fn test_craft_dead_agent_ignored() {\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        agents[0].alive = false;\n        agents[0].inventory.add_item(ItemType::Wood, 5);\n        agents[0].inventory.add_item(ItemType::Stone, 3);\n\n        let recipes = make_test_recipe_book();\n        let actions = vec![Action::Craft(0)];\n        let near_station = vec![false];\n\n        process_crafting(\u0026mut agents, \u0026actions, \u0026recipes, \u0026near_station);\n\n        // Nothing consumed\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 5);\n        assert_eq!(agents[0].inventory.count_item(ItemType::Axe), 0);\n    }\n\n    #[test]\n    fn test_craft_noop_action_ignored() {\n        let mut agents = vec![make_test_agent(0, 5, 5)];\n        agents[0].inventory.add_item(ItemType::Wood, 5);\n        agents[0].inventory.add_item(ItemType::Stone, 3);\n\n        let recipes = make_test_recipe_book();\n        let actions = vec![Action::Noop];\n        let near_station = vec![false];\n\n        process_crafting(\u0026mut agents, \u0026actions, \u0026recipes, \u0026near_station);\n\n        // Nothing consumed\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 5);\n        assert_eq!(agents[0].inventory.count_item(ItemType::Axe), 0);\n    }\n\n    #[test]\n    fn test_craft_multiple_agents() {\n        let mut agents = vec![make_test_agent(0, 5, 5), make_test_agent(1, 7, 7)];\n        agents[0].inventory.add_item(ItemType::Wood, 5);\n        agents[0].inventory.add_item(ItemType::Stone, 3);\n        agents[1].inventory.add_item(ItemType::Wood, 5);\n        agents[1].inventory.add_item(ItemType::Stone, 3);\n\n        let recipes = make_test_recipe_book();\n        let actions = vec![Action::Craft(0), Action::Craft(0)]; // both craft Axe\n        let near_station = vec![false, false];\n\n        process_crafting(\u0026mut agents, \u0026actions, \u0026recipes, \u0026near_station);\n\n        // Both should have crafted\n        assert_eq!(agents[0].inventory.count_item(ItemType::Axe), 1);\n        assert_eq!(agents[1].inventory.count_item(ItemType::Axe), 1);\n    }\n}\n","traces":[{"line":25,"address":[3255728,3255734,3248704],"length":1,"stats":{"Line":6}},{"line":31,"address":[3258401,3259121],"length":1,"stats":{"Line":16}},{"line":32,"address":[3451369],"length":1,"stats":{"Line":9}},{"line":33,"address":[3259505],"length":1,"stats":{"Line":6}},{"line":37,"address":[3250076],"length":1,"stats":{"Line":6}},{"line":41,"address":[3259554,3259619],"length":1,"stats":{"Line":6}},{"line":42,"address":[3250144],"length":1,"stats":{"Line":6}},{"line":47,"address":[3259655],"length":1,"stats":{"Line":5}},{"line":48,"address":[3259737],"length":1,"stats":{"Line":4}},{"line":50,"address":[3451794],"length":1,"stats":{"Line":1}},{"line":60,"address":[3451777],"length":1,"stats":{"Line":4}},{"line":61,"address":[3255146,3250940],"length":1,"stats":{"Line":4}},{"line":72,"address":[3689684],"length":1,"stats":{"Line":3}},{"line":73,"address":[3260477],"length":1,"stats":{"Line":2}},{"line":74,"address":[3260579],"length":1,"stats":{"Line":2}},{"line":75,"address":[3251131],"length":1,"stats":{"Line":2}},{"line":85,"address":[3453260,3453345,3452447],"length":1,"stats":{"Line":11}},{"line":88,"address":[3190672,3190695],"length":1,"stats":{"Line":9}},{"line":90,"address":[3261365],"length":1,"stats":{"Line":5}},{"line":91,"address":[3261369,3261446],"length":1,"stats":{"Line":4}},{"line":100,"address":[3261401],"length":1,"stats":{"Line":4}},{"line":101,"address":[3251953,3252577],"length":1,"stats":{"Line":8}},{"line":102,"address":[3454171,3454226],"length":1,"stats":{"Line":8}},{"line":103,"address":[3262331],"length":1,"stats":{"Line":0}},{"line":108,"address":[3262195],"length":1,"stats":{"Line":4}},{"line":110,"address":[3262432,3263018,3262847,3262344],"length":1,"stats":{"Line":0}},{"line":119,"address":[3252928],"length":1,"stats":{"Line":4}},{"line":120,"address":[3263083,3262406],"length":1,"stats":{"Line":8}},{"line":123,"address":[3263797,3263625],"length":1,"stats":{"Line":0}},{"line":131,"address":[3264242,3264314],"length":1,"stats":{"Line":8}}],"covered":27,"coverable":30},{"path":["/","home","user","FORGE","crates","forge-core","src","day_night.rs"],"content":"//! Day/night cycle system.\n//!\n//! Divides simulation time into four phases: dawn, day, dusk, and night.\n//! Each phase affects agent vision radius through a modifier, enabling\n//! emergent behaviour differences between day and night.\n\nuse forge_types::config::WorldConfig;\nuse forge_types::constants::{\n    DAY_PHASE_DAWN, DAY_PHASE_DAY, DAY_PHASE_DUSK, DAY_PHASE_NIGHT, NUM_DAY_PHASES,\n    VISION_MODIFIER_DAY, VISION_MODIFIER_NIGHT, VISION_MODIFIER_TWILIGHT,\n};\nuse tracing::{instrument, trace};\n\n/// Dawn phase constant (re-exported from forge-types for convenience).\npub const PHASE_DAWN: u8 = DAY_PHASE_DAWN;\n/// Daytime phase constant (re-exported from forge-types for convenience).\npub const PHASE_DAY: u8 = DAY_PHASE_DAY;\n/// Dusk phase constant (re-exported from forge-types for convenience).\npub const PHASE_DUSK: u8 = DAY_PHASE_DUSK;\n/// Nighttime phase constant (re-exported from forge-types for convenience).\npub const PHASE_NIGHT: u8 = DAY_PHASE_NIGHT;\n\n/// Computes the current day phase (0-3) from the tick and cycle configuration.\n///\n/// The cycle is divided into 4 equal quarters:\n/// - Quarter 0: Dawn\n/// - Quarter 1: Day\n/// - Quarter 2: Dusk\n/// - Quarter 3: Night\n///\n/// If `day_night_cycle_length` is 0, the cycle is disabled and this\n/// always returns `PHASE_DAY`.\n#[instrument(skip_all)]\npub fn compute_day_phase(tick: u64, config: \u0026WorldConfig) -\u003e u8 {\n    let cycle_length = config.day_night_cycle_length;\n    if cycle_length == 0 {\n        trace!(\"day/night cycle disabled, returning DAY\");\n        return PHASE_DAY;\n    }\n\n    let position_in_cycle = tick % (cycle_length as u64);\n    let quarter_length = cycle_length as u64 / 4;\n\n    // Avoid division by zero if cycle_length \u003c 4\n    if quarter_length == 0 {\n        trace!(tick, cycle_length, \"cycle length too short, returning DAY\");\n        return PHASE_DAY;\n    }\n\n    let phase = (position_in_cycle / quarter_length).min((NUM_DAY_PHASES - 1) as u64) as u8;\n\n    trace!(tick, cycle_length, phase, \"computed day phase\");\n\n    phase\n}\n\n/// Returns the vision radius modifier for a given day phase.\n///\n/// - Day: 1.0 (full vision)\n/// - Dawn / Dusk: 0.75 (reduced visibility)\n/// - Night: 0.5 (limited visibility)\n#[instrument]\npub fn vision_modifier(phase: u8) -\u003e f32 {\n    match phase {\n        PHASE_DAY =\u003e VISION_MODIFIER_DAY,\n        PHASE_DAWN | PHASE_DUSK =\u003e VISION_MODIFIER_TWILIGHT,\n        PHASE_NIGHT =\u003e VISION_MODIFIER_NIGHT,\n        _ =\u003e VISION_MODIFIER_DAY, // fallback\n    }\n}\n\n/// Returns whether the given phase is considered \"daytime\".\n///\n/// Dawn and Day are daytime; Dusk and Night are not.\n#[instrument]\npub fn is_daytime(phase: u8) -\u003e bool {\n    phase == PHASE_DAY || phase == PHASE_DAWN\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::WorldConfig;\n\n    fn config_with_cycle(length: u32) -\u003e WorldConfig {\n        WorldConfig {\n            day_night_cycle_length: length,\n            ..WorldConfig::default()\n        }\n    }\n\n    #[test]\n    fn test_day_phase_progression() {\n        let config = config_with_cycle(100);\n\n        // Quarter 0 (ticks 0-24): Dawn\n        assert_eq!(compute_day_phase(0, \u0026config), PHASE_DAWN);\n        assert_eq!(compute_day_phase(12, \u0026config), PHASE_DAWN);\n        assert_eq!(compute_day_phase(24, \u0026config), PHASE_DAWN);\n\n        // Quarter 1 (ticks 25-49): Day\n        assert_eq!(compute_day_phase(25, \u0026config), PHASE_DAY);\n        assert_eq!(compute_day_phase(49, \u0026config), PHASE_DAY);\n\n        // Quarter 2 (ticks 50-74): Dusk\n        assert_eq!(compute_day_phase(50, \u0026config), PHASE_DUSK);\n        assert_eq!(compute_day_phase(74, \u0026config), PHASE_DUSK);\n\n        // Quarter 3 (ticks 75-99): Night\n        assert_eq!(compute_day_phase(75, \u0026config), PHASE_NIGHT);\n        assert_eq!(compute_day_phase(99, \u0026config), PHASE_NIGHT);\n    }\n\n    #[test]\n    fn test_cycle_disabled() {\n        let config = config_with_cycle(0);\n\n        assert_eq!(compute_day_phase(0, \u0026config), PHASE_DAY);\n        assert_eq!(compute_day_phase(500, \u0026config), PHASE_DAY);\n        assert_eq!(compute_day_phase(u64::MAX, \u0026config), PHASE_DAY);\n    }\n\n    #[test]\n    fn test_vision_modifier_day() {\n        assert!((vision_modifier(PHASE_DAY) - 1.0).abs() \u003c f32::EPSILON);\n    }\n\n    #[test]\n    fn test_vision_modifier_night() {\n        assert!((vision_modifier(PHASE_NIGHT) - 0.5).abs() \u003c f32::EPSILON);\n    }\n\n    #[test]\n    fn test_vision_modifier_dawn_dusk() {\n        assert!((vision_modifier(PHASE_DAWN) - 0.75).abs() \u003c f32::EPSILON);\n        assert!((vision_modifier(PHASE_DUSK) - 0.75).abs() \u003c f32::EPSILON);\n    }\n\n    #[test]\n    fn test_full_cycle() {\n        let config = config_with_cycle(400);\n        let mut phases_seen = [false; 4];\n\n        for tick in 0..400 {\n            let phase = compute_day_phase(tick, \u0026config);\n            assert!(phase \u003c= 3, \"phase should be 0-3, got {}\", phase);\n            phases_seen[phase as usize] = true;\n        }\n\n        // All four phases should occur in a full cycle\n        assert!(phases_seen.iter().all(|\u0026seen| seen));\n\n        // Cycle should repeat\n        for tick in 0..400 {\n            assert_eq!(\n                compute_day_phase(tick, \u0026config),\n                compute_day_phase(tick + 400, \u0026config)\n            );\n        }\n    }\n\n    #[test]\n    fn test_is_daytime() {\n        assert!(is_daytime(PHASE_DAWN));\n        assert!(is_daytime(PHASE_DAY));\n        assert!(!is_daytime(PHASE_DUSK));\n        assert!(!is_daytime(PHASE_NIGHT));\n    }\n\n    #[test]\n    fn test_phase_boundary_transition() {\n        let config = config_with_cycle(100);\n\n        // Tick 24 → Dawn (last tick of quarter 0)\n        assert_eq!(compute_day_phase(24, \u0026config), PHASE_DAWN);\n        // Tick 25 → Day (first tick of quarter 1)\n        assert_eq!(compute_day_phase(25, \u0026config), PHASE_DAY);\n        // Tick 49 → Day (last tick of quarter 1)\n        assert_eq!(compute_day_phase(49, \u0026config), PHASE_DAY);\n        // Tick 50 → Dusk (first tick of quarter 2)\n        assert_eq!(compute_day_phase(50, \u0026config), PHASE_DUSK);\n        // Tick 74 → Dusk\n        assert_eq!(compute_day_phase(74, \u0026config), PHASE_DUSK);\n        // Tick 75 → Night\n        assert_eq!(compute_day_phase(75, \u0026config), PHASE_NIGHT);\n        // Tick 99 → Night (end of cycle)\n        assert_eq!(compute_day_phase(99, \u0026config), PHASE_NIGHT);\n        // Tick 100 → Dawn (cycle wraps)\n        assert_eq!(compute_day_phase(100, \u0026config), PHASE_DAWN);\n    }\n\n    #[test]\n    fn test_very_short_cycle() {\n        // cycle_length = 3: quarter_length = 0, falls through to PHASE_DAY\n        let config = config_with_cycle(3);\n        assert_eq!(compute_day_phase(0, \u0026config), PHASE_DAY);\n        assert_eq!(compute_day_phase(1, \u0026config), PHASE_DAY);\n        assert_eq!(compute_day_phase(2, \u0026config), PHASE_DAY);\n    }\n\n    #[test]\n    fn test_minimum_valid_cycle() {\n        // cycle_length = 4: exactly 1 tick per quarter\n        let config = config_with_cycle(4);\n        assert_eq!(compute_day_phase(0, \u0026config), PHASE_DAWN);\n        assert_eq!(compute_day_phase(1, \u0026config), PHASE_DAY);\n        assert_eq!(compute_day_phase(2, \u0026config), PHASE_DUSK);\n        assert_eq!(compute_day_phase(3, \u0026config), PHASE_NIGHT);\n        // Cycle wraps\n        assert_eq!(compute_day_phase(4, \u0026config), PHASE_DAWN);\n    }\n\n    #[test]\n    fn test_vision_modifier_unknown_phase() {\n        // Phase values \u003e 3 should fallback to day modifier\n        assert!((vision_modifier(4) - VISION_MODIFIER_DAY).abs() \u003c f32::EPSILON);\n        assert!((vision_modifier(255) - VISION_MODIFIER_DAY).abs() \u003c f32::EPSILON);\n    }\n\n    #[test]\n    fn test_large_tick_values() {\n        let config = config_with_cycle(400);\n        // Very large tick should not panic and should give valid phase\n        let phase = compute_day_phase(u64::MAX - 1, \u0026config);\n        assert!(phase \u003c= 3);\n    }\n}\n","traces":[{"line":34,"address":[3120944,3123947,3123953],"length":1,"stats":{"Line":5}},{"line":35,"address":[3591257],"length":1,"stats":{"Line":5}},{"line":36,"address":[3121091],"length":1,"stats":{"Line":5}},{"line":37,"address":[4009181,4007343,4008949],"length":1,"stats":{"Line":2}},{"line":38,"address":[3593808],"length":1,"stats":{"Line":1}},{"line":41,"address":[3121888,3121842,3121784],"length":1,"stats":{"Line":10}},{"line":42,"address":[3121871,3121916],"length":1,"stats":{"Line":9}},{"line":45,"address":[3568720],"length":1,"stats":{"Line":6}},{"line":46,"address":[3568742,3569893,3569655],"length":1,"stats":{"Line":2}},{"line":47,"address":[4008632],"length":1,"stats":{"Line":1}},{"line":50,"address":[3568734,3568785],"length":1,"stats":{"Line":10}},{"line":52,"address":[3592586,3592257],"length":1,"stats":{"Line":6}},{"line":54,"address":[3592553],"length":1,"stats":{"Line":5}},{"line":63,"address":[3566784,3567684,3567713],"length":1,"stats":{"Line":6}},{"line":64,"address":[3590282],"length":1,"stats":{"Line":7}},{"line":65,"address":[3590946],"length":1,"stats":{"Line":3}},{"line":66,"address":[3590962],"length":1,"stats":{"Line":5}},{"line":67,"address":[4006338],"length":1,"stats":{"Line":3}},{"line":68,"address":[4006290],"length":1,"stats":{"Line":1}},{"line":76,"address":[3590132,3589296,3590161],"length":1,"stats":{"Line":1}},{"line":77,"address":[3590027,3589402],"length":1,"stats":{"Line":2}}],"covered":21,"coverable":21},{"path":["/","home","user","FORGE","crates","forge-core","src","lib.rs"],"content":"#![deny(missing_docs)]\n#![deny(clippy::all)]\n\n//! # forge-core\n//!\n//! Core simulation engine for the FORGE platform.\n//!\n//! This crate implements the deterministic simulation step function,\n//! physics, and all game systems. The step function is designed for\n//! \u003c1µs per environment step on a single CPU core.\n\npub mod combat;\npub mod communication;\npub mod crafting;\npub mod day_night;\npub mod physics;\npub mod prelude;\npub mod resource;\npub mod rng;\npub mod systems;\npub mod visibility;\npub mod world;\n\n// Re-export the main entry points\npub use world::WorldState;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-core","src","physics.rs"],"content":"//! Physics system for the FORGE simulation.\n//!\n//! Handles movement, collision detection, stamina costs, and projectile\n//! trajectories. Uses the grid directly for position tracking.\n//! All arithmetic is integer-based for determinism.\n\nuse forge_types::config::PhysicsConfig;\nuse forge_types::entity::Agent;\nuse forge_types::grid::{Grid, Position};\nuse forge_types::Action;\nuse tracing::{instrument, trace, warn};\n\n/// Result of processing a single agent's movement action.\n#[derive(Debug, Clone, PartialEq)]\npub enum MoveResult {\n    /// Agent successfully moved to the new position.\n    Moved(Position),\n    /// Movement was blocked (wall, occupied tile, boundary, etc.).\n    Blocked,\n    /// Agent doesn't have enough stamina.\n    NoStamina,\n    /// Terrain is not walkable.\n    Impassable,\n}\n\n/// Processes movement actions for all agents.\n///\n/// This is the core physics step. It validates moves, checks collisions,\n/// applies stamina costs, and updates agent positions on the grid.\n///\n/// Movement is processed in agent order (agent 0 first). Ties in movement\n/// to the same tile are resolved by agent priority (lower ID wins).\n#[instrument(skip_all)]\npub fn process_movements(\n    agents: \u0026mut [Agent],\n    grid: \u0026mut Grid,\n    actions: \u0026[Action],\n    config: \u0026PhysicsConfig,\n) -\u003e Vec\u003cMoveResult\u003e {\n    let mut results = Vec::with_capacity(agents.len());\n\n    // First pass: compute desired positions\n    let desired_positions: Vec\u003cOption\u003cPosition\u003e\u003e = agents\n        .iter()\n        .zip(actions.iter())\n        .map(|(agent, action)| {\n            if !agent.alive {\n                return None;\n            }\n            match action {\n                Action::Move(dir) =\u003e agent.position.offset(*dir, grid.width, grid.height),\n                _ =\u003e None,\n            }\n        })\n        .collect();\n\n    // Second pass: detect conflicts (two agents wanting same tile)\n    let mut occupied_targets: Vec\u003c(usize, Position)\u003e = Vec::new();\n    for (i, pos) in desired_positions.iter().enumerate() {\n        if let Some(p) = pos {\n            occupied_targets.push((i, *p));\n        }\n    }\n\n    // Third pass: apply movements\n    for (i, agent) in agents.iter_mut().enumerate() {\n        if !agent.alive {\n            results.push(MoveResult::Blocked);\n            continue;\n        }\n\n        let action = \u0026actions[i];\n        let direction = match action {\n            Action::Move(dir) =\u003e *dir,\n            _ =\u003e {\n                results.push(MoveResult::Blocked);\n                continue;\n            }\n        };\n\n        // Check stamina\n        if !config.collision_enabled {\n            // Simplified mode without collision\n        }\n\n        let stamina_cost = config.stamina_cost_move;\n        if agent.stamina \u003c stamina_cost {\n            trace!(agent_id = agent.id, \"movement blocked: no stamina\");\n            results.push(MoveResult::NoStamina);\n            continue;\n        }\n\n        // Get target position\n        let target = match agent.position.offset(direction, grid.width, grid.height) {\n            Some(pos) =\u003e pos,\n            None =\u003e {\n                trace!(\n                    agent_id = agent.id,\n                    ?direction,\n                    \"movement blocked: boundary\"\n                );\n                results.push(MoveResult::Blocked);\n                continue;\n            }\n        };\n\n        // Check terrain walkability\n        let target_tile = grid.get(target.x, target.y).unwrap();\n        if !target_tile.terrain.is_walkable() {\n            trace!(\n                agent_id = agent.id,\n                terrain = ?target_tile.terrain,\n                \"movement blocked: impassable terrain\"\n            );\n            results.push(MoveResult::Impassable);\n            continue;\n        }\n\n        // Check collision with other agents\n        if config.collision_enabled {\n            if let Some(occupant) = target_tile.agent_id {\n                if occupant != agent.id {\n                    trace!(\n                        agent_id = agent.id,\n                        occupant_id = occupant,\n                        \"movement blocked: tile occupied\"\n                    );\n                    results.push(MoveResult::Blocked);\n                    continue;\n                }\n            }\n\n            // Check if another agent (with higher priority) is also moving here\n            let conflict = occupied_targets\n                .iter()\n                .any(|(other_idx, other_pos)| *other_idx \u003c i \u0026\u0026 *other_pos == target);\n            if conflict {\n                trace!(\n                    agent_id = agent.id,\n                    \"movement blocked: conflict with higher priority agent\"\n                );\n                results.push(MoveResult::Blocked);\n                continue;\n            }\n        }\n\n        // Apply terrain movement cost\n        let terrain_cost = target_tile.terrain.movement_cost();\n        let total_cost = if terrain_cost == i32::MAX {\n            stamina_cost\n        } else {\n            // Multiply base cost by terrain multiplier (both fixed-point)\n            // Fixed-point multiply: (a * b) \u003e\u003e 16\n            ((stamina_cost as i64 * terrain_cost as i64) \u003e\u003e 16) as i32\n        };\n\n        // Deduct stamina\n        agent.stamina = (agent.stamina - total_cost).max(0);\n\n        // Clear old position on grid\n        if let Some(tile) = grid.get_mut(agent.position.x, agent.position.y) {\n            if tile.agent_id == Some(agent.id) {\n                tile.agent_id = None;\n            }\n        }\n\n        // Update agent position\n        let old_pos = agent.position;\n        agent.position = target;\n\n        // Set new position on grid\n        if let Some(tile) = grid.get_mut(target.x, target.y) {\n            tile.agent_id = Some(agent.id);\n        }\n\n        trace!(\n            agent_id = agent.id,\n            old_x = old_pos.x,\n            old_y = old_pos.y,\n            new_x = target.x,\n            new_y = target.y,\n            stamina_cost = total_cost,\n            \"agent moved\"\n        );\n        results.push(MoveResult::Moved(target));\n    }\n\n    results\n}\n\n/// Regenerates stamina for all agents.\n#[instrument(skip_all)]\npub fn regenerate_stamina(agents: \u0026mut [Agent], config: \u0026PhysicsConfig, max_stamina: i32) {\n    for agent in agents.iter_mut() {\n        if !agent.alive {\n            continue;\n        }\n        agent.stamina = (agent.stamina + config.stamina_regen_rate).min(max_stamina);\n    }\n}\n\n/// Minimal agent snapshot for push processing.\n///\n/// Contains only the fields needed to evaluate push actions, avoiding a full\n/// `Vec\u003cAgent\u003e` clone. Extracted once per tick before mutable borrows begin.\n#[derive(Debug, Clone, Copy)]\npub struct AgentPushData {\n    /// Agent identifier.\n    pub id: u32,\n    /// Current position.\n    pub position: Position,\n    /// Whether the agent is alive.\n    pub alive: bool,\n}\n\nimpl AgentPushData {\n    /// Creates push data from an agent reference.\n    #[inline]\n    pub fn from_agent(agent: \u0026Agent) -\u003e Self {\n        Self {\n            id: agent.id,\n            position: agent.position,\n            alive: agent.alive,\n        }\n    }\n}\n\n/// Processes push actions -- agents pushing objects.\n///\n/// Accepts [`AgentPushData`] slices instead of full `\u0026[Agent]` references,\n/// eliminating the need to clone the entire agent vec each tick.\n#[instrument(skip_all)]\npub fn process_pushes(\n    agent_data: \u0026[AgentPushData],\n    grid: \u0026mut Grid,\n    objects: \u0026mut [forge_types::Object],\n    actions: \u0026[Action],\n    config: \u0026PhysicsConfig,\n) {\n    if !config.collision_enabled {\n        return;\n    }\n\n    for (i, action) in actions.iter().enumerate() {\n        if let Action::Push(direction) = action {\n            if i \u003e= agent_data.len() {\n                continue;\n            }\n            let agent = \u0026agent_data[i];\n            if !agent.alive {\n                continue;\n            }\n\n            // Find adjacent tile in push direction\n            let push_from = match agent.position.offset(*direction, grid.width, grid.height) {\n                Some(pos) =\u003e pos,\n                None =\u003e continue,\n            };\n\n            // Check if there's an object to push\n            let tile = match grid.get(push_from.x, push_from.y) {\n                Some(t) =\u003e t,\n                None =\u003e continue,\n            };\n\n            let obj_id = match tile.object_id {\n                Some(id) =\u003e id,\n                None =\u003e continue,\n            };\n\n            // Check if the destination tile is free\n            let push_to = match push_from.offset(*direction, grid.width, grid.height) {\n                Some(pos) =\u003e pos,\n                None =\u003e {\n                    warn!(agent_id = agent.id, \"push blocked: boundary\");\n                    continue;\n                }\n            };\n\n            let dest_tile = match grid.get(push_to.x, push_to.y) {\n                Some(t) =\u003e t,\n                None =\u003e continue,\n            };\n\n            if !dest_tile.terrain.is_walkable()\n                || dest_tile.object_id.is_some()\n                || dest_tile.agent_id.is_some()\n            {\n                continue;\n            }\n\n            // Move the object\n            if let Some(obj) = objects.iter_mut().find(|o| o.id == obj_id) {\n                // Clear old tile\n                if let Some(t) = grid.get_mut(push_from.x, push_from.y) {\n                    t.object_id = None;\n                }\n                // Set new tile\n                if let Some(t) = grid.get_mut(push_to.x, push_to.y) {\n                    t.object_id = Some(obj_id);\n                }\n                obj.position = push_to;\n                trace!(\n                    agent_id = agent.id,\n                    object_id = obj_id,\n                    \"object pushed to ({}, {})\",\n                    push_to.x,\n                    push_to.y\n                );\n            }\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::AgentConfig;\n    use forge_types::grid::{Direction, TerrainType};\n\n    fn make_test_grid(width: u16, height: u16) -\u003e Grid {\n        Grid::new(width, height)\n    }\n\n    fn make_test_agent(id: u32, x: u16, y: u16) -\u003e Agent {\n        let config = AgentConfig::default();\n        let mut agent = Agent::new(id, Position::new(x, y), \u0026config);\n        agent.stamina = 655360; // 10.0 in fixed point\n        agent\n    }\n\n    fn default_physics() -\u003e PhysicsConfig {\n        PhysicsConfig::default()\n    }\n\n    #[test]\n    fn test_basic_movement() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = [make_test_agent(0, 5, 5)];\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let actions = vec![Action::Move(Direction::Up)];\n        let results = process_movements(\u0026mut agents, \u0026mut grid, \u0026actions, \u0026default_physics());\n\n        assert_eq!(results[0], MoveResult::Moved(Position::new(5, 4)));\n        assert_eq!(agents[0].position, Position::new(5, 4));\n        assert!(grid.get(5, 5).unwrap().agent_id.is_none());\n        assert_eq!(grid.get(5, 4).unwrap().agent_id, Some(0));\n    }\n\n    #[test]\n    fn test_movement_all_directions() {\n        for (dir, expected) in [\n            (Direction::Up, Position::new(5, 4)),\n            (Direction::Down, Position::new(5, 6)),\n            (Direction::Left, Position::new(4, 5)),\n            (Direction::Right, Position::new(6, 5)),\n        ] {\n            let mut grid = make_test_grid(16, 16);\n            let mut agents = [make_test_agent(0, 5, 5)];\n            grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n            let actions = vec![Action::Move(dir)];\n            let results = process_movements(\u0026mut agents, \u0026mut grid, \u0026actions, \u0026default_physics());\n\n            assert_eq!(\n                results[0],\n                MoveResult::Moved(expected),\n                \"direction: {:?}\",\n                dir\n            );\n        }\n    }\n\n    #[test]\n    fn test_collision_with_wall() {\n        let mut grid = make_test_grid(16, 16);\n        grid.get_mut(5, 4).unwrap().terrain = TerrainType::Wall;\n        let mut agents = [make_test_agent(0, 5, 5)];\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let actions = vec![Action::Move(Direction::Up)];\n        let results = process_movements(\u0026mut agents, \u0026mut grid, \u0026actions, \u0026default_physics());\n\n        assert_eq!(results[0], MoveResult::Impassable);\n        assert_eq!(agents[0].position, Position::new(5, 5)); // didn't move\n    }\n\n    #[test]\n    fn test_collision_with_boundary() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 0, 0)];\n        grid.get_mut(0, 0).unwrap().agent_id = Some(0);\n\n        let actions = vec![Action::Move(Direction::Up)];\n        let results = process_movements(\u0026mut agents, \u0026mut grid, \u0026actions, \u0026default_physics());\n\n        assert_eq!(results[0], MoveResult::Blocked);\n        assert_eq!(agents[0].position, Position::new(0, 0));\n    }\n\n    #[test]\n    fn test_collision_with_agent() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 5, 5), make_test_agent(1, 5, 4)];\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n        grid.get_mut(5, 4).unwrap().agent_id = Some(1);\n\n        let actions = vec![Action::Move(Direction::Up), Action::Noop];\n        let results = process_movements(\u0026mut agents, \u0026mut grid, \u0026actions, \u0026default_physics());\n\n        assert_eq!(results[0], MoveResult::Blocked);\n        assert_eq!(agents[0].position, Position::new(5, 5));\n    }\n\n    #[test]\n    fn test_movement_drains_stamina() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = [make_test_agent(0, 5, 5)];\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let initial_stamina = agents[0].stamina;\n        let actions = vec![Action::Move(Direction::Up)];\n        process_movements(\u0026mut agents, \u0026mut grid, \u0026actions, \u0026default_physics());\n\n        assert!(agents[0].stamina \u003c initial_stamina);\n    }\n\n    #[test]\n    fn test_no_stamina_blocks_movement() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = [make_test_agent(0, 5, 5)];\n        agents[0].stamina = 0;\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let actions = vec![Action::Move(Direction::Up)];\n        let results = process_movements(\u0026mut agents, \u0026mut grid, \u0026actions, \u0026default_physics());\n\n        assert_eq!(results[0], MoveResult::NoStamina);\n    }\n\n    #[test]\n    fn test_stamina_regeneration() {\n        let config = default_physics();\n        let agent_config = AgentConfig::default();\n        let mut agents = [make_test_agent(0, 5, 5)];\n        agents[0].stamina = 100000;\n\n        regenerate_stamina(\u0026mut agents, \u0026config, agent_config.max_stamina);\n        assert!(agents[0].stamina \u003e 100000);\n    }\n\n    #[test]\n    fn test_stamina_regen_capped() {\n        let config = default_physics();\n        let max = 655360;\n        let mut agents = [make_test_agent(0, 5, 5)];\n        agents[0].stamina = max;\n\n        regenerate_stamina(\u0026mut agents, \u0026config, max);\n        assert_eq!(agents[0].stamina, max);\n    }\n\n    #[test]\n    fn test_dead_agent_cannot_move() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = [make_test_agent(0, 5, 5)];\n        agents[0].alive = false;\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let actions = vec![Action::Move(Direction::Up)];\n        let results = process_movements(\u0026mut agents, \u0026mut grid, \u0026actions, \u0026default_physics());\n\n        assert_eq!(results[0], MoveResult::Blocked);\n        assert_eq!(agents[0].position, Position::new(5, 5));\n    }\n\n    #[test]\n    fn test_noop_no_movement() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = [make_test_agent(0, 5, 5)];\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let initial_stamina = agents[0].stamina;\n        let actions = vec![Action::Noop];\n        let results = process_movements(\u0026mut agents, \u0026mut grid, \u0026actions, \u0026default_physics());\n\n        assert_eq!(results[0], MoveResult::Blocked);\n        assert_eq!(agents[0].position, Position::new(5, 5));\n        assert_eq!(agents[0].stamina, initial_stamina); // no stamina cost for noop\n    }\n\n    #[test]\n    fn test_terrain_movement_cost() {\n        // Forest costs 2x stamina\n        let mut grid = make_test_grid(16, 16);\n        grid.get_mut(5, 4).unwrap().terrain = TerrainType::Forest;\n        let mut agents = [make_test_agent(0, 5, 5)];\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let initial_stamina = agents[0].stamina;\n        let actions = vec![Action::Move(Direction::Up)];\n        process_movements(\u0026mut agents, \u0026mut grid, \u0026actions, \u0026default_physics());\n\n        let stamina_used = initial_stamina - agents[0].stamina;\n\n        // Now test normal ground\n        let mut grid2 = make_test_grid(16, 16);\n        let mut agents2 = vec![make_test_agent(0, 5, 5)];\n        agents2[0].stamina = initial_stamina;\n        grid2.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let actions2 = vec![Action::Move(Direction::Up)];\n        process_movements(\u0026mut agents2, \u0026mut grid2, \u0026actions2, \u0026default_physics());\n\n        let normal_stamina_used = initial_stamina - agents2[0].stamina;\n\n        // Forest should cost more\n        assert!(stamina_used \u003e normal_stamina_used);\n    }\n\n    #[test]\n    fn test_water_impassable() {\n        let mut grid = make_test_grid(16, 16);\n        grid.get_mut(5, 4).unwrap().terrain = TerrainType::Water;\n        let mut agents = [make_test_agent(0, 5, 5)];\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let actions = vec![Action::Move(Direction::Up)];\n        let results = process_movements(\u0026mut agents, \u0026mut grid, \u0026actions, \u0026default_physics());\n\n        assert_eq!(results[0], MoveResult::Impassable);\n    }\n\n    #[test]\n    fn test_two_agents_independent_movement() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 2, 2), make_test_agent(1, 8, 8)];\n        grid.get_mut(2, 2).unwrap().agent_id = Some(0);\n        grid.get_mut(8, 8).unwrap().agent_id = Some(1);\n\n        let actions = vec![\n            Action::Move(Direction::Right),\n            Action::Move(Direction::Left),\n        ];\n        let results = process_movements(\u0026mut agents, \u0026mut grid, \u0026actions, \u0026default_physics());\n\n        assert_eq!(results[0], MoveResult::Moved(Position::new(3, 2)));\n        assert_eq!(results[1], MoveResult::Moved(Position::new(7, 8)));\n    }\n\n    // ---- process_pushes tests ----\n\n    fn make_test_object(id: u32, x: u16, y: u16) -\u003e forge_types::Object {\n        forge_types::Object {\n            id,\n            position: Position::new(x, y),\n            object_type: forge_types::entity::ObjectType::Boulder,\n            mass: 65536,\n            durability: 655360,\n            state: forge_types::entity::ObjectState::Active,\n        }\n    }\n\n    #[test]\n    fn test_push_object_right() {\n        let mut grid = make_test_grid(16, 16);\n        let agents = [make_test_agent(0, 5, 5)];\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let mut objects = vec![make_test_object(0, 6, 5)];\n        grid.get_mut(6, 5).unwrap().object_id = Some(0);\n\n        let actions = vec![Action::Push(Direction::Right)];\n        let push_data: Vec\u003cAgentPushData\u003e = agents.iter().map(AgentPushData::from_agent).collect();\n        process_pushes(\n            \u0026push_data,\n            \u0026mut grid,\n            \u0026mut objects,\n            \u0026actions,\n            \u0026default_physics(),\n        );\n\n        assert_eq!(objects[0].position, Position::new(7, 5));\n        assert!(grid.get(6, 5).unwrap().object_id.is_none());\n        assert_eq!(grid.get(7, 5).unwrap().object_id, Some(0));\n    }\n\n    #[test]\n    fn test_push_object_up() {\n        let mut grid = make_test_grid(16, 16);\n        let agents = [make_test_agent(0, 5, 5)];\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let mut objects = vec![make_test_object(0, 5, 4)];\n        grid.get_mut(5, 4).unwrap().object_id = Some(0);\n\n        let actions = vec![Action::Push(Direction::Up)];\n        let push_data: Vec\u003cAgentPushData\u003e = agents.iter().map(AgentPushData::from_agent).collect();\n        process_pushes(\n            \u0026push_data,\n            \u0026mut grid,\n            \u0026mut objects,\n            \u002 , 5).unwrap().object_id, Some(0));\n    }\n\n    #[test]\n    fn test_push_against_grid_boundary() {\n        let mut grid = make_test_grid(16, 16);\n        let agents = [make_test_agent(0, 0, 1)];\n        grid.get_mut(0, 1).unwrap().agent_id = Some(0);\n\n        let mut objects = vec![make_test_object(0, 0, 0)];\n        grid.get_mut(0, 0).unwrap().object_id = Some(0);\n\n        let actions = vec![Action::Push(Direction::Up)];\n        let push_data: Vec\u003cAgentPushData\u003e = agents.iter().map(AgentPushData::from_agent).collect();\n        process_pushes(\n            \u0026push_data,\n            \u0026mut grid,\n            \u0026mut objects,\n            \u0026actions,\n            \u0026default_physics(),\n        );\n\n        // Object should NOT have moved — destination is out of bounds\n        assert_eq!(objects[0].position, Position::new(0, 0));\n        assert_eq!(grid.get(0, 0).unwrap().object_id, Some(0));\n    }\n\n    #[test]\n    fn test_push_against_wall() {\n        let mut grid = make_test_grid(16, 16);\n        let agents = [make_test_agent(0, 5, 5)];\n        grid.get_mut(5, 5).unwrap().agent_id = Some(0);\n\n        let mut objects = vec![make_test_object(0, 6, 5)];\n        grid.get_mut(6, 5).unwrap().object_id = Some(0);\n\n        grid.get_mut(7, 5).unwrap().terrain = TerrainType::Wall;\n\n        let actions = vec![Action::Push(Direction::Right)];\n        let push_data: Vec\u003cAgentPushData\u003e = agents.iter().map(AgentPushData::from_agent).collect();\n        process_pushes(\n            \u0026push_data,\n            \u0026mut grid,\n            \u0026mut objects,\n            \u0026actions,\n            \u0026default_physics(),\n        );\n\n        // Object should NOT have moved (wall blocks)\n        assert_eq!(objects[0].position, Position::new(6, 5));\n        assert_eq!(grid.get(6, 5).unwrap().object_id, Some(0));\n    }\n\n    #[test]\n    fn test_push_against_water() {\n        let mut grid = make_test_grid(16, 16) 669],"length":1,"stats":{"Line":1}},{"line":296,"address":[3963477],"length":1,"stats":{"Line":2}},{"line":299,"address":[3548135],"length":1,"stats":{"Line":1}},{"line":300,"address":[3963583],"length":1,"stats":{"Line":3}},{"line":302,"address":[3548245],"length":1,"stats":{"Line":1}},{"line":303,"address":[3548269],"length":1,"stats":{"Line":3}}],"covered":90,"coverable":93},{"path":["/","home","user","FORGE","crates","forge-core","src","prelude.rs"],"content":"//! Convenience re-exports for common forge-core items.\n//!\n//! ```rust,no_run\n//! use forge_core::prelude::*;\n//! ```\n\npub use crate::WorldState;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","user","FORGE","crates","forge-core","src","resource.rs"],"content":"//! Resource harvesting, depletion, and respawn system.\n//!\n//! Handles agents picking up resources from resource nodes in the world,\n//! depletion tracking, and automatic respawn of depleted resource nodes.\n\nuse forge_types::entity::Agent;\nuse forge_types::grid::Grid;\nuse forge_types::resource::ResourceNode;\nuse forge_types::Action;\nuse tracing::{instrument, trace};\n\n/// Processes resource harvesting for PickUp actions at resource nodes.\n///\n/// When an agent performs a `PickUp` action on a tile that contains a resource node:\n/// - Checks if the resource node has remaining quantity\n/// - Checks if the resource requires a tool and verifies the agent has it\n/// - Checks if the agent's inventory has space\n/// - Decrements the resource quantity by 1\n/// - Adds the harvested item to the agent's inventory\n///\n/// All processing is deterministic and uses agent-order priority.\n#[instrument(skip_all)]\npub fn process_harvesting(\n    agents: \u0026mut [Agent],\n    grid: \u0026Grid,\n    resources: \u0026mut [ResourceNode],\n    actions: \u0026[Action],\n) {\n    for (i, action) in actions.iter().enumerate() {\n        if *action != Action::PickUp {\n            continue;\n        }\n\n        if i \u003e= agents.len() {\n            continue;\n        }\n\n        let agent = \u0026agents[i];\n        if !agent.alive {\n            continue;\n        }\n\n        // Look up the tile at the agent's position\n        let tile = match grid.get(agent.position.x, agent.position.y) {\n            Some(t) =\u003e t,\n            None =\u003e continue,\n        };\n\n        // Check if there's a resource node on this tile\n        let resource_id = match tile.resource_id {\n            Some(id) =\u003e id,\n            None =\u003e {\n                trace!(\n                    agent_id = agent.id,\n                    \"harvest failed: no resource at position\"\n                );\n                continue;\n            }\n        };\n\n        // Find the resource node\n        let resource = match resources.iter_mut().find(|r| r.id == resource_id) {\n            Some(r) =\u003e r,\n            None =\u003e continue,\n        };\n\n        // Check if the resource is depleted\n        if !resource.can_harvest() {\n            trace!(\n                agent_id = agent.id,\n                resource_id = resource.id,\n                \"harvest failed: resource depleted\"\n            );\n            continue;\n        }\n\n        // Check tool requirement\n        if let Some(required_tool) = resource.requires_tool {\n            if !agents[i].inventory.has_item(required_tool, 1) {\n                trace!(\n                    agent_id = agents[i].id,\n                    resource_id = resource.id,\n                    required_tool = ?required_tool,\n                    \"harvest failed: missing required tool\"\n                );\n                continue;\n            }\n        }\n\n        // Check inventory space\n        let agent = \u0026agents[i];\n        if agent.inventory.is_full() \u0026\u0026 agent.inventory.count_item(resource.resource_type) == 0 {\n            // Inventory is full and we can't stack with existing items\n            trace!(\n                agent_id = agent.id,\n                resource_id = resource.id,\n                \"harvest failed: inventory full\"\n            );\n            continue;\n        }\n\n        // Attempt to add item to inventory\n        let item_type = resource.resource_type;\n        let agent = \u0026mut agents[i];\n        if !agent.inventory.add_item(item_type, 1) {\n            trace!(\n                agent_id = agent.id,\n                resource_id = resource.id,\n                \"harvest failed: could not add item to inventory\"\n            );\n            continue;\n        }\n\n        // Decrement resource quantity\n        resource.quantity -= 1;\n\n        trace!(\n            agent_id = agent.id,\n            resource_id = resource.id,\n            item_type = ?item_type,\n            remaining = resource.quantity,\n            \"resource harvested\"\n        );\n    }\n}\n\n/// Ticks resource respawn timers and replenishes depleted resources.\n///\n/// For each resource node:\n/// - If the resource is below max quantity and the respawn timer is active,\n///   decrement the timer\n/// - When the timer reaches 0, add 1 unit of quantity (up to max_quantity)\n///   and reset the timer to the respawn_rate\n#[instrument(skip_all)]\npub fn tick_respawn(resources: \u0026mut [ResourceNode]) {\n    for resource in resources.iter_mut() {\n        // Only process resources that are below max capacity\n        if resource.quantity \u003e= resource.max_quantity {\n            continue;\n        }\n\n        // Skip resources with no respawn (rate of 0)\n        if resource.respawn_rate == 0 {\n            continue;\n        }\n\n        if resource.respawn_timer \u003e 0 {\n            resource.respawn_timer -= 1;\n        }\n\n        if resource.respawn_timer == 0 {\n            // Replenish 1 unit\n            resource.quantity = (resource.quantity + 1).min(resource.max_quantity);\n\n            // Reset timer if still below max\n            if resource.quantity \u003c resource.max_quantity {\n                resource.respawn_timer = resource.respawn_rate;\n            }\n\n            trace!(\n                resource_id = resource.id,\n                quantity = resource.quantity,\n                max_quantity = resource.max_quantity,\n                \"resource respawned\"\n            );\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use forge_types::config::AgentConfig;\n    use forge_types::grid::Position;\n    use forge_types::resource::ItemType;\n\n    fn make_test_agent(id: u32, x: u16, y: u16) -\u003e Agent {\n        let config = AgentConfig::default();\n        Agent::new(id, Position::new(x, y), \u0026config)\n    }\n\n    fn make_test_grid(width: u16, height: u16) -\u003e Grid {\n        Grid::new(width, height)\n    }\n\n    fn make_test_resource(\n        id: u32,\n        x: u16,\n        y: u16,\n        item_type: ItemType,\n        quantity: u16,\n    ) -\u003e ResourceNode {\n        ResourceNode {\n            id,\n            position: Position::new(x, y),\n            resource_type: item_type,\n            quantity,\n            max_quantity: 5,\n            respawn_timer: 0,\n            respawn_rate: 10,\n            requires_tool: None,\n        }\n    }\n\n    // ---- Harvesting tests ----\n\n    #[test]\n    fn test_harvest_success() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 3, 3)];\n        grid.get_mut(3, 3).unwrap().agent_id = Some(0);\n        grid.get_mut(3, 3).unwrap().resource_id = Some(0);\n\n        let mut resources = vec![make_test_resource(0, 3, 3, ItemType::Wood, 3)];\n        let actions = vec![Action::PickUp];\n\n        process_harvesting(\u0026mut agents, \u0026grid, \u0026mut resources, \u0026actions);\n\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 1);\n        assert_eq!(resources[0].quantity, 2);\n    }\n\n    #[test]\n    fn test_harvest_multiple_times() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 3, 3)];\n        grid.get_mut(3, 3).unwrap().agent_id = Some(0);\n        grid.get_mut(3, 3).unwrap().resource_id = Some(0);\n\n        let mut resources = vec![make_test_resource(0, 3, 3, ItemType::Wood, 3)];\n        let actions = vec![Action::PickUp];\n\n        // Harvest 3 times\n        for _ in 0..3 {\n            process_harvesting(\u0026mut agents, \u0026grid, \u0026mut resources, \u0026actions);\n        }\n\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 3);\n        assert_eq!(resources[0].quantity, 0);\n    }\n\n    #[test]\n    fn test_harvest_depleted_resource() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 3, 3)];\n        grid.get_mut(3, 3).unwrap().agent_id = Some(0);\n        grid.get_mut(3, 3).unwrap().resource_id = Some(0);\n\n        let mut resources = vec![make_test_resource(0, 3, 3, ItemType::Wood, 0)];\n        let actions = vec![Action::PickUp];\n\n        process_harvesting(\u0026mut agents, \u0026grid, \u0026mut resources, \u0026actions);\n\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 0);\n        assert_eq!(resources[0].quantity, 0);\n    }\n\n    #[test]\n    fn test_harvest_requires_tool_success() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 3, 3)];\n        // Give agent a pickaxe\n        agents[0].inventory.add_item(ItemType::Pickaxe, 1);\n        grid.get_mut(3, 3).unwrap().agent_id = Some(0);\n        grid.get_mut(3, 3).unwrap().resource_id = Some(0);\n\n        let mut resources = vec![ResourceNode {\n            id: 0,\n            position: Position::new(3, 3),\n            resource_type: ItemType::Stone,\n            quantity: 5,\n            max_quantity: 5,\n            respawn_timer: 0,\n            respawn_rate: 10,\n            requires_tool: Some(ItemType::Pickaxe),\n        }];\n        let actions = vec![Action::PickUp];\n\n        process_harvesting(\u0026mut agents, \u0026grid, \u0026mut resources, \u0026actions);\n\n        assert_eq!(agents[0].inventory.count_item(ItemType::Stone), 1);\n        assert_eq!(resources[0].quantity, 4);\n    }\n\n    #[test]\n    fn test_harvest_requires_tool_missing() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 3, 3)];\n        // Agent has no pickaxe\n        grid.get_mut(3, 3).unwrap().agent_id = Some(0);\n        grid.get_mut(3, 3).unwrap().resource_id = Some(0);\n\n        let mut resources = vec![ResourceNode {\n            id: 0,\n            position: Position::new(3, 3),\n            resource_type: ItemType::Stone,\n            quantity: 5,\n            max_quantity: 5,\n            respawn_timer: 0,\n            respawn_rate: 10,\n            requires_tool: Some(ItemType::Pickaxe),\n        }];\n        let actions = vec![Action::PickUp];\n\n        process_harvesting(\u0026mut agents, \u0026grid, \u0026mut resources, \u0026actions);\n\n        assert_eq!(agents[0].inventory.count_item(ItemType::Stone), 0);\n        assert_eq!(resources[0].quantity, 5); // unchanged\n    }\n\n    #[test]\n    fn test_harvest_inventory_full() {\n        let mut grid = make_test_grid(16, 16);\n        let config = AgentConfig {\n            default_carry_capacity: 2,\n            ..AgentConfig::default()\n        };\n        let mut agents = vec![Agent::new(0, Position::new(3, 3), \u0026config)];\n        // Fill inventory\n        agents[0].inventory.add_item(ItemType::Ore, 1);\n        agents[0].inventory.add_item(ItemType::Fiber, 1);\n        assert!(agents[0].inventory.is_full());\n\n        grid.get_mut(3, 3).unwrap().agent_id = Some(0);\n        grid.get_mut(3, 3).unwrap().resource_id = Some(0);\n\n        let mut resources = vec![make_test_resource(0, 3, 3, ItemType::Wood, 3)];\n        let actions = vec![Action::PickUp];\n\n        process_harvesting(\u0026mut agents, \u0026grid, \u0026mut resources, \u0026actions);\n\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 0);\n        assert_eq!(resources[0].quantity, 3); // unchanged\n    }\n\n    #[test]\n    fn test_harvest_inventory_full_but_can_stack() {\n        let mut grid = make_test_grid(16, 16);\n        let config = AgentConfig {\n            default_carry_capacity: 2,\n            ..AgentConfig::default()\n        };\n        let mut agents = vec![Agent::new(0, Position::new(3, 3), \u0026config)];\n        // Fill inventory with wood and stone\n        agents[0].inventory.add_item(ItemType::Wood, 1);\n        agents[0].inventory.add_item(ItemType::Stone, 1);\n        assert!(agents[0].inventory.is_full());\n\n        grid.get_mut(3, 3).unwrap().agent_id = Some(0);\n        grid.get_mut(3, 3).unwrap().resource_id = Some(0);\n\n        // Resource yields wood -- can stack with existing wood\n        let mut resources = vec![make_test_resource(0, 3, 3, ItemType::Wood, 3)];\n        let actions = vec![Action::PickUp];\n\n        process_harvesting(\u0026mut agents, \u0026grid, \u0026mut resources, \u0026actions);\n\n        assert_eq!(agents[0].inventory.count_item(ItemType::Wood), 2);\n        assert_eq!(resources[0].quantity, 2);\n    }\n\n    #[test]\n    fn test_harvest_no_resource_at_position() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 3, 3)];\n        grid.get_mut(3, 3).unwrap().agent_id = Some(0);\n        // No resource_id set on this tile\n\n        let mut resources: Vec\u003cResourceNode\u003e = vec![];\n        let actions = vec![Action::PickUp];\n\n        process_harvesting(\u0026mut agents, \u0026grid, \u0026mut resources, \u0026actions);\n\n        assert_eq!(agents[0].inventory.occupied_slots(), 0);\n    }\n\n    #[test]\n    fn test_harvest_dead_agent_ignored() {\n        let mut grid = make_test_grid(16, 16);\n        let mut agents = vec![make_test_agent(0, 3, 3)];\n        agents[0].alive = false;\n        grid.get_mut(3, 3).unwrap().agent_id = Some(0);\n        grid.get_mut(3, 3).unwrap().resource_id = Some(0);\n\n        let mut resources = vec![make_test_resource(0, 3, 3, ItemType::Wood, 3)];\n        let actions = vec![Action::PickUp];\n\n        process_harvesting(\u0026mut agents, \u0026grid, \u0026mut resources, \u0026actions);\n\n        assert_eq!(resources[0].quantity, 3); // unchanged\n    }\n\n    // ---- Respawn tests ----\n\n    #[test]\n    fn test_respawn_timer_decrement() {\n        let mut resources = vec![ResourceNode {\n            id: 0,\n            position: Position::new(0, 0),\n            resource_type: ItemType::Wood,\n            quantity: 0,\n            max_quantity: 5,\n            respawn_timer: 5,\n            respawn_rate: 10,\n            requires_tool: None,\n        }];\n\n        tick_respawn(\u0026mut resources);\n\n        assert_eq!(resources[0].respawn_timer, 4);\n        assert_eq!(resources[0].quantity, 0); // not yet\n    }\n\n    #[test]\n    fn test_respawn_replenish_on_zero_timer() {\n        let mut resources = vec![ResourceNode {\n            id: 0,\n            position: Position::new(0, 0),\n            resource_type: ItemType::Wood,\n            quantity: 0,\n            max_quantity: 5,\n            respawn_timer: 1,\n            respawn_rate: 10,\n            requires_tool: None,\n        }];\n\n        tick_respawn(\u0026mut resources);\n\n        // Timer was decremented from 1 to 0, then respawn triggered\n        assert_eq!(resources[0].quantity, 1);\n        // Timer reset because quantity (1) \u003c max_quantity (5)\n        assert_eq!(resources[0].respawn_timer, 10);\n    }\n\n    #[test]\n    fn test_respawn_to_max() {\n        let mut resources = vec![ResourceNode {\n            id: 0,\n            position: Position::new(0, 0),\n            resource_type: ItemType::Wood,\n            quantity: 4,\n            max_quantity: 5,\n            respawn_timer: 1,\n            respawn_rate: 10,\n            requires_tool: None,\n        }];\n\n        tick_respawn(\u0026mut resources);\n\n        assert_eq!(resources[0].quantity, 5);\n        // Timer should NOT be reset since we're now at max\n        // (the if condition quantity \u003c max_quantity is false)\n    }\n\n    #[test]\n    fn test_respawn_full_resource_no_change() {\n        let mut resources = vec![ResourceNode {\n            id: 0,\n            position: Position::new(0, 0),\n            resource_type: ItemType::Wood,\n            quantity: 5,\n            max_quantity: 5,\n            respawn_timer: 0,\n            respawn_rate: 10,\n            requires_tool: None,\n        }];\n\n        tick_respawn(\u0026mut resources);\n\n        assert_eq!(resources[0].quantity, 5);\n    }\n\n    #[test]\n    fn test_respawn_zero_rate_no_respawn() {\n        let mut resources = vec![ResourceNode {\n            id: 0,\n            position: Position::new(0, 0),\n            resource_type: ItemType::Wood,\n            quantity: 0,\n            max_quantity: 5,\n            respawn_timer: 0,\n            respawn_rate: 0, // no respawn\n            requires_tool: None,\n        }];\n\n        tick_respawn(\u0026mut resources);\n\n        assert_eq!(resources[0].quantity, 0); // still depleted\n    }\n\n    #[test]\n    fn test_respawn_complete_cycle() {\n        let mut resources = vec![ResourceNode {\n            id: 0,\n            position: Position::new(0, 0),\n            resource_type: ItemType::Stone,\n            quantity: 0,\n            max_quantity: 3,\n            respawn_timer: 0,\n            respawn_rate: 2,\n            requires_tool: None,\n        }];\n\n        // Tick 1: timer is 0, quantity below max -\u003e respawn 1, reset timer to 2\n        tick_respawn(\u0026mut resources);\n        assert_eq!(resources[0].quantity, 1);\n        assert_eq!(resources[0].respawn_timer, 2);\n\n        // Tick 2: decrement timer to 1\n        tick_respawn(\u0026mut resources);\n        assert_eq!(resources[0].quantity, 1);\n        assert_eq!(resources[0].respawn_timer, 1);\n\n        // Tick 3: decrement timer to 0, respawn another\n        tick_respawn(\u0026mut resources);\n        assert_eq!(resources[0].quantity, 2);\n        assert_eq!(resources[0].respawn_timer, 2);\n\n        // Tick 4: decrement timer to 1\n        tick_respawn(\u0026mut resources);\n        assert_eq!(resources[0].quantity, 2);\n        assert_eq!(resources[0].respawn_timer, 1);\n\n        // Tick 5: decrement timer to 0, respawn to max (3)\n        tick_respawn(\u0026mut resources);\n        assert_eq!(resources[0].quantity, 3);\n    }\n}\n","traces":[{"line":23,"address":[2784032,2784026,2777824],"length":1,"stats":{"Line":5}},{"line":29,"address":[3984785,3984065],"length":1,"stats":{"Line":11}},{"line":30,"address":[3569657,3569811],"length":1,"stats":{"Line":10}},{"line":34,"address":[3985197],"length":1,"stats":{"Line":3}},{"line":38,"address":[2779277,2779206],"length":1,"stats":{"Line":3}},{"line":39,"address":[3569906],"length":1,"stats":{"Line":3}},{"line":44,"address":[2779313],"length":1,"stats":{"Line":3}},{"line":45,"address":[3546650],"length":1,"stats":{"Line":3}},{"line":50,"address":[3985426],"length":1,"stats":{"Line":3}},{"line":51,"address":[3985461],"length":1,"stats":{"Line":2}},{"line":53,"address":[3546756],"length":1,"stats":{"Line":2}},{"line":62,"address":[3543034,3543024],"length":1,"stats":{"Line":8}},{"line":63,"address":[3986197],"length":1,"stats":{"Line":2}},{"line":68,"address":[3986221],"length":1,"stats":{"Line":2}},{"line":69,"address":[2780228,2780299],"length":1,"stats":{"Line":2}},{"line":78,"address":[3571551,3570924],"length":1,"stats":{"Line":5}},{"line":79,"address":[3986974,3986921],"length":1,"stats":{"Line":2}},{"line":80,"address":[3572264,3572151,3571706],"length":1,"stats":{"Line":0}},{"line":91,"address":[3572478,3571584,3572535],"length":1,"stats":{"Line":8}},{"line":92,"address":[3549171,3549237,3549109],"length":1,"stats":{"Line":10}},{"line":94,"address":[3988026,3989531],"length":1,"stats":{"Line":2}},{"line":103,"address":[3987953],"length":1,"stats":{"Line":2}},{"line":104,"address":[3988139,3987963,3988069],"length":1,"stats":{"Line":7}},{"line":105,"address":[3549340,3549415],"length":1,"stats":{"Line":8}},{"line":106,"address":[3549421,3549494],"length":1,"stats":{"Line":0}},{"line":115,"address":[3550102,3549453,3550074],"length":1,"stats":{"Line":8}},{"line":117,"address":[3988882,3988830],"length":1,"stats":{"Line":9}},{"line":135,"address":[3983771,3981856,3983777],"length":1,"stats":{"Line":6}},{"line":136,"address":[2776735,2776025],"length":1,"stats":{"Line":14}},{"line":138,"address":[3567499],"length":1,"stats":{"Line":8}},{"line":143,"address":[3567638],"length":1,"stats":{"Line":7}},{"line":147,"address":[3983013,3983069],"length":1,"stats":{"Line":15}},{"line":148,"address":[3544288,3544319],"length":1,"stats":{"Line":7}},{"line":151,"address":[3983024],"length":1,"stats":{"Line":5}},{"line":153,"address":[3544344],"length":1,"stats":{"Line":6}},{"line":156,"address":[3983182,3983224],"length":1,"stats":{"Line":12}},{"line":157,"address":[3567858],"length":1,"stats":{"Line":6}},{"line":160,"address":[3567832,3567870],"length":1,"stats":{"Line":12}}],"covered":36,"coverable":38},{"path":["/","home","user","FORGE","crates","forge-core","src","rng.rs"],"content":"//! Deterministic PRNG wrapper for the FORGE simulation.\n//!\n//! Uses PCG (Permuted Congruential Generator) for fast, deterministic,\n//! seedable random number generation. The RNG state is part of WorldState\n//! to ensure full reproducibility.\n\nuse rand::Rng;\nuse rand::SeedableRng;\nuse rand_pcg::Pcg64Mcg;\nuse serde::{Deserialize, Serialize};\nuse tracing::instrument;\n\n/// Deterministic random number generator for FORGE simulations.\n///\n/// Wraps PCG64 for fast, reproducible random number generation.\n/// The state can be serialized for MCTS state snapshots.\n#[derive(Debug, Clone)]\npub struct ForgeRng {\n    inner: Pcg64Mcg,\n    /// The original seed, stored for debugging and replay.\n    seed: u64,\n    /// Number of values generated (for debugging).\n    generation_count: u64,\n}\n\n/// Serializable RNG state for snapshots.\n#[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]\npub struct RngState {\n    /// The seed used to initialize the RNG.\n    pub seed: u64,\n    /// Number of values generated.\n    pub generation_count: u64,\n}\n\nimpl ForgeRng {\n    /// Creates a new deterministic RNG from a seed.\n    #[instrument(skip_all)]\n    pub fn new(seed: u64) -\u003e Self {\n        Self {\n            inner: Pcg64Mcg::seed_from_u64(seed),\n            seed,\n            generation_count: 0,\n        }\n    }\n\n    /// Returns the original seed.\n    pub fn seed(\u0026self) -\u003e u64 {\n        self.seed\n    }\n\n    /// Returns a random u32.\n    #[inline]\n    pub fn next_u32(\u0026mut self) -\u003e u32 {\n        self.generation_count += 1;\n        self.inner.gen()\n    }\n\n    /// Returns a random u64.\n    #[inline]\n    pub fn next_u64(\u0026mut self) -\u003e u64 {\n        self.generation_count += 1;\n        self.inner.gen()\n    }\n\n    /// Returns a random f32 in [0.0, 1.0).\n    #[inline]\n    pub fn next_f32(\u0026mut self) -\u003e f32 {\n        self.generation_count += 1;\n        self.inner.gen()\n    }\n\n    /// Returns a random value in [0, max) (exclusive).\n    #[inline]\n    pub fn next_range(\u0026mut self, max: u32) -\u003e u32 {\n        if max == 0 {\n            return 0;\n        }\n        self.generation_count += 1;\n        self.inner.gen_range(0..max)\n    }\n\n    /// Returns a random boolean with given probability of true.\n    #[inline]\n    pub fn next_bool(\u0026mut self, probability: f32) -\u003e bool {\n        self.next_f32() \u003c probability\n    }\n\n    /// Saves the current RNG state for serialization.\n    #[instrument(skip_all)]\n    pub fn save_state(\u0026self) -\u003e RngState {\n        RngState {\n            seed: self.seed,\n            generation_count: self.generation_count,\n        }\n    }\n\n    /// Restores RNG from a saved state.\n    #[instrument(skip_all)]\n    pub fn from_state(state: \u0026RngState) -\u003e Self {\n        // Recreate by replaying from seed\n        // This ensures exact state reproduction\n        let mut rng = Self::new(state.seed);\n        for _ in 0..state.generation_count {\n            let _ = rng.next_u64();\n        }\n        rng\n    }\n\n    /// Creates a derived RNG with a new seed mixed from the current state.\n    /// Useful for generating sub-seeds for world generation layers.\n    #[instrument(skip_all)]\n    pub fn derive(\u0026mut self, domain: u64) -\u003e ForgeRng {\n        let derived_seed = self.next_u64() ^ domain;\n        ForgeRng::new(derived_seed)\n    }\n\n    /// Returns the number of values generated.\n    pub fn generation_count(\u0026self) -\u003e u64 {\n        self.generation_count\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_determinism() {\n        let mut rng1 = ForgeRng::new(42);\n        let mut rng2 = ForgeRng::new(42);\n\n        for _ in 0..1000 {\n            assert_eq!(rng1.next_u64(), rng2.next_u64());\n        }\n    }\n\n    #[test]\n    fn test_different_seeds_differ() {\n        let mut rng1 = ForgeRng::new(42);\n        let mut rng2 = ForgeRng::new(43);\n\n        // Overwhelmingly likely to produce different sequences\n        let vals1: Vec\u003cu64\u003e = (0..10).map(|_| rng1.next_u64()).collect();\n        let vals2: Vec\u003cu64\u003e = (0..10).map(|_| rng2.next_u64()).collect();\n        assert_ne!(vals1, vals2);\n    }\n\n    #[test]\n    fn test_range() {\n        let mut rng = ForgeRng::new(42);\n        for _ in 0..1000 {\n            let val = rng.next_range(10);\n            assert!(val \u003c 10);\n        }\n    }\n\n    #[test]\n    fn test_range_zero() {\n        let mut rng = ForgeRng::new(42);\n        assert_eq!(rng.next_range(0), 0);\n    }\n\n    #[test]\n    fn test_f32_range() {\n        let mut rng = ForgeRng::new(42);\n        for _ in 0..1000 {\n            let val = rng.next_f32();\n            assert!((0.0..1.0).contains(\u0026val));\n        }\n    }\n\n    #[test]\n    fn test_state_save_restore() {\n        let mut rng = ForgeRng::new(42);\n        // Advance the RNG\n        for _ in 0..100 {\n            rng.next_u64();\n        }\n        let state = rng.save_state();\n\n        // Create a new RNG from the saved state\n        let mut restored = ForgeRng::from_state(\u0026state);\n\n        // They should produce the same sequence going forward\n        for _ in 0..100 {\n            assert_eq!(rng.next_u64(), restored.next_u64());\n        }\n    }\n\n    #[test]\n    fn test_derive() {\n        let mut rng1 = ForgeRng::new(42);\n        let mut rng2 = ForgeRng::new(42);\n\n        let derived1 = rng1.derive(1);\n        let derived2 = rng2.derive(1);\n\n        // Derived RNGs with same parent state and domain should be identical\n        assert_eq!(derived1.seed(), derived2.seed());\n    }\n\n    #[test]\n    fn test_generation_count() {\n        let mut rng = ForgeRng::new(42);\n        assert_eq!(rng.generation_count(), 0);\n        rng.next_u32();\n        assert_eq!(rng.generation_count(), 1);\n        rng.next_f32();\n        assert_eq!(rng.generation_count(), 2);\n    }\n}\n","traces":[{"line":38,"address":[3377749,3376832,3377743],"length":1,"stats":{"Line":11}},{"line":40,"address":[3785055],"length":1,"stats":{"Line":10}},{"line":47,"address":[3377792],"length":1,"stats":{"Line":1}},{"line":48,"address":[3377797],"length":1,"stats":{"Line":1}},{"line":53,"address":[3371584],"length":1,"stats":{"Line":1}},{"line":54,"address":[3348250,3348205],"length":1,"stats":{"Line":1}},{"line":55,"address":[3378895],"length":1,"stats":{"Line":1}},{"line":60,"address":[3787024],"length":1,"stats":{"Line":2}},{"line":61,"address":[],"length":0,"stats":{"Line"
