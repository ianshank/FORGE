# docker compose -f docker/compose.minecraft.yml up
#
# End-to-end Minecraft RL stack:
#   - `minecraft` — vanilla Minecraft server (itzg image; EULA via env)
#   - `mc-bot`    — Node.js mineflayer bridge (WS + prismarine-viewer)
#   - `runner`    — Rust forge-mc-runner driving the episode loop
#
# All ports, image tags, volumes, and the Minecraft version come from
# the .env file alongside this compose file (`docker/compose.minecraft.env`)
# OR shell env vars. No literals are baked in; every value below is a
# `${VAR:-default}` reference, so a CI workflow or developer can swap
# the MC version, ports, or image tags without editing this file.
#
# The trainer container is intentionally omitted from this compose;
# trainers run on GPU hosts (or in CI jobs) and write into the same
# `models/` volume the runner reads from.
#
# ---------------------------------------------------------------------------
# NETWORK EXPOSURE  (${BIND_HOST})
# ---------------------------------------------------------------------------
# Every published port below is prefixed with `${BIND_HOST:-127.0.0.1}`.
# Docker's default (`"3001:3000"`, no host IP) binds 0.0.0.0 and, because
# Docker writes its own iptables rules, that reaches past most host firewalls.
# This stack has no authentication in front of the mc-bot WebSocket or the
# prismarine viewer, and the Minecraft server runs with `ONLINE_MODE: FALSE`
# (no Mojang auth) — so none of it should face a network by default.
#
# Loopback is the default. To expose the stack deliberately, opt in
# explicitly — e.g. in the env file:
#
#   BIND_HOST=0.0.0.0      # all interfaces (understand the above first)
#   BIND_HOST=192.168.1.20 # one specific interface
#
# Note that with the default, remote Minecraft clients cannot join
# `MC_SERVER_PORT`; that is the point. Set BIND_HOST if you need them to.
#
# ---------------------------------------------------------------------------
# REQUIRED VARIABLE: GRAFANA_ADMIN_PASSWORD
# ---------------------------------------------------------------------------
# `GF_SECURITY_ADMIN_PASSWORD` no longer defaults to `admin`. It uses
# compose's required-variable form (`${VAR:?message}`), so an unset or empty
# value makes compose refuse to start instead of silently publishing a
# Grafana with admin/admin. Compose interpolates the whole file regardless of
# which profiles are active, so this variable must be defined for ANY
# invocation against this file — set it once in `docker/compose.minecraft.env`
# (see `compose.minecraft.env.example`). The scripts in `scripts/` already
# pass `--env-file`, so defining it there is enough.

services:
  minecraft:
    image: ${MC_SERVER_IMAGE:-itzg/minecraft-server:latest}
    container_name: forge-mc-server
    restart: ${MC_RESTART_POLICY:-unless-stopped}
    # Resource governance — every limit/reservation is env-driven so operators
    # tune them per host without editing this file (defaults are conservative,
    # never zero). `deploy.resources.limits` is enforced by `docker compose up`
    # on Compose v2+.
    deploy:
      resources:
        limits:
          cpus: ${MC_CPU_LIMIT:-2.0}
          memory: ${MC_MEM_LIMIT:-3G}
        reservations:
          cpus: ${MC_CPU_RESERVATION:-0.5}
          memory: ${MC_MEM_RESERVATION:-1G}
    ports:
      # Loopback by default — see the NETWORK EXPOSURE note at the top. This
      # server runs ONLINE_MODE=FALSE (no Mojang auth), so an internet-facing
      # bind lets anyone join as any username.
      - "${BIND_HOST:-127.0.0.1}:${MC_SERVER_PORT:-25565}:25565"
    # `no-new-privileges` is safe here: the itzg entrypoint DROPS privileges
    # (root -> the `minecraft` user) and never needs to regain them.
    #
    # `cap_drop: [ALL]` is deliberately NOT set on this service: the itzg
    # image chowns /data and switches user at start-up, which needs
    # CAP_CHOWN / CAP_SETUID / CAP_SETGID / CAP_DAC_OVERRIDE. Dropping them
    # breaks the container before the server ever boots.
    security_opt:
      - "no-new-privileges:true"
    environment:
      # EULA acceptance MUST be set explicitly by the operator. We do
      # not embed `EULA=TRUE` here — that would be agreeing to
      # Mojang's terms on behalf of every downstream user.
      EULA: ${MC_EULA:-FALSE}
      VERSION: ${MC_VERSION:-1.20.4}
      TYPE: ${MC_TYPE:-VANILLA}
      MEMORY: ${MC_MEMORY:-2G}
      ONLINE_MODE: ${MC_ONLINE_MODE:-FALSE}
      DIFFICULTY: ${MC_DIFFICULTY:-easy}
      GAMEMODE: ${MC_GAMEMODE:-survival}
      VIEW_DISTANCE: ${MC_VIEW_DISTANCE:-10}
      MAX_PLAYERS: ${MC_MAX_PLAYERS:-4}
    volumes:
      - ${MC_SERVER_DATA_DIR:-./minecraft-server-data}:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc-monitor status --host localhost --port 25565 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  mc-bot:
    build:
      context: ../mc-bot
      dockerfile: ../docker/mc-bot.Dockerfile
      args:
        WS_PORT: ${MC_BOT_WS_PORT:-8765}
        VIEWER_PORT: ${MC_BOT_VIEWER_PORT:-3007}
    image: ${MC_BOT_IMAGE:-forge-mc-bot:dev}
    container_name: forge-mc-bot
    restart: ${MC_BOT_RESTART_POLICY:-on-failure}
    deploy:
      resources:
        limits:
          cpus: ${MC_BOT_CPU_LIMIT:-1.0}
          memory: ${MC_BOT_MEM_LIMIT:-1G}
        reservations:
          cpus: ${MC_BOT_CPU_RESERVATION:-0.25}
          memory: ${MC_BOT_MEM_RESERVATION:-256M}
    depends_on:
      minecraft:
        condition: service_healthy
    # Environment overrides. The mc-bot reads its WS bind address +
    # port from `configs/minecraft/env.toml` (mounted read-only below),
    # not from these env vars; values here are passed through to the
    # container for any future code paths that consume them. Keep
    # additive — do not introduce env-driven knobs that don't have a
    # corresponding code-path on the bot side.
    environment:
      MC_BOT_WS_PORT: ${MC_BOT_WS_PORT:-8765}
      MC_BOT_VIEWER_PORT: ${MC_BOT_VIEWER_PORT:-3007}
      MC_BOT_TARGET_HOST: ${MC_BOT_TARGET_HOST:-minecraft}
      MC_BOT_TARGET_PORT: ${MC_BOT_TARGET_PORT:-25565}
      MC_BOT_USERNAME: ${MC_BOT_USERNAME:-forge_bot}
      MC_BOT_AUTH: ${MC_BOT_AUTH:-offline}
    ports:
      # The WS bridge has no authentication and the prismarine viewer serves
      # a live view of the world — loopback by default (see the top note).
      - "${BIND_HOST:-127.0.0.1}:${MC_BOT_WS_PORT:-8765}:${MC_BOT_WS_PORT:-8765}"
      - "${BIND_HOST:-127.0.0.1}:${MC_BOT_VIEWER_PORT:-3007}:${MC_BOT_VIEWER_PORT:-3007}"
    # mc-bot.Dockerfile already runs as `USER node` and listens on
    # unprivileged ports, so it needs no Linux capabilities at all.
    # UNVERIFIED: no Docker daemon was available in the environment where
    # this was added, so the container was not started to confirm.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    volumes:
      - ${MC_CONFIG_DIR:-../configs/minecraft}:/app/configs:ro
      # mc-bot's `DEFAULT_CONFIG_DIR` resolves to /configs/minecraft
      # (relative to its installed src dir). Mount the same host dir
      # at that absolute path so the bot finds env.toml without
      # needing an envPath CLI arg.
      - ${MC_CONFIG_DIR:-../configs/minecraft}:/configs/minecraft:ro
      # Docker-networking overlay: the checked-in env.toml is local-
      # dev (127.0.0.1); this single-file mount replaces it with the
      # docker version (mc-bot:8766, minecraft:25565). Keeps local-
      # dev workflows unbroken (no docker DNS in env.toml when run
      # natively).
      - ${MC_CONFIG_DIR:-../configs/minecraft}/env.docker.toml:/configs/minecraft/env.toml:ro
    # NOTE on the healthcheck: `net.connect` is asynchronous, so a
    # plain `.on('connect', () => process.exit(0))` form would race the
    # node process exiting before the connect callback ever fires when
    # the kernel ACK takes longer than the synchronous portion of the
    # script. We bind explicit `process.exit(0/1)` calls on `connect`
    # and `error`, and destroy the socket on success so the event loop
    # doesn't keep the process alive past the callback.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"var s=require('net').connect(${MC_BOT_WS_PORT:-8765},'127.0.0.1');s.on('connect',function(){s.destroy();process.exit(0);});s.on('error',function(){process.exit(1);});\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  runner:
    build:
      context: ..
      dockerfile: docker/mc-runner.Dockerfile
    image: ${FORGE_MC_RUNNER_IMAGE:-forge-mc-runner:dev}
    container_name: forge-mc-runner
    restart: ${RUNNER_RESTART_POLICY:-on-failure}
    deploy:
      resources:
        limits:
          cpus: ${RUNNER_CPU_LIMIT:-2.0}
          memory: ${RUNNER_MEM_LIMIT:-2G}
        reservations:
          cpus: ${RUNNER_CPU_RESERVATION:-0.5}
          memory: ${RUNNER_MEM_RESERVATION:-512M}
    depends_on:
      mc-bot:
        condition: service_healthy
    # mc-runner.Dockerfile already runs as `USER forge`; the binary opens
    # outbound sockets and writes to its bind mounts, neither of which needs
    # a capability. UNVERIFIED: no Docker daemon was available where this was
    # added, so the container was not started to confirm.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    environment:
      # The env-var ladder in `RunnerConfig::with_env_var_overrides`
      # lets an operator override the static runner.toml without
      # patching it. Only the vars that ladder actually reads belong
      # here -- FORGE_MC_BOT_URL and FORGE_MC_RUNNER_CONFIG were set
      # for years with zero readers in `crates/`; the bot URL comes
      # from the env.docker.toml overlay mounted below, and the config
      # path from the `command:` block.
      # Empty by default so `runner.toml`'s `episodes` stays in charge --
      # this var only gained a reader recently, and a non-empty default
      # here would silently override the TOML for every operator.
      # Precedence is CLI > env > TOML.
      FORGE_MC_RUNNER_EPISODES: ${RUNNER_EPISODES:-}
      # v0.4: propagates the freshly-computed schema_id from
      # `mc_self_play.sh`.
      FORGE_MC_SCHEMA_ID: ${FORGE_MC_SCHEMA_ID:-}
      RUST_LOG: ${RUST_LOG:-forge_mc_runner=info,forge_env_mc=info,forge_agent=info}
    volumes:
      - ${MC_CONFIG_DIR:-../configs/minecraft}:/app/configs:ro
      # Docker-networking overlay (same rationale as the mc-bot mount
      # above): the runner reads env.toml via cfg.mc_env_config_path,
      # and the docker version points at `ws://mc-bot:8766` instead
      # of the local-dev `127.0.0.1` default.
      - ${MC_CONFIG_DIR:-../configs/minecraft}/env.docker.toml:/app/configs/env.toml:ro
      - ${MODELS_DIR:-../models}:/app/models
      - ${TRAJECTORIES_DIR:-../trajectories}:/app/trajectories
    command:
      - "--config"
      - "/app/configs/runner.toml"

  # v0.4 self-improving loop: trainer service. Under `profiles:
  # ["self-play"]` so default `mc_run.sh` invocations stay unchanged
  # — existing v0.3-pre operators see ZERO behavioural change.
  trainer:
    build:
      context: ..
      dockerfile: docker/trainer.Dockerfile
      args:
        TORCH_VARIANT: ${TRAINER_TORCH_VARIANT:-cpu}
    image: ${TRAINER_IMAGE:-forge-mc-trainer:dev}
    container_name: forge-mc-trainer
    profiles: ["self-play"]
    restart: ${TRAINER_RESTART_POLICY:-on-failure}
    # CPU/memory limits live here; the GPU overlay
    # (compose.minecraft.gpu.yml) deep-merges its device *reservation* into
    # this same `deploy.resources` block, so the two compose cleanly.
    deploy:
      resources:
        limits:
          cpus: ${TRAINER_CPU_LIMIT:-4.0}
          memory: ${TRAINER_MEM_LIMIT:-8G}
        reservations:
          cpus: ${TRAINER_CPU_RESERVATION:-1.0}
          memory: ${TRAINER_MEM_RESERVATION:-2G}
    depends_on:
      runner:
        condition: service_started
    # trainer.Dockerfile now runs as a non-root user (see its APP_UID /
    # APP_GID build args). Pure compute + file I/O — no capabilities needed.
    # UNVERIFIED: no Docker daemon was available where this was added, so the
    # container was not started to confirm.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    environment:
      TRAINER_DEVICE: ${TRAINER_DEVICE:-cpu}
      TRAINER_ROUND_ITERS: ${TRAINER_ROUND_ITERS:-10}
      TRAINER_POLL_SLEEP: ${TRAINER_POLL_SLEEP:-5}
      TRAINER_MAX_TRAJECTORIES: ${TRAINER_MAX_TRAJECTORIES:-200}
      TRAINER_MAX_BUNDLE_VERSIONS: ${TRAINER_MAX_BUNDLE_VERSIONS:-5}
      TRAINER_EXPORT_EVERY: ${TRAINER_EXPORT_EVERY:-10}
      TRAINER_SCHEMA_ID: ${FORGE_MC_SCHEMA_ID:-}
      TRAINER_OBS_DIM: ${TRAINER_OBS_DIM:-920}
      TRAINER_ACTION_DIM: ${TRAINER_ACTION_DIM:-12}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${MC_CONFIG_DIR:-../configs/minecraft}:/app/configs:ro
      - ${MODELS_DIR:-../models}:/app/models
      # Trajectory mount is rw because the trainer's
      # `_trim_replay_buffer` (T4) unlinks oldest-by-mtime files
      # when `max_trajectories` is set. The runner is the SOLE
      # writer of new files; the trainer is the SOLE deleter of
      # old files; the in-process newest-N floor guards against
      # the trainer racing the runner's in-flight write.
      - ${TRAJECTORIES_DIR:-../trajectories}:/app/trajectories
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - "python"
      - "-u"
      - "-m"
      - "forge.training.muzero_mc.cli"
      - "train"
      - "--continuous"
      - "--input=/app/trajectories"
      - "--out=/app/models"
      - "--schema-id=${FORGE_MC_SCHEMA_ID:-unset}"
      - "--obs-dim=${TRAINER_OBS_DIM:-920}"
      - "--action-dim=${TRAINER_ACTION_DIM:-12}"
      - "--device=${TRAINER_DEVICE:-cpu}"
      - "--round-iters=${TRAINER_ROUND_ITERS:-10}"
      - "--round-poll-sleep=${TRAINER_POLL_SLEEP:-5}"
      - "--max-trajectories=${TRAINER_MAX_TRAJECTORIES:-200}"
      - "--max-bundle-versions=${TRAINER_MAX_BUNDLE_VERSIONS:-5}"
      - "--export-every=${TRAINER_EXPORT_EVERY:-10}"

  # One-shot bootstrap container — invoked by `mc_self_play.sh` via
  # `docker compose run --rm trainer-bootstrap bootstrap ...` to
  # produce the initial random-init ONNX bundle + manifest before
  # the runner starts. Resolves the bootstrap chicken-and-egg
  # (operator host needs torch to run bootstrap locally; this
  # container has it).
  trainer-bootstrap:
    build:
      context: ..
      dockerfile: docker/trainer.Dockerfile
      args:
        TORCH_VARIANT: ${TRAINER_TORCH_VARIANT:-cpu}
    image: ${TRAINER_IMAGE:-forge-mc-trainer:dev}
    container_name: forge-mc-trainer-bootstrap
    profiles: ["self-play"]
    # No `restart` policy — one-shot.
    # Same image and same hardening as the `trainer` service above.
    # UNVERIFIED: no Docker daemon was available where this was added.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    volumes:
      - ${MC_CONFIG_DIR:-../configs/minecraft}:/app/configs:ro
      - ${MODELS_DIR:-../models}:/app/models
    # Default command is a no-op; `mc_self_play.sh` overrides with
    # `compute-schema-id` or `bootstrap` argv.
    entrypoint: ["python", "-u", "-m", "forge.training.muzero_mc.cli"]
    command: ["--help"]

  # ---- Opt-in monitoring stack (Prometheus + Grafana) ----
  # Guarded by `profiles: ["monitoring"]`, so a plain `docker compose up` is
  # completely unaffected. Bring it up with:
  #   docker compose -f docker/compose.minecraft.yml --profile monitoring up -d
  # Prometheus scrapes the runner's /metrics over the compose network. For that
  # to work the runner must bind its metrics server to 0.0.0.0 inside the
  # container (set `metrics_bind = "0.0.0.0"` in runner.toml — container-internal
  # only, see the LOW-2 note in docker/compose.minecraft.env.example).
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: forge-prometheus
    profiles: ["monitoring"]
    restart: ${MONITORING_RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          cpus: ${PROMETHEUS_CPU_LIMIT:-1.0}
          memory: ${PROMETHEUS_MEM_LIMIT:-1G}
        reservations:
          cpus: ${PROMETHEUS_CPU_RESERVATION:-0.25}
          memory: ${PROMETHEUS_MEM_RESERVATION:-256M}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
    ports:
      # Prometheus has no auth and its query API exposes every scraped
      # series — loopback by default (see the top note).
      - "${BIND_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9091}:9090"
    # prom/prometheus runs as `nobody` and binds 9090 (unprivileged).
    # UNVERIFIED: no Docker daemon was available where this was added.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    volumes:
      - ${MONITORING_DIR:-./monitoring}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:latest}
    container_name: forge-grafana
    profiles: ["monitoring"]
    restart: ${MONITORING_RESTART_POLICY:-unless-stopped}
    deploy:
      resources:
        limits:
          cpus: ${GRAFANA_CPU_LIMIT:-1.0}
          memory: ${GRAFANA_MEM_LIMIT:-512M}
        reservations:
          cpus: ${GRAFANA_CPU_RESERVATION:-0.25}
          memory: ${GRAFANA_MEM_RESERVATION:-128M}
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # FAIL CLOSED. `${VAR:?msg}` is compose's required-variable form: an
      # unset or empty value aborts with this message instead of falling back
      # to a default. The previous `${GRAFANA_ADMIN_PASSWORD:-admin}` meant a
      # `--profile monitoring up` published Grafana with admin/admin.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in docker/compose.minecraft.env — there is no default (it used to be "admin")}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # Loopback by default (see the top note).
      - "${BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    # grafana/grafana runs as uid 472 and binds 3000 (unprivileged).
    # UNVERIFIED: no Docker daemon was available where this was added.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    volumes:
      - ${MONITORING_DIR:-./monitoring}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${MONITORING_DIR:-./monitoring}/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data: {}
  grafana-data: {}
