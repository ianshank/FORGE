services:
  simulation:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../forge.toml:/app/forge.toml:ro
      - ../configs:/app/configs:ro
    environment:
      - FORGE_SIMULATION_GRID_SIZE=64
      - FORGE_HARDWARE_NUM_WORKERS=4
      - RUST_LOG=info

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python3", "-m", "http.server", "3000", "--directory", "/app/dashboard/dist"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - simulation

  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.demo
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../forge.toml:/app/forge.toml:ro
