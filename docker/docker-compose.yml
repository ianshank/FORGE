services:
  simulation:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${FORGE_SERVER_PORT:-8080}:8080"
    volumes:
      - ../forge.toml:/app/forge.toml:ro
      - ../configs:/app/configs:ro
    environment:
      # forge-server now defaults to 127.0.0.1 so a bare `cargo run` is not
      # reachable off-host. In a container that default is wrong: Docker's
      # port forwarding arrives on the container's own interface, which a
      # loopback-bound process refuses, so the published port would connect
      # to nothing. Binding 0.0.0.0 here is safe because the container
      # network namespace is the isolation boundary and the `ports:` entry
      # above already restricts host exposure to 127.0.0.1.
      - FORGE_SERVER_BIND=0.0.0.0:8080
      - FORGE_SIMULATION_GRID_SIZE=${FORGE_SIMULATION_GRID_SIZE:-64}
      - FORGE_HARDWARE_NUM_WORKERS=${FORGE_HARDWARE_NUM_WORKERS:-4}
      - RUST_LOG=${RUST_LOG:-info}
      - FORGE_LOG_FORMAT=${FORGE_LOG_FORMAT:-text}
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:${FORGE_SERVER_PORT:-8080}/health" ]
      interval: ${FORGE_HEALTHCHECK_INTERVAL:-15s}
      timeout: ${FORGE_HEALTHCHECK_TIMEOUT:-3s}
      start_period: ${FORGE_HEALTHCHECK_START_PERIOD:-10s}
      retries: ${FORGE_HEALTHCHECK_RETRIES:-3}
    deploy:
      resources:
        limits:
          cpus: ${FORGE_SIM_CPU_LIMIT:-2.0}
          memory: ${FORGE_SIM_MEM_LIMIT:-2G}
        reservations:
          cpus: ${FORGE_SIM_CPU_RESERVATION:-0.5}
          memory: ${FORGE_SIM_MEM_RESERVATION:-512M}
    networks:
      - forge-net
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "127.0.0.1:${FORGE_DASHBOARD_PORT:-3000}:80"
    depends_on:
      simulation:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${FORGE_DASHBOARD_CPU_LIMIT:-1.0}
          memory: ${FORGE_DASHBOARD_MEM_LIMIT:-256M}
        reservations:
          cpus: ${FORGE_DASHBOARD_CPU_RESERVATION:-0.1}
          memory: ${FORGE_DASHBOARD_MEM_RESERVATION:-64M}
    networks:
      - forge-net
    restart: unless-stopped

  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.demo
    ports:
      - "127.0.0.1:${FORGE_DEMO_UI_PORT:-8765}:8765"
    volumes:
      - ../forge.toml:/app/forge.toml:ro
    depends_on:
      simulation:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${FORGE_DEMO_CPU_LIMIT:-1.0}
          memory: ${FORGE_DEMO_MEM_LIMIT:-512M}
        reservations:
          cpus: ${FORGE_DEMO_CPU_RESERVATION:-0.1}
          memory: ${FORGE_DEMO_MEM_RESERVATION:-128M}
    networks:
      - forge-net
    restart: unless-stopped

networks:
  forge-net:
    driver: bridge
