services:
  simulation:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${FORGE_SERVER_PORT:-8080}:8080"
    volumes:
      - ../forge.toml:/app/forge.toml:ro
      - ../configs:/app/configs:ro
    environment:
      - FORGE_SIMULATION_GRID_SIZE=64
      - FORGE_HARDWARE_NUM_WORKERS=4
      - RUST_LOG=info
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:${FORGE_SERVER_PORT:-8080}/health" ]
      interval: ${FORGE_HEALTHCHECK_INTERVAL:-15s}
      timeout: ${FORGE_HEALTHCHECK_TIMEOUT:-3s}
      start_period: ${FORGE_HEALTHCHECK_START_PERIOD:-10s}
      retries: ${FORGE_HEALTHCHECK_RETRIES:-3}
    networks:
      - forge-net
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "127.0.0.1:${FORGE_DASHBOARD_PORT:-3000}:80"
    depends_on:
      simulation:
        condition: service_healthy
    networks:
      - forge-net
    restart: unless-stopped

  demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.demo
    ports:
      - "127.0.0.1:${FORGE_DEMO_UI_PORT:-8765}:8765"
    volumes:
      - ../forge.toml:/app/forge.toml:ro
    depends_on:
      simulation:
        condition: service_healthy
    networks:
      - forge-net
    restart: unless-stopped

networks:
  forge-net:
    driver: bridge
